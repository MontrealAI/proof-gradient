[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-gradient"
version = "0.3.1"
description = "Proof Gradient: Artifact Vault, Run Fabric, Proof Ledger, Selection Gate."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "httpx2>=2.3",
  "ruff>=0.6",
  "bandit>=1.7"
]

[project.scripts]
proof-gradient = "proof_gradient.cli:main"

[tool.setuptools.packages.find]
include = ["proof_gradient*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 160
target-version = "py311"
