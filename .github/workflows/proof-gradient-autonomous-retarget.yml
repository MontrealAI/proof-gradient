name: Proof Gradient Autonomous Retarget

on:
  workflow_dispatch:
    inputs:
      trigger_pages_after_migration:
        description: "Trigger the new Proof Gradient Pages deployment after migration?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  actions: read

jobs:
  retarget:
    name: Retarget SkillOS copy into Proof Gradient
    runs-on: ubuntu-latest

    if: github.repository == 'MontrealAI/proof-gradient'

    env:
      PROOF_GRADIENT_MAINTAINER_TOKEN: ${{ secrets.PROOF_GRADIENT_MAINTAINER_TOKEN }}

    steps:
      - name: Check token is present
        run: |
          if [ -z "$PROOF_GRADIENT_MAINTAINER_TOKEN" ]; then
            echo "Missing secret: PROOF_GRADIENT_MAINTAINER_TOKEN"
            echo "Create a fine-grained PAT with Contents: Read/write and Workflows: Read/write."
            exit 1
          fi

      - name: Check out repository with migration token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROOF_GRADIENT_MAINTAINER_TOKEN }}
          fetch-depth: 0

      - name: Retarget repository, workflows, and Pages
        run: |
          python <<'PY'
          from pathlib import Path
          import os
          import re
          import json
          from datetime import datetime, timezone

          ROOT = Path(".")
          EXPECTED_REPO = "MontrealAI/proof-gradient"
          actual_repo = os.environ.get("GITHUB_REPOSITORY", "")

          if actual_repo != EXPECTED_REPO:
              raise SystemExit(f"This migrator is only allowed to run in {EXPECTED_REPO}; current repo is {actual_repo}")

          SKIP_DIRS = {
              ".git",
              "node_modules",
              ".venv",
              "venv",
              "__pycache__",
              ".pytest_cache",
              "dist",
              "build",
          }

          BINARY_EXTENSIONS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".tar", ".tgz",
              ".woff", ".woff2", ".ttf", ".otf",
              ".sqlite", ".db",
          }

          GENERAL_REPLACEMENTS = [
              ("https://montrealai.github.io/skillos/index.html", "https://montrealai.github.io/proof-gradient/index.html"),
              ("https://montrealai.github.io/skillos/", "https://montrealai.github.io/proof-gradient/"),
              ("https://montrealai.github.io/skillos", "https://montrealai.github.io/proof-gradient"),
              ("https://github.com/MontrealAI/skillos", "https://github.com/MontrealAI/proof-gradient"),
              ("github.com/MontrealAI/skillos", "github.com/MontrealAI/proof-gradient"),
              ("MontrealAI/skillos", "MontrealAI/proof-gradient"),

              ("SKILLOS_LIVE_URL", "PROOF_GRADIENT_LIVE_URL"),
              ("SKILLOS_PUBLIC_URL", "PROOF_GRADIENT_PUBLIC_URL"),
              ("SKILLOS_REPOSITORY", "PROOF_GRADIENT_REPOSITORY"),
              ("SKILLOS_SITE_URL", "PROOF_GRADIENT_SITE_URL"),

              ("skillos-public", "proof-gradient-public"),
              ("skillos-command-center", "proof-gradient-command-center"),
              ("skillos-pages", "proof-gradient-pages"),
              ("skillos-site", "proof-gradient-site"),

              ("Public SkillOS Command Center", "Proof Gradient Command Center"),
              ("SkillOS Command Center", "Proof Gradient Command Center"),
              ("SkillOS Public", "Proof Gradient Public"),
              ("Public SkillOS", "Public Proof Gradient"),
              ("MONTREAL.AI / SKILLOS", "MONTREAL.AI / PROOF GRADIENT"),
          ]

          WORKFLOW_NAME_REPLACEMENTS = [
              ("Public SkillOS Command Center Root Authority", "Proof Gradient Command Center Root Authority"),
              ("SkillOS Public Site Refresh", "Proof Gradient Public Site Refresh"),
              ("SkillOS Public Proof Command Center", "Proof Gradient Command Center"),
              ("Retired legacy SkillOS site workflow", "Retargeted legacy Proof Gradient site workflow"),
              ("Retired legacy SkillOS site refresh", "Retargeted legacy Proof Gradient site refresh"),
              ("SkillOS Tests", "Proof Gradient Tests"),
              ("SkillOS Run All Public Proofs", "Proof Gradient Run All Public Proofs"),
          ]

          def should_skip(path: Path) -> bool:
              parts = set(path.parts)
              if parts & SKIP_DIRS:
                  return True
              if path.suffix.lower() in BINARY_EXTENSIONS:
                  return True
              if path.is_dir():
                  return True
              try:
                  if path.stat().st_size > 5_000_000:
                      return True
              except OSError:
                  return True
              return False

          def read_text(path: Path):
              try:
                  data = path.read_bytes()
              except OSError:
                  return None
              if b"\0" in data:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  return None

          def pause_legacy_pages_deploy_steps(text: str, rel: str) -> str:
              if not rel.startswith(".github/workflows/"):
                  return text
              if rel.endswith("deploy-proof-gradient-pages.yml"):
                  return text
              if rel.endswith("proof-gradient-autonomous-retarget.yml"):
                  return text

              lines = text.splitlines()
              out = []
              for line in lines:
                  stripped = line.strip()
                  is_pages_deploy = (
                      "uses: actions/deploy-pages@" in stripped
                      or "uses: peaceiris/actions-gh-pages@" in stripped
                  )
                  if is_pages_deploy:
                      indent = line[: len(line) - len(line.lstrip())]
                      recent_same_indent_if = False
                      for prev in out[-4:]:
                          if prev.startswith(indent + "if:"):
                              recent_same_indent_if = True
                      if not recent_same_indent_if:
                          out.append(
                              indent
                              + "if: false  # Proof Gradient: legacy direct Pages deploy paused; canonical deploy-proof-gradient-pages.yml publishes the site."
                          )
                  out.append(line)
              return "\n".join(out) + ("\n" if text.endswith("\n") else "")

          changed_files = []

          for path in ROOT.rglob("*"):
              if should_skip(path):
                  continue

              rel = path.relative_to(ROOT).as_posix()
              text = read_text(path)
              if text is None:
                  continue

              original = text

              for old, new in GENERAL_REPLACEMENTS:
                  text = text.replace(old, new)

              if rel.startswith(".github/workflows/"):
                  for old, new in WORKFLOW_NAME_REPLACEMENTS:
                      text = text.replace(old, new)

                  text = re.sub(
                      r"(?m)^(\s*url:\s*)https://montrealai\.github\.io/skillos/?(?:index\.html)?\s*$",
                      r"\1https://montrealai.github.io/proof-gradient/",
                      text,
                  )

                  text = re.sub(
                      r"(?mi)^(\s*group:\s*.*)skillos(.*)$",
                      lambda m: m.group(1).replace("skillos", "proof-gradient") + m.group(2).replace("skillos", "proof-gradient"),
                      text,
                  )

                  text = pause_legacy_pages_deploy_steps(text, rel)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed_files.append(rel)

          pages_workflow = r'''name: Deploy Proof Gradient Pages

          on:
            workflow_dispatch:
            push:
              branches: ["main"]
              paths:
                - ".github/workflows/deploy-proof-gradient-pages.yml"
                - "site/**"
                - "docs/**"
                - "data/**"
                - "badges/**"
                - "README.md"

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: proof-gradient-pages
            cancel-in-progress: true

          jobs:
            deploy:
              name: Deploy Proof Gradient Command Center
              runs-on: ubuntu-latest

              environment:
                name: github-pages
                url: https://montrealai.github.io/proof-gradient/

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Build Proof Gradient site
                  run: |
                    mkdir -p dist

                    cat > dist/index.html <<'HTML'
                    <!doctype html>
                    <html lang="en">
                      <head>
                        <meta charset="utf-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1">
                        <title>Proof Gradient</title>
                        <style>
                          :root {
                            color-scheme: dark;
                            --bg: #05070d;
                            --panel: #0b1020;
                            --text: #f7f8ff;
                            --muted: #aab3cf;
                            --line: rgba(255,255,255,.14);
                            --gold: #f4c76b;
                            --blue: #8ab4ff;
                          }
                          * { box-sizing: border-box; }
                          body {
                            margin: 0;
                            min-height: 100vh;
                            background:
                              radial-gradient(circle at 20% 10%, rgba(138,180,255,.18), transparent 30%),
                              radial-gradient(circle at 80% 20%, rgba(244,199,107,.14), transparent 28%),
                              linear-gradient(180deg, #05070d 0%, #090d18 100%);
                            color: var(--text);
                            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                          }
                          main {
                            width: min(1120px, calc(100% - 40px));
                            margin: 0 auto;
                            padding: 72px 0;
                          }
                          .eyebrow {
                            color: var(--gold);
                            letter-spacing: .18em;
                            text-transform: uppercase;
                            font-size: 13px;
                            font-weight: 800;
                          }
                          h1 {
                            font-size: clamp(46px, 8vw, 104px);
                            line-height: .92;
                            margin: 18px 0 22px;
                            letter-spacing: -0.07em;
                          }
                          .tagline {
                            font-size: clamp(22px, 3vw, 40px);
                            line-height: 1.12;
                            margin: 0 0 34px;
                            max-width: 980px;
                          }
                          .muted {
                            color: var(--muted);
                            font-size: 18px;
                            line-height: 1.65;
                            max-width: 780px;
                          }
                          .grid {
                            display: grid;
                            grid-template-columns: repeat(4, 1fr);
                            gap: 16px;
                            margin: 46px 0;
                          }
                          .card {
                            border: 1px solid var(--line);
                            border-radius: 22px;
                            padding: 24px;
                            background: rgba(11,16,32,.72);
                            min-height: 190px;
                            box-shadow: 0 24px 80px rgba(0,0,0,.24);
                          }
                          .card b {
                            display: block;
                            font-size: 21px;
                            margin-bottom: 12px;
                          }
                          .card p {
                            margin: 0;
                            color: var(--muted);
                            line-height: 1.55;
                          }
                          .doctrine {
                            border: 1px solid var(--line);
                            border-radius: 28px;
                            padding: 32px;
                            margin-top: 30px;
                            background: linear-gradient(135deg, rgba(244,199,107,.12), rgba(138,180,255,.10));
                          }
                          .doctrine h2 {
                            margin: 0 0 14px;
                            font-size: clamp(28px, 4vw, 54px);
                            letter-spacing: -0.04em;
                          }
                          .doctrine p {
                            margin: 0;
                            color: var(--muted);
                            font-size: 19px;
                            line-height: 1.6;
                          }
                          .pillrow {
                            display: flex;
                            flex-wrap: wrap;
                            gap: 10px;
                            margin-top: 28px;
                          }
                          .pill {
                            border: 1px solid var(--line);
                            border-radius: 999px;
                            padding: 10px 14px;
                            color: var(--muted);
                            background: rgba(255,255,255,.04);
                          }
                          .footer {
                            margin-top: 48px;
                            color: var(--muted);
                            font-size: 14px;
                          }
                          a { color: var(--blue); }
                          @media (max-width: 900px) {
                            .grid { grid-template-columns: 1fr; }
                            main { padding: 42px 0; }
                          }
                        </style>
                      </head>
                      <body>
                        <main>
                          <div class="eyebrow">Proof Gradient · The Agent Evolution Protocol</div>

                          <h1>One agent tries.<br>Proof decides.<br>The network evolves.</h1>

                          <p class="tagline">
                            GoalOS gives the network Direction. PlanOS gives it Strategy.
                            SkillOS gives it Capability. The Proof Gradient gives it Evolution.
                          </p>

                          <p class="muted">
                            Proof Gradient is the agent evolution protocol where every run leaves proof,
                            every proof selects intelligence, and every selected artifact evolves the network.
                          </p>

                          <section class="grid" aria-label="Proof Gradient pillars">
                            <div class="card">
                              <b>Artifact Vault</b>
                              <p>The treasury of reusable intelligence: goals, plans, skills, tools, policies, evals, and context recipes.</p>
                            </div>
                            <div class="card">
                              <b>Run Fabric</b>
                              <p>The execution layer where agents resolve active artifacts, run at scale, and emit proof.</p>
                            </div>
                            <div class="card">
                              <b>Proof Ledger</b>
                              <p>The append-only record of what happened: traces, scores, feedback, policy decisions, cost, latency, and credit assignment.</p>
                            </div>
                            <div class="card">
                              <b>Selection Gate</b>
                              <p>The authority that promotes only what proved itself through evals, approval, rollout, monitoring, and rollback.</p>
                            </div>
                          </section>

                          <section class="doctrine">
                            <h2>No proof, no evolution.</h2>
                            <p>
                              Every job is an experiment. Every experiment leaves proof.
                              Every proof creates selection pressure. Every selected artifact strengthens the network.
                            </p>
                            <div class="pillrow">
                              <span class="pill">Direction</span>
                              <span class="pill">Strategy</span>
                              <span class="pill">Capability</span>
                              <span class="pill">Evolution</span>
                              <span class="pill">Vault</span>
                              <span class="pill">Fabric</span>
                              <span class="pill">Ledger</span>
                              <span class="pill">Gate</span>
                            </div>
                          </section>

                          <p class="footer">
                            Repository:
                            <a href="https://github.com/MontrealAI/proof-gradient">github.com/MontrealAI/proof-gradient</a>
                            · Live site:
                            <a href="https://montrealai.github.io/proof-gradient/">montrealai.github.io/proof-gradient</a>
                          </p>
                        </main>
                      </body>
                    </html>
                    HTML

                    touch dist/.nojekyll

                    if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
                      echo "Old SkillOS URL found in generated Proof Gradient site. Stopping."
                      exit 1
                    fi

                - name: Configure GitHub Pages
                  uses: actions/configure-pages@v5

                - name: Upload GitHub Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist

                - name: Deploy GitHub Pages
                  uses: actions/deploy-pages@v4

                - name: Show live URL
                  run: |
                    echo "Proof Gradient deployed to: https://montrealai.github.io/proof-gradient/"
          '''

          pages_path = ROOT / ".github" / "workflows" / "deploy-proof-gradient-pages.yml"
          pages_path.parent.mkdir(parents=True, exist_ok=True)
          old_pages = read_text(pages_path)
          normalized_pages = "\n".join(line[10:] if line.startswith("          ") else line for line in pages_workflow.splitlines()).strip() + "\n"
          if old_pages != normalized_pages:
              pages_path.write_text(normalized_pages, encoding="utf-8")
              changed_files.append(pages_path.as_posix())

          safety_workflow = r'''name: Proof Gradient Safety Check

          on:
            workflow_dispatch:
            pull_request:
            push:
              branches: ["main"]

          permissions:
            contents: read

          jobs:
            check:
              name: Check for stale SkillOS deployment targets
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Block stale SkillOS deployment URLs
                  run: |
                    python <<'PY'
                    from pathlib import Path

                    stale = [
                        "https://montrealai.github.io/skillos",
                        "github.com/MontrealAI/skillos",
                        "MontrealAI/skillos",
                    ]

                    scan_roots = [
                        Path(".github/workflows"),
                        Path("site"),
                        Path("scripts"),
                        Path("README.md"),
                    ]

                    offenders = []

                    for root in scan_roots:
                        if not root.exists():
                            continue
                        paths = [root] if root.is_file() else [p for p in root.rglob("*") if p.is_file()]
                        for path in paths:
                            if path.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".webp", ".pdf", ".zip"}:
                                continue
                            try:
                                text = path.read_text(encoding="utf-8")
                            except Exception:
                                continue
                            for needle in stale:
                                if needle in text:
                                    offenders.append((str(path), needle))

                    if offenders:
                        print("Stale SkillOS deployment references found:")
                        for path, needle in offenders:
                            print(f"- {path}: {needle}")
                        raise SystemExit(1)

                    print("No stale SkillOS deployment URLs found in deployment-sensitive files.")
                    PY
          '''

          safety_path = ROOT / ".github" / "workflows" / "proof-gradient-safety-check.yml"
          normalized_safety = "\n".join(line[10:] if line.startswith("          ") else line for line in safety_workflow.splitlines()).strip() + "\n"
          old_safety = read_text(safety_path)
          if old_safety != normalized_safety:
              safety_path.write_text(normalized_safety, encoding="utf-8")
              changed_files.append(safety_path.as_posix())

          report_path = ROOT / "docs" / "proof_gradient_migration_report.md"
          report_path.parent.mkdir(parents=True, exist_ok=True)

          report = {
              "repository": "MontrealAI/proof-gradient",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "changed_files_count": len(sorted(set(changed_files))),
              "changed_files": sorted(set(changed_files)),
              "canonical_live_url": "https://montrealai.github.io/proof-gradient/",
              "canonical_repository": "https://github.com/MontrealAI/proof-gradient",
              "note": "Legacy direct Pages deploy steps were paused. The canonical deploy-proof-gradient-pages.yml workflow publishes the Proof Gradient site.",
          }

          report_text = "# Proof Gradient Migration Report\n\n"
          report_text += "This report was generated by the autonomous Proof Gradient retarget workflow.\n\n"
          report_text += "## Canonical platform\n\n"
          report_text += "- GoalOS gives the network Direction.\n"
          report_text += "- PlanOS gives it Strategy.\n"
          report_text += "- SkillOS gives it Capability.\n"
          report_text += "- The Proof Gradient gives it Evolution.\n\n"
          report_text += "## Four systems\n\n"
          report_text += "- Artifact Vault stores reusable intelligence.\n"
          report_text += "- Run Fabric executes agents at scale.\n"
          report_text += "- Proof Ledger records what happened.\n"
          report_text += "- Selection Gate promotes only what proved itself.\n\n"
          report_text += "## Migration data\n\n"
          report_text += "```json\n"
          report_text += json.dumps(report, indent=2)
          report_text += "\n```\n"

          old_report = read_text(report_path)
          if old_report != report_text:
              report_path.write_text(report_text, encoding="utf-8")
              changed_files.append(report_path.as_posix())

          print("Changed files:")
          for rel in sorted(set(changed_files)):
              print(f"- {rel}")

          if not changed_files:
              print("No changes needed.")
          PY

      - name: Show migration diff
        run: |
          git status --short
          git diff --stat

      - name: Commit and push migration
        run: |
          git config user.name "proof-gradient-migrator"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add -A
          git commit -m "Migrate SkillOS automation to Proof Gradient [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.PROOF_GRADIENT_MAINTAINER_TOKEN }}

      - name: Trigger canonical Proof Gradient Pages deploy
        if: inputs.trigger_pages_after_migration == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROOF_GRADIENT_MAINTAINER_TOKEN }}
        run: |
          echo "Waiting briefly for GitHub to register the new deploy workflow..."
          sleep 15

          echo "Triggering deploy-proof-gradient-pages.yml..."
          gh workflow run deploy-proof-gradient-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

          echo "Deployment requested."
          echo "Open Actions → Deploy Proof Gradient Pages to watch it finish."
          echo "Then open: https://montrealai.github.io/proof-gradient/"
