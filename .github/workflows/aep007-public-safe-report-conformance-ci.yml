name: AEP-007 Public-Safe Report Conformance CI
on: [workflow_dispatch, pull_request, push]
permissions:
  contents: read
jobs:
  validate-aep007:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate sample public-safe report
        run: |
          if [ -d docs/standards/AEP-007/examples ]; then
            python docs/standards/AEP-007/tools/validate_public_safe_report.py docs/standards/AEP-007/examples/sample_public_safe_report.json
            python docs/standards/AEP-007/tools/public_safe_redaction_audit.py docs/standards/AEP-007/examples/sample_public_safe_report.json
          fi
