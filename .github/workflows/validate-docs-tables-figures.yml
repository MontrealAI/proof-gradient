name: Validate GoalOS Docs, Tables, Figures

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run validation
        run: python scripts/validate_docs_tables_figures.py
