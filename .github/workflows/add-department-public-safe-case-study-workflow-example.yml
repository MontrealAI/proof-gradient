name: Add Department Public Safe Case Study Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: department-public-safe-case-study-workflow-example
  cancel-in-progress: false

jobs:
  add-department-public-safe-case-study-example:
    name: Add department-public-safe-case-study workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create department-public-safe-case-study workflow example safely
        id: build
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "department-public-safe-case-study"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "department-public-safe-case-study"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · PROOF ROOM LITE</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn internal AI proof</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a safe case study.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Monthly report → Claim matrix → Redaction → Case study → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 23:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Proof Room Lite → public-safe case study</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Share proof without leaking private data, fake results, or unsupported claims.</text>
          </svg>"""
          (assets_dir / "department-public-safe-case-study-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough Department Public-Safe Case Study notes:
          Product: GoalOS Department Pack / Proof Room Lite
          Buyer: department lead, operations manager, AI champion, or small-business manager
          Room: Customer Success AI Workflow Room
          Source evidence: monthly Proof Room Lite report

          What happened internally:
          - department created a Proof Room Lite for repeated AI-assisted workflows
          - workflows included support FAQ replies, meeting notes to action plan, and product feedback summary
          - owners were assigned
          - rules and checks were added
          - weekly proof reviews were run
          - one unclear support draft was caught before external sending and rolled back
          - monthly leadership report was created

          Goal:
          Create a public-safe case study that can be shared on a website or LinkedIn without leaking private customer, employee, policy, metric, or operational details.

          Need output:
          - public-safe case study
          - public claim matrix
          - redaction checklist
          - what can be said / what cannot be said
          - approval checklist
          - LinkedIn post
          - proof note

          Rules:
          - no private customer details
          - no employee names
          - no screenshots
          - no exact internal metrics unless approved
          - no fake testimonial
          - no invented quote
          - no guaranteed ROI
          - no guaranteed productivity
          - no compliance certification
          - no claim that the department is AI-safe or autonomous
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Public-Safe Case Study:
          Title:
          How one department turned repeated AI work into a Proof Room Lite

          Summary:
          A department used GoalOS Proof Room Lite to organize three repeated AI-assisted workflows.

          The goal was not to automate everything.

          The goal was to make repeated AI work more structured, reviewable, and easier to improve.

          Before:
          - people used AI differently
          - repeated tasks were not documented
          - review rules were unclear
          - AI outputs did not consistently leave proof notes

          What changed:
          The department created a lightweight Proof Room with:
          - workflow owners
          - task boundaries
          - human-review rules
          - checks
          - weekly proof reviews
          - correction / rollback process
          - monthly proof report

          Workflows covered:
          - support FAQ replies
          - meeting notes to action plans
          - product feedback summaries

          Important lesson:
          The most useful change was not “more AI.”

          The useful change was a reviewable operating rhythm:
          run the workflow
          check the output
          record the proof note
          revise what fails
          keep what works

          Claim boundary:
          This case study does not claim guaranteed productivity, ROI, legal compliance, safety, or autonomous readiness.

          Public Claim Matrix:
          Allowed public claims:
          - A department used Proof Room Lite to organize repeated AI-assisted workflows.
          - The department assigned owners to workflows.
          - The department added human-review checks.
          - The department used proof notes and weekly reviews.
          - An unclear AI draft was caught before external sending and corrected.
          - A monthly proof report was created.

          Not allowed public claims:
          - The department achieved guaranteed productivity gains.
          - The department achieved ROI.
          - The department is compliant.
          - The workflows are safe.
          - AI can send outputs without human review.
          - Customers benefited in a measured way unless evidence and permission exist.
          - Any specific customer, employee, company, or metric unless approved.

          Redaction Checklist:
          Remove before publishing:
          - customer names
          - employee names
          - email addresses
          - account details
          - exact support messages
          - screenshots
          - internal policy text
          - sensitive operational details
          - unapproved metrics
          - security or privacy details
          - exact quotes without permission

          Approval Checklist:
          Before publishing, confirm:
          - public case study was reviewed by the room owner
          - private data was removed
          - claims match evidence
          - no ROI or productivity guarantee is implied
          - no testimonial is invented
          - no exact quote is used without permission
          - public-safe version is approved

          LinkedIn Post:
          Most AI adoption stories sound like hype.

          Here is the more useful version:

          A department does not need to “automate everything.”

          It needs to know:
          what workflows exist
          who owns them
          what data is allowed
          what must be checked
          what failed
          what was corrected
          what proof was recorded

          That is the idea behind Proof Room Lite.

          Not AI chaos.
          Not blind trust.

          A lightweight room for repeated AI work."""

          proof_note = """Proof note:
          Source: monthly Proof Room Lite report and summarized department workflow evidence.
          Outputs created: public-safe case study, public claim matrix, redaction checklist, approval checklist, LinkedIn post.
          Claims made: Proof Room Lite can help describe department AI workflow organization in a public-safe way.
          Claims avoided: no guaranteed productivity, no guaranteed ROI, no compliance certification, no safety guarantee, no private details, no fake testimonial.
          Review needed: department should confirm redaction, approval, public claim boundary, and permission before publishing.
          Public-safe: yes, if the redaction checklist is completed and approval is recorded."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Department Public-Safe Case Study — GoalOS Workflow Example</title>
            <meta name="description" content="Turn a Proof Room Lite monthly report into a public-safe case study, claim matrix, redaction checklist, approval checklist, social post, and proof note." />
            <meta property="og:title" content="Turn internal AI proof into a safe case study." />
            <meta property="og:description" content="Monthly report → claim matrix → redaction → case study → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/department-public-safe-case-study-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Proof Room Lite · Example 23</div>
              <h1>Turn internal AI proof into a safe case study.</h1>
              <p class="lead">This reusable AI workflow turns a department Proof Room Lite report into a public-safe case study: claim matrix, redaction checklist, approval checklist, LinkedIn post, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                <a class="btn" href="/proof-gradient/workflow/department-ai-correction-rollback/">Example 22: correction / rollback</a>
                <a class="btn" href="/proof-gradient/workflow/department-monthly-proof-report/">Example 20: monthly proof report</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/AEP-007/">Public-Safe Proof Standard</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Share proof without leaking private data.</div>
                <p class="lead">A department should be able to explain what it learned from AI adoption without exposing customers, employees, screenshots, internal policies, or unsupported results.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: proof stays private or gets overhyped</h3>
                    <p>The department has useful evidence, but either keeps everything hidden or publishes vague AI hype with risky claims.</p>
                    <p class="mini">Result: missed trust-building opportunity or public claim risk.</p>
                  </div>
                  <div class="card">
                    <h3>After: public-safe case study</h3>
                    <p>The workflow creates a safe version with approved claims, redactions, boundaries, and proof notes.</p>
                    <p class="mini">Result: shareable credibility without leaking private details.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI what happened in the Proof Room Lite and what source evidence exists.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to reveal private details, invent testimonials, imply ROI, or claim compliance/safety.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the public-safe structure: case study, claim matrix, redaction checklist, approval checklist, proof note.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates the case study, allowed/not-allowed claims, redaction checklist, approval checklist, social post, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether every public claim is supported and whether private details are removed.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was published, what was withheld, what was claimed, and what was avoided.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough Department Public-Safe Case Study notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Public-safe case study</span>
                  <span class="pill">Claim matrix</span>
                  <span class="pill">Redaction checklist</span>
                  <span class="pill">Approval checklist</span>
                  <span class="pill">LinkedIn post</span>
                  <span class="pill">Claim boundary</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for trust</h3><p>Turn internal proof into a clear public story without overclaiming.</p></div>
                  <div class="card"><h3>Privacy-aware</h3><p>Use redaction and approval steps before anything public is shared.</p></div>
                  <div class="card"><h3>Demand-generating</h3><p>Public-safe case studies create credibility without fake testimonials or private screenshots.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste monthly proof notes. Get a public-safe case study and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof Standard</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, procurement, security, privacy, advertising, endorsement, or regulatory advice. No income, savings, compliance, safety, accuracy, productivity, ROI, or business-results guarantee. Do not publish private data, exact quotes, testimonials, screenshots, or identifiable details without appropriate review and permission.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof."),
              "internal-approval-memo": ("Example 16: Interest → approval memo", "Turn an interested internal champion into a manager memo, procurement email, rollout plan, and proof."),
              "team-sprint-facilitator": ("Example 17: Team Pack → self-run sprint", "Turn a team meeting into a reusable AI workflow session, role assignments, checks, and proof."),
              "department-proof-room-lite": ("Example 18: Department Pack → Proof Room Lite", "Turn scattered department AI use into workflow priorities, roles, checks, dashboard fields, and proof."),
              "department-weekly-proof-review": ("Example 19: Weekly proof review", "Turn dashboard notes into keep/revise/stop decisions, manager update, and proof."),
              "department-monthly-proof-report": ("Example 20: Monthly proof report", "Turn 30 days of Proof Room Lite notes into an executive report, leadership email, and proof."),
              "department-ai-permission-map": ("Example 21: Department AI Permission Map", "Turn AI tool confusion into Green / Yellow / Red rules, task permissions, escalation, and proof."),
              "department-ai-correction-rollback": ("Example 22: AI correction / rollback", "Turn an AI workflow issue into severity, correction, rule update, rollback receipt, and proof."),
              "department-public-safe-case-study": ("Example 23: Public-safe case study", "Turn internal Proof Room evidence into a safe case study, claim matrix, redaction checklist, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-department-public-safe-case-study-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- DEPARTMENT-PUBLIC-SAFE-CASE-STUDY-EXAMPLE:START -->"
              end = "<!-- DEPARTMENT-PUBLIC-SAFE-CASE-STUDY-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="department-public-safe-case-study-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Proof Room Lite · Example 23</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn internal AI proof into a safe case study.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste monthly Proof Room notes. Get a public-safe case study, claim matrix, redaction checklist, approval checklist, social post, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/department-public-safe-case-study/">See the public-safe case study workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit department-public-safe-case-study example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add department-public-safe-case-study workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
