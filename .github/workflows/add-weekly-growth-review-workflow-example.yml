name: Add Weekly Growth Review Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-growth-review-workflow-example
  cancel-in-progress: false

jobs:
  add-weekly-growth-example:
    name: Add weekly-growth-review workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create weekly-growth-review workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "weekly-growth-review"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "weekly-growth-review"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · WEEKLY GROWTH REVIEW</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn weekly numbers</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into next actions.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Traffic → Leads → Sales → Support → Bottleneck → Experiment → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 12:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Weekly metrics → one growth experiment</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Do not guess what to fix. Turn simple numbers into one next move.</text>
          </svg>"""
          (assets_dir / "weekly-growth-review-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough weekly numbers:
          Website visits: 1,200
          Workflow example page visits: 430
          Shop visits: 95
          Checkout starts: 18
          Purchases: 4
          Email subscribers: 62
          Top support question: “Where do I start?”
          Top objection: “Is this just templates?”
          Most visited example: Meeting notes → action plan
          Goal: choose one improvement for next week
          Important:
          - no guaranteed revenue claim
          - no fake urgency
          - no fake testimonials
          - no pretending the data proves causation
          - do not overreact to one week of small numbers
          - create one practical experiment, one content idea, one product fix, and a proof note"""

          output_example = """Weekly Growth Summary:
          The site generated interest, but the main drop-off appears between example-page visits and shop visits.

          Observed numbers:
          - 1,200 website visits
          - 430 workflow example visits
          - 95 shop visits
          - 18 checkout starts
          - 4 purchases
          - 62 email subscribers

          Main bottleneck:
          People are engaging with examples, but not enough visitors are moving from examples to the shop.

          Likely friction:
          1. The product value may still feel abstract.
          2. The “where do I start?” question appears after purchase and before purchase.
          3. The “is this just templates?” objection remains important.

          Next Best Experiment:
          Add a stronger call-to-action under the Meeting Notes example:

          “Want this workflow as a fill-in-the-blank kit? Get the GoalOS AI Efficiency Sprint Kit.”

          Experiment Goal:
          Increase clicks from example pages to the shop.

          Do not claim:
          This will increase sales.
          This will improve conversion.
          This proves the funnel works.

          Content Idea:
          Post:
          “The most visited GoalOS example this week was meeting notes → action plan.
          That tells us something simple:
          people do not want abstract AI.
          They want their messy work turned into clear next steps.”

          Product Fix:
          Add a “Where do I start?” mini-card to the Start Here page and the product page.

          Support Fix:
          Create one FAQ entry:
          “Which workflow should I build first?”

          Proof Note:
          This week’s review used aggregate site and shop numbers.
          The chosen experiment is based on observed drop-off and repeated questions.
          No revenue increase is promised.
          No causal claim is made.
          Next review should compare example-to-shop clicks before and after the CTA change."""

          proof_note = """Proof note:
          Source: rough weekly metrics and support-objection notes.
          Outputs created: weekly summary, bottleneck, next experiment, content idea, product fix, support fix, proof note.
          Claims made: the review identified an observed drop-off and selected one experiment for next week.
          Claims avoided: no guaranteed sales increase, no revenue guarantee, no ROI claim, no causation claim from small data, no fake testimonial.
          Review needed: human should confirm numbers, tracking links, checkout data, and final experiment before publishing or acting.
          Public-safe: yes if aggregate numbers are used and no private customer data is included."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Weekly Growth Review — GoalOS Workflow Example</title>
            <meta name="description" content="Turn weekly traffic, leads, sales, and support numbers into one practical growth experiment and proof note." />
            <meta property="og:title" content="Turn weekly numbers into next actions." />
            <meta property="og:description" content="Traffic → leads → sales → support → bottleneck → experiment → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/weekly-growth-review-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Weekly Growth Review · Example 12</div>
              <h1>Turn weekly numbers into next actions.</h1>
              <p class="lead">This reusable AI workflow turns simple weekly numbers into a growth summary, bottleneck, next experiment, content idea, product fix, support fix, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/partner-referral-kit/">Example 11: partner kit</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Do not guess what to fix. Pick one next experiment from the numbers.</div>
                <p class="lead">An autonomous money machine needs a weekly review loop: look at traffic, leads, sales, support, and objections, then choose one small improvement.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: random optimization</h3>
                    <p>You look at sales, get nervous, rewrite everything, post randomly, and chase ten ideas at once.</p>
                    <p class="mini">Result: noise, overreaction, no clean learning.</p>
                  </div>
                  <div class="card">
                    <h3>After: weekly growth workflow</h3>
                    <p>You paste a few numbers into the same workflow. It identifies the bottleneck and chooses one experiment for next week.</p>
                    <p class="mini">Result: calmer iteration and cleaner proof.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI what product you sell and what numbers you track: visits, leads, shop visits, checkout starts, purchases, objections, and support questions.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to promise revenue, not to infer causation from weak data, and not to recommend ten changes at once.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your funnel: homepage → workflow example → shop → checkout → delivery → onboarding → support.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI summarizes the week, finds the bottleneck, chooses one experiment, drafts one content idea, suggests one product fix, and writes a proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks that the experiment is small, measurable, safe, and not based on exaggerated claims.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was observed, what was decided, what was not claimed, and what to review next week.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough weekly numbers:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Weekly summary</span>
                  <span class="pill">Bottleneck</span>
                  <span class="pill">One experiment</span>
                  <span class="pill">Content idea</span>
                  <span class="pill">Product fix</span>
                  <span class="pill">Support fix</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for calm iteration</h3><p>Pick one next move instead of changing everything at once.</p></div>
                  <div class="card"><h3>Lower-risk growth</h3><p>The workflow avoids guaranteed revenue claims and weak-data overconfidence.</p></div>
                  <div class="card"><h3>Compounding system</h3><p>Every week creates one experiment, one learning, and one proof note.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste weekly numbers. Get one next experiment and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, investment, or regulatory advice. No income, revenue, ROI, savings, compliance, safety, accuracy, or business-results guarantee. Review your own numbers and use judgment before acting.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
              <a class="card" href="feedback-to-product-update/"><h3>Example 8: Feedback → product update</h3><p>Turn buyer feedback into product improvements, changelog, buyer email, and proof.</p></a>
              <a class="card" href="proof-card-referral-loop/"><h3>Example 9: Usage → proof card</h3><p>Turn real usage into public-safe proof, social post, referral ask, and permission request.</p></a>
              <a class="card" href="monthly-workflow-vault-drop/"><h3>Example 10: Requests → Vault drop</h3><p>Turn buyer requests into a recurring template library, announcement email, changelog, and proof.</p></a>
              <a class="card" href="partner-referral-kit/"><h3>Example 11: Partner interest → referral kit</h3><p>Turn partner interest into clear promo copy, disclosure language, FAQ, and proof.</p></a>
              <a class="card" href="weekly-growth-review/"><h3>Example 12: Weekly numbers → next action</h3><p>Turn traffic, leads, sales, and support notes into one growth experiment and proof note.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-weekly-growth-review-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- WEEKLY-GROWTH-REVIEW-EXAMPLE:START -->"
              end = "<!-- WEEKLY-GROWTH-REVIEW-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="weekly-growth-review-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Weekly Growth Review · Example 12</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn weekly numbers into next actions.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste traffic, leads, sales, checkout, and support notes. Get one next experiment, one content idea, one product fix, and a proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/weekly-growth-review/">See the weekly growth workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit weekly-growth-review example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add weekly growth review workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
