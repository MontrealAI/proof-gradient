name: Add Department Monthly Proof Report Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: department-monthly-proof-report-workflow-example
  cancel-in-progress: false

jobs:
  add-department-monthly-proof-report-example:
    name: Add department-monthly-proof-report workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create department-monthly-proof-report workflow example safely
        id: build
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "department-monthly-proof-report"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "department-monthly-proof-report"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · PROOF ROOM LITE</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn 30 days of AI work</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a proof report.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Weekly reviews → Executive summary → Decisions → Next month → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 20:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Proof Room Lite → monthly executive proof report</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Give leadership proof of what ran, what changed, and what should happen next.</text>
          </svg>"""
          (assets_dir / "department-monthly-proof-report-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough monthly Proof Room Lite report notes:
          Product: GoalOS Department Pack / Proof Room Lite
          Buyer: department lead, operations manager, AI champion, or small-business manager
          Room: Customer Success AI Workflow Room
          Reporting period: first 30 days

          Weekly review summary:
          Week 1:
          - Inventoried repeated tasks
          - Chose support FAQ replies, meeting notes to action plan, and product feedback summary

          Week 2:
          - Support FAQ workflow ran 18 times
          - Meeting notes workflow ran 9 times
          - Product feedback workflow ran 5 times
          - Support workflow needed tone and policy-rule revisions

          Week 3:
          - Support FAQ workflow ran 22 times
          - Meeting notes workflow ran 11 times
          - Product feedback workflow ran 6 times
          - Meeting notes workflow needed stronger owner/deadline checks

          Week 4:
          - Support FAQ workflow ran 25 times
          - Meeting notes workflow ran 12 times
          - Product feedback workflow ran 8 times
          - Product feedback workflow produced recurring themes for product updates

          Goal:
          Create a monthly executive proof report, leadership summary, workflow status table, decision list, next-month plan, public-safe summary, and proof note.

          Rules:
          - no guaranteed productivity
          - no guaranteed ROI
          - no compliance certification
          - no claim that AI outputs are safe without human review
          - do not reveal private customer details
          - mark uncertain metrics clearly
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Monthly Proof Room Lite Report:
          Room:
          Customer Success AI Workflow Room

          Reporting period:
          First 30 days

          Executive summary:
          The department tested three repeated AI-assisted workflows for 30 days:

          1. Support FAQ replies
          2. Meeting notes to action plan
          3. Product feedback summary

          The most useful pattern was not “automate everything.”

          The useful pattern was:
          choose a repeated task
          assign an owner
          add rules
          add checks
          run it
          record issues
          revise weekly

          Workflow status table:
          1. Support FAQ replies
          Status: Active / revised
          Runs recorded: 65
          Main issue found: tone and policy clarity
          Decision: keep with revised rules and human review

          2. Meeting notes to action plan
          Status: Active / needs stronger checks
          Runs recorded: 32
          Main issue found: missing owners and unclear deadlines
          Decision: keep with mandatory owner/deadline checks

          3. Product feedback summary
          Status: Keep
          Runs recorded: 19
          Main issue found: none serious
          Decision: continue and use themes for product updates

          Decisions:
          Keep:
          - product feedback summary

          Revise:
          - support FAQ replies
          - meeting notes to action plan

          Stop:
          - no workflow stopped this month

          Next-month plan:
          1. Add stronger policy uncertainty rule to support replies.
          2. Add owner/deadline checks to meeting notes workflow.
          3. Turn product feedback summary into one monthly product-update memo.
          4. Add one new workflow only after the three current workflows are stable.

          Leadership update email:
          Subject: 30-day Proof Room Lite summary

          We completed the first 30 days of the Customer Success AI Workflow Room.

          We tested three repeated workflows:
          - support FAQ replies
          - meeting notes to action plan
          - product feedback summary

          The room helped us see what should be kept, what should be revised, and where human review is still required.

          Important boundary:
          This report does not claim productivity gains, ROI, compliance, or autonomous readiness. It summarizes observed workflow use, issues, revisions, and next actions.

          Next month:
          We will strengthen checks on support and meeting workflows, continue product feedback summaries, and avoid adding more workflows until the current three are stable.

          Public-safe summary:
          Over 30 days, a department used Proof Room Lite to organize three repeated AI-assisted workflows, assign owners, track issues, revise rules, and produce a monthly evidence-based update."""

          proof_note = """Proof note:
          Source: 30 days of summarized Proof Room Lite notes.
          Outputs created: monthly executive proof report, workflow status table, decision list, next-month plan, leadership update email, public-safe summary.
          Claims made: Proof Room Lite can help a department organize repeated AI workflows, owners, checks, issues, revisions, and proof summaries.
          Claims avoided: no guaranteed productivity, no guaranteed ROI, no compliance certification, no autonomous-readiness claim, no private customer details.
          Review needed: department should confirm run counts, issue summaries, owners, private data boundaries, and internal policy before sharing.
          Public-safe: yes, if customer/private details and sensitive operational details are removed."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Department Monthly Proof Report — GoalOS Workflow Example</title>
            <meta name="description" content="Turn 30 days of Proof Room Lite notes into an executive proof report, status table, leadership update, next-month plan, and proof note." />
            <meta property="og:title" content="Turn 30 days of AI work into a proof report." />
            <meta property="og:description" content="Weekly reviews → executive summary → decisions → next month → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/department-monthly-proof-report-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Proof Room Lite · Example 20</div>
              <h1>Turn 30 days of AI work into a proof report.</h1>
              <p class="lead">This reusable AI workflow turns a month of Proof Room Lite notes into an executive report: what ran, what changed, what needs revision, what should happen next, and what can be shared safely.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                <a class="btn" href="/proof-gradient/workflow/department-weekly-proof-review/">Example 19: weekly proof review</a>
                <a class="btn" href="/proof-gradient/workflow/department-proof-room-lite/">Example 18: Proof Room Lite setup</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/AEP-008/">Proof Room Standard</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Leadership does not need AI hype. It needs proof of what happened.</div>
                <p class="lead">A monthly Proof Room report turns scattered AI experiments into a clear executive summary: workflows, owners, issues, decisions, next actions, and claim boundaries.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: no executive visibility</h3>
                    <p>The department tries AI workflows, but leadership only hears anecdotes. Nobody sees what ran, what broke, or what changed.</p>
                    <p class="mini">Result: AI adoption feels vague and hard to trust.</p>
                  </div>
                  <div class="card">
                    <h3>After: monthly proof report</h3>
                    <p>The department summarizes workflows, run counts, issues, revisions, decisions, and next-month priorities in one proof-ready report.</p>
                    <p class="mini">Result: leadership sees evidence, not hype.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the room name, reporting period, workflows, weekly reviews, issues, and decisions.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to claim ROI, productivity, compliance, or autonomous readiness.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the monthly report structure: executive summary, status table, decisions, next plan, public-safe summary, proof note.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates the monthly report, leadership email, workflow status table, next-month plan, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether metrics are grounded, owners are clear, private data is removed, and claim boundaries are explicit.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was claimed, what was avoided, and what must be reviewed before sharing.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough monthly Proof Room Lite report notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Executive summary</span>
                  <span class="pill">Workflow status table</span>
                  <span class="pill">Keep / revise / stop decisions</span>
                  <span class="pill">Next-month plan</span>
                  <span class="pill">Leadership email</span>
                  <span class="pill">Public-safe summary</span>
                  <span class="pill">Claim boundary</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for leadership</h3><p>Turn a month of AI activity into a report managers can understand.</p></div>
                  <div class="card"><h3>Evidence over hype</h3><p>The workflow summarizes observed runs, issues, and revisions without unsupported ROI claims.</p></div>
                  <div class="card"><h3>Monthly operating rhythm</h3><p>Every month ends with decisions, next actions, and a proof note.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste 30 days of proof notes. Get an executive proof report.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-008/">See the Proof Room Standard</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, procurement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, productivity, ROI, or business-results guarantee. Review internal policies, data boundaries, metrics, workflow owners, and human-review responsibilities before sharing.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof."),
              "internal-approval-memo": ("Example 16: Interest → approval memo", "Turn an interested internal champion into a manager memo, procurement email, rollout plan, and proof."),
              "team-sprint-facilitator": ("Example 17: Team Pack → self-run sprint", "Turn a team meeting into a reusable AI workflow session, role assignments, checks, and proof."),
              "department-proof-room-lite": ("Example 18: Department Pack → Proof Room Lite", "Turn scattered department AI use into workflow priorities, roles, checks, dashboard fields, and proof."),
              "department-weekly-proof-review": ("Example 19: Weekly proof review", "Turn dashboard notes into keep/revise/stop decisions, manager update, and proof."),
              "department-monthly-proof-report": ("Example 20: Monthly proof report", "Turn 30 days of Proof Room Lite notes into an executive report, leadership email, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-department-monthly-proof-report-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- DEPARTMENT-MONTHLY-PROOF-REPORT-EXAMPLE:START -->"
              end = "<!-- DEPARTMENT-MONTHLY-PROOF-REPORT-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="department-monthly-proof-report-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Proof Room Lite · Example 20</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn 30 days of AI work into a proof report.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste monthly Proof Room notes. Get an executive report, workflow status table, leadership email, next-month plan, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/department-monthly-proof-report/">See the monthly proof report workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit department-monthly-proof-report example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add department-monthly-proof-report workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
