name: Add Checkout Recovery Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: checkout-recovery-workflow-example
  cancel-in-progress: false

jobs:
  add-checkout-recovery-example:
    name: Add checkout-recovery workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create checkout-recovery workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "checkout-recovery"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "checkout-recovery"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · CHECKOUT LOOP</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn almost-buyers</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into clear decisions.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Checkout signal → Objection → Clarifying email → FAQ → Proof note</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 13:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Abandoned checkout → ethical recovery sequence</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Recover confused buyers with clarity, not pressure, fake urgency, or misleading claims.</text>
          </svg>"""
          (assets_dir / "checkout-recovery-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough checkout recovery notes:
          Product: GoalOS AI Efficiency Sprint Kit
          Price: $49
          Signal: visitor clicked checkout but did not complete purchase
          Possible reasons:
          - they are unsure what is inside the kit
          - they think it may be just prompts
          - they wonder if it is technical
          - they worry there are no refunds
          - they got distracted
          Goal: create a simple, permission-aware checkout recovery sequence that clarifies the offer without pressure
          Rules:
          - only send if the person gave permission / platform allows checkout recovery
          - include unsubscribe where required
          - no fake urgency
          - no fake scarcity
          - no income guarantee
          - no ROI guarantee
          - no fake testimonial
          - no “you forgot” guilt language
          - be calm and helpful
          Terms:
          digital product, instant access, all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Checkout Recovery Email 1 — Clarify the offer
          Subject: Still considering the GoalOS kit?

          Hi,

          You were looking at the GoalOS AI Efficiency Sprint Kit.

          Simple reminder:

          This is a $49 digital kit that helps you build one reusable AI workflow in under one hour.

          It is for people who keep asking AI from scratch for the same kind of task.

          Inside the kit:
          - Start Here guide
          - 60-minute sprint checklist
          - AI task picker
          - Context template
          - Rules template
          - Memory template
          - Workflow template
          - Checks template
          - Proof page template
          - Copy-paste prompts
          - Examples

          It is not a magic income system.
          It is not legal, financial, medical, or compliance advice.

          It is a practical workflow kit.

          Checkout Recovery Email 2 — Answer the objection
          Subject: Is this just prompts?

          Fair question.

          No — the point is not to collect more prompts.

          A prompt helps once.

          A reusable workflow helps repeatedly.

          The GoalOS method is:

          context
          rules
          memory
          workflow
          checks
          proof

          The goal is to build one reusable AI work system you can run again.

          Checkout Recovery Email 3 — Terms clarity
          Subject: Before you buy

          A quick clarity note before checkout:

          The GoalOS AI Efficiency Sprint Kit is a digital educational product.

          Access is delivered instantly.

          All sales are final once delivered, except where required by law or for duplicate charges / technical access failures.

          Buy only if you want a self-serve kit that helps you build one reusable AI workflow.

          Not for:
          - guaranteed income
          - guaranteed ROI
          - legal/financial/medical advice
          - fully autonomous AI acting without review

          Checkout FAQ:
          Q: Do I need to be technical?
          A: No. Pick one repeated task and follow the 60-minute checklist.

          Q: What should I use it for first?
          A: Customer replies, meeting notes, weekly updates, sales-page sections, email sequences, or support FAQ.

          Q: What if my download does not work?
          A: Contact support with your order email. Access issues and corrupted/missing files can be reviewed.

          Q: Can I get a refund because I changed my mind?
          A: This is a digital product with instant access. Sales are final once delivered, except where required by law or for duplicate charges / technical access failures."""

          proof_note = """Proof note:
          Source: rough checkout recovery notes.
          Outputs created: checkout recovery email sequence and FAQ.
          Claims made: the kit helps buyers build one reusable AI workflow.
          Claims avoided: no income guarantee, no ROI guarantee, no fake urgency, no fake scarcity, no fake testimonial, no pressure language, no guarantee of results.
          Consent boundary: send only where the person opted in or the checkout platform legally supports recovery messages; include unsubscribe/identity where required.
          Review needed: human should confirm email consent, platform settings, unsubscribe link, checkout terms, and final product contents before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Checkout Recovery — GoalOS Workflow Example</title>
            <meta name="description" content="Turn abandoned checkout signals into a calm, permission-aware recovery sequence with offer clarity, FAQ, terms, and proof note." />
            <meta property="og:title" content="Turn almost-buyers into clear decisions." />
            <meta property="og:description" content="Checkout signal → objection → clarifying email → FAQ → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/checkout-recovery-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Checkout Loop · Example 13</div>
              <h1>Turn almost-buyers into clear decisions.</h1>
              <p class="lead">This reusable AI workflow turns an abandoned checkout signal into a calm, permission-aware recovery sequence that clarifies the offer, answers objections, explains terms, and leaves a proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/partner-referral-kit/">Example 11: partner kit</a>
                <a class="btn" href="/proof-gradient/workflow/monthly-workflow-vault-drop/">Example 10: Workflow Vault</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Recover confusion, not just carts.</div>
                <p class="lead">Some buyers do not need pressure. They need clarity: what is inside, who it is for, what is not promised, and what the digital product terms mean.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: abandoned checkout</h3>
                    <p>Someone clicks checkout, hesitates, and leaves. You do not know whether the issue was price, confusion, technical concern, or terms.</p>
                    <p class="mini">Result: lost demand and no learning.</p>
                  </div>
                  <div class="card">
                    <h3>After: recovery workflow</h3>
                    <p>The workflow creates a calm sequence that clarifies the offer, answers common concerns, and reminds people of the terms without fake urgency.</p>
                    <p class="mini">Result: clearer buyer decisions with less manual follow-up.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the product, price, checkout signal, likely objections, and product terms.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to avoid fake urgency, guilt language, income claims, ROI claims, and fake testimonials.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the product contents, who it is for, who it is not for, and standard final-sale wording.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates clarifying email, objection email, terms email, FAQ, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks consent, unsubscribe needs, claim boundaries, and whether the copy is calm and honest.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was claimed, what was avoided, and what must be reviewed before sending.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough checkout recovery notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Recovery email 1</span>
                  <span class="pill">Objection email</span>
                  <span class="pill">Terms email</span>
                  <span class="pill">Checkout FAQ</span>
                  <span class="pill">Claim boundary</span>
                  <span class="pill">Consent reminder</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for checkout clarity</h3><p>Recover buyers who left because the product was not clear enough.</p></div>
                  <div class="card"><h3>No pressure tactics</h3><p>The workflow avoids fake urgency, fake scarcity, and guilt language.</p></div>
                  <div class="card"><h3>Lower support risk</h3><p>The recovery sequence explains digital product terms before purchase.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste checkout notes. Get a calm recovery sequence and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, advertising, endorsement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Send checkout recovery messages only where you have proper permission or platform/legal basis, and include unsubscribe/identity where required.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
              <a class="card" href="feedback-to-product-update/"><h3>Example 8: Feedback → product update</h3><p>Turn buyer feedback into product improvements, changelog, buyer email, and proof.</p></a>
              <a class="card" href="proof-card-referral-loop/"><h3>Example 9: Usage → proof card</h3><p>Turn real usage into public-safe proof, social post, referral ask, and permission request.</p></a>
              <a class="card" href="monthly-workflow-vault-drop/"><h3>Example 10: Requests → Vault drop</h3><p>Turn buyer requests into a recurring template library, announcement email, changelog, and proof.</p></a>
              <a class="card" href="partner-referral-kit/"><h3>Example 11: Partner interest → referral kit</h3><p>Turn partner interest into clear promo copy, disclosure language, FAQ, and proof.</p></a>
              <a class="card" href="checkout-recovery/"><h3>Example 13: Checkout signal → recovery sequence</h3><p>Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-checkout-recovery-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- CHECKOUT-RECOVERY-EXAMPLE:START -->"
              end = "<!-- CHECKOUT-RECOVERY-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="checkout-recovery-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Checkout Loop · Example 13</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn almost-buyers into clear decisions.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste checkout recovery notes. Get clarifying emails, objection handling, FAQ, terms language, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/checkout-recovery/">See the checkout recovery workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit checkout-recovery example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add checkout-recovery workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
