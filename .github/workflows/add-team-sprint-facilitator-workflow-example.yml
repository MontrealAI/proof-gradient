name: Add Team Sprint Facilitator Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: team-sprint-facilitator-workflow-example
  cancel-in-progress: false

jobs:
  add-team-sprint-example:
    name: Add team-sprint-facilitator workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create team-sprint-facilitator workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "team-sprint-facilitator"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "team-sprint-facilitator"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · TEAM SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn a team meeting</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a workflow.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Team task → Sprint agenda → Roles → Workflow → Checks → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 17:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Team Pack → self-run 60-minute sprint</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Help a team build one reusable AI workflow without live consulting.</text>
          </svg>"""
          (assets_dir / "team-sprint-facilitator-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough team sprint notes:
          Product: GoalOS AI Efficiency Sprint Team Pack
          Goal: help a team run a self-serve 60-minute session without live consulting
          Team size: 3 to 6 people
          First task: weekly client status update
          Need output:
          - facilitator agenda
          - role assignments
          - room rules
          - 60-minute script
          - reusable workflow draft
          - checks list
          - follow-up email
          - proof note
          Rules:
          - no guaranteed productivity
          - no guaranteed ROI
          - no legal/compliance claim
          - no promise that AI output can be used without review
          - keep it simple for non-technical teams
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Team Sprint Agenda:
          Goal:
          Turn one repeated team task into one reusable AI workflow.

          Task selected:
          Weekly client status update.

          Roles:
          1. Facilitator — keeps the session moving.
          2. Task Owner — explains how the task is done today.
          3. Context Keeper — captures reusable context.
          4. Rules Keeper — captures must-do / never-do rules.
          5. Checker — defines what must be reviewed before use.
          6. Proof Keeper — writes the proof note.

          60-Minute Sprint Script:
          Minute 0–5:
          Pick the repeated task and agree on the output.

          Minute 5–15:
          Describe the current messy process.

          Minute 15–25:
          Write the context the AI needs every time.

          Minute 25–35:
          Write the rules:
          - what the AI must always do
          - what the AI must never do
          - what must be reviewed by a human

          Minute 35–45:
          Build the workflow steps.

          Minute 45–55:
          Add checks.

          Minute 55–60:
          Create the proof note and choose the next owner.

          Room Rules:
          - Start with one task only.
          - Do not solve every workflow today.
          - Do not use private client data in public examples.
          - Do not treat AI output as final without review.
          - Record what was claimed and what was not claimed.

          Reusable Workflow Draft:
          Workflow name:
          Weekly Client Status Update

          Input:
          meeting notes, current project status, blockers, next actions

          Steps:
          1. Summarize the week.
          2. List completed work.
          3. List blockers.
          4. List next actions.
          5. Draft the client update.
          6. Mark uncertain items for human review.
          7. Create proof note.

          Checks:
          - Are client names correct?
          - Are deadlines confirmed?
          - Are claims supported?
          - Are uncertain items marked?
          - Is private information removed if shared publicly?

          Follow-up Email:
          Subject: Team sprint output — weekly client status workflow

          Thanks for joining the GoalOS team sprint.

          We built one reusable workflow:
          Weekly Client Status Update

          Next owner:
          Task Owner

          Before using it:
          - test it on one internal example
          - check names and dates
          - review uncertain items
          - keep private client details out of public examples

          Next step:
          Run the workflow once this week and record what worked."""

          proof_note = """Proof note:
          Source: rough team sprint notes.
          Outputs created: facilitator agenda, role assignments, room rules, 60-minute script, reusable workflow draft, checks list, follow-up email.
          Claims made: the Team Pack can help a team run a self-serve sprint to build one reusable AI workflow.
          Claims avoided: no guaranteed productivity, no guaranteed ROI, no compliance claim, no claim that AI output is final without review.
          Review needed: team should confirm roles, task scope, privacy boundaries, and internal policies before using outputs.
          Public-safe: yes, if client/private details are removed."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Team Sprint Facilitator — GoalOS Workflow Example</title>
            <meta name="description" content="Turn a Team Pack purchase into a self-run 60-minute team sprint with agenda, roles, workflow draft, checks, follow-up email, and proof note." />
            <meta property="og:title" content="Turn a team meeting into a reusable workflow." />
            <meta property="og:description" content="Team task → sprint agenda → roles → workflow → checks → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/team-sprint-facilitator-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Team Sprint · Example 17</div>
              <h1>Turn a team meeting into a workflow.</h1>
              <p class="lead">This reusable AI workflow turns a Team Pack purchase into a self-run 60-minute team sprint: facilitator agenda, role assignments, room rules, workflow draft, checks, follow-up email, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Team Pack</a>
                <a class="btn" href="/proof-gradient/workflow/internal-approval-memo/">Example 16: approval memo</a>
                <a class="btn" href="/proof-gradient/workflow/team-pack-upsell/">Example 15: Team Pack upsell</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">A team does not need another AI lecture. It needs one reusable workflow.</div>
                <p class="lead">The Team Pack becomes much easier to understand when people see the exact 60-minute session it helps them run.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: team AI chaos</h3>
                    <p>Everyone uses AI differently. Repeated tasks are handled from scratch. Nobody knows what context, rules, checks, or proof should be used.</p>
                    <p class="mini">Result: inconsistent AI work and no reusable team process.</p>
                  </div>
                  <div class="card">
                    <h3>After: one team workflow</h3>
                    <p>The team picks one repeated task and leaves with a shared workflow, role assignments, checks, and proof note.</p>
                    <p class="mini">Result: one reusable team asset without live consulting.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the team size, task, session goal, and desired output.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to promise ROI, productivity, compliance, or final AI output without review.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the standard sprint structure: task, context, rules, workflow, checks, proof.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates the agenda, roles, script, workflow draft, checks, follow-up email, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the session is clear, time-boxed, non-technical, and realistic.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was created, what was claimed, what was avoided, and what needs review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough team sprint notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Facilitator agenda</span>
                  <span class="pill">Role assignments</span>
                  <span class="pill">Room rules</span>
                  <span class="pill">60-minute script</span>
                  <span class="pill">Workflow draft</span>
                  <span class="pill">Checks list</span>
                  <span class="pill">Follow-up email</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for self-serve teams</h3><p>The Team Pack becomes easier to use without live facilitation.</p></div>
                  <div class="card"><h3>Non-technical</h3><p>The team only needs to pick one repeated task and follow the agenda.</p></div>
                  <div class="card"><h3>Proof-ready</h3><p>The output includes checks and a proof note, not just a brainstorm.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste team sprint notes. Get a 60-minute team workflow session and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS Team Pack</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-008/">See the Proof Room Standard</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, procurement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, productivity, or business-results guarantee. Review internal policies and private data boundaries before using team outputs.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof."),
              "internal-approval-memo": ("Example 16: Interest → approval memo", "Turn an interested internal champion into a manager memo, procurement email, rollout plan, and proof."),
              "team-sprint-facilitator": ("Example 17: Team Pack → self-run sprint", "Turn a team meeting into a reusable AI workflow session, role assignments, checks, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-team-sprint-facilitator-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- TEAM-SPRINT-FACILITATOR-EXAMPLE:START -->"
              end = "<!-- TEAM-SPRINT-FACILITATOR-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="team-sprint-facilitator-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Team Sprint · Example 17</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn a team meeting into a workflow.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste team sprint notes. Get a 60-minute agenda, roles, room rules, workflow draft, checks, follow-up email, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/team-sprint-facilitator/">See the team sprint workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the Team Pack</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit team-sprint-facilitator example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add team-sprint-facilitator workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
