name: AEP-005 Official Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "aep-005-v1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/aep005_assets
          find docs/standards/AEP-005 site/standards/AEP-005 -maxdepth 5 -type f \
            \( -name '*.zip' -o -name '*.pdf' -o -name '*.json' -o -name '*.md' -o -name 'SHA256SUMS.txt' -o -name 'QA_REPORT.md' \) \
            -exec cp {} /tmp/aep005_assets/ \; 2>/dev/null || true
          ls -la /tmp/aep005_assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cat > /tmp/aep005_notes.md <<'EOF'
          # AEP-005 — Tool Permission Standard v1.1

          AEP-001 defines the protocol.  
          AEP-002 defines the docket.  
          AEP-003 defines the packet.  
          AEP-004 defines the gate.  
          AEP-005 defines the permission.

          GoalOS allows only what is scoped, approved, leased, revocable, and provable.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AEP-005 — Tool Permission Standard v1.1" --notes-file /tmp/aep005_notes.md
          else
            gh release create "$TAG" --title "AEP-005 — Tool Permission Standard v1.1" --notes-file /tmp/aep005_notes.md
          fi

          if compgen -G "/tmp/aep005_assets/*" > /dev/null; then
            gh release upload "$TAG" /tmp/aep005_assets/* --clobber
          fi
