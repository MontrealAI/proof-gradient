          if home.exists():
              text = home.read_text(encoding='utf-8', errors='ignore')
              text = re.sub(r'<!-- GOALOS-CLOUD-MVP:START -->.*?<!-- GOALOS-CLOUD-MVP:END -->', block, text, flags=re.S)
              if 'GOALOS-CLOUD-MVP:START' not in text:
                  if '</main>' in text:
                      text = text.replace('</main>', block + '\n</main>', 1)
                  elif '</body>' in text:
                      text = text.replace('</body>', block + '\n</body>', 1)
