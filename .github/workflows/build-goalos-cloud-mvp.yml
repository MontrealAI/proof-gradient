              <a href="/proof-gradient/products/goalos-cloud-mvp/" style="display:inline-flex;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;color:#f7f8ff;">Read about the MVP</a>
