name: Build GoalOS Cloud MVP 0.1

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-goalos-cloud-mvp
  cancel-in-progress: false

jobs:
  build-goalos-mvp:
    name: Build smallest production-grade GoalOS MVP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GoalOS Cloud MVP files
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/generate_goalos_cloud_mvp.py" <<'PY'

          from pathlib import Path
          import re, json, hashlib

          WEB_ROOT = Path('site')
          if not WEB_ROOT.exists() and Path('public').exists():
              WEB_ROOT = Path('public')
          WEB_ROOT.mkdir(parents=True, exist_ok=True)
          (WEB_ROOT / '.nojekyll').write_text('', encoding='utf-8')
          APP = WEB_ROOT / 'app' / 'goalos-cloud-mvp'
          ASSETS = APP / 'assets'
          TESTS = APP / 'tests'
          ASSETS.mkdir(parents=True, exist_ok=True)
          TESTS.mkdir(parents=True, exist_ok=True)

          (ASSETS / 'goalos-core.mjs').write_text('export const SAMPLE_CASES = [\n  {\n    id: "case_refund_001",\n    title: "Refund / access issue",\n    issueType: "refund",\n    customerMessage: "I bought the digital kit but cannot access the files. Can I get a refund?",\n    expectedQualities: ["clear access help", "approved refund boundary", "human review flag when uncertain"],\n    risk: "medium"\n  },\n  {\n    id: "case_tone_002",\n    title: "Confused buyer asks how to start",\n    issueType: "onboarding",\n    customerMessage: "I downloaded the kit but I’m overwhelmed. What do I open first?",\n    expectedQualities: ["calm tone", "step-by-step guidance", "no overpromise"],\n    risk: "low"\n  },\n  {\n    id: "case_policy_003",\n    title: "No-refund challenge",\n    issueType: "refund",\n    customerMessage: "I changed my mind after downloading. Your page says all sales are final. Is there any exception?",\n    expectedQualities: ["approved digital product terms", "no legal advice", "human review flag"],\n    risk: "medium"\n  },\n  {\n    id: "case_support_004",\n    title: "Missing file",\n    issueType: "access",\n    customerMessage: "The ZIP opens but one PDF seems missing. Can you help?",\n    expectedQualities: ["helpful troubleshooting", "support boundary", "replacement path"],\n    risk: "low"\n  },\n  {\n    id: "case_claims_005",\n    title: "Buyer asks for ROI guarantee",\n    issueType: "claims",\n    customerMessage: "Will this guarantee I save 10 hours per week or make more money?",\n    expectedQualities: ["no ROI guarantee", "safe claim boundary", "plain explanation"],\n    risk: "medium"\n  },\n  {\n    id: "case_bilingual_006",\n    title: "French buyer asks for guidance",\n    issueType: "onboarding",\n    customerMessage: "Je suis débutant. Quelle est la première étape pour utiliser GoalOS RSI Lite?",\n    expectedQualities: ["French answer", "simple first step", "no overpromise"],\n    risk: "low"\n  }\n];\n\nexport function initialWorkflow() {\n  return {\n    id: "wf_support_reply",\n    name: "Customer Support Reply Workflow",\n    version: "1.0.0",\n    status: "production-demo",\n    author: "GoalOS MVP",\n    riskLevel: "medium",\n    goal: "Draft helpful customer support replies for digital product buyers.",\n    context: [\n      "Buyer may be non-technical.",\n      "Products are digital educational products.",\n      "Support is limited to access issues, duplicate charges, missing files, or corrupted files."\n    ],\n    rules: [\n      "Be calm, clear, and helpful.",\n      "Do not guarantee income, ROI, productivity, compliance, safety, or business results.",\n      "Do not provide legal, financial, medical, employment, security, tax, or regulatory advice.",\n      "If uncertain, mark the answer for human review."\n    ],\n    memory: [\n      "Digital product terms: instant access; all sales are final once delivered except where required by law or for duplicate charges / technical access failures.",\n      "GoalOS helps users build reusable and self-improving AI workflows. Human review remains required."\n    ],\n    steps: [\n      "Classify the buyer issue.",\n      "Draft a short answer.",\n      "Add one next step.",\n      "Add support boundary when relevant."\n    ],\n    checks: [\n      "No ROI or income guarantee.",\n      "No legal/compliance claim.",\n      "Tone is calm and useful.",\n      "Uncertainty is marked."\n    ],\n    proofRequirements: [\n      "Claims made",\n      "Claims avoided",\n      "Checks performed",\n      "Human review status",\n      "Next improvement recommendation"\n    ],\n    modelPolicy: {\n      provider: "local-demo",\n      model: "goalos-local-demo-model",\n      note: "Static deterministic demo. Replace with secure Model Gateway in production SaaS."\n    },\n    versionNotes: "Baseline workflow without a dedicated refund/access policy classifier."\n  };\n}\n\nfunction hasRefundPolicyRule(workflow) {\n  const text = [...workflow.rules, ...workflow.steps, ...workflow.checks].join(" ").toLowerCase();\n  return text.includes("refund") && text.includes("policy");\n}\n\nfunction hasFrenchSignal(input) {\n  return /je suis|quelle|étape|débutant|français|bonjour/i.test(input.customerMessage || "");\n}\n\nexport function runWorkflow(workflow, input) {\n  const refundAware = hasRefundPolicyRule(workflow);\n  const isFrench = hasFrenchSignal(input);\n  const issue = input.issueType;\n  let output = "";\n  let warnings = [];\n  let assumptions = [];\n  let uncertainty = [];\n  let checks = [];\n\n  if (isFrench) {\n    output += "Bonjour — voici la manière la plus simple de commencer.\\n\\n";\n    output += "1. Ouvrez le guide Start Here / Départ.\\n2. Choisissez une seule tâche IA répétée.\\n3. Créez le flux v1.0, exécutez-le, notez-le, puis améliorez-le.\\n\\n";\n    output += "La revue humaine reste requise avant d\'utiliser une sortie importante.";\n    checks.push("French response provided");\n  } else if (issue === "refund" && refundAware) {\n    output += "Thanks for reaching out. I can help you check the access issue first.\\n\\n";\n    output += "Because this is a digital educational product with instant access, sales are generally final once delivered, except where required by law or for duplicate charges / technical access failures.\\n\\n";\n    output += "Next step: please send the order email and a screenshot of the access problem so we can check whether this is a technical access failure.\\n\\n";\n    output += "Human review required: refund/access cases should be reviewed before a final decision is sent.";\n    uncertainty.push("Refund/access issue requires human review before final decision.");\n    checks.push("Approved digital product terms included");\n    checks.push("Human review flag included");\n  } else if (issue === "refund") {\n    output += "Thanks for reaching out. I understand the concern.\\n\\n";\n    output += "Please send your order email and we will review the situation.\\n\\n";\n    output += "We will do our best to help.";\n    warnings.push("Refund/access policy language missing.");\n    warnings.push("Human review flag missing for refund issue.");\n  } else if (issue === "claims") {\n    output += "GoalOS is an educational workflow product. It helps you structure repeated AI work, but it does not guarantee income, ROI, savings, productivity, compliance, safety, or business results.\\n\\n";\n    output += "The best next step is to use it on one repeated task and judge whether the workflow is useful for your situation.";\n    checks.push("ROI guarantee avoided");\n  } else if (issue === "access") {\n    output += "Thanks for letting us know. Please try unzipping the file again and check the folder named 00_OPEN_FIRST.\\n\\n";\n    output += "If a file is missing or corrupted, reply with your order email and the filename so support can help with access or replacement.";\n    checks.push("Access support boundary included");\n  } else {\n    output += "Thanks for reaching out. Start with one repeated AI task only.\\n\\n";\n    output += "Open the Start Here guide, complete the first worksheet, then run the workflow once and save a proof note.\\n\\n";\n    output += "Do not try to complete every template at once.";\n    checks.push("Beginner-friendly first step included");\n  }\n\n  return {\n    runId: "run_" + Date.now() + "_" + Math.random().toString(16).slice(2, 8),\n    workflowId: workflow.id,\n    workflowVersion: workflow.version,\n    inputId: input.id,\n    status: "completed",\n    modelUsed: workflow.modelPolicy.model,\n    provider: workflow.modelPolicy.provider,\n    inputSummary: input.title + " — " + input.issueType,\n    output,\n    warnings,\n    assumptions: assumptions.length ? assumptions : ["Input is treated as a sanitized demo support case."],\n    uncertainty,\n    checksPerformed: checks,\n    latencyMs: 120 + Math.floor(Math.random() * 30),\n    costUsd: 0,\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function evaluateRun(workflow, input, run) {\n  const text = (run.output || "").toLowerCase();\n  const refundAware = hasRefundPolicyRule(workflow);\n  const isRefund = input.issueType === "refund";\n  const isFrench = hasFrenchSignal(input);\n\n  let scores = {\n    accuracy: 8,\n    completeness: 8,\n    clarity: 8,\n    brandFit: 8,\n    policy: 8,\n    proofReadiness: 7\n  };\n  let issues = [];\n  let requiredFixes = [];\n  let unsupportedClaims = false;\n  let humanReviewNeeded = false;\n\n  if (/guarantee.*(income|roi|save|productivity)|guaranteed/i.test(run.output)) {\n    unsupportedClaims = true;\n    scores.policy -= 5;\n    issues.push("Unsupported guarantee detected.");\n    requiredFixes.push("Remove unsupported guarantee language.");\n  }\n\n  if (isRefund) {\n    humanReviewNeeded = true;\n    if (!text.includes("digital educational product") || !text.includes("technical access")) {\n      scores.policy = 2;\n      scores.completeness -= 2;\n      issues.push("Refund/access policy boundary missing or incomplete.");\n      requiredFixes.push("Add approved digital-product terms and technical-access exception language.");\n    }\n    if (!text.includes("human review")) {\n      scores.policy -= 1;\n      issues.push("Refund/access issue missing human review flag.");\n      requiredFixes.push("Add human review flag for refund/access cases.");\n    }\n  }\n\n  if (isFrench && !/[éèàùç]|bonjour|étape|revue humaine/i.test(run.output)) {\n    scores.clarity -= 3;\n    issues.push("French buyer did not receive a French-friendly response.");\n    requiredFixes.push("Add bilingual response handling.");\n  }\n\n  scores.accuracy = Math.max(0, Math.min(10, scores.accuracy));\n  scores.completeness = Math.max(0, Math.min(10, scores.completeness));\n  scores.clarity = Math.max(0, Math.min(10, scores.clarity));\n  scores.brandFit = Math.max(0, Math.min(10, scores.brandFit));\n  scores.policy = Math.max(0, Math.min(10, scores.policy));\n  scores.proofReadiness = Math.max(0, Math.min(10, scores.proofReadiness));\n\n  const overallScore = Math.round(\n    (scores.accuracy + scores.completeness + scores.clarity + scores.brandFit + scores.policy + scores.proofReadiness) / 6 * 10\n  ) / 10;\n\n  return {\n    evaluationId: "eval_" + run.runId,\n    runId: run.runId,\n    workflowVersion: workflow.version,\n    overallScore,\n    subScores: scores,\n    pass: overallScore >= 7.5 && !unsupportedClaims && !(isRefund && scores.policy < 7),\n    severity: overallScore >= 8 ? "low" : overallScore >= 6.5 ? "medium" : "high",\n    issues,\n    recommendedFixes: requiredFixes,\n    unsupportedClaims,\n    humanReviewNeeded,\n    confidence: 0.86,\n    explanation: issues.length ? "Evaluation found issues that should be corrected before external use." : "Evaluation passed the demo quality threshold.",\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function createProofRecord(workflow, input, run, evaluation) {\n  const claimsMade = [];\n  if ((run.output || "").toLowerCase().includes("digital educational product")) claimsMade.push("Digital product final-sale boundary explained.");\n  if ((run.output || "").toLowerCase().includes("human review")) claimsMade.push("Human review requirement stated.");\n  if ((run.output || "").toLowerCase().includes("does not guarantee")) claimsMade.push("No ROI / income guarantee boundary stated.");\n\n  const claimsAvoided = [\n    "No income guarantee",\n    "No ROI guarantee",\n    "No compliance certification",\n    "No autonomous sending claim",\n    "No model self-modification claim"\n  ];\n\n  return {\n    proofId: "proof_" + run.runId,\n    workflowName: workflow.name,\n    workflowVersion: workflow.version,\n    inputSummary: run.inputSummary,\n    outputSummary: run.output.slice(0, 220) + (run.output.length > 220 ? "..." : ""),\n    modelUsed: run.modelUsed,\n    provider: run.provider,\n    time: run.createdAt,\n    user: "demo-user",\n    checksPerformed: run.checksPerformed,\n    claimsMade,\n    claimsAvoided,\n    evidenceUsed: ["Workflow definition", "Demo input case", "Evaluation scorecard"],\n    uncertaintyFlagged: run.uncertainty,\n    reviewer: evaluation.humanReviewNeeded ? "human-review-required" : "not-required-for-demo",\n    approvalStatus: evaluation.pass && !evaluation.humanReviewNeeded ? "approved-demo" : "needs-review",\n    finalDecision: evaluation.pass ? "keep" : "revise",\n    nextImprovementRecommendation: evaluation.recommendedFixes.join(" ") || "Monitor repeated runs.",\n    publicSafe: true,\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function benchmarkWorkflow(workflow, cases = SAMPLE_CASES) {\n  const runs = [];\n  const evaluations = [];\n  const proofRecords = [];\n  for (const input of cases) {\n    const run = runWorkflow(workflow, input);\n    const evaluation = evaluateRun(workflow, input, run);\n    const proof = createProofRecord(workflow, input, run, evaluation);\n    runs.push(run);\n    evaluations.push(evaluation);\n    proofRecords.push(proof);\n  }\n  const avgScore = Math.round(evaluations.reduce((sum, e) => sum + e.overallScore, 0) / evaluations.length * 10) / 10;\n  const refundCases = cases.filter(c => c.issueType === "refund").length;\n  const refundPass = evaluations.filter((e, i) => cases[i].issueType === "refund" && e.subScores.policy >= 7).length;\n  const passRate = Math.round(evaluations.filter(e => e.pass).length / evaluations.length * 100);\n  const refundPolicyCompliance = refundCases ? Math.round(refundPass / refundCases * 100) : 100;\n  return {\n    workflowVersion: workflow.version,\n    avgScore,\n    passRate,\n    refundPolicyCompliance,\n    runCount: runs.length,\n    runs,\n    evaluations,\n    proofRecords,\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function detectFailurePattern(benchmark) {\n  if (benchmark.refundPolicyCompliance < 90) {\n    return {\n      pattern: "refund_policy_failure",\n      severity: "high",\n      problem: `${100 - benchmark.refundPolicyCompliance}% of refund/access cases failed the refund-policy check.`,\n      evidence: {\n        refundPolicyCompliance: benchmark.refundPolicyCompliance,\n        avgScore: benchmark.avgScore,\n        passRate: benchmark.passRate\n      },\n      diagnosis: "Workflow v1.0 does not explicitly classify refund/access issues before drafting the final reply.",\n      recommendedChange: "Add a policy classification step and a refund/access human-review rule."\n    };\n  }\n  if (benchmark.passRate < 80) {\n    return {\n      pattern: "general_quality_failure",\n      severity: "medium",\n      problem: `Only ${benchmark.passRate}% of benchmark cases passed.`,\n      evidence: { avgScore: benchmark.avgScore, passRate: benchmark.passRate },\n      diagnosis: "Workflow rules and checks are not specific enough.",\n      recommendedChange: "Add task-specific checks and clearer output format."\n    };\n  }\n  return {\n    pattern: "no_major_pattern",\n    severity: "low",\n    problem: "No major repeated failure pattern detected.",\n    evidence: { avgScore: benchmark.avgScore, passRate: benchmark.passRate },\n    diagnosis: "Workflow is stable in the current benchmark set.",\n    recommendedChange: "Monitor additional runs."\n  };\n}\n\nexport function proposeImprovement(workflow, failurePattern) {\n  const proposed = JSON.parse(JSON.stringify(workflow));\n  proposed.version = "1.1.0-draft";\n  proposed.status = "draft";\n  proposed.versionNotes = "Adds refund/access policy classification and human-review gate.";\n  proposed.rules = [\n    ...workflow.rules,\n    "If the issue involves refund, cancellation, billing, access failure, or policy uncertainty, use the approved digital-product terms and flag for human review before final decision."\n  ];\n  proposed.steps = [\n    "Classify the buyer issue.",\n    "If refund/access/billing/policy issue, classify policy sensitivity before drafting.",\n    "Draft a short answer using approved policy boundaries.",\n    "Add one next step.",\n    "Add support boundary and human-review flag when relevant."\n  ];\n  proposed.checks = [\n    ...workflow.checks,\n    "Refund/access policy boundary is present when relevant.",\n    "Human review flag is present for refund/access or policy uncertainty."\n  ];\n\n  return {\n    proposalId: "imp_" + Date.now(),\n    workflowId: workflow.id,\n    fromVersion: workflow.version,\n    proposedVersion: proposed.version,\n    problemDetected: failurePattern.problem,\n    evidence: failurePattern.evidence,\n    diagnosis: failurePattern.diagnosis,\n    proposedChange: failurePattern.recommendedChange,\n    expectedBenefit: "Improve refund/access policy compliance and reduce unsupported support replies.",\n    potentialRisk: "Replies may become slightly longer and may increase human-review load.",\n    diff: [\n      { field: "rules", action: "add", value: proposed.rules[proposed.rules.length - 1] },\n      { field: "steps", action: "replace", value: "Add policy classification before drafting." },\n      { field: "checks", action: "add", value: "Refund/access policy boundary and human-review flag." }\n    ],\n    rollbackPlan: `Restore workflow version ${workflow.version} as production if v1.1 quality drops.`,\n    approvalRequired: true,\n    deploymentRecommendation: "approve-canary-after-human-review",\n    status: "pending-approval",\n    proposedWorkflow: proposed,\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function approveProposal(proposal) {\n  const approved = JSON.parse(JSON.stringify(proposal.proposedWorkflow));\n  approved.version = "1.1.0";\n  approved.status = "approved-demo";\n  approved.approvedAt = new Date().toISOString();\n  return {\n    approvalId: "approval_" + proposal.proposalId,\n    proposalId: proposal.proposalId,\n    decision: "approved-canary-demo",\n    reviewer: "demo-reviewer",\n    comments: "Approved for demo canary after benchmark comparison. Human review remains required for refund/access cases.",\n    rollbackTarget: proposal.fromVersion,\n    approvedWorkflow: approved,\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function createPublicSafeProofCard(proofRecords, benchmarkBefore, benchmarkAfter = null) {\n  return {\n    title: "GoalOS Public-Safe Proof Card",\n    workflowFamily: "Customer Support Reply Workflow",\n    summary: "A repeated AI support task was converted into a versioned workflow, scored, reviewed, and improved through a human-approved recursive workflow loop.",\n    before: benchmarkBefore ? {\n      version: benchmarkBefore.workflowVersion,\n      avgScore: benchmarkBefore.avgScore,\n      passRate: benchmarkBefore.passRate,\n      refundPolicyCompliance: benchmarkBefore.refundPolicyCompliance\n    } : null,\n    after: benchmarkAfter ? {\n      version: benchmarkAfter.workflowVersion,\n      avgScore: benchmarkAfter.avgScore,\n      passRate: benchmarkAfter.passRate,\n      refundPolicyCompliance: benchmarkAfter.refundPolicyCompliance\n    } : null,\n    claimsAvoided: [\n      "No ROI guarantee",\n      "No productivity guarantee",\n      "No compliance certification",\n      "No autonomous sending claim",\n      "No model self-modification claim"\n    ],\n    publicSafe: true,\n    note: "Private customer details, exact messages, and internal policies are removed. Human review remains required.",\n    createdAt: new Date().toISOString()\n  };\n}\n\nexport function exportState(state) {\n  return JSON.stringify(state, null, 2);\n}\n', encoding='utf-8')
          (ASSETS / 'app.js').write_text('import {\n  SAMPLE_CASES,\n  initialWorkflow,\n  runWorkflow,\n  evaluateRun,\n  createProofRecord,\n  benchmarkWorkflow,\n  detectFailurePattern,\n  proposeImprovement,\n  approveProposal,\n  createPublicSafeProofCard,\n  exportState\n} from "./goalos-core.mjs";\n\nconst STORAGE_KEY = "goalos_cloud_mvp_0_1_state";\n\nfunction defaultState() {\n  const workflow = initialWorkflow();\n  return {\n    organization: {\n      id: "org_demo",\n      name: "GoalOS Demo Organization",\n      workspace: "Proof Room Demo",\n      role: "Owner / Reviewer"\n    },\n    workflows: [workflow],\n    activeWorkflowVersion: workflow.version,\n    activeCaseId: SAMPLE_CASES[0].id,\n    runs: [],\n    evaluations: [],\n    proofRecords: [],\n    benchmarks: [],\n    proposals: [],\n    approvals: [],\n    auditLog: [{\n      time: new Date().toISOString(),\n      action: "mvp_initialized",\n      actor: "system",\n      detail: "GoalOS Cloud MVP initialized with Customer Support Reply Workflow v1.0."\n    }]\n  };\n}\n\nlet state = loadState();\n\nfunction loadState() {\n  try {\n    const saved = localStorage.getItem(STORAGE_KEY);\n    return saved ? JSON.parse(saved) : defaultState();\n  } catch {\n    return defaultState();\n  }\n}\n\nfunction saveState() {\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n}\n\nfunction log(action, detail) {\n  state.auditLog.unshift({\n    time: new Date().toISOString(),\n    action,\n    actor: "demo-user",\n    detail\n  });\n  state.auditLog = state.auditLog.slice(0, 100);\n  saveState();\n}\n\nfunction currentWorkflow() {\n  return state.workflows.find(w => w.version === state.activeWorkflowVersion) || state.workflows[0];\n}\n\nfunction currentCase() {\n  return SAMPLE_CASES.find(c => c.id === state.activeCaseId) || SAMPLE_CASES[0];\n}\n\nfunction el(id) { return document.getElementById(id); }\nfunction pretty(obj) { return JSON.stringify(obj, null, 2); }\n\nfunction setTab(name) {\n  document.querySelectorAll("[data-tab]").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === name));\n  document.querySelectorAll("[data-panel]").forEach(panel => panel.hidden = panel.dataset.panel !== name);\n}\n\nfunction render() {\n  renderStatus();\n  renderStudio();\n  renderRun();\n  renderProofRoom();\n  renderImprovement();\n  renderVersions();\n  renderAdmin();\n}\n\nfunction renderStatus() {\n  const latestBenchmark = state.benchmarks[0];\n  const approved = state.workflows.find(w => w.status.includes("approved"));\n  el("statusCards").innerHTML = `\n    <div class="metric"><strong>${state.workflows.length}</strong><span>Workflow versions</span></div>\n    <div class="metric"><strong>${state.runs.length}</strong><span>Runs</span></div>\n    <div class="metric"><strong>${state.proofRecords.length}</strong><span>Proof records</span></div>\n    <div class="metric"><strong>${latestBenchmark ? latestBenchmark.passRate + "%" : "—"}</strong><span>Latest pass rate</span></div>\n    <div class="metric"><strong>${approved ? approved.version : "—"}</strong><span>Approved version</span></div>\n  `;\n}\n\nfunction renderStudio() {\n  const workflow = currentWorkflow();\n  el("workflowVersionSelect").innerHTML = state.workflows.map(w => `<option value="${w.version}" ${w.version === state.activeWorkflowVersion ? "selected" : ""}>${w.name} ${w.version} — ${w.status}</option>`).join("");\n  el("workflowJson").value = pretty(workflow);\n  el("workflowSummary").innerHTML = `\n    <h3>${workflow.name}</h3>\n    <p><b>Version:</b> ${workflow.version} · <b>Status:</b> ${workflow.status} · <b>Risk:</b> ${workflow.riskLevel}</p>\n    <p>${workflow.goal}</p>\n    <div class="pillrow">${workflow.checks.map(c => `<span>${c}</span>`).join("")}</div>\n  `;\n}\n\nfunction renderRun() {\n  el("caseSelect").innerHTML = SAMPLE_CASES.map(c => `<option value="${c.id}" ${c.id === state.activeCaseId ? "selected" : ""}>${c.title} — ${c.issueType}</option>`).join("");\n  const input = currentCase();\n  el("caseDetails").innerHTML = `<h3>${input.title}</h3><p><b>Issue:</b> ${input.issueType} · <b>Risk:</b> ${input.risk}</p><blockquote>${input.customerMessage}</blockquote><p><b>Expected qualities:</b> ${input.expectedQualities.join(", ")}</p>`;\n  const latestRun = state.runs[0];\n  const latestEval = state.evaluations[0];\n  el("latestRun").textContent = latestRun ? pretty(latestRun) : "No run yet.";\n  el("latestEvaluation").textContent = latestEval ? pretty(latestEval) : "No evaluation yet.";\n}\n\nfunction renderProofRoom() {\n  el("proofTable").innerHTML = state.proofRecords.map(p => `\n    <tr>\n      <td>${p.createdAt.slice(0,19).replace("T", " ")}</td>\n      <td>${p.workflowVersion}</td>\n      <td>${p.inputSummary}</td>\n      <td>${p.approvalStatus}</td>\n      <td>${p.finalDecision}</td>\n    </tr>\n  `).join("") || `<tr><td colspan="5">No proof records yet.</td></tr>`;\n  el("proofJson").textContent = state.proofRecords.length ? pretty(state.proofRecords[0]) : "Run a workflow to generate proof.";\n}\n\nfunction renderImprovement() {\n  const latestBenchmark = state.benchmarks[0];\n  const latestProposal = state.proposals[0];\n  el("benchmarkJson").textContent = latestBenchmark ? pretty({\n    workflowVersion: latestBenchmark.workflowVersion,\n    avgScore: latestBenchmark.avgScore,\n    passRate: latestBenchmark.passRate,\n    refundPolicyCompliance: latestBenchmark.refundPolicyCompliance,\n    runCount: latestBenchmark.runCount,\n    createdAt: latestBenchmark.createdAt\n  }) : "No benchmark yet.";\n  el("proposalJson").textContent = latestProposal ? pretty(latestProposal) : "No improvement proposal yet.";\n  el("approveProposalBtn").disabled = !latestProposal || latestProposal.status !== "pending-approval";\n}\n\nfunction renderVersions() {\n  el("versionTable").innerHTML = state.workflows.map(w => `\n    <tr>\n      <td>${w.version}</td>\n      <td>${w.status}</td>\n      <td>${w.riskLevel}</td>\n      <td>${w.versionNotes || ""}</td>\n    </tr>\n  `).join("");\n  const v10 = state.benchmarks.find(b => b.workflowVersion === "1.0.0");\n  const v11 = state.benchmarks.find(b => b.workflowVersion === "1.1.0");\n  el("comparisonJson").textContent = pretty({\n    v1_0: v10 ? { avgScore: v10.avgScore, passRate: v10.passRate, refundPolicyCompliance: v10.refundPolicyCompliance } : null,\n    v1_1: v11 ? { avgScore: v11.avgScore, passRate: v11.passRate, refundPolicyCompliance: v11.refundPolicyCompliance } : null,\n    rollbackTarget: "1.0.0"\n  });\n}\n\nfunction renderAdmin() {\n  el("auditLog").innerHTML = state.auditLog.map(a => `<li><b>${a.time.slice(0,19).replace("T", " ")}</b> — ${a.action}: ${a.detail}</li>`).join("");\n  el("exportJson").value = exportState(state);\n}\n\nfunction runCurrentCase() {\n  const workflow = currentWorkflow();\n  const input = currentCase();\n  const run = runWorkflow(workflow, input);\n  const evaluation = evaluateRun(workflow, input, run);\n  const proof = createProofRecord(workflow, input, run, evaluation);\n  state.runs.unshift(run);\n  state.evaluations.unshift(evaluation);\n  state.proofRecords.unshift(proof);\n  log("workflow_run_completed", `${workflow.name} ${workflow.version} ran on ${input.id}; score ${evaluation.overallScore}.`);\n  render();\n  setTab("run");\n}\n\nfunction runBenchmark() {\n  const workflow = currentWorkflow();\n  const result = benchmarkWorkflow(workflow);\n  state.benchmarks.unshift(result);\n  state.runs.unshift(...result.runs.reverse());\n  state.evaluations.unshift(...result.evaluations.reverse());\n  state.proofRecords.unshift(...result.proofRecords.reverse());\n  log("benchmark_completed", `${workflow.version}: pass ${result.passRate}%, refund compliance ${result.refundPolicyCompliance}%.`);\n  saveState();\n  render();\n  setTab("improve");\n}\n\nfunction generateProposal() {\n  let benchmark = state.benchmarks.find(b => b.workflowVersion === currentWorkflow().version);\n  if (!benchmark) {\n    benchmark = benchmarkWorkflow(currentWorkflow());\n    state.benchmarks.unshift(benchmark);\n  }\n  const pattern = detectFailurePattern(benchmark);\n  const proposal = proposeImprovement(currentWorkflow(), pattern);\n\n  const proposedBenchmark = benchmarkWorkflow(proposal.proposedWorkflow);\n  proposal.testResults = {\n    proposedAvgScore: proposedBenchmark.avgScore,\n    proposedPassRate: proposedBenchmark.passRate,\n    proposedRefundPolicyCompliance: proposedBenchmark.refundPolicyCompliance\n  };\n  proposal.benchmarkComparison = {\n    current: {\n      version: benchmark.workflowVersion,\n      avgScore: benchmark.avgScore,\n      passRate: benchmark.passRate,\n      refundPolicyCompliance: benchmark.refundPolicyCompliance\n    },\n    proposed: {\n      version: proposal.proposedVersion,\n      avgScore: proposedBenchmark.avgScore,\n      passRate: proposedBenchmark.passRate,\n      refundPolicyCompliance: proposedBenchmark.refundPolicyCompliance\n    }\n  };\n  state.proposals.unshift(proposal);\n  state.benchmarks.unshift(proposedBenchmark);\n  log("improvement_proposal_created", `${proposal.proposalId}: ${proposal.problemDetected}`);\n  saveState();\n  render();\n}\n\nfunction approveLatestProposal() {\n  const proposal = state.proposals[0];\n  if (!proposal || proposal.status !== "pending-approval") return;\n  const approval = approveProposal(proposal);\n  proposal.status = "approved";\n  state.approvals.unshift(approval);\n  state.workflows.unshift(approval.approvedWorkflow);\n  state.activeWorkflowVersion = approval.approvedWorkflow.version;\n\n  const benchmark = benchmarkWorkflow(approval.approvedWorkflow);\n  state.benchmarks.unshift(benchmark);\n  state.runs.unshift(...benchmark.runs.reverse());\n  state.evaluations.unshift(...benchmark.evaluations.reverse());\n  state.proofRecords.unshift(...benchmark.proofRecords.reverse());\n\n  log("proposal_approved_and_deployed", `Approved ${approval.approvedWorkflow.version}; rollback target ${approval.rollbackTarget}.`);\n  saveState();\n  render();\n  setTab("versions");\n}\n\nfunction rollbackToV10() {\n  if (!state.workflows.find(w => w.version === "1.0.0")) return;\n  state.activeWorkflowVersion = "1.0.0";\n  log("rollback_selected", "Active workflow set back to v1.0.0. This demo preserves all versions.");\n  saveState();\n  render();\n}\n\nfunction generateProofCard() {\n  const before = state.benchmarks.find(b => b.workflowVersion === "1.0.0");\n  const after = state.benchmarks.find(b => b.workflowVersion === "1.1.0");\n  const card = createPublicSafeProofCard(state.proofRecords, before, after);\n  const blob = new Blob([pretty(card)], { type: "application/json" });\n  downloadBlob(blob, "goalos_public_safe_proof_card_001.json");\n  log("public_safe_proof_card_exported", "Exported public-safe proof card.");\n}\n\nfunction downloadReport() {\n  const before = state.benchmarks.find(b => b.workflowVersion === "1.0.0");\n  const after = state.benchmarks.find(b => b.workflowVersion === "1.1.0");\n  const report = `GoalOS Cloud MVP 0.1 Proof Room Report\n\nLoop:\nRun → Score → Prove → Diagnose → Improve → Approve → Version → Monitor → Re-run\n\nWorkflow:\nCustomer Support Reply Workflow\n\nVersions:\n${state.workflows.map(w => `- ${w.version}: ${w.status} — ${w.versionNotes}`).join("\\n")}\n\nBenchmark summary:\nv1.0: ${before ? `${before.passRate}% pass rate, ${before.refundPolicyCompliance}% refund-policy compliance` : "not run"}\nv1.1: ${after ? `${after.passRate}% pass rate, ${after.refundPolicyCompliance}% refund-policy compliance` : "not approved/run"}\n\nProof records:\n${state.proofRecords.length}\n\nSafe boundary:\nGoalOS does not modify AI models. It improves workflows around AI through instructions, checks, scorecards, proof records, versions, approvals, monitoring, and rollback.\n\nClaims avoided:\nNo ROI guarantee. No productivity guarantee. No compliance certification. No autonomous sending claim. No model self-modification claim.\n`;\n  downloadBlob(new Blob([report], { type: "text/plain" }), "goalos_proof_room_report.txt");\n  log("proof_room_report_downloaded", "Downloaded text proof report.");\n}\n\nfunction downloadBlob(blob, filename) {\n  const a = document.createElement("a");\n  a.href = URL.createObjectURL(blob);\n  a.download = filename;\n  a.click();\n  URL.revokeObjectURL(a.href);\n}\n\nfunction downloadState() {\n  downloadBlob(new Blob([exportState(state)], { type: "application/json" }), "goalos_cloud_mvp_state.json");\n}\n\nfunction resetDemo() {\n  if (!confirm("Reset GoalOS Cloud MVP demo state?")) return;\n  state = defaultState();\n  saveState();\n  render();\n  log("demo_reset", "Demo state reset.");\n}\n\ndocument.addEventListener("DOMContentLoaded", () => {\n  document.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => setTab(btn.dataset.tab)));\n  el("workflowVersionSelect").addEventListener("change", e => { state.activeWorkflowVersion = e.target.value; saveState(); render(); });\n  el("caseSelect").addEventListener("change", e => { state.activeCaseId = e.target.value; saveState(); render(); });\n  el("runCaseBtn").addEventListener("click", runCurrentCase);\n  el("benchmarkBtn").addEventListener("click", runBenchmark);\n  el("proposalBtn").addEventListener("click", generateProposal);\n  el("approveProposalBtn").addEventListener("click", approveLatestProposal);\n  el("rollbackBtn").addEventListener("click", rollbackToV10);\n  el("downloadStateBtn").addEventListener("click", downloadState);\n  el("downloadReportBtn").addEventListener("click", downloadReport);\n  el("proofCardBtn").addEventListener("click", generateProofCard);\n  el("resetBtn").addEventListener("click", resetDemo);\n  setTab("studio");\n  render();\n});\n', encoding='utf-8')
          (ASSETS / 'styles.css').write_text('*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 14% -8%,rgba(143,179,255,.22),transparent 34rem),radial-gradient(circle at 90% 0%,rgba(255,215,106,.13),transparent 30rem),linear-gradient(180deg,#05070d,#080b13 55%,#05070d);color:#f7f8ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px min(26px,4vw);background:rgba(5,7,13,.86);border-bottom:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px)}.brand{text-decoration:none;font-weight:950;letter-spacing:-.03em}.brand span{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:8px;border:1px solid rgba(255,215,106,.6);border-radius:9px;color:#ffd76a}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{font-size:13px;text-decoration:none;color:#b8c0da;border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:8px 10px}main{width:min(1240px,calc(100% - 34px));margin:0 auto;padding:56px 0 86px}.hero{padding:26px 0 34px}.eyebrow{color:#ffd76a;text-transform:uppercase;letter-spacing:.22em;font-weight:950;font-size:12px}h1{font-size:clamp(48px,8vw,108px);line-height:.86;letter-spacing:-.08em;margin:16px 0 24px;max-width:1080px}h2{font-size:clamp(30px,4vw,52px);line-height:.96;letter-spacing:-.055em;margin:0 0 12px}h3{margin:0 0 10px}.lead{font-size:clamp(19px,2vw,23px);color:#b8c0da;line-height:1.55;max-width:920px}.loop{display:inline-flex;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:#ffd76a;background:rgba(255,215,106,.08);padding:10px 14px;font-weight:900;margin:12px 0}.boundary{color:#d7def6;max-width:940px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0 24px}.metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:16px;background:rgba(255,255,255,.06)}.metric strong{display:block;font-size:34px;color:#ffd76a}.metric span{color:#b8c0da}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.tabs button,.buttons button{cursor:pointer;border:1px solid rgba(255,215,106,.52);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.055);color:#f7f8ff;font-weight:900}.tabs button.active,.buttons button:hover{background:#ffd76a;color:#05070d}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons .danger{border-color:rgba(255,80,80,.6)}.panel{border:1px solid rgba(255,255,255,.16);border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.045));box-shadow:0 28px 78px rgba(0,0,0,.34);padding:24px;margin:22px 0}.panelHead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.panelHead p{color:#b8c0da;line-height:1.45}label{display:block;color:#ffd76a;font-weight:900;margin:14px 0 8px}select,textarea{width:100%;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:#080b13;color:#f7f8ff;padding:14px;font:inherit}textarea{min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px}pre{white-space:pre-wrap;overflow:auto;max-height:520px;background:#080b13;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px;color:#dbe7ff}.callout{border:1px solid rgba(255,215,106,.32);border-radius:20px;padding:16px;background:rgba(255,215,106,.07);margin:14px 0}.callout p,.callout blockquote{color:#d7def6}.pillrow{display:flex;flex-wrap:wrap;gap:8px}.pillrow span{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 9px;color:#b8c0da;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}table{width:100%;border-collapse:separate;border-spacing:0 8px}td,th{padding:12px;background:rgba(255,255,255,.055);border-top:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13);color:#b8c0da;text-align:left;vertical-align:top}th{color:#f7f8ff}td:first-child,th:first-child{border-left:1px solid rgba(255,255,255,.13);border-radius:12px 0 0 12px}td:last-child,th:last-child{border-right:1px solid rgba(255,255,255,.13);border-radius:0 12px 12px 0}.audit{display:grid;gap:8px;color:#b8c0da}.final p{color:#b8c0da;line-height:1.55}footer{padding:30px;text-align:center;color:#b8c0da;border-top:1px solid rgba(255,255,255,.16)}@media(max-width:900px){.metrics,.grid2{grid-template-columns:1fr}.panelHead{display:block}nav{display:none}}', encoding='utf-8')
          (APP / 'index.html').write_text('<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>GoalOS Cloud MVP 0.1 — Recursive Workflow Proof</title>\n  <meta name="description" content="Smallest production-grade GoalOS MVP proving recursive workflow improvement end to end.">\n  <link rel="stylesheet" href="./assets/styles.css">\n</head>\n<body>\n  <header class="topbar">\n    <a class="brand" href="/proof-gradient/"><span>G</span> GoalOS Cloud MVP 0.1</a>\n    <nav>\n      <a href="/proof-gradient/pricing/">Pricing</a>\n      <a href="/proof-gradient/products/goalos-enterprise-rsi-pilot/">Enterprise RSI Pilot</a>\n      <a href="https://www.quebecartificialintelligence.com/shop">Shop</a>\n    </nav>\n  </header>\n\n  <main>\n    <section class="hero">\n      <p class="eyebrow">Production-grade proof loop · no model self-modification</p>\n      <h1>Recursive workflow improvement, end to end.</h1>\n      <p class="lead">This public MVP proves the GoalOS loop on one workflow family: Customer Support Reply Workflow.</p>\n      <div class="loop">Run → Score → Prove → Diagnose → Improve → Approve → Version → Monitor → Re-run</div>\n      <p class="boundary">GoalOS does not modify AI models. It improves workflows around AI through instructions, checks, scorecards, proof records, versions, approvals, monitoring, and rollback.</p>\n    </section>\n\n    <section id="statusCards" class="metrics"></section>\n\n    <section class="tabs" aria-label="GoalOS MVP tabs">\n      <button data-tab="studio" class="active">1 · Workflow Studio</button>\n      <button data-tab="run">2 · Run + Evaluate</button>\n      <button data-tab="proof">3 · Proof Room</button>\n      <button data-tab="improve">4 · Improve</button>\n      <button data-tab="versions">5 · Versions</button>\n      <button data-tab="admin">6 · Admin / Export</button>\n    </section>\n\n    <section data-panel="studio" class="panel">\n      <div class="panelHead">\n        <div>\n          <h2>Workflow Studio</h2>\n          <p>Versioned workflow definition with GoalOS structure: goal, context, rules, memory, steps, checks, proof.</p>\n        </div>\n        <select id="workflowVersionSelect"></select>\n      </div>\n      <div id="workflowSummary" class="callout"></div>\n      <label for="workflowJson">Workflow definition JSON</label>\n      <textarea id="workflowJson" spellcheck="false"></textarea>\n    </section>\n\n    <section data-panel="run" class="panel" hidden>\n      <div class="panelHead">\n        <div>\n          <h2>Run + Evaluate</h2>\n          <p>Execute the selected workflow against a demo support case, then score it and create proof.</p>\n        </div>\n        <div class="buttons">\n          <button id="runCaseBtn">Run selected case</button>\n          <button id="benchmarkBtn">Run benchmark suite</button>\n        </div>\n      </div>\n      <label for="caseSelect">Demo support case</label>\n      <select id="caseSelect"></select>\n      <div id="caseDetails" class="callout"></div>\n      <div class="grid2">\n        <div>\n          <h3>Latest run record</h3>\n          <pre id="latestRun"></pre>\n        </div>\n        <div>\n          <h3>Latest evaluation</h3>\n          <pre id="latestEvaluation"></pre>\n        </div>\n      </div>\n    </section>\n\n    <section data-panel="proof" class="panel" hidden>\n      <div class="panelHead">\n        <div>\n          <h2>Proof Room</h2>\n          <p>Every run creates an auditable proof record. Export a public-safe proof card or proof report.</p>\n        </div>\n        <div class="buttons">\n          <button id="proofCardBtn">Download public-safe proof card</button>\n          <button id="downloadReportBtn">Download proof report</button>\n        </div>\n      </div>\n      <table>\n        <thead><tr><th>Time</th><th>Version</th><th>Input</th><th>Approval</th><th>Decision</th></tr></thead>\n        <tbody id="proofTable"></tbody>\n      </table>\n      <h3>Latest proof record</h3>\n      <pre id="proofJson"></pre>\n    </section>\n\n    <section data-panel="improve" class="panel" hidden>\n      <div class="panelHead">\n        <div>\n          <h2>Recursive Improvement Engine</h2>\n          <p>Detect failure patterns, propose v1.1, benchmark it, then require human approval before deployment.</p>\n        </div>\n        <div class="buttons">\n          <button id="proposalBtn">Generate improvement proposal</button>\n          <button id="approveProposalBtn">Approve v1.1 + re-run</button>\n        </div>\n      </div>\n      <div class="grid2">\n        <div>\n          <h3>Benchmark summary</h3>\n          <pre id="benchmarkJson"></pre>\n        </div>\n        <div>\n          <h3>Improvement proposal</h3>\n          <pre id="proposalJson"></pre>\n        </div>\n      </div>\n    </section>\n\n    <section data-panel="versions" class="panel" hidden>\n      <div class="panelHead">\n        <div>\n          <h2>Versioning + rollback</h2>\n          <p>Compare versions, approval states, benchmark outcomes, and rollback target.</p>\n        </div>\n        <button id="rollbackBtn">Select rollback target v1.0</button>\n      </div>\n      <table>\n        <thead><tr><th>Version</th><th>Status</th><th>Risk</th><th>Notes</th></tr></thead>\n        <tbody id="versionTable"></tbody>\n      </table>\n      <h3>Version comparison</h3>\n      <pre id="comparisonJson"></pre>\n    </section>\n\n    <section data-panel="admin" class="panel" hidden>\n      <div class="panelHead">\n        <div>\n          <h2>Admin / Export</h2>\n          <p>Tenant-local state, audit log, export, reset. This static MVP persists locally in browser storage.</p>\n        </div>\n        <div class="buttons">\n          <button id="downloadStateBtn">Download full JSON state</button>\n          <button id="resetBtn" class="danger">Reset demo</button>\n        </div>\n      </div>\n      <h3>Audit log</h3>\n      <ul id="auditLog" class="audit"></ul>\n      <h3>Exported state</h3>\n      <textarea id="exportJson" spellcheck="false"></textarea>\n    </section>\n\n    <section class="panel final">\n      <h2>Enterprise MVP acceptance test</h2>\n      <p>This MVP is considered successful when v1.0 runs, evaluations detect refund-policy failure, the system proposes v1.1, human approval deploys v1.1, and the Proof Room shows improved benchmark results with rollback target preserved.</p>\n    </section>\n  </main>\n\n  <footer>\n    GoalOS Cloud MVP 0.1 · Static public proof demo · Paid products stay on QUEBEC.AI · No buyer ZIPs included\n  </footer>\n\n  <script type="module" src="./assets/app.js"></script>\n</body>\n</html>\n', encoding='utf-8')
          (TESTS / 'goalos-core.test.mjs').write_text('import assert from "node:assert/strict";\nimport {\n  SAMPLE_CASES,\n  initialWorkflow,\n  benchmarkWorkflow,\n  detectFailurePattern,\n  proposeImprovement,\n  approveProposal,\n  createPublicSafeProofCard\n} from "../assets/goalos-core.mjs";\n\nconst v10 = initialWorkflow();\nconst b10 = benchmarkWorkflow(v10, SAMPLE_CASES);\nassert.equal(b10.workflowVersion, "1.0.0");\nassert.ok(b10.refundPolicyCompliance < 90, "v1.0 should expose refund policy weakness");\n\nconst pattern = detectFailurePattern(b10);\nassert.equal(pattern.pattern, "refund_policy_failure");\n\nconst proposal = proposeImprovement(v10, pattern);\nassert.equal(proposal.status, "pending-approval");\nassert.ok(proposal.proposedWorkflow.rules.join(" ").toLowerCase().includes("refund"));\n\nconst approval = approveProposal(proposal);\nconst v11 = approval.approvedWorkflow;\nassert.equal(v11.version, "1.1.0");\n\nconst b11 = benchmarkWorkflow(v11, SAMPLE_CASES);\nassert.ok(b11.refundPolicyCompliance > b10.refundPolicyCompliance, "v1.1 should improve refund policy compliance");\nassert.ok(b11.passRate >= b10.passRate, "v1.1 should not regress pass rate in demo benchmark");\n\nconst card = createPublicSafeProofCard(b11.proofRecords, b10, b11);\nassert.equal(card.publicSafe, true);\nassert.ok(card.claimsAvoided.includes("No model self-modification claim"));\n\nconsole.log("GoalOS Cloud MVP tests passed:", {\n  v10RefundPolicyCompliance: b10.refundPolicyCompliance,\n  v11RefundPolicyCompliance: b11.refundPolicyCompliance,\n  v10PassRate: b10.passRate,\n  v11PassRate: b11.passRate\n});\n', encoding='utf-8')
          (APP / 'README.md').write_text('# GoalOS Cloud MVP 0.1\n\nThis is the smallest production-grade public GoalOS proof app.\n\nIt demonstrates the recursive workflow improvement loop end to end:\n\n`Run → Score → Prove → Diagnose → Improve → Approve → Version → Monitor → Re-run`\n\n## What it proves\n\n- Workflow Studio with immutable versions\n- Execution Engine demo\n- Evaluation Engine demo\n- Proof Room records\n- Recursive Improvement Proposal\n- Human approval gate\n- Version comparison\n- Rollback target\n- Public-safe proof card export\n- Full JSON export\n- Audit log\n\n## Safe boundary\n\nGoalOS does not modify AI models.\n\nIt improves workflows around AI through instructions, checks, scorecards, proof records, versions, approvals, monitoring, and rollback.\n\n## Demo workflow\n\nCustomer Support Reply Workflow.\n\nv1.0 intentionally misses refund/access policy classification.\n\nThe system detects the failure pattern, proposes v1.1, benchmarks it, requires approval, deploys it, and preserves rollback to v1.0.\n\n## Note\n\nThis is a static public MVP. It stores demo state in browser localStorage. It is not the full enterprise SaaS backend.\n', encoding='utf-8')

          # Public marketing / entry page
          products = WEB_ROOT / 'products' / 'goalos-cloud-mvp'
          products.mkdir(parents=True, exist_ok=True)
          products_page = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>GoalOS Cloud MVP 0.1</title>
          <style>
          body{margin:0;background:#05070d;color:#f7f8ff;font-family:system-ui}main{max-width:1120px;margin:auto;padding:70px 24px}h1{font-size:clamp(46px,8vw,98px);line-height:.88;letter-spacing:-.065em}p{color:#b8c0da;font-size:20px;line-height:1.5}.btn{display:inline-block;background:#ffd76a;color:#05070d;padding:14px 18px;border-radius:999px;text-decoration:none;font-weight:900;margin-right:10px}.card{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:24px;padding:24px;margin:20px 0}.eyebrow{color:#ffd76a;text-transform:uppercase;letter-spacing:.2em;font-weight:900}
          </style></head><body><main>
          <p class="eyebrow">GoalOS Cloud MVP 0.1</p>
          <h1>The smallest working Recursive Workflow OS proof.</h1>
          <p>Run, score, prove, diagnose, improve, approve, version, monitor, and re-run one workflow family end to end.</p>
