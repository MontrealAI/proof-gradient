          # Sitemap addition
          sitemap = WEB_ROOT / 'sitemap.xml'
          urls = [
              'https://montrealai.github.io/proof-gradient/app/goalos-cloud-mvp/',
              'https://montrealai.github.io/proof-gradient/products/goalos-cloud-mvp/'
          ]
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8', errors='ignore')
              if '</urlset>' in text:
                  for url in urls:
                      if url not in text:
                          text = text.replace('</urlset>', f'  <url><loc>{url}</loc></url>\n</urlset>')
                  sitemap.write_text(text, encoding='utf-8')
          else:
              sitemap.write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + ''.join(f'  <url><loc>{u}</loc></url>\n' for u in urls) + '</urlset>\n', encoding='utf-8')

          # Manifest
          manifest = []
          for p in sorted(APP.rglob('*')):
              if p.is_file():
                  manifest.append({'path': p.relative_to(APP).as_posix(), 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          (APP / 'site-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('Generated GoalOS Cloud MVP at', APP)
          print('web_root=' + str(WEB_ROOT))

          PY
          python3 "$RUNNER_TEMP/generate_goalos_cloud_mvp.py"

      - name: Run GoalOS Cloud MVP unit tests
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.generate.outputs.web_root }}"
          node "$WEB_ROOT/app/goalos-cloud-mvp/tests/goalos-core.test.mjs"

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit GoalOS Cloud MVP
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.generate.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No GoalOS Cloud MVP changes to commit."
          else
            git commit -m "Build GoalOS Cloud MVP 0.1 [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.generate.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
