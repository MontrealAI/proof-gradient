          </main></body></html>'''
          (products / 'index.html').write_text(products_page, encoding='utf-8')

          # Add homepage section non-destructively
          home = WEB_ROOT / 'index.html'
          block = '''<!-- GOALOS-CLOUD-MVP:START -->
          <section id="goalos-cloud-mvp" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS Cloud MVP 0.1</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Recursive workflow improvement, end to end.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:850px;">A public software proof of the GoalOS loop: Run → Score → Prove → Diagnose → Improve → Approve → Version → Monitor → Re-run.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
