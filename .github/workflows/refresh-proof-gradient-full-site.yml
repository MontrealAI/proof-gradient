          <section class="pg-section">
            <div class="pg-eyebrow">Product ladder</div>
            <h2 class="pg-h2">A complete self-serve path.</h2>
            <div class="pg-path">
              <div><strong>1 · Kit</strong><span>$49 Sprint Kit</span></div>
              <div><strong>2 · Bump</strong><span>$29 Proof Page Pack</span></div>
              <div><strong>3 · Team</strong><span>$199 Team Pack</span></div>
              <div><strong>4 · Dept</strong><span>Proof Room Lite</span></div>
              <div><strong>5 · Vault</strong><span>Monthly workflow drops</span></div>
            </div>
          </section>

          <section class="pg-section">
            <div class="pg-eyebrow">Featured proof paths</div>
            <h2 class="pg-h2">The site is now navigable by intent.</h2>
            <div class="pg-grid">
              {card("Build one reusable AI workflow", "The core buyer transformation: one repeated task becomes a reusable system.", "/workflow/build-one-reusable-ai-workflow/", "Start")}
              {card("Proof Room Lite", "Department task inventory, charter, permissions, reviews, reports, and public-safe case studies.", "/proof-room-lite/", "Department")}
              {card("Command Center", "Search products, examples, standards, workflows, and proof-room pages from one place.", "/command-center/", "Navigate")}
            </div>
          </section>

          <section class="pg-section">
            <div class="pg-eyebrow">Standards / Normes</div>
