                <a href="{GITHUB}">GitHub</a>
                <a href="{SHOP}">Shop</a>
              </div>
            </div>
          </footer>
          <!-- PG-SITE-FOOTER:END -->'''

          css_link = f'<link rel="stylesheet" href="{BASE}/assets/proof-gradient-site.css" data-pg-site-css>'
          js_link = f'<script defer src="{BASE}/assets/proof-gradient-site.js" data-pg-site-js></script>'

          def inject_shell(path: Path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "<html" not in text.lower():
                  return
              text = re.sub(r'<!-- PG-SITE-SHELL:START -->.*?<!-- PG-SITE-SHELL:END -->', '', text, flags=re.S)
              text = re.sub(r'<!-- PG-SITE-FOOTER:START -->.*?<!-- PG-SITE-FOOTER:END -->', '', text, flags=re.S)
              text = re.sub(r'<link[^>]+data-pg-site-css[^>]*>\s*', '', text, flags=re.I)
              text = re.sub(r'<script[^>]+data-pg-site-js[^>]*></script>\s*', '', text, flags=re.I)
              if "</head>" in text:
                  text = text.replace("</head>", f"  {css_link}\n  {js_link}\n</head>", 1)
              if "<body" in text:
                  text = re.sub(r'(<body[^>]*>)', r'\1\n' + nav + "\n", text, count=1, flags=re.I)
              else:
                  text = nav + "\n" + text
              if "</body>" in text:
                  text = text.replace("</body>", footer + "\n</body>", 1)
              else:
                  text += "\n" + footer
              path.write_text(text, encoding="utf-8")

          for html in WEB_ROOT.rglob("*.html"):
              if ".git" not in html.parts:
                  inject_shell(html)

          manifest = []
          for p in sorted(WEB_ROOT.rglob("*")):
              if p.is_file() and ".git" not in p.parts:
                  rel = p.relative_to(WEB_ROOT).as_posix()
                  manifest.append({"path": rel, "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          (WEB_ROOT / "site-manifest.json").write_text(json.dumps({"generated_at": NOW, "files": manifest}, indent=2) + "\n", encoding="utf-8")

          missing = []
          for html in WEB_ROOT.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href="(/proof-gradient/[^"#?]*)"', text):
                  target = m.group(1)[len(BASE):]
                  if not target:
                      target = "/"
                  if target.endswith("/"):
                      fs = WEB_ROOT / target.lstrip("/") / "index.html"
                  else:
                      fs = WEB_ROOT / target.lstrip("/")
                  if not fs.exists():
                      missing.append((html.relative_to(WEB_ROOT).as_posix(), m.group(1)))
          if missing:
              report = "\n".join(f"{src} -> {url}" for src, url in missing[:200])
              raise SystemExit("Generated local link check failed:\n" + report)

          print("Proof Gradient full site refresh complete.")
          print("Web root:", WEB_ROOT)
          print("Generated files:", len(manifest))
          PY

      - name: Refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit refreshed site
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No refreshed site changes to commit."
          else
            git commit -m "Refresh full Proof Gradient public site [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
