            <div class="pg-divider"></div>
            <p class="pg-lead">GoalOS packages repeated AI work into reusable workflows. Proof Gradient records what happened, what was checked, what changed, and what can be shared safely.</p>
          </section>

          <section class="pg-section">
            <div class="pg-eyebrow">Choose your path / Choisissez votre parcours</div>
            <h2 class="pg-h2">From one workflow to a department Proof Room.</h2>
            <div class="pg-grid">
