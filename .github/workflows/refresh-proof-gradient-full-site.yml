              </div>
            </nav>
          </header>
          <!-- PG-SITE-SHELL:END -->'''
          footer = f'''<!-- PG-SITE-FOOTER:START -->
          <footer class="pg-footer">
            <div class="pg-footer-inner">
              <div>Proof Gradient · GoalOS · Reusable AI workflows · Provable machine work</div>
              <div>
                <a href="{href('/site-map/')}">Site Map</a>
