            <h1 class="pg-h1">Self-serve kits for reusable AI work.</h1>
            <p class="pg-lead">Digital products first. Services optional later. The public standards remain free; the paid products are practical implementation kits.</p>
            <div class="pg-actions"><a class="pg-btn primary" href="{SHOP}">Shop / Acheter</a></div>
          </section>
