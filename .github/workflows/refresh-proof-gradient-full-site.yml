name: Refresh Full Proof Gradient Site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-full-proof-gradient-site
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh full public site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate refreshed site
        id: build
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          from pathlib import Path
          from html import escape
          import json, re, hashlib, datetime

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")
          WEB_ROOT.mkdir(parents=True, exist_ok=True)

          BASE = "/proof-gradient"
          SHOP = "https://www.quebecartificialintelligence.com/shop"
          GITHUB = "https://github.com/MontrealAI/proof-gradient"
          NOW = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"

          assets = WEB_ROOT / "assets"
          assets.mkdir(parents=True, exist_ok=True)

          standards = [
              ("AEP-001", "GoalOS Proof-of-Evolution Constitution", "The canonical law: Commit → Execute → Prove → Evolve."),
              ("AEP-002", "Evidence Docket Standard", "The docket for evidence bundles, artifacts, decisions, checks, and release proof."),
              ("AEP-003", "ProofPacket Schema", "Atomic proof units for machine-work events, tool calls, evaluations, risks, costs, rollouts, and reports."),
              ("AEP-004", "Selection Gate Standard", "A standard for promotion decisions: evidence, challenge, canary, monitoring, rollback."),
              ("AEP-005", "Tool Permission Standard", "Scoped, approved, leased, revocable, provable tool use."),
              ("AEP-006", "Rollback Receipt Standard", "Recovery proof for rollback, restoration, compensation, verification, and review."),
              ("AEP-007", "Public-Safe Proof Report Standard", "Public proof without leaking protected data or unsupported claims."),
              ("AEP-008", "Proof Room Standard", "A governed workspace where machine work becomes institutional proof.")
          ]

          examples = [
              ("build-one-reusable-ai-workflow", "Example 1", "Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes.", "Individual"),
              ("meeting-to-action-plan", "Example 2", "Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.", "Individual"),
              ("idea-to-demand-engine", "Example 3", "One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof.", "Demand"),
              ("offer-to-sales-page", "Example 4", "Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note.", "Demand"),
              ("lead-magnet-email-sequence", "Example 5", "Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof.", "Demand"),
              ("post-purchase-onboarding", "Example 6", "Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.", "Delivery"),
              ("support-faq-triage", "Example 7", "Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.", "Delivery"),
              ("feedback-to-product-update", "Example 8", "Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof.", "Product"),
              ("proof-card-referral-loop", "Example 9", "Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request.", "Proof"),
              ("monthly-workflow-vault-drop", "Example 10", "Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof.", "Recurring"),
              ("partner-referral-kit", "Example 11", "Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof.", "Distribution"),
              ("weekly-growth-review", "Example 12", "Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note.", "Growth"),
              ("checkout-recovery", "Example 13", "Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof.", "Checkout"),
              ("order-bump-builder", "Example 14", "Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof.", "Checkout"),
              ("team-pack-upsell", "Example 15", "Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof.", "Team"),
              ("internal-approval-memo", "Example 16", "Interest → approval memo", "Turn an internal champion into a manager memo, procurement email, rollout plan, and proof.", "Team"),
              ("team-sprint-facilitator", "Example 17", "Team Pack → self-run sprint", "Turn a team meeting into a reusable AI workflow session, role assignments, checks, and proof.", "Team"),
              ("department-proof-room-lite", "Example 18", "Department Pack → Proof Room Lite setup", "Turn scattered department AI use into workflow priorities, roles, checks, dashboard fields, and proof.", "Department"),
              ("department-weekly-proof-review", "Example 19", "Weekly proof review", "Turn dashboard notes into keep/revise/stop decisions, manager update, and proof.", "Department"),
              ("department-monthly-proof-report", "Example 20", "Monthly proof report", "Turn 30 days of Proof Room Lite notes into an executive report, leadership email, and proof.", "Department"),
              ("department-ai-permission-map", "Example 21", "Department AI Permission Map", "Turn AI tool confusion into Green / Yellow / Red rules, task permissions, escalation, and proof.", "Department"),
              ("department-ai-correction-rollback", "Example 22", "AI correction / rollback", "Turn an AI workflow issue into severity, correction, rule update, rollback receipt, and proof.", "Department"),
              ("department-public-safe-case-study", "Example 23", "Public-safe case study", "Turn internal Proof Room evidence into a safe case study, claim matrix, redaction checklist, and proof.", "Department")
          ]

          products = [
              ("goalos-ai-efficiency-sprint-kit", "$49", "GoalOS AI Efficiency Sprint Kit", "Build one reusable AI workflow in under one hour.", "Individual / Solo operators", ["Open First map", "Offline Workflow Builder", "60-minute sprint checklist", "Context, rules, memory, workflow, checks, proof templates", "Completed examples and recipes"]),
              ("proof-page-template-pack", "$29", "Proof Page Template Pack", "Extra proof-page examples and claim-boundary templates.", "Order bump", ["10 proof-page templates", "10 claim-boundary examples", "Public-safe proof cards", "Proof-note prompts"]),
              ("team-pack", "$199", "GoalOS AI Efficiency Sprint Team Pack", "Run the sprint with coworkers, clients, students, or a small team.", "Team / Workshop", ["Team workshop agenda", "Manager facilitation guide", "Role assignment sheet", "Rollout checklist", "Team scoring rubric"]),
              ("department-proof-room-lite", "$499–$999", "GoalOS Department Pack / Proof Room Lite", "Turn scattered department AI use into a lightweight proof room.", "Department", ["Task inventory", "Proof Room Lite charter", "AI permission map", "Weekly proof review", "Monthly proof report", "Correction / rollback templates"]),
              ("workflow-vault", "$29–$99/mo", "GoalOS Workflow Vault", "Monthly reusable workflow drops, proof cards, and claim-boundary examples.", "Recurring", ["New workflow drops", "New proof-note examples", "Department templates", "Public-safe proof cards"])
          ]

          css = r'''
          :root{
            --pg-bg:#05070d;
            --pg-bg2:#090d17;
            --pg-panel:rgba(255,255,255,.075);
            --pg-panel2:rgba(255,255,255,.045);
            --pg-line:rgba(255,255,255,.16);
            --pg-text:#f7f8ff;
            --pg-muted:#b8c0da;
            --pg-gold:#ffd76a;
            --pg-red:#ff4545;
            --pg-blue:#8fb3ff;
            --pg-green:#7ce0a3;
            --pg-radius:26px;
            --pg-shadow:0 30px 80px rgba(0,0,0,.35);
          }
          *{box-sizing:border-box}
          html{scroll-behavior:smooth}
          body{
            margin:0;
            background:
              radial-gradient(circle at 18% -8%,rgba(143,179,255,.22),transparent 34rem),
              radial-gradient(circle at 86% 8%,rgba(255,215,106,.12),transparent 30rem),
              linear-gradient(180deg,#05070d 0%,#080b13 55%,#05070d 100%);
            color:var(--pg-text);
            font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
          }
          a{color:inherit}
          .pg-site-shell{position:sticky;top:0;z-index:1000;backdrop-filter:blur(18px);background:rgba(5,7,13,.82);border-bottom:1px solid var(--pg-line)}
          .pg-nav{width:min(1220px,calc(100% - 28px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0}
          .pg-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:950;letter-spacing:-.035em}
          .pg-mark{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,215,106,.65);display:grid;place-items:center;color:var(--pg-gold);font-weight:950;background:rgba(255,215,106,.08)}
          .pg-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
          .pg-links a{font-size:13px;text-decoration:none;padding:9px 11px;border:1px solid transparent;border-radius:999px;color:var(--pg-muted);font-weight:800}
          .pg-links a:hover{color:var(--pg-text);border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
          .pg-links a.pg-shop{color:#05070d;background:var(--pg-gold);border-color:var(--pg-gold)}
          .pg-wrap{width:min(1220px,calc(100% - 36px));margin:0 auto;padding:70px 0 94px}
          .pg-hero{padding:44px 0 42px}
          .pg-eyebrow{color:var(--pg-gold);text-transform:uppercase;letter-spacing:.22em;font-weight:950;font-size:12px;margin-bottom:18px}
          .pg-h1{font-size:clamp(52px,8vw,118px);line-height:.86;letter-spacing:-.085em;margin:0 0 26px;max-width:1120px}
          .pg-h2{font-size:clamp(34px,5.5vw,68px);line-height:.92;letter-spacing:-.065em;margin:0 0 18px}
          .pg-h3{font-size:24px;letter-spacing:-.04em;margin:0 0 10px}
          .pg-lead{font-size:clamp(19px,2vw,24px);line-height:1.55;color:var(--pg-muted);max-width:920px;margin:0 0 24px}
          .pg-sublead{font-size:17px;line-height:1.55;color:var(--pg-muted);max-width:780px}
          .pg-actions{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
          .pg-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 17px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:900;background:rgba(255,255,255,.055);color:var(--pg-text)}
          .pg-btn:hover{background:rgba(255,255,255,.1)}
          .pg-btn.primary{background:var(--pg-gold);color:#05070d;border-color:var(--pg-gold)}
          .pg-btn.red{border-color:rgba(255,69,69,.55)}
          .pg-section{margin:62px 0}
          .pg-panel,.pg-card,.pg-feature{
            border:1px solid var(--pg-line);
            background:linear-gradient(180deg,var(--pg-panel),var(--pg-panel2));
            border-radius:var(--pg-radius);
            box-shadow:var(--pg-shadow);
          }
          .pg-panel{padding:30px}
          .pg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
          .pg-grid.two{grid-template-columns:repeat(2,1fr)}
          .pg-grid.four{grid-template-columns:repeat(4,1fr)}
          .pg-card{padding:22px;text-decoration:none;min-height:164px;display:flex;flex-direction:column}
          .pg-card:hover{transform:translateY(-2px);border-color:rgba(255,215,106,.5)}
          .pg-card p{color:var(--pg-muted);line-height:1.45;margin:0}
          .pg-badge{display:inline-flex;align-self:flex-start;margin-bottom:13px;font-size:12px;color:var(--pg-gold);border:1px solid rgba(255,215,106,.45);border-radius:999px;padding:6px 9px;font-weight:900}
          .pg-price{font-size:42px;font-weight:950;letter-spacing:-.06em;color:var(--pg-gold);margin:6px 0}
          .pg-kicker{color:var(--pg-muted);font-size:13px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin-bottom:10px}
          .pg-list{display:grid;gap:10px;margin:18px 0 0;padding:0;list-style:none}
          .pg-list li{padding-left:26px;position:relative;color:var(--pg-muted);line-height:1.4}
          .pg-list li:before{content:"✓";position:absolute;left:0;color:var(--pg-gold);font-weight:950}
          .pg-law{font-size:clamp(26px,3.6vw,48px);line-height:1.1;letter-spacing:-.05em;margin:0;color:var(--pg-text)}
          .pg-path{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}
          .pg-path div{border:1px solid var(--pg-line);border-radius:20px;padding:16px;background:rgba(255,255,255,.045)}
          .pg-path strong{display:block;color:var(--pg-gold);font-size:13px;margin-bottom:8px}
          .pg-path span{color:var(--pg-muted);font-size:14px;line-height:1.35}
          .pg-command input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--pg-line);background:#080b13;color:var(--pg-text);font-size:17px;outline:none}
          .pg-table{width:100%;border-collapse:separate;border-spacing:0 8px}
          .pg-table td,.pg-table th{padding:14px;background:rgba(255,255,255,.055);border-top:1px solid var(--pg-line);border-bottom:1px solid var(--pg-line);text-align:left;color:var(--pg-muted)}
          .pg-table th{color:var(--pg-text)}
          .pg-table td:first-child,.pg-table th:first-child{border-left:1px solid var(--pg-line);border-radius:14px 0 0 14px}
          .pg-table td:last-child,.pg-table th:last-child{border-right:1px solid var(--pg-line);border-radius:0 14px 14px 0}
          .pg-footer{border-top:1px solid var(--pg-line);padding:34px 0;color:var(--pg-muted);font-size:13px;background:rgba(5,7,13,.7)}
          .pg-footer-inner{width:min(1220px,calc(100% - 36px));margin:0 auto;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}
          .pg-footer a{color:var(--pg-muted);text-decoration:none;margin-right:14px}
          .pg-footer a:hover{color:var(--pg-text)}
          .pg-small{font-size:13px;color:var(--pg-muted)}
          .pg-fr{color:#d7def6}
          .pg-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,106,.45),transparent);margin:28px 0}
          @media(max-width:960px){
            .pg-grid,.pg-grid.two,.pg-grid.four,.pg-path{grid-template-columns:1fr}
            .pg-links{display:none}
            .pg-wrap{padding-top:42px}
          }
          '''
          (assets / "proof-gradient-site.css").write_text(css, encoding="utf-8")

          js = r'''
          (function(){
            function ready(fn){ if(document.readyState !== "loading"){fn()} else {document.addEventListener("DOMContentLoaded",fn)} }
            ready(function(){
              var input = document.querySelector("[data-pg-search]");
              if(!input) return;
              var cards = Array.prototype.slice.call(document.querySelectorAll("[data-pg-card]"));
              input.addEventListener("input", function(){
                var q = input.value.toLowerCase().trim();
                cards.forEach(function(card){
                  var text = card.textContent.toLowerCase();
                  card.style.display = (!q || text.indexOf(q) !== -1) ? "" : "none";
                });
              });
            });
          })();
          '''
          (assets / "proof-gradient-site.js").write_text(js, encoding="utf-8")

          def href(path):
              if path.startswith("http"):
                  return path
              return BASE + path

          def card(title, desc, url, badge=None):
              return f'''<a class="pg-card" data-pg-card href="{href(url)}">
                {f'<span class="pg-badge">{escape(badge)}</span>' if badge else ''}
                <h3 class="pg-h3">{escape(title)}</h3>
                <p>{escape(desc)}</p>
              </a>'''

          def page(title, desc, body, extra_head=""):
              return f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{escape(title)}</title>
            <meta name="description" content="{escape(desc)}">
            <meta property="og:title" content="{escape(title)}">
            <meta property="og:description" content="{escape(desc)}">
            <meta property="og:type" content="website">
            <meta property="og:image" content="{BASE}/assets/proof-gradient-og.svg">
            <link rel="stylesheet" href="{BASE}/assets/proof-gradient-site.css" data-pg-site-css>
            <script defer src="{BASE}/assets/proof-gradient-site.js" data-pg-site-js></script>
            {extra_head}
          </head>
          <body>
            <main class="pg-wrap">
              {body}
            </main>
          </body>
          </html>'''

          og = '''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="76%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="110" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">PROOF GRADIENT · GOALOS</text>
