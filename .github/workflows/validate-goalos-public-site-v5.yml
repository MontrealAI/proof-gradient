name: Validate GoalOS Public Site (v5, compatibility wrapper)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/validate-goalos-public-site-v5.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Compatibility wrapper for shared v14 validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate GoalOS public site with shared rules
        run: python scripts/validate_goalos_public_site.py
      - name: Check paid/private artifact boundary with shared rules
        run: python scripts/check_no_paid_artifacts.py
