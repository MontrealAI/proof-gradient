name: Add Support FAQ Triage Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: support-faq-triage-workflow-example
  cancel-in-progress: false

jobs:
  add-support-example:
    name: Add support-faq-triage workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create support-faq-triage workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "support-faq-triage"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "support-faq-triage"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn support questions</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into self-serve answers.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Inbox → Triage → FAQ → Reply → Escalation → Proof note</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 7:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Support inbox → low-management help system</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Reduce repetitive support without hiding policies or overpromising.</text>
          </svg>"""
          (assets_dir / "support-faq-triage-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough support notes:
          Product: GoalOS AI Efficiency Sprint Kit
          Price: $49
          Support goal: low management, self-serve, clear boundaries
          Common questions:
          - Where is my download?
          - What file do I open first?
          - Can I get a refund?
          - I was charged twice.
          - The file will not open.
          - Can you review my workflow?
          - Do I need to be technical?
          Policy:
          Digital product, instant access, all sales final once delivered except where required by law or for duplicate charges / technical access failures.
          Support included:
          Access issues, duplicate charges, missing/corrupted files.
          Support not included:
          Personal workflow review, consulting, custom implementation, legal/financial/compliance advice.
          Tone:
          Helpful, calm, firm, clear, non-defensive."""

          output_example = """Support Triage Rules:
          1. If the buyer cannot access the download, ask for order email and resend access.
          2. If the buyer was charged twice, escalate for billing review.
          3. If the file is missing or corrupted, send a replacement link.
          4. If the buyer asks how to start, send the 60-minute plan.
          5. If the buyer asks for a refund, explain the digital product terms politely and check whether the case is a duplicate charge, technical access failure, or legal exception.
          6. If the buyer asks for personal review, explain that the $49 kit is self-serve and suggest the Team Pack or workshop if available.
          7. If the message contains legal, financial, medical, employment, security, or compliance questions, do not answer as advice. Tell them to consult a qualified professional.

          Help Center FAQ:

          Q: Where do I start?
          A: Open START_HERE.pdf, then follow the 60-minute sprint checklist.

          Q: What is the first task I should choose?
          A: Pick one task you repeat often: customer replies, meeting summaries, weekly updates, product content, sales-page sections, or support replies.

          Q: Can I get a refund?
          A: This is a digital educational product with instant access. Sales are final once delivered, except where required by law or for duplicate charges / technical access failures. If you believe one of those applies, reply with your order email and a short description of the issue.

          Q: I was charged twice. What should I do?
          A: Reply with your order email and screenshots of both charges. We will review the duplicate charge.

          Q: My file will not open. What should I do?
          A: Reply with your order email, device type, and the file name that is not opening. We will help with access or send a replacement file.

          Q: Can you review my workflow personally?
          A: The $49 kit is self-serve and does not include personal workflow review. If you want team help, look for the Team Pack or workshop option.

          Canned Reply — Refund Request:
          Hi,

          Thanks for reaching out.

          The GoalOS AI Efficiency Sprint Kit is a digital educational product with instant access. As stated before checkout, sales are final once delivered, except where required by law or for duplicate charges / technical access failures.

          If you are having an access issue, duplicate charge, missing file, or corrupted file, reply with your order email and a screenshot or short description, and we will review it.

          If you are asking for help using the kit, please start with START_HERE.pdf and the 60-minute sprint checklist.

          Thank you.

          Canned Reply — How To Start:
          Hi,

          Start with START_HERE.pdf.

          Then follow this order:

          1. Pick one repeated AI task.
          2. Fill the Context template.
          3. Fill the Rules template.
          4. Fill the Memory template.
          5. Build the Workflow steps.
          6. Add Checks.
          7. Create the Proof note.

          Do not start with ten workflows. Start with one."""

          proof_note = """Proof note:
          Source: rough support notes.
          Outputs created: triage rules, help center FAQ, refund-request reply, how-to-start reply.
          Claims made: support covers access issues, duplicate charges, missing/corrupted files; the kit is self-serve.
          Claims avoided: no promise of personal consulting, no legal/compliance advice, no guarantee of results, no refusal of legally required remedies.
          Escalation needed: duplicate charges, technical access failures, legal exceptions, threats, chargebacks, or regulated advice requests.
          Review needed: human should confirm exact checkout terms, support email, legal requirements, and platform policies before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Support FAQ Triage — GoalOS Workflow Example</title>
            <meta name="description" content="Turn repeated support questions into a self-serve FAQ, policy-aware replies, escalation rules, and proof note." />
            <meta property="og:title" content="Turn support questions into self-serve answers." />
            <meta property="og:description" content="Inbox → triage → FAQ → reply → escalation → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/support-faq-triage-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 7</div>
              <h1>Turn support questions into self-serve answers.</h1>
              <p class="lead">This reusable AI workflow turns repeated support questions into a help center FAQ, policy-aware canned replies, escalation rules, and a proof note — so a digital product can stay simple and low-management.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/post-purchase-onboarding/">Example 6: onboarding</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">If the same question appears twice, turn it into a reusable answer.</div>
                <p class="lead">A low-friction digital product needs clear support boundaries: help with access problems, duplicate charges, and broken files — without turning a $49 self-serve kit into unlimited consulting.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: manual support loop</h3>
                    <p>Buyers ask the same questions. You answer from scratch. You repeat the refund policy. You explain where to start. You manually triage every issue.</p>
                    <p class="mini">Result: management burden, inconsistent replies, more friction.</p>
                  </div>
                  <div class="card">
                    <h3>After: support workflow</h3>
                    <p>The workflow turns repeated questions into FAQ entries, canned replies, escalation rules, and proof notes.</p>
                    <p class="mini">Result: self-serve support with clear boundaries.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the product, price, support boundaries, common questions, and digital product terms.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to be helpful but firm, never invent legal rules, and escalate duplicate charges or access failures.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save standard wording for “how to start,” “access issue,” “duplicate charge,” and “self-serve support.”</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates triage rules, FAQ answers, canned replies, escalation rules, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the reply is clear, respectful, policy-aware, and not overpromising support.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was answered, what was claimed, what was avoided, and what needs escalation.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough support notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Triage rules</span>
                  <span class="pill">Help center FAQ</span>
                  <span class="pill">Refund-request reply</span>
                  <span class="pill">Access-issue reply</span>
                  <span class="pill">Support boundary</span>
                  <span class="pill">Escalation rules</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for low management</h3><p>Turn repeated support questions into self-serve answers.</p></div>
                  <div class="card"><h3>Clear boundaries</h3><p>Support access problems without promising unlimited personal help.</p></div>
                  <div class="card"><h3>Policy-aware</h3><p>Escalate duplicate charges, technical failures, legal exceptions, and regulated advice requests.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste support notes. Get FAQ, replies, escalation rules, and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Users are responsible for review and judgment before using outputs.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-support-faq-triage-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- SUPPORT-FAQ-TRIAGE-EXAMPLE:START -->"
              end = "<!-- SUPPORT-FAQ-TRIAGE-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="support-faq-triage-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 7</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn support questions into self-serve answers.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste support notes. Get FAQ answers, canned replies, escalation rules, support boundaries, and a proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/support-faq-triage/">See the support workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit support-faq-triage example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add support-faq-triage workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
