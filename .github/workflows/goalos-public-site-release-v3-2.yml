            <div class="actions"><a class="btn primary" href="{href('/app/goalos-cloud-mvp/')}">Open GoalOS Cloud MVP</a><a class="btn" href="{href('/workshop/goalos-rsi-sprint-workshop/')}">RSI Sprint Workshop</a><a class="btn" href="{SHOP}">Shop / Apply</a></div>
          </section>
          <section class="section panel">
            <div class="eyebrow">Featured workshop</div>
            <p class="law">GoalOS RSI Sprint Workshop turns one repeated AI task into a scored, versioned, proof-recorded, self-improving workflow.</p>
            <p class="lead">A premium private workshop for building workflow v1.0, running it, scoring it, diagnosing weakness, improving to v1.1, and leaving with a proof note and 30-day next-run plan.</p>
            <div class="actions"><a class="btn primary" href="{href('/workshop/goalos-rsi-sprint-workshop/')}">Explore the workshop</a><a class="btn" href="{SHOP}">Apply / Buy</a></div>
          </section>
          <section class="section panel">
            <div class="eyebrow">Latest software proof</div>
            <p class="law">GoalOS Cloud MVP 0.2 proves recursive workflow improvement running in software.</p>
            <p class="lead">One workflow family. One Proof Room. One improvement proposal. One approval gate. One rollback target. One public-safe proof card.</p>
            <div class="actions"><a class="btn primary" href="{href('/app/goalos-cloud-mvp/')}">Open the MVP</a><a class="btn" href="{href('/products/goalos-cloud-mvp/')}">Read about it</a></div>
          </section>
          <section class="section">
            <div class="eyebrow">Commercial ladder</div>
