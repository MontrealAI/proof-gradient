          if not (WEB_ROOT / "app/goalos-cloud-mvp/index.html").exists():
              write_page("app/goalos-cloud-mvp", "GoalOS Cloud MVP 0.2", "Public software proof placeholder.", f"""<section class="hero"><div class="eyebrow">GoalOS Cloud MVP 0.2</div><h1>Recursive workflow improvement, running in software.</h1><p class="lead">This page is ready for the full Cloud MVP action. Run the GoalOS Cloud MVP v0.2 action to install the interactive app.</p><div class="actions"><a class="btn primary" href="{href('/products/goalos-cloud-mvp/')}">Read about the MVP</a></div></section>""")

          # Standards and examples.
          standards_cards = "".join(f'<a class="card" data-site-card href="{href("/standards/" + code + "/")}"><span class="badge">AEP</span><h3>{escape(code)}</h3><p>{escape(title)}</p></a>' for code,title in STANDARDS)
          write_page("standards", "AEP Standards", "Proof Gradient standards.", f"""<section class="hero"><div class="eyebrow">AEP Standards</div><h1>The public trust layer.</h1><p class="lead">AEP standards provide the vocabulary for proof, permission, rollback, public-safe reports, and Proof Rooms.</p></section><section class="section"><div class="grid">{standards_cards}</div></section>""")
          for code,title in STANDARDS:
