            <span class="badge">{escape(item['price'])}</span>
            <h3>{escape(item['title'])}</h3>
            <p class="fr">{escape(item['fr'])}</p>
            <p>{escape(item['promise'])}</p>
          </a>"""

          def bullets(items):
              return "<ul class='list'>" + "".join(f"<li>{escape(i)}</li>" for i in items) + "</ul>"

          # Core pages.
          write_page("", "GoalOS · Proof Gradient", "GoalOS Recursive Workflow OS and Proof Gradient public site.", f"""
