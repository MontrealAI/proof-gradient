          write_page("start-here", "Start Here · GoalOS", "Choose your GoalOS path.", f"""<section class="hero"><div class="eyebrow">Start Here / Départ</div><h1>Start with the outcome you need.</h1><p class="lead">Reusable workflow, self-improving workflow, department Proof Room, RSI Sprint Workshop, implementation sprint, or enterprise pilot.</p></section><section class="section"><div class="grid">{''.join(card(o) for o in OFFERS)}</div></section>""")

