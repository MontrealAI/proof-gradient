                  write_page(f"standards/{code}", f"{code} — {title}", title, f"""<section class="hero"><div class="eyebrow">AEP Standard</div><h1>{escape(code)} — {escape(title)}</h1><p class="lead">Public trust layer for GoalOS and Proof Gradient.</p><div class="actions"><a class="btn" href="{href('/standards/')}">All standards</a></div></section>""")

          example_cards = "".join(f'<a class="card" data-site-card href="{href("/workflow/" + slug + "/")}"><span class="badge">Example</span><h3>{escape(title)}</h3><p>{escape(desc)}</p></a>' for slug,title,desc in EXAMPLES)
          write_page("examples", "GoalOS Examples", "Practical GoalOS workflow examples.", f"""<section class="hero"><div class="eyebrow">Examples</div><h1>Practical GoalOS examples.</h1><p class="lead">Examples that teach reusable workflows, RSI Lite, Proof Room Lite, and Department RSI.</p><div class="search"><input data-site-search placeholder="Search examples..."></div></section><section class="section"><div class="grid">{example_cards}</div></section>""")
          for slug,title,desc in EXAMPLES:
              target = WEB_ROOT / "workflow" / slug / "index.html"
              if not target.exists():
                  write_page(f"workflow/{slug}", title, desc, f"""<section class="hero"><div class="eyebrow">GoalOS Example</div><h1>{escape(title)}</h1><p class="lead">{escape(desc)}</p><div class="actions"><a class="btn" href="{href('/examples/')}">All examples</a><a class="btn primary" href="{SHOP}">Shop / Apply</a></div></section><section class="section panel"><h2>GoalOS structure</h2><p class="lead">Context → Rules → Memory → Workflow → Checks → Proof.</p></section>""")

          command_cards = "".join(card(o) for o in OFFERS)
          command_cards += f'<a class="card" data-site-card href="{href("/products/goalos-cloud-mvp/")}"><span class="badge">MVP</span><h3>GoalOS Cloud MVP 0.2</h3><p>Enterprise recursive workflow proof running in software.</p></a>'
          write_page("command-center", "GoalOS Command Center", "Unified GoalOS command center.", f"""<section class="hero"><div class="eyebrow">Command Center</div><h1>One site. One command center.</h1><p class="lead">Search the unified GoalOS / Proof Gradient website.</p><div class="search"><input data-site-search placeholder="Search products, services, examples, standards..."></div></section><section class="section"><div class="grid">{command_cards}</div></section>""")

          URLS = ["/","/start-here/","/products/","/pricing/","/services/","/examples/","/standards/","/command-center/","/site-map/","/products/goalos-cloud-mvp/","/app/goalos-cloud-mvp/","/workshop/goalos-rsi-sprint-workshop/","/implementation/goalos-proof-room-implementation-sprint/","/workshop/goalos-proof-room-implementation-sprint/","/enterprise/goalos-enterprise-rsi-pilot/","/platform/goalos-recursive-workflow-os/"]
          URLS += [f"/products/{o['slug']}/" for o in OFFERS] + [f"/standards/{c}/" for c,_ in STANDARDS] + [f"/workflow/{s}/" for s,_,_ in EXAMPLES]
          site_rows = "".join(f"<tr><td>{escape(u)}</td><td><a href='{href(u)}'>{href(u)}</a></td></tr>" for u in sorted(set(URLS)))
          write_page("site-map", "GoalOS Site Map", "Unified GoalOS site map.", f"""<section class="hero"><div class="eyebrow">Site Map</div><h1>Unified site map.</h1></section><section class="section"><table class="table"><tr><th>Path</th><th>URL</th></tr>{site_rows}</table></section>""")

          backup(WEB_ROOT / "404.html")
          (WEB_ROOT / "404.html").write_text(base_page("404 · GoalOS", "Page not found.", f"""<section class="hero"><div class="eyebrow">404</div><h1>Page not found.</h1><p class="lead">Use the Command Center to find the right GoalOS page.</p><div class="actions"><a class="btn primary" href="{href('/command-center/')}">Open Command Center</a><a class="btn" href="{href('/')}">Home</a></div></section>"""), encoding="utf-8")

          # Documentation page.
          DOCS = Path("docs")
          DOCS.mkdir(exist_ok=True)
          (DOCS / "GOALOS_PUBLIC_SITE_RELEASE_V3.md").write_text(f"""# GoalOS Public Site Release v3.2

          Generated: {NOW}

          ## Purpose

          Unify the public Proof Gradient / GoalOS website, include the GoalOS RSI Sprint Workshop public offer, preserve AEP standards, keep paid materials private, and support GoalOS Cloud MVP public proof.

          ## Public ladder

          - $49 GoalOS AI Efficiency Sprint Kit
          - $199 GoalOS RSI Lite
          - $997 Proof Room Lite / Department Pack
          - $2,500+ GoalOS RSI Sprint Workshop
          - $9,500+ Proof Room Implementation Sprint
          - $49,000+ Enterprise RSI Pilot

          ## Paid file policy

          Paid buyer ZIPs, private workshop materials, implementation bundles, and enterprise delivery kits are not uploaded to the public site.

          All buy/apply buttons point to:
          {SHOP}

          ## Safe boundary

          GoalOS does not modify AI models. It improves workflows around AI through instructions, checks, scorecards, proof records, memory, evidence standards, versions, approvals, monitoring, and rollback.
          """, encoding="utf-8")

          # Hard repair any HTML: remove old shells, inject exactly one canonical shell/footer.
          MARKERS = [
              r"<!-- GOALOS-CANONICAL-SHELL:START -->.*?<!-- GOALOS-CANONICAL-SHELL:END -->",
              r"<!-- GOALOS-CANONICAL-FOOTER:START -->.*?<!-- GOALOS-CANONICAL-FOOTER:END -->",
              r"<!-- GOALOS-UNIFIED-SHELL:START -->.*?<!-- GOALOS-UNIFIED-SHELL:END -->",
              r"<!-- GOALOS-UNIFIED-FOOTER:START -->.*?<!-- GOALOS-UNIFIED-FOOTER:END -->",
              r"<!-- GOALOS-COMPLETE-NAV:START -->.*?<!-- GOALOS-COMPLETE-NAV:END -->",
              r"<!-- GOALOS-COMPLETE-FOOTER:START -->.*?<!-- GOALOS-COMPLETE-FOOTER:END -->",
              r"<!-- GOALOS-PRODUCT-LADDER-NAV:START -->.*?<!-- GOALOS-PRODUCT-LADDER-NAV:END -->",
              r"<!-- GOALOS-PRODUCT-LADDER-FOOTER:START -->.*?<!-- GOALOS-PRODUCT-LADDER-FOOTER:END -->",
              r"<!-- GOALOS-CLOUD-MVP:START -->.*?<!-- GOALOS-CLOUD-MVP:END -->",
              r"<!-- GOALOS-CLOUD-MVP-V02:START -->.*?<!-- GOALOS-CLOUD-MVP-V02:END -->",
          ]
          ASSET_PATTERNS = [
              r'<link[^>]+data-goalos-[^>]+>\s*',
              r'<script[^>]+data-goalos-[^>]+></script>\s*',
              r'<link[^>]+goalos-(?:complete|product|unified|site-v2|site-v3|ladder)[^>]+\.css[^>]*>\s*',
              r'<script[^>]+goalos-(?:complete|product|unified|site-v2|site-v3|ladder)[^>]+\.js[^>]*></script>\s*',
          ]
          SHELL_TEXT = re.compile(r"(GoalOS|Proof Gradient|Products|Pricing|Services|Standards|Shop|Department RSI|Cloud MVP|RSI Workshop)", re.I)

          def remove_headers(text):
              body = re.search(r"<body\b[^>]*>", text, flags=re.I)
              if not body: return text, 0
              start = body.end()
              # inspect only before first main/section content.
              next_content = re.search(r"<main\b|<section\b|<article\b", text[start:], flags=re.I)
              prefix_end = start + (next_content.start() if next_content else min(9000, len(text)-start))
              prefix = text[start:prefix_end]
              removed = 0
              def repl(m):
                  nonlocal removed
                  block = m.group(0)
                  flat = re.sub(r"<[^>]+>", " ", block)
                  if SHELL_TEXT.search(flat):
                      removed += 1
                      return "\n"
                  return block
              pattern = re.compile(r"<(?:header|nav)\b[\s\S]*?</(?:header|nav)>|<div\b(?=[^>]*class=[\"'][^\"']*(?:topbar|shell|navbar|site-header|nav)[^\"']*[\"'])[\s\S]*?</div>", re.I)
              new_prefix = pattern.sub(repl, prefix)
              return text[:start] + new_prefix + text[prefix_end:], removed

          def remove_footers(text):
              removed = 0
              def repl(m):
                  nonlocal removed
                  block = m.group(0)
                  if SHELL_TEXT.search(re.sub(r"<[^>]+>", " ", block)):
                      removed += 1
                      return "\n"
                  return block
              return re.sub(r"<footer\b[\s\S]*?</footer>", repl, text, flags=re.I), removed

          CANON_CSS = f'<link rel="stylesheet" href="{BASE}/assets/goalos-site-v3.css" data-goalos-canonical-css>'
          CANON_JS = f'<script defer src="{BASE}/assets/goalos-site-v3.js" data-goalos-canonical-js></script>'

          def repair_html(path):
              if "_archive" in path.parts or ".git" in path.parts: return
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "<html" not in text.lower(): return
              original = text
              backup(path)
              for pat in MARKERS:
                  text, n = re.subn(pat, "", text, flags=re.S|re.I)
                  REPORT["old_markers_removed"] += n
              for pat in ASSET_PATTERNS:
                  text, n = re.subn(pat, "", text, flags=re.I)
                  REPORT["old_assets_removed"] += n
              text, n = remove_headers(text); REPORT["topbars_removed"] += n
              text, n = remove_footers(text); REPORT["footers_removed"] += n
              if "</head>" in text:
                  text = text.replace("</head>", f"  {CANON_CSS}\n  {CANON_JS}\n</head>", 1)
              if "<body" in text.lower():
                  text = re.sub(r"(<body\b[^>]*>)", r"\1\n" + NAV + "\n", text, count=1, flags=re.I)
              else:
                  text = NAV + "\n" + text
              if "</body>" in text:
                  text = text.replace("</body>", FOOTER + "\n</body>", 1)
              else:
                  text += "\n" + FOOTER
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  REPORT["html_repaired"].append(path.relative_to(WEB_ROOT).as_posix())

          for html in sorted(WEB_ROOT.rglob("*.html")):
              repair_html(html)

          # Sitemap/robots.
          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          for u in sorted(set(URLS)):
              sitemap += f'  <url><loc>https://montrealai.github.io{BASE}{u}</loc><lastmod>{TODAY}</lastmod></url>\n'
          sitemap += "</urlset>\n"
          (WEB_ROOT / "sitemap.xml").write_text(sitemap, encoding="utf-8")
          (WEB_ROOT / "robots.txt").write_text(f"User-agent: *\nAllow: /\nSitemap: https://montrealai.github.io{BASE}/sitemap.xml\n", encoding="utf-8")

          # Paid artifact guard.
          # v3.2 is smarter: public AEP standard packages are allowed, but buyer/delivery/private bundles are blocked.
          def is_public_standard_package(rel):
              rel = rel.replace("\\", "/").lower()
              return re.fullmatch(r"standards/aep-[0-9]{3}/complete-package\.zip", rel) is not None

          restricted = []
          allowed_public_packages = []
          blocked_terms = [
              "buyer", "buyer_official", "complete_bundle", "delivery_kit", "seller_assets",
              "master_pack", "commercialization_ready", "quick_launch", "opulent_institutional",
              "institutional_boardroom", "implementation_sprint", "enterprise_rsi_pilot",
              "workshop_v", "buyer_facilitator"
          ]
          for p in WEB_ROOT.rglob("*"):
              if not p.is_file() or "_archive" in p.parts:
                  continue
              rel = p.relative_to(WEB_ROOT).as_posix()
              name = p.name.lower()

              if name.endswith(".zip"):
                  if is_public_standard_package(rel):
                      allowed_public_packages.append(rel)
                  else:
                      restricted.append(rel)
                      continue

              if any(term in name for term in blocked_terms):
                  if not name.endswith((".md", ".html", ".json", ".txt", ".yml", ".yaml", ".css", ".js", ".svg")):
                      restricted.append(rel)

          REPORT["allowed_public_packages"] = allowed_public_packages
          if restricted:
              raise SystemExit(
                  "Paid/private artifacts detected in public site. These should not be deployed to GitHub Pages.\n"
                  "Allowed exception: standards/AEP-###/complete-package.zip only.\n\n"
                  + "\n".join(sorted(set(restricted))[:120])
              )

          # Validations.
          errors = []
          for html in sorted(WEB_ROOT.rglob("*.html")):
              if "_archive" in html.parts: continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              if text.count("GOALOS-CANONICAL-SHELL:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-SHELL:START')} canonical shells")
              if text.count("GOALOS-CANONICAL-FOOTER:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-FOOTER:START')} canonical footers")
              for old in ["GOALOS-COMPLETE-NAV","GOALOS-PRODUCT-LADDER-NAV","GOALOS-UNIFIED-SHELL","GOALOS-CLOUD-MVP:START","GOALOS-CLOUD-MVP-V02:START"]:
                  if old in text: errors.append(f"{html.relative_to(WEB_ROOT)} still has old marker {old}")

          # Internal link check.
          missing = []
          for html in WEB_ROOT.rglob("*.html"):
              if "_archive" in html.parts: continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                  target = m.group(1)[len(BASE):] or "/"
                  fs = WEB_ROOT / target.lstrip("/")
                  if target.endswith("/"): fs = fs / "index.html"
                  if not fs.exists(): missing.append((html.relative_to(WEB_ROOT).as_posix(), m.group(1)))
          if missing:
              errors.append("Missing internal links:\n" + "\n".join(f"{s} -> {u}" for s,u in missing[:80]))

          REPORT["validation"] = {"errors": errors, "html_files_checked": len([p for p in WEB_ROOT.rglob('*.html') if '_archive' not in p.parts])}
          if errors:
              (WEB_ROOT / "goalos-public-site-release-v3-2-errors.json").write_text(json.dumps(errors, indent=2), encoding="utf-8")
              raise SystemExit("GoalOS public site release v3.2 validation failed:\n" + "\n".join(errors[:60]))

          # Manifest/report.
          manifest = []
          for p in sorted(WEB_ROOT.rglob("*")):
              if p.is_file() and ".git" not in p.parts:
                  manifest.append({"path":p.relative_to(WEB_ROOT).as_posix(),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          (WEB_ROOT / "goalos-public-site-release-v3-2-manifest.json").write_text(json.dumps({"generated_at":NOW,"files":manifest}, indent=2)+"\n", encoding="utf-8")
          (WEB_ROOT / "goalos-public-site-release-v3-2-report.json").write_text(json.dumps(REPORT, indent=2)+"\n", encoding="utf-8")

          print("GoalOS public site release v3.2 complete.")
          print("Web root:", WEB_ROOT)
          print("Pages written:", len(REPORT["pages_written"]))
          print("HTML repaired:", len(REPORT["html_repaired"]))
          print("Validation: passed")
          PY

          python3 "$RUNNER_TEMP/goalos_public_site_release_v3.py"

      - name: Run public site validation
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi

          cat > "$RUNNER_TEMP/validate_goalos_public_site.py" <<'PY'
          from pathlib import Path
          import re, sys, json

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")
          BASE = "/proof-gradient"
          errors = []

          # HTML shell validation.
          for html in sorted(WEB_ROOT.rglob("*.html")):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              if text.count("GOALOS-CANONICAL-SHELL:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-SHELL:START')} canonical shells")
              if text.count("GOALOS-CANONICAL-FOOTER:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-FOOTER:START')} canonical footers")
              for old in ["GOALOS-COMPLETE-NAV","GOALOS-PRODUCT-LADDER-NAV","GOALOS-UNIFIED-SHELL","GOALOS-CLOUD-MVP:START","GOALOS-CLOUD-MVP-V02:START"]:
                  if old in text:
                      errors.append(f"{html.relative_to(WEB_ROOT)} still has old marker {old}")

          # Internal links.
          for html in WEB_ROOT.rglob("*.html"):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                  target = m.group(1)[len(BASE):] or "/"
                  fs = WEB_ROOT / target.lstrip("/")
                  if target.endswith("/"):
                      fs = fs / "index.html"
                  if not fs.exists():
                      errors.append(f"Broken link in {html.relative_to(WEB_ROOT)} -> {m.group(1)}")

          # Paid/private artifact guard.
          # v3.2 allows public AEP standard packages but blocks buyer/delivery/private bundles.
          def is_public_standard_package(rel):
              rel = rel.replace("\\", "/").lower()
              return re.fullmatch(r"standards/aep-[0-9]{3}/complete-package\.zip", rel) is not None

          blocked_terms = [
              "buyer", "buyer_official", "complete_bundle", "delivery_kit", "seller_assets",
              "master_pack", "commercialization_ready", "quick_launch", "opulent_institutional",
              "institutional_boardroom", "implementation_sprint", "enterprise_rsi_pilot",
              "workshop_v", "buyer_facilitator"
          ]

          for p in WEB_ROOT.rglob("*"):
              if not p.is_file() or "_archive" in p.parts:
                  continue
              rel = p.relative_to(WEB_ROOT).as_posix()
              name = p.name.lower()

              if name.endswith(".zip") and not is_public_standard_package(rel):
                  errors.append(f"Paid/private ZIP detected in public site: {rel}")

              if any(term in name for term in blocked_terms):
                  if not name.endswith((".md",".html",".json",".txt",".yml",".yaml",".css",".js",".svg")):
                      errors.append(f"Suspicious paid/private artifact detected: {rel}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("GoalOS public site validation passed.")
          PY

          python3 "$RUNNER_TEMP/validate_goalos_public_site.py"

          if [ -f "$WEB_ROOT/app/goalos-cloud-mvp/tests/enterprise-core.test.mjs" ]; then
            node "$WEB_ROOT/app/goalos-cloud-mvp/tests/enterprise-core.test.mjs"
          else
            echo "Cloud MVP Node test not found; skipping because app may be installed by separate workflow."
          fi

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit public site release
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT" docs || true
          if git diff --cached --quiet; then
            echo "No public site changes to commit."
          else
            git commit -m "Release unified GoalOS public site v3.2 [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
