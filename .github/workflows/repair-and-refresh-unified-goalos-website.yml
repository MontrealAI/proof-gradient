name: Repair and Refresh Unified GoalOS Website

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repair-refresh-unified-goalos-website
  cancel-in-progress: false

jobs:
  repair-site:
    name: Remove duplicate site shells and refresh pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair duplicate navigation and refresh public site
        id: build
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          cat > "$RUNNER_TEMP/repair_complete_goalos_website.py" <<'PY'
          from pathlib import Path
          from html import escape
          import re, json, hashlib, datetime, shutil

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")
          WEB_ROOT.mkdir(parents=True, exist_ok=True)
          BASE = "/proof-gradient"
          SHOP = "https://www.quebecartificialintelligence.com/shop"
          GITHUB = "https://github.com/MontrealAI/proof-gradient"
          NOW = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"

          assets = WEB_ROOT / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          archive = WEB_ROOT / "_archive" / "before_unified_site_shell"
          archive.mkdir(parents=True, exist_ok=True)

          report = {
              "generated_at": NOW,
              "web_root": str(WEB_ROOT),
              "backups_created": [],
              "pages_written": [],
              "html_files_repaired": [],
              "duplicate_shells_removed_estimate": 0,
              "paid_files_policy": "No buyer ZIPs, paid workshop materials, or private delivery assets are uploaded by this action."
          }

          products = [
              {
                  "slug": "goalos-ai-efficiency-sprint-kit",
                  "price": "$49",
                  "title": "GoalOS AI Efficiency Sprint Kit",
                  "fr": "Trousse GoalOS Sprint d’efficacité IA",
                  "promise": "Build one reusable AI workflow.",
                  "type": "Self-serve digital product",
                  "for": "Beginners, creators, freelancers, consultants, small-business owners.",
                  "bullets": ["60-minute first win", "offline builder", "copy-paste prompts", "editable templates", "proof note"]
              },
              {
                  "slug": "goalos-rsi-lite",
                  "price": "$199",
                  "title": "GoalOS RSI Lite",
                  "fr": "GoalOS RSI Lite",
                  "promise": "Build one self-improving AI workflow.",
                  "type": "Premium self-serve system",
                  "for": "Serious operators, consultants, agencies, creators, small teams.",
                  "bullets": ["Run", "Score", "Diagnose", "Improve", "Version", "Prove", "Re-run"]
              },
              {
                  "slug": "goalos-proof-room-lite",
                  "price": "$997",
                  "title": "GoalOS Proof Room Lite / Department Pack",
                  "fr": "GoalOS Proof Room Lite / Pack Département",
                  "promise": "Set up a lightweight department Proof Room.",
                  "type": "Premium department pack",
                  "for": "Department leads, operations managers, AI champions, team leads.",
                  "bullets": ["owners", "permissions", "proof notes", "weekly reviews", "executive reports", "rollback", "public-safe proof"]
              },
              {
                  "slug": "goalos-rsi-sprint-workshop",
                  "price": "$2,500+",
                  "title": "GoalOS RSI Sprint Workshop",
                  "fr": "Atelier GoalOS RSI Sprint",
                  "promise": "Build the first self-improving workflow live.",
                  "type": "Private workshop",
                  "for": "Founders, operators, teams, consultants, agencies.",
                  "bullets": ["workflow v1.0", "first run", "scorecard", "diagnosis", "workflow v1.1", "proof note"]
              },
              {
                  "slug": "goalos-proof-room-implementation-sprint",
                  "price": "$9,500+",
                  "title": "GoalOS Proof Room Implementation Sprint",
                  "fr": "Sprint de mise en œuvre GoalOS Proof Room",
                  "promise": "Department RSI in 30 days.",
                  "type": "Done-with-you implementation",
                  "for": "Department leaders, AI champions, operations executives.",
                  "bullets": ["3 workflows", "permission map", "proof review", "monthly report", "rollback procedure", "case study"]
