            <div class="eyebrow">GoalOS · Proof Gradient</div>
            <h1>A model can answer. An agent can act. An institution must prove.</h1>
            <p class="lead">GoalOS turns repeated AI work into owned, scored, versioned, approved, monitored, and recursively improving workflows.</p>
            <div class="loop">Run → Score → Prove → Diagnose → Improve → Approve → Version → Monitor → Re-run</div>
            <div class="actions"><a class="btn primary" href="{href('/app/goalos-cloud-mvp/')}">Open GoalOS Cloud MVP</a><a class="btn" href="{href('/pricing/')}">View ladder</a><a class="btn" href="{SHOP}">Shop / Apply</a></div>
