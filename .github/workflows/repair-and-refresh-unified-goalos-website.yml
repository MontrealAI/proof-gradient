                  "slug": "goalos-enterprise-rsi-pilot",
                  "price": "$49,000+",
                  "title": "GoalOS Enterprise RSI Pilot",
                  "fr": "GoalOS Enterprise RSI Pilot",
                  "promise": "Pilot the Recursive Workflow OS.",
                  "type": "Enterprise pilot",
                  "for": "Enterprise AI governance, CIO/CDO office, support/ops executives.",
                  "bullets": ["90-day pilot", "workflow family", "benchmark", "proof records", "v1.1 proposal", "architecture blueprint"]
              },
          ]

