              ("AEP-001", "GoalOS Proof-of-Evolution Constitution"),
              ("AEP-002", "Evidence Docket Standard"),
              ("AEP-003", "ProofPacket Schema"),
              ("AEP-004", "Selection Gate Standard"),
              ("AEP-005", "Tool Permission Standard"),
              ("AEP-006", "Rollback Receipt Standard"),
              ("AEP-007", "Public-Safe Proof Report Standard"),
              ("AEP-008", "Proof Room Standard")
          ]

          def href(path):
              if path.startswith("http"):
                  return path
              return BASE + path

          def backup(path):
              if not path.exists() or not path.is_file():
                  return
              rel = path.relative_to(WEB_ROOT)
              dest = archive / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              if not dest.exists():
                  shutil.copy2(path, dest)
                  report["backups_created"].append(dest.relative_to(WEB_ROOT).as_posix())

          def page(title, desc, body):
              return f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>{escape(title)}</title>
            <meta name="description" content="{escape(desc)}">
            <meta property="og:title" content="{escape(title)}">
            <meta property="og:description" content="{escape(desc)}">
            <meta property="og:image" content="{BASE}/assets/goalos-unified-og.svg">
            <link rel="stylesheet" href="{BASE}/assets/goalos-unified-site-shell.css" data-goalos-unified-css>
            <script defer src="{BASE}/assets/goalos-unified-site.js" data-goalos-unified-js></script>
          </head>
          <body>
          <main class="unified-wrap">
          {body}
          </main>
          </body>
