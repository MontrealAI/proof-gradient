          write_page("platform/goalos-recursive-workflow-os", "GoalOS Recursive Workflow OS", "Enterprise Recursive Workflow OS platform direction.", enterprise_body)

          standards_body = f"""
          <section class="unified-hero"><div class="eyebrow">AEP Standards</div><h1>The public trust layer.</h1><p class="lead">AEP standards provide the vocabulary for proof, permission, rollback, public-safe reports, and Proof Rooms.</p></section>
          <section class="section"><div class="grid">{''.join(f'<a class="card" data-unified-card href="{href("/standards/" + code + "/")}"><span class="badge">AEP</span><h3>{escape(code)}</h3><p>{escape(title)}</p></a>' for code,title in standards)}</div></section>
          """
          write_page("standards", "AEP Standards", "Proof Gradient standards.", standards_body)

          for code,title in standards:
              out = WEB_ROOT / "standards" / code / "index.html"
              if not out.exists():
                  write_page(f"standards/{code}", f"{code} — {title}", title, f"""<section class="unified-hero"><div class="eyebrow">AEP Standard</div><h1>{escape(code)} — {escape(title)}</h1><p class="lead">Public trust layer for GoalOS and Proof Gradient.</p><div class="actions"><a class="btn" href="{href('/standards/')}">All standards</a></div></section>""", backup_existing=False)

          examples = [
              ("build-one-reusable-ai-workflow", "Build one reusable AI workflow", "Customer question → clear reply."),
              ("rsi-lite-self-improving-workflows", "Recursive Self-Improving Workflows", "Run, score, diagnose, improve, version, prove, and re-run."),
              ("department-proof-room-lite", "Department Proof Room Lite", "Set up owners, permissions, proof notes, reviews, reports, and rollback."),
              ("department-ai-permission-map", "AI Permission Map", "Green / Yellow / Red boundaries for department AI use."),
              ("department-public-safe-case-study", "Public-safe case study", "Turn internal proof into safe external evidence.")
          ]
          examples_body = f"""
          <section class="unified-hero"><div class="eyebrow">Examples</div><h1>Practical GoalOS examples.</h1><p class="lead">Examples that teach reusable workflows, RSI Lite, Proof Room Lite, and Department RSI.</p><div class="search"><input data-unified-search placeholder="Search examples..."></div></section>
          <section class="section"><div class="grid">{''.join(f'<a class="card" data-unified-card href="{href("/workflow/" + slug + "/")}"><span class="badge">Example</span><h3>{escape(title)}</h3><p>{escape(desc)}</p></a>' for slug,title,desc in examples)}</div></section>
          """
          write_page("examples", "GoalOS Examples", "Practical GoalOS workflow examples.", examples_body)

          for slug,title,desc in examples:
              out = WEB_ROOT / "workflow" / slug / "index.html"
              if not out.exists():
                  write_page(f"workflow/{slug}", title, desc, f"""<section class="unified-hero"><div class="eyebrow">GoalOS Example</div><h1>{escape(title)}</h1><p class="lead">{escape(desc)}</p><div class="actions"><a class="btn" href="{href('/examples/')}">All examples</a><a class="btn primary" href="{SHOP}">Shop / Apply</a></div></section><section class="section panel"><h2>GoalOS structure</h2><p class="lead">Context → Rules → Memory → Workflow → Checks → Proof.</p></section>""", backup_existing=False)

          command_cards = ''.join(card(p) for p in products)
          command_cards += f'<a class="card" data-unified-card href="{href("/products/goalos-cloud-mvp/")}"><span class="badge">MVP</span><h3>GoalOS Cloud MVP 0.2</h3><p>Enterprise recursive workflow proof running in software.</p></a>'
          command_body = f"""
          <section class="unified-hero"><div class="eyebrow">Command Center</div><h1>One site. One command center.</h1><p class="lead">Search the unified GoalOS / Proof Gradient website.</p><div class="search"><input data-unified-search placeholder="Search products, services, examples, standards..."></div></section>
          <section class="section"><div class="grid">{command_cards}</div></section>
          """
          write_page("command-center", "GoalOS Command Center", "Unified GoalOS command center.", command_body)

          # Site map and URLs
          urls = [
              "/", "/start-here/", "/products/", "/pricing/", "/services/", "/examples/", "/standards/", "/command-center/",
              "/products/goalos-cloud-mvp/", "/app/goalos-cloud-mvp/",
              "/implementation/goalos-proof-room-implementation-sprint/",
              "/workshop/goalos-rsi-sprint-workshop/",
              "/workshop/goalos-proof-room-implementation-sprint/",
              "/enterprise/goalos-enterprise-rsi-pilot/",
              "/platform/goalos-recursive-workflow-os/"
          ]
          urls += [f"/products/{p['slug']}/" for p in products]
          urls += [f"/standards/{code}/" for code,_ in standards]
          urls += [f"/workflow/{slug}/" for slug,_,_ in examples]
          rows = "".join(f"<tr><td>{escape(u)}</td><td><a href='{href(u)}'>{href(u)}</a></td></tr>" for u in sorted(set(urls)))
          write_page("site-map", "GoalOS Site Map", "Unified GoalOS site map.", f"""<section class="unified-hero"><div class="eyebrow">Site Map</div><h1>Unified site map.</h1></section><section class="section"><table class="table"><tr><th>Path</th><th>URL</th></tr>{rows}</table></section>""")

          (WEB_ROOT / "404.html").write_text(page("404 · GoalOS", "Page not found.", f"""<section class="unified-hero"><div class="eyebrow">404</div><h1>Page not found.</h1><p class="lead">Use the Command Center to find the right GoalOS page.</p><div class="actions"><a class="btn primary" href="{href('/command-center/')}">Open Command Center</a><a class="btn" href="{href('/')}">Home</a></div></section>"""), encoding="utf-8")

          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          for u in sorted(set(urls)):
              sitemap += f"  <url><loc>https://montrealai.github.io{BASE}{u}</loc><lastmod>{NOW[:10]}</lastmod></url>\n"
          sitemap += "</urlset>\n"
          (WEB_ROOT / "sitemap.xml").write_text(sitemap, encoding="utf-8")
          (WEB_ROOT / "robots.txt").write_text(f"User-agent: *\nAllow: /\nSitemap: https://montrealai.github.io{BASE}/sitemap.xml\n", encoding="utf-8")

          # Unified nav/footer insertion and duplicate cleanup.
          nav = f"""<!-- GOALOS-UNIFIED-SHELL:START -->
          <header class="unified-shell">
            <nav class="unified-nav" aria-label="GoalOS unified navigation">
              <a class="unified-brand" href="{href('/')}"><span class="unified-mark">G</span><span>GoalOS · Proof Gradient</span></a>
              <div class="unified-links">
                <a href="{href('/start-here/')}">Start</a>
                <a href="{href('/products/')}">Products</a>
                <a href="{href('/pricing/')}">Pricing</a>
                <a href="{href('/services/')}">Services</a>
                <a href="{href('/products/goalos-cloud-mvp/')}">Cloud MVP</a>
                <a href="{href('/implementation/goalos-proof-room-implementation-sprint/')}">Department RSI</a>
                <a href="{href('/examples/')}">Examples</a>
                <a href="{href('/standards/')}">Standards</a>
                <a class="shop" href="{SHOP}">Shop</a>
              </div>
            </nav>
          </header>
          <!-- GOALOS-UNIFIED-SHELL:END -->"""

          footer = f"""<!-- GOALOS-UNIFIED-FOOTER:START -->
          <footer class="unified-footer">
            <div class="unified-footer-inner">
              <div>GoalOS · Recursive Workflows · Proof Rooms · Enterprise RSI</div>
              <div><a href="{href('/site-map/')}">Site Map</a><a href="{href('/pricing/')}">Pricing</a><a href="{GITHUB}">GitHub</a><a href="{SHOP}">Shop</a></div>
            </div>
          </footer>
          <!-- GOALOS-UNIFIED-FOOTER:END -->"""

          css_link = f'<link rel="stylesheet" href="{BASE}/assets/goalos-unified-site-shell.css" data-goalos-unified-css>'
          js_link = f'<script defer src="{BASE}/assets/goalos-unified-site.js" data-goalos-unified-js></script>'

          marker_patterns = [
              r"<!-- GOALOS-UNIFIED-SHELL:START -->.*?<!-- GOALOS-UNIFIED-SHELL:END -->",
              r"<!-- GOALOS-UNIFIED-FOOTER:START -->.*?<!-- GOALOS-UNIFIED-FOOTER:END -->",
              r"<!-- GOALOS-COMPLETE-NAV:START -->.*?<!-- GOALOS-COMPLETE-NAV:END -->",
              r"<!-- GOALOS-COMPLETE-FOOTER:START -->.*?<!-- GOALOS-COMPLETE-FOOTER:END -->",
              r"<!-- GOALOS-PRODUCT-LADDER-NAV:START -->.*?<!-- GOALOS-PRODUCT-LADDER-NAV:END -->",
              r"<!-- GOALOS-PRODUCT-LADDER-FOOTER:START -->.*?<!-- GOALOS-PRODUCT-LADDER-FOOTER:END -->",
              r"<!-- GOALOS-LATEST-PRODUCT-LADDER:START -->.*?<!-- GOALOS-LATEST-PRODUCT-LADDER:END -->",
              r"<!-- GOALOS-CLOUD-MVP:START -->.*?<!-- GOALOS-CLOUD-MVP:END -->",
              r"<!-- GOALOS-CLOUD-MVP-V02:START -->.*?<!-- GOALOS-CLOUD-MVP-V02:END -->",
          ]

          def repair_html(path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "<html" not in text.lower():
                  return
              original = text

              for pat in marker_patterns:
                  text, n = re.subn(pat, "", text, flags=re.S | re.I)
                  report["duplicate_shells_removed_estimate"] += n

              # Remove old stylesheet/script links that were injected by previous automated site actions.
              text = re.sub(r'<link[^>]+data-goalos-(?:complete|ladder|product|unified)[^>]*>\s*', "", text, flags=re.I)
              text = re.sub(r'<script[^>]+data-goalos-(?:complete|ladder|product|unified)[^>]*></script>\s*', "", text, flags=re.I)

              # Remove stacked navigation headers immediately after body.
              body_header_pat = r'(<body[^>]*>)\s*(?:(?:<!--.*?-->\s*)?<header\b(?=[^>]*class=["\'][^"\']*(?:unified-shell|gpl-shell|shell|topbar|site-header|nav-shell)[^"\']*["\'])[\s\S]*?</header>\s*)+'
              text, n = re.subn(body_header_pat, r"\1\n", text, count=1, flags=re.I)
              report["duplicate_shells_removed_estimate"] += n

              # Remove stacked footers near bottom.
              footer_pat = r'(?:\s*<footer\b(?=[^>]*class=["\'][^"\']*(?:unified-footer|gpl-footer|footer)[^"\']*["\'])[\s\S]*?</footer>\s*)+(?=</body>)'
              text, n = re.subn(footer_pat, "\n", text, flags=re.I)
              report["duplicate_shells_removed_estimate"] += n

              # Add canonical CSS/JS.
              if "</head>" in text:
                  text = text.replace("</head>", f"  {css_link}\n  {js_link}\n</head>", 1)

              # Insert exactly one nav.
              if "<body" in text.lower():
                  text = re.sub(r"(<body[^>]*>)", r"\1\n" + nav + "\n", text, count=1, flags=re.I)
              else:
                  text = nav + "\n" + text

              # Insert exactly one footer.
              if "</body>" in text:
                  text = text.replace("</body>", footer + "\n</body>", 1)
              else:
                  text += "\n" + footer

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  report["html_files_repaired"].append(path.relative_to(WEB_ROOT).as_posix())

          for html in sorted(WEB_ROOT.rglob("*.html")):
              if "_archive" in html.parts or ".git" in html.parts:
                  continue
              repair_html(html)

          # Local link check for generated absolute internal links.
          missing = []
          for html in WEB_ROOT.rglob("*.html"):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                  target = m.group(1)[len(BASE):] or "/"
                  fs = WEB_ROOT / target.lstrip("/")
                  if target.endswith("/"):
                      fs = fs / "index.html"
                  if not fs.exists():
                      missing.append((html.relative_to(WEB_ROOT).as_posix(), m.group(1)))
          if missing:
              raise SystemExit("Generated local link check failed:\n" + "\n".join(f"{s} -> {u}" for s,u in missing[:200]))

          # Manifest and report.
          manifest = []
          for p in sorted(WEB_ROOT.rglob("*")):
              if p.is_file() and ".git" not in p.parts:
                  manifest.append({"path": p.relative_to(WEB_ROOT).as_posix(), "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          (WEB_ROOT / "goalos-unified-site-manifest.json").write_text(json.dumps({"generated_at": NOW, "files": manifest}, indent=2) + "\n", encoding="utf-8")
          (WEB_ROOT / "goalos-unified-site-repair-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")

          print("GoalOS unified website repair complete.")
          print("Web root:", WEB_ROOT)
          print("Pages written:", len(report["pages_written"]))
          print("HTML files repaired:", len(report["html_files_repaired"]))
          print("Duplicate shell removals estimate:", report["duplicate_shells_removed_estimate"])
          PY

          python3 "$RUNNER_TEMP/repair_complete_goalos_website.py"

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit unified website repair
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "Repair and refresh unified GoalOS website [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
