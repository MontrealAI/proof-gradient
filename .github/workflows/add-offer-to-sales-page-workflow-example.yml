name: Add Offer To Sales Page Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: offer-to-sales-page-workflow-example
  cancel-in-progress: false

jobs:
  add-offer-example:
    name: Add offer-to-sales-page workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create offer-to-sales-page workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "offer-to-sales-page"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "offer-to-sales-page"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn rough offer notes</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a sales page.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Offer → Benefits → What’s inside → FAQ → Terms → Proof note</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 4:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Rough kit notes → buyer-ready product page</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Reduce confusion before checkout. Make the offer clear before money changes hands.</text>
          </svg>"""
          (assets_dir / "offer-to-sales-page-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough offer notes:
          Product: GoalOS AI Efficiency Sprint Kit
          Price: $49
          Promise: build one reusable AI workflow in under one hour
          Buyer: founders, consultants, creators, operators, and small teams
          Includes: templates, checklist, copy-paste prompts, examples, proof page
          Important: no income claims, no ROI guarantee, no legal/compliance guarantee
          Policy: digital product, instant access, all sales final once delivered except where required by law or for duplicate charges / technical access failures
          Goal: make the offer clear enough that buyers know exactly what they are getting before checkout."""

          output_example = """Hero Section:
          Stop asking AI from scratch.

          Build one reusable AI workflow in under one hour.

          GoalOS AI Efficiency Sprint Kit helps you turn one repeated AI task into a reusable work system with context, rules, memory, workflow, checks, and proof.

          Price:
          $49 digital kit

          What you get:
          - Start Here guide
          - 60-minute sprint checklist
          - AI task picker
          - Context pack template
          - Rules template
          - Memory template
          - Workflow template
          - Checks / eval template
          - Proof page template
          - Copy-paste prompts
          - Before / after examples

          Best for:
          - founders
          - consultants
          - creators
          - operators
          - small teams
          - professionals who use AI repeatedly but keep starting from zero

          Not for:
          - people expecting guaranteed income
          - people expecting legal, financial, medical, tax, or compliance advice
          - people who want a fully autonomous agent to act without review

          FAQ:
          Is this just a prompt pack?
          No. A prompt is something you ask once. This kit helps you build a reusable workflow you can run again.

          Will this make me money?
          No income or ROI is guaranteed. The kit is designed to help structure repeated AI work into a reusable system.

          Do I need to be technical?
          No. Pick one repeated task and follow the 60-minute checklist.

          Digital Product Terms:
          This is a digital educational workflow product. Because access is delivered instantly, all sales are final once delivered, except where required by law or for duplicate charges / technical access failures.

          Call to Action:
          Get the kit and build your first reusable AI workflow."""

          proof_note = """Proof note:
          Source: rough product offer notes.
          Output created: sales-page hero, buyer list, contents list, FAQ, terms language, call to action.
          Claims made: the kit helps buyers build one reusable AI workflow.
          Claims avoided: no income guarantee, no ROI guarantee, no legal/compliance promise, no perfect-accuracy claim.
          Review needed: human should confirm final terms, checkout settings, product contents, and applicable consumer rules before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Offer to Sales Page — GoalOS Workflow Example</title>
            <meta name="description" content="Turn rough offer notes into a buyer-ready product page with benefits, contents, FAQ, terms, and proof note." />
            <meta property="og:title" content="Turn rough offer notes into a sales page." />
            <meta property="og:description" content="Offer → benefits → what’s inside → FAQ → terms → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/offer-to-sales-page-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 4</div>
              <h1>Turn rough offer notes into a sales page.</h1>
              <p class="lead">This reusable AI workflow turns rough product notes into a clear buyer-ready sales page section with what buyers get, who it is for, who it is not for, FAQ, digital product terms, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/idea-to-demand-engine/">Example 3: demand engine</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Make the offer clear before checkout.</div>
                <p class="lead">For a low-friction digital product business, clarity is the support system. Clear pages reduce confusion, reduce support, and reduce avoidable disputes.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: vague offer</h3>
                    <p>You have a product idea and a price, but the page does not clearly explain what buyers get, who it is for, or what is not promised.</p>
                    <p class="mini">Result: confused buyers, support questions, avoidable friction.</p>
                  </div>
                  <div class="card">
                    <h3>After: buyer-ready page</h3>
                    <p>You paste rough notes into the workflow. It creates the page sections, FAQ, terms language, and proof note.</p>
                    <p class="mini">Result: clear offer, clearer expectations, easier automated checkout.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the product, price, buyer, promise, contents, and checkout destination.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to avoid income guarantees, fake urgency, fake testimonials, and legal/compliance promises.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your exact product language: “Stop asking AI from scratch. Build one reusable AI workflow.”</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates the hero, benefit list, contents list, FAQ, terms, call to action, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the offer is clear, specific, honest, and not overpromising.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what it created, what it claimed, what it avoided, and what still needs human review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough offer notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Hero section</span>
                  <span class="pill">Benefits</span>
                  <span class="pill">What’s inside</span>
                  <span class="pill">FAQ</span>
                  <span class="pill">Terms language</span>
                  <span class="pill">Call to action</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for digital kits</h3><p>Turn rough product notes into a page that can support automated checkout.</p></div>
                  <div class="card"><h3>Less friction</h3><p>Clear “who it is for / not for” language helps filter bad-fit buyers before purchase.</p></div>
                  <div class="card"><h3>Safer claims</h3><p>The proof note shows which claims were made and which were avoided.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste rough offer notes. Get a buyer-ready product page and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Users are responsible for review and judgment before using outputs.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-offer-to-sales-page-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- OFFER-TO-SALES-PAGE-EXAMPLE:START -->"
              end = "<!-- OFFER-TO-SALES-PAGE-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="offer-to-sales-page-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 4</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn rough offer notes into a sales page.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste rough product notes. Get a buyer-ready page section, FAQ, digital product terms, call to action, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/offer-to-sales-page/">See the sales-page workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit offer-to-sales-page example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add offer-to-sales-page workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
