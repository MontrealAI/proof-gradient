name: Add Meeting To Action Plan Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meeting-to-action-plan-workflow-example
  cancel-in-progress: false

jobs:
  add-meeting-example:
    name: Add meeting-to-action-plan workflow example page
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create meeting-to-action-plan workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          workflow_dir = WEB_ROOT / "workflow" / "meeting-to-action-plan"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "meeting-to-action-plan"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn meeting notes</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into action.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Messy call → Decisions → Owners → Deadlines → Follow-up → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 2:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Meeting notes → Action plan → Follow-up email → Proof note</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Stop letting meetings disappear into notes. Build a workflow that turns talk into work.</text>
          </svg>"""
          (assets_dir / "meeting-to-action-plan-card.svg").write_text(svg, encoding="utf-8")

          messy_notes = """Marketing call notes:
          - We talked about launching the $49 kit.
          - Need better page example.
          - Someone should make the product page simpler.
          - Need proof / claim boundary.
          - Maybe post on LinkedIn.
          - Not sure who owns what.
          - Need by Friday if possible."""

          output_example = """Meeting Summary:
          We decided to improve the $49 GoalOS AI Efficiency Sprint page by adding a simple example that makes the product easier to understand.

          Decisions:
          1. Use “build one reusable AI workflow” as the main promise.
          2. Use a practical example instead of abstract protocol language.
          3. Add a claim boundary to avoid risky guarantees.

          Action Plan:
          1. Create a clearer product-page section.
             Owner: Marketing
             Due: Friday

          2. Draft one LinkedIn post explaining the example.
             Owner: Founder
             Due: Thursday

          3. Add a proof note to the page.
             Owner: Product
             Due: Friday

          Follow-up Email:
          Subject: Action items from today’s GoalOS launch call

          Hi team,

          Here is the simple action plan from today’s call:

          - Marketing will simplify the $49 kit page by Friday.
          - Founder will draft one LinkedIn post by Thursday.
          - Product will add a proof note and claim boundary by Friday.

          The main message is:
          “Stop asking AI from scratch. Build one reusable AI workflow in under one hour.”

          Thanks."""

          proof_note = """Proof note:
          Source: messy internal meeting notes.
          Output created: summary, decisions, action plan, follow-up email.
          Claims made: the workflow helps organize meeting notes into reusable action outputs.
          Claims avoided: no productivity guarantee, no revenue guarantee, no legal/compliance promise.
          Review needed: human should confirm owners and deadlines before sending.
          Public-safe: yes, if private names/client details are removed."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Meeting Notes to Action Plan — GoalOS Workflow Example</title>
            <meta name="description" content="Turn messy meeting notes into a clear action plan, follow-up email, and proof note with a reusable AI workflow." />
            <meta property="og:title" content="Turn meeting notes into action." />
            <meta property="og:description" content="Messy call → decisions → owners → deadlines → follow-up email → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/meeting-to-action-plan-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 2</div>
              <h1>Turn meeting notes into action.</h1>
              <p class="lead">Most meetings create notes. Good workflows create action. This reusable AI workflow turns messy meeting notes into decisions, owners, deadlines, a follow-up email, and a proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/">Example 1: customer replies</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
                <a class="btn" href="/proof-gradient/">Proof Gradient</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Stop letting meetings disappear into notes.</div>
                <p class="lead">Build a reusable workflow that turns every meeting into a clear action plan people can actually use.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: notes that sit somewhere</h3>
                    <p>You leave the call with a messy transcript, scattered ideas, unclear owners, and no proof of what was decided.</p>
                    <p class="mini">Result: forgotten tasks, repeated conversations, unclear accountability.</p>
                  </div>
                  <div class="card">
                    <h3>After: a reusable meeting workflow</h3>
                    <p>You paste the notes into the same workflow every time. It produces a summary, decisions, owners, deadlines, follow-up email, and proof note.</p>
                    <p class="mini">Result: talk becomes action.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI what kind of meeting it is, who the audience is, and what format you want.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to invent owners, deadlines, or decisions. If something is unclear, it must mark it as “needs confirmation.”</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your usual team roles, project names, tone, and follow-up style.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI follows the same sequence: summarize → extract decisions → assign actions → draft follow-up → create proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks for missing owners, risky claims, unclear deadlines, and invented facts.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was produced, what needs review, and what was not claimed.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Messy meeting notes:</p>
                <pre>{messy_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Meeting summary</span>
                  <span class="pill">Decisions</span>
                  <span class="pill">Action items</span>
                  <span class="pill">Owners</span>
                  <span class="pill">Deadlines</span>
                  <span class="pill">Follow-up email</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Useful immediately</h3><p>Almost every team has messy notes. This turns them into structured work.</p></div>
                  <div class="card"><h3>Low-risk</h3><p>The workflow marks uncertainty instead of inventing facts, owners, or deadlines.</p></div>
                  <div class="card"><h3>Easy to repeat</h3><p>Run it after every call, client meeting, planning session, or team check-in.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste messy meeting notes. Get an action plan, follow-up email, and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-008/">See the Proof Room Standard</a>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">GoalOS kits are digital educational workflow products. To keep the product simple, automated, and low-friction, sales should be clearly presented as final once access is delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Users are responsible for review and judgment before using outputs.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-meeting-workflow-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- MEETING-TO-ACTION-PLAN-EXAMPLE:START -->"
              end = "<!-- MEETING-TO-ACTION-PLAN-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="meeting-to-action-plan-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 2</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn meeting notes into action.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">The next reusable workflow example: paste messy notes and get decisions, owners, deadlines, a follow-up email, and a proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/meeting-to-action-plan/">See the meeting workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit meeting workflow example page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add meeting-to-action-plan workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
