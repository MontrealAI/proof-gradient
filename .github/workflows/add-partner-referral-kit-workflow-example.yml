name: Add Partner Referral Kit Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: partner-referral-kit-workflow-example
  cancel-in-progress: false

jobs:
  add-partner-example:
    name: Add partner-referral-kit workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create partner-referral-kit workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "partner-referral-kit"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "partner-referral-kit"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · PARTNER LOOP</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn partners</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into distribution.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Partner note → Promo kit → Disclosure → Swipe copy → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 11:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Partner interest → safe referral promo kit</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Let other people share the product clearly without fake claims or hidden incentives.</text>
          </svg>"""
          (assets_dir / "partner-referral-kit-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough partner notes:
          Product: GoalOS AI Efficiency Sprint Kit
          Price: $49
          Potential partner: AI newsletter writer, creator, consultant, or community owner
          Goal: give them a simple referral / affiliate promo kit they can use to explain the product clearly
          Need:
          - partner one-liner
          - disclosure line
          - short post
          - email blurb
          - FAQ
          - claims to avoid
          - tracking link placeholder
          - proof note
          Important:
          - disclose if the partner earns commission or receives anything of value
          - no fake testimonials
          - no income guarantee
          - no ROI guarantee
          - no fake scarcity
          - no hidden relationship
          - do not imply the partner personally used the product unless they actually did
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Partner One-Liner:
          GoalOS AI Efficiency Sprint Kit helps people stop asking AI from scratch by building one reusable AI workflow with context, rules, memory, workflow, checks, and proof.

          Required Disclosure Line:
          Disclosure: I may earn a commission if you buy through my link.

          Short Social Post:
          Most people use AI like a chat box.

          They ask.
          They edit.
          They close the tab.
          Then they ask the same kind of thing again next week.

          The better move:
          build one reusable AI workflow.

          Context.
          Rules.
          Memory.
          Workflow.
          Checks.
          Proof.

          GoalOS AI Efficiency Sprint Kit is a $49 digital kit designed to help you build one reusable workflow in under one hour.

          Disclosure: I may earn a commission if you buy through my link.

          Email Blurb:
          Subject: A simple kit for people repeating the same AI task

          If you use AI every week but keep starting from zero, this may help.

          GoalOS AI Efficiency Sprint Kit is a $49 digital kit that walks you through building one reusable AI workflow.

          Examples:
          - customer replies
          - meeting notes
          - sales page sections
          - email sequences
          - support FAQ

          It is not a magic income system.
          It is not legal, financial, or compliance advice.
          It is a practical workflow kit.

          Disclosure: I may earn a commission if you buy through my link.

          FAQ For Partners:

          Q: Can I say this guarantees results?
          A: No. Do not claim guaranteed income, guaranteed ROI, guaranteed savings, compliance, or perfect accuracy.

          Q: Can I say I used it?
          A: Only if you actually used it.

          Q: Can I offer a refund?
          A: Do not promise refunds. Use the published product terms: digital product, instant access, all sales final once delivered except where required by law or for duplicate charges / technical access failures.

          Q: Can I use my own words?
          A: Yes, but keep the claim boundary: reusable AI workflow, not guaranteed business results.

          Claims To Avoid:
          - “This will make you money.”
          - “Guaranteed ROI.”
          - “Fully automated income.”
          - “Legally compliant AI system.”
          - “I used this and got results” unless true and permission-safe.
          - “No refunds ever under any circumstances.”

          Tracking Link Placeholder:
          Use your approved partner link here:
          [PARTNER_LINK]"""

          proof_note = """Proof note:
          Source: rough partner / referral notes.
          Outputs created: partner one-liner, disclosure line, social post, email blurb, FAQ, claims-to-avoid list, tracking link placeholder.
          Claims made: the kit helps people build one reusable AI workflow.
          Claims avoided: no income guarantee, no ROI guarantee, no fake testimonial, no hidden incentive, no false use claim, no refund promise beyond published terms.
          Disclosure boundary: partner must disclose commission or anything of value in a clear, hard-to-miss way near the recommendation.
          Review needed: human should confirm partner terms, platform rules, tracking link, disclosure language, and final legal requirements before launch.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Partner Referral Kit — GoalOS Workflow Example</title>
            <meta name="description" content="Turn partner interest into a safe referral promo kit with disclosure line, swipe copy, FAQ, claims-to-avoid list, and proof note." />
            <meta property="og:title" content="Turn partners into distribution." />
            <meta property="og:description" content="Partner note → promo kit → disclosure → swipe copy → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/partner-referral-kit-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Partner Loop · Example 11</div>
              <h1>Turn partners into distribution.</h1>
              <p class="lead">This reusable AI workflow turns partner interest into a safe referral promo kit: one-liner, disclosure line, social post, email blurb, FAQ, claims-to-avoid list, tracking link placeholder, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/monthly-workflow-vault-drop/">Example 10: Workflow Vault</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Make it easy for the right people to share the product clearly.</div>
                <p class="lead">A partner kit lets creators, newsletter writers, consultants, and communities explain the product without making fake claims, hiding incentives, or creating refund confusion.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: messy partner sharing</h3>
                    <p>A partner wants to share your kit, but they write their own hype, forget disclosure, overpromise results, or ask you to rewrite everything manually.</p>
                    <p class="mini">Result: trust risk, support burden, inconsistent messaging.</p>
                  </div>
                  <div class="card">
                    <h3>After: partner promo kit</h3>
                    <p>You give them clean copy, a clear disclosure line, a claims-to-avoid list, FAQ, and tracking-link placeholder.</p>
                    <p class="mini">Result: scalable distribution with clearer boundaries.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the product, price, partner type, offer, tracking link, and terms.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to disclose commissions, avoid fake testimonials, and avoid income or ROI claims.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your core explanation: “Stop asking AI from scratch. Build one reusable AI workflow.”</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates partner one-liner, disclosure, posts, email blurb, FAQ, claims-to-avoid list, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the promo is clear, honest, disclosure-aware, and not overstated.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was created, what was claimed, what was avoided, and what needs human review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough partner notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Partner one-liner</span>
                  <span class="pill">Disclosure line</span>
                  <span class="pill">Social post</span>
                  <span class="pill">Email blurb</span>
                  <span class="pill">Partner FAQ</span>
                  <span class="pill">Claims to avoid</span>
                  <span class="pill">Tracking link placeholder</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for distribution</h3><p>Give partners clear language they can use without needing custom help from you.</p></div>
                  <div class="card"><h3>Disclosure-aware</h3><p>The workflow reminds partners to disclose commissions or anything of value.</p></div>
                  <div class="card"><h3>Lower trust risk</h3><p>The claims-to-avoid list keeps the offer away from fake testimonials and income promises.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste partner notes. Get a referral promo kit and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, advertising, endorsement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Partners should disclose material connections and review platform/legal requirements before publishing.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
              <a class="card" href="feedback-to-product-update/"><h3>Example 8: Feedback → product update</h3><p>Turn buyer feedback into product improvements, changelog, buyer email, and proof.</p></a>
              <a class="card" href="proof-card-referral-loop/"><h3>Example 9: Usage → proof card</h3><p>Turn real usage into public-safe proof, social post, referral ask, and permission request.</p></a>
              <a class="card" href="monthly-workflow-vault-drop/"><h3>Example 10: Requests → Vault drop</h3><p>Turn buyer requests into a recurring template library, announcement email, changelog, and proof.</p></a>
              <a class="card" href="partner-referral-kit/"><h3>Example 11: Partner interest → referral kit</h3><p>Turn partner interest into clear promo copy, disclosure language, FAQ, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-partner-referral-kit-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- PARTNER-REFERRAL-KIT-EXAMPLE:START -->"
              end = "<!-- PARTNER-REFERRAL-KIT-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="partner-referral-kit-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Partner Loop · Example 11</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn partners into distribution.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste partner notes. Get a referral promo kit, disclosure line, swipe copy, FAQ, claims-to-avoid list, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/partner-referral-kit/">See the partner workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit partner-referral-kit example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add partner-referral-kit workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
