name: Add Proof Card Referral Loop Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proof-card-referral-loop-workflow-example
  cancel-in-progress: false

jobs:
  add-proof-card-example:
    name: Add proof-card-referral-loop workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create proof-card-referral-loop workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "proof-card-referral-loop"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "proof-card-referral-loop"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn real usage</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into shareable proof.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Usage note → Proof card → Share post → Referral ask → Claim boundary</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 9:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Real buyer use → public-safe proof card</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Create viral proof without fake testimonials, private screenshots, or inflated claims.</text>
          </svg>"""
          (assets_dir / "proof-card-referral-loop-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough proof-card notes:
          Product: GoalOS AI Efficiency Sprint Kit
          Buyer message summary: “I used the kit to turn my meeting notes task into a reusable workflow.”
          Important: do not publish the buyer’s name, email, company, screenshot, or exact quote without permission.
          Goal: create a public-safe proof card, social post, referral request, and proof note.
          Rules:
          - no fake testimonial
          - no invented result
          - no income claim
          - no ROI claim
          - no private buyer details
          - ask permission before using any identifiable quote
          - summarize the pattern safely if permission is not confirmed
          Offer: If this helped, share the example or send the kit to one person who repeats the same AI task weekly.
          Terms: digital product, instant access, all sales final once delivered except where required by law or for duplicate charges / technical access failures."""

          output_example = """Public-Safe Proof Card:
          Before:
          Meeting notes were messy and hard to turn into action.

          Workflow built:
          Meeting notes → decisions → owners → deadlines → follow-up email → proof note.

          Public-safe result:
          One repeated meeting-notes task was turned into a reusable AI workflow.

          Claim boundary:
          This does not claim guaranteed productivity, income, ROI, legal compliance, or universal results.

          Share Post:
          Someone used the GoalOS AI Efficiency Sprint method to turn a repeated meeting-notes task into a reusable AI workflow.

          The pattern:

          messy notes
          → summary
          → decisions
          → owners
          → deadlines
          → follow-up email
          → proof note

          That is the point.

          Not “prompt harder.”

          Build a workflow you can run again.

          Referral Ask:
          If this helped you, send the GoalOS AI Efficiency Sprint Kit to one person who keeps asking AI from scratch for the same task every week.

          Best fit:
          - customer replies
          - meeting notes
          - weekly updates
          - sales-page sections
          - support FAQ
          - email sequences

          Permission Request:
          Hi,

          Glad the kit helped you build a reusable workflow.

          May we share a short, public-safe summary of your use case?

          We would not include your name, company, email, private files, screenshots, or exact words unless you explicitly approve them.

          Example summary:
          “A buyer used the GoalOS sprint to turn meeting notes into a reusable action-plan workflow.”

          Thanks."""

          proof_note = """Proof note:
          Source: summarized buyer usage message.
          Outputs created: public-safe proof card, social post, referral ask, permission request.
          Claims made: a buyer used the method to turn one repeated task into a reusable workflow.
          Claims avoided: no fake testimonial, no invented quote, no income guarantee, no ROI claim, no private buyer details.
          Permission boundary: do not use identifiable buyer details or exact quotes without explicit permission.
          Review needed: human should confirm permission status before publishing any identifiable testimonial or quote.
          Public-safe: yes, if anonymized and no private details are included."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Proof Card Referral Loop — GoalOS Workflow Example</title>
            <meta name="description" content="Turn real product usage into a public-safe proof card, social post, referral ask, permission request, and proof note." />
            <meta property="og:title" content="Turn real usage into shareable proof." />
            <meta property="og:description" content="Usage note → proof card → share post → referral ask → claim boundary." />
            <meta property="og:image" content="/proof-gradient/assets/proof-card-referral-loop-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 9</div>
              <h1>Turn real usage into shareable proof.</h1>
              <p class="lead">This reusable AI workflow turns a real buyer usage note into a public-safe proof card, social post, referral ask, permission request, and proof note — without fake testimonials, private screenshots, or inflated claims.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/feedback-to-product-update/">Example 8: feedback to update</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Real usage can create demand — if you keep it public-safe.</div>
                <p class="lead">The goal is not to invent testimonials. The goal is to turn real, permission-aware usage into simple proof people can understand and share.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: proof stays private</h3>
                    <p>A buyer says the kit helped them build a workflow. The message stays in your inbox, or worse, gets turned into risky marketing without permission.</p>
                    <p class="mini">Result: missed demand or unnecessary trust risk.</p>
                  </div>
                  <div class="card">
                    <h3>After: public-safe proof loop</h3>
                    <p>The workflow creates an anonymized proof card, social post, referral ask, permission request, and proof note.</p>
                    <p class="mini">Result: shareable demand without fake claims.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI what the buyer used, what task they worked on, and what can or cannot be public.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to invent quotes, names, screenshots, results, income claims, or testimonials.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your standard claim boundary and permission-request language.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates a proof card, social post, referral ask, permission request, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks that the output is anonymized, truthful, and not overstated.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was claimed, what was avoided, and what needs permission before publishing.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough proof-card notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Public-safe proof card</span>
                  <span class="pill">Social post</span>
                  <span class="pill">Referral ask</span>
                  <span class="pill">Permission request</span>
                  <span class="pill">Claim boundary</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for ethical virality</h3><p>Turn real usage into a shareable story without faking testimonials.</p></div>
                  <div class="card"><h3>Permission-aware</h3><p>Ask before using names, quotes, companies, screenshots, or private details.</p></div>
                  <div class="card"><h3>Demand loop</h3><p>Each real use case can become a proof card and referral ask.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste a real usage note. Get a public-safe proof card and referral loop.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Do not publish private buyer messages, names, emails, screenshots, testimonials, or exact quotes without appropriate permission.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
              <a class="card" href="feedback-to-product-update/"><h3>Example 8: Feedback → product update</h3><p>Turn buyer feedback into product improvements, changelog, buyer email, and proof.</p></a>
              <a class="card" href="proof-card-referral-loop/"><h3>Example 9: Usage → proof card</h3><p>Turn real usage into public-safe proof, social post, referral ask, and permission request.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-proof-card-referral-loop-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- PROOF-CARD-REFERRAL-LOOP-EXAMPLE:START -->"
              end = "<!-- PROOF-CARD-REFERRAL-LOOP-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="proof-card-referral-loop-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 9</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn real usage into shareable proof.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste a usage note. Get a public-safe proof card, social post, referral ask, permission request, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/proof-card-referral-loop/">See the proof-card workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit proof-card-referral-loop example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add proof-card-referral-loop workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
