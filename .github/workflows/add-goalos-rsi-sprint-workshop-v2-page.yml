name: Add GoalOS RSI Sprint Workshop v2 Public Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: add-goalos-rsi-sprint-workshop-v2-pages
  cancel-in-progress: false

jobs:
  add-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create public workshop pages
        id: build
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT/workshop/goalos-rsi-sprint-workshop" "$WEB_ROOT/products/goalos-rsi-sprint-workshop" "$WEB_ROOT/assets"
          touch "$WEB_ROOT/.nojekyll"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"
          cat > "$WEB_ROOT/workshop/goalos-rsi-sprint-workshop/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoalOS RSI Sprint Workshop</title><style>body{margin:0;background:#05070d;color:#f7f8ff;font-family:system-ui}.wrap{max-width:1100px;margin:0 auto;padding:64px 24px}.eyebrow{color:#ffd76a;text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}h1{font-size:clamp(48px,8vw,100px);line-height:.88;letter-spacing:-.08em}.lead{font-size:22px;line-height:1.5;color:#b8c0da;max-width:850px}.btn{display:inline-flex;padding:13px 18px;border:1px solid #ffd76a;border-radius:999px;text-decoration:none;color:#05070d;background:#ffd76a;font-weight:900}.card{border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));margin:20px 0}</style></head><body><main class="wrap"><div class="eyebrow">GoalOS RSI Sprint Workshop</div><h1>Build your first self-improving AI workflow live.</h1><p class="lead">Run -> Score -> Diagnose -> Improve -> Version -> Prove -> Re-run. The AI model does not improve itself. Your workflow improves around the AI.</p><a class="btn" href="https://www.quebecartificialintelligence.com/shop">Book / Buy on QUEBEC.AI</a><section class="card"><h2>What you leave with</h2><p>Workflow v1.0, first run, scorecard, diagnosis, workflow v1.1, proof note, and 30-day next-run plan.</p></section><section class="card"><h2>Safe boundary</h2><p>No model self-modification, no guaranteed ROI, no compliance certification, no autonomous deployment. Human review required.</p></section></main></body></html>
          HTML
          cp "$WEB_ROOT/workshop/goalos-rsi-sprint-workshop/index.html" "$WEB_ROOT/products/goalos-rsi-sprint-workshop/index.html"
      - name: Refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then echo "$deleted"; exit 1; fi
      - name: Commit pages
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add GoalOS RSI Sprint Workshop public pages [skip ci]"; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}
      - uses: actions/deploy-pages@v4
