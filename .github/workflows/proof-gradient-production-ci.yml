name: Proof Gradient Production CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/proof-gradient-production-ci.yml"
      - "proof_gradient/__init__.py"
      - "proof_gradient/config.py"
      - "proof_gradient/db.py"
      - "proof_gradient/models.py"
      - "proof_gradient/security.py"
      - "proof_gradient/providers.py"
      - "proof_gradient/evals.py"
      - "proof_gradient/services.py"
      - "proof_gradient/api.py"
      - "proof_gradient/cli.py"
      - "proof_gradient/workers.py"
      - "tests/test_proof_gradient_*.py"
      - "docs/architecture.md"
      - "docs/final_acceptance_report.md"
      - "docs/security.md"
      - "docs/api.md"
      - "docs/cli.md"
      - "docs/deployment.md"
      - "docs/migration_from_skillos_v2.md"
      - "scripts/security_review.py"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "alembic.ini"
      - "migrations/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: proof-gradient-production-ci
  cancel-in-progress: true

jobs:
  production-ci:
    name: Test production platform with Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: proofgradient
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROOF_GRADIENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/proofgradient
      PROOF_GRADIENT_PROVIDER: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify production files exist
        run: |
          set -euo pipefail

          required=(
            "proof_gradient/__init__.py"
            "proof_gradient/config.py"
            "proof_gradient/db.py"
            "proof_gradient/models.py"
            "proof_gradient/security.py"
            "proof_gradient/providers.py"
            "proof_gradient/evals.py"
            "proof_gradient/services.py"
            "proof_gradient/api.py"
            "proof_gradient/cli.py"
            "proof_gradient/workers.py"
            "tests/test_proof_gradient_vertical_slice.py"
            "tests/test_proof_gradient_security.py"
            "tests/test_proof_gradient_api.py"
            "scripts/security_review.py"
            "docs/architecture.md"
            "docs/final_acceptance_report.md"
            "docs/security.md"
            "docs/api.md"
            "docs/cli.md"
            "docs/deployment.md"
            "docs/migration_from_skillos_v2.md"
            "Dockerfile"
            "docker-compose.yml"
            "alembic.ini"
            "migrations/env.py"
            "migrations/versions/0001_initial_schema.py"
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required production file: $file"; exit 1; }
          done

          echo "Production files verified."

      - name: Lint production platform only
        run: |
          set -euo pipefail

          ruff check \
            proof_gradient/__init__.py \
            proof_gradient/config.py \
            proof_gradient/db.py \
            proof_gradient/models.py \
            proof_gradient/security.py \
            proof_gradient/providers.py \
            proof_gradient/evals.py \
            proof_gradient/services.py \
            proof_gradient/api.py \
            proof_gradient/cli.py \
            proof_gradient/workers.py \
            tests/test_proof_gradient_vertical_slice.py \
            tests/test_proof_gradient_security.py \
            tests/test_proof_gradient_api.py

      - name: Security review
        run: |
          set -euo pipefail

          python scripts/security_review.py

          bandit -q \
            proof_gradient/__init__.py \
            proof_gradient/config.py \
            proof_gradient/db.py \
            proof_gradient/models.py \
            proof_gradient/security.py \
            proof_gradient/providers.py \
            proof_gradient/evals.py \
            proof_gradient/services.py \
            proof_gradient/api.py \
            proof_gradient/cli.py \
            proof_gradient/workers.py

      - name: Test production platform only
        run: |
          set -euo pipefail

          pytest tests/test_proof_gradient_*.py

      - name: CLI smoke test
        run: |
          set -euo pipefail

          proof-gradient db reset
          proof-gradient demo --tenant ci --json
          proof-gradient proof list --tenant ci
          proof-gradient selection list --tenant ci

      - name: API smoke test
        run: |
          set -euo pipefail

          python - <<'PY'
          from fastapi.testclient import TestClient

          from proof_gradient.api import app
          from proof_gradient.db import reset_db


          reset_db()

          client = TestClient(app)

          health = client.get("/healthz")
          assert health.status_code == 200, health.text
          assert health.json()["status"] == "ok"

          ready = client.get("/readyz")
          assert ready.status_code == 200, ready.text
          assert ready.json()["status"] == "ready"

          demo = client.post(
              "/demo/run",
              json={
                  "tenant": "ci-api",
                  "prompt": "Draft a response to this angry customer asking for a refund.",
              },
          )
          assert demo.status_code == 200, demo.text

          body = demo.json()
          assert body["proof_id"]
          assert body["run_id"]
          assert body["patch_id"]
          assert body["selection_id"]
          assert body["rollout_id"]
          assert body["rollback_id"]
          assert body["run_contract"]["trace_required"] is True
          assert body["run_contract"]["rollback_required"] is True

          proofs = client.get("/proofs", params={"tenant": "ci-api"})
          assert proofs.status_code == 200, proofs.text
          assert len(proofs.json()["proofs"]) == 1

          artifacts = client.get("/artifacts", params={"tenant": "ci-api"})
          assert artifacts.status_code == 200, artifacts.text
          assert len(artifacts.json()["artifacts"]) >= 1

          metrics = client.get("/metrics")
          assert metrics.status_code == 200, metrics.text
          assert "proof_gradient_proofs_total" in metrics.text

          print("API smoke test passed.")
          PY

      - name: Final production CI verdict
        run: |
          echo "Production CI passed."
          echo "Artifact Vault verified."
          echo "Run Fabric verified."
          echo "Proof Ledger verified."
          echo "Selection Gate verified."
          echo "Postgres-backed production tests passed."
