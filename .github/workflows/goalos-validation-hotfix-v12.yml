name: OBSOLETE — do not run — GoalOS Validation Hotfix v12

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalos-validation-hotfix-v12
  cancel-in-progress: false

jobs:
  hotfix:
    name: Fix validation rules, standalone proof pages, and AEP package allowlist
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shared validation scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts tests docs

          cat > scripts/goalos_public_site_rules.py <<'PY'
          from __future__ import annotations

          from pathlib import Path, PurePosixPath
          import re

          PUBLIC_AEP_PACKAGE_RE = re.compile(
              r"^standards/AEP-[0-9]{3}/complete-package\.zip$",
              re.IGNORECASE,
          )

          STANDALONE_PROOF_RE = re.compile(
              r"^(rsi-ai-first-[a-z0-9-]+-proof\.html|proofs/.+\.html)$",
              re.IGNORECASE,
          )

          APP_PAGE_RE = re.compile(
              r"^app/goalos-cloud-mvp/.*\.html$",
              re.IGNORECASE,
          )

          PRIVATE_TERMS = [
              "buyer",
              "buyer_official",
              "complete_bundle",
              "delivery_kit",
              "seller_assets",
              "master_pack",
              "commercialization_ready",
              "quick_launch",
              "opulent_institutional",
              "institutional_boardroom",
              "implementation_sprint",
              "enterprise_rsi_pilot",
              "workshop_v",
              "buyer_facilitator",
              "private",
              "paid",
          ]

          SAFE_PUBLIC_EXTENSIONS = {
              ".md", ".html", ".json", ".txt", ".yml", ".yaml",
              ".css", ".js", ".svg", ".png", ".jpg", ".jpeg",
              ".webp", ".gif", ".avif", ".xml", ".ico",
          }

          OLD_SHELL_MARKERS = [
              "GOALOS-COMPLETE-NAV",
              "GOALOS-COMPLETE-FOOTER",
              "GOALOS-PRODUCT-LADDER-NAV",
              "GOALOS-PRODUCT-LADDER-FOOTER",
              "GOALOS-UNIFIED-SHELL",
              "GOALOS-UNIFIED-FOOTER",
              "GOALOS-CLOUD-MVP:START",
              "GOALOS-CLOUD-MVP-V02:START",
          ]

          CANONICAL_SHELL_MARKER = "GOALOS-CANONICAL-SHELL:START"
          CANONICAL_FOOTER_MARKER = "GOALOS-CANONICAL-FOOTER:START"


          def normalize_rel(path: str | Path) -> str:
              rel = str(path).replace("\\", "/").lstrip("./")
              while rel.startswith("/"):
                  rel = rel[1:]
              return PurePosixPath(rel).as_posix()


          def strip_public_root(rel: str | Path) -> str:
              rel = normalize_rel(rel)
              for prefix in ("site/", "public/"):
                  if rel.lower().startswith(prefix):
                      return rel[len(prefix):]
              return rel


          def is_public_aep_package(rel: str | Path) -> bool:
              return bool(PUBLIC_AEP_PACKAGE_RE.match(strip_public_root(rel)))


          def has_standalone_marker(text: str) -> bool:
              return (
                  "GOALOS-STANDALONE-PROOF" in text
                  or 'name="goalos-page-type" content="standalone-proof"' in text
                  or "data-goalos-standalone" in text
              )


          def is_standalone_proof_page(rel: str | Path, text: str = "") -> bool:
              rel = strip_public_root(rel)
              return bool(STANDALONE_PROOF_RE.match(rel)) or has_standalone_marker(text)


          def is_app_page(rel: str | Path) -> bool:
              return bool(APP_PAGE_RE.match(strip_public_root(rel)))


          def requires_canonical_shell(rel: str | Path, text: str = "") -> bool:
              rel = strip_public_root(rel)
              if not rel.endswith(".html"):
                  return False
              if is_app_page(rel):
                  return False
              if is_standalone_proof_page(rel, text):
                  return False
              return True


          def is_blocked_paid_or_private_artifact(rel: str | Path) -> bool:
              rel = strip_public_root(rel)
              rel_lower = rel.lower()
              name = PurePosixPath(rel_lower).name
              suffix = PurePosixPath(rel_lower).suffix

              if is_public_aep_package(rel):
                  return False

              if suffix == ".zip":
                  return True

              if any(term in rel_lower or term in name for term in PRIVATE_TERMS):
                  if suffix not in SAFE_PUBLIC_EXTENSIONS:
                      return True

              return False


          def classify_html_page(rel: str | Path, text: str = "") -> str:
              rel = strip_public_root(rel)
              if is_app_page(rel):
                  return "app_page"
              if is_standalone_proof_page(rel, text):
                  return "standalone_proof_page"
              if rel.endswith(".html"):
                  return "canonical_page"
              return "other"
          PY

          cat > scripts/validate_goalos_public_site.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys

          from goalos_public_site_rules import (
              CANONICAL_FOOTER_MARKER,
              CANONICAL_SHELL_MARKER,
              OLD_SHELL_MARKERS,
              classify_html_page,
              is_blocked_paid_or_private_artifact,
              is_public_aep_package,
              requires_canonical_shell,
              strip_public_root,
          )

          BASE = "/proof-gradient"


          def find_web_root() -> Path:
              if Path("site").exists():
                  return Path("site")
              if Path("public").exists():
                  return Path("public")
              raise SystemExit("No public site root found. Expected site/ or public/.")


          def iter_public_files(root: Path):
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  if "_archive" in p.parts or ".git" in p.parts or "node_modules" in p.parts:
                      continue
                  yield p


          def read_text(path: Path) -> str:
              return path.read_text(encoding="utf-8", errors="ignore")


          def has_title(text: str) -> bool:
              return bool(re.search(r"<title>[^<]{2,}</title>", text, flags=re.I | re.S))


          def has_description(text: str) -> bool:
              return bool(re.search(r'<meta\s+name=["\']description["\'][^>]+content=["\'][^"\']{8,}["\']', text, flags=re.I))


          def has_goalos_backlink_or_text(text: str) -> bool:
              return bool(re.search(r"GoalOS|Proof Gradient|/proof-gradient/", text, flags=re.I))


          def has_quebec_identity(text: str) -> bool:
              return "QUEBEC.AI" in text or "⚜️✨" in text or "quebecaisealv5" in text


          def resolve_internal_link(root: Path, href: str) -> Path:
              target = href[len(BASE):] or "/"
              fs = root / target.lstrip("/")
              if target.endswith("/"):
                  return fs / "index.html"
              if fs.suffix:
                  return fs
              return fs / "index.html"


          def validate() -> int:
              root = find_web_root()
              errors: list[str] = []

              # Required public identity assets.
              required_assets = [
                  root / "assets" / "quebecaisealv5.png",
                  root / "favicon.png",
                  root / "assets" / "apple-touch-icon.png",
                  root / "site.webmanifest",
              ]
              for asset in required_assets:
                  if not asset.exists():
                      errors.append(
                          f"Missing required public identity asset: {asset.as_posix()}. "
                          "Run the QUEBEC.AI seal/icon release workflow or copy assets/quebecaisealv5.png into the public site."
                      )

              brand_manifest_v8 = root / "assets" / "brand-assets-v8.json"
              brand_manifest_v9 = root / "assets" / "brand-assets-v9.json"
              brand_manifest_v10 = root / "assets" / "brand-assets-v10.json"
              brand_manifest_v11 = root / "assets" / "brand-assets-v11.json"
              if (root / "assets" / "brand").exists() and not any(p.exists() for p in [brand_manifest_v8, brand_manifest_v9, brand_manifest_v10, brand_manifest_v11]):
                  errors.append("site/assets/brand/ exists but no brand-assets-v8/v9/v10/v11 manifest was found.")

              # Paid/private artifact guard.
              for p in iter_public_files(root):
                  rel = p.relative_to(root).as_posix()
                  if is_blocked_paid_or_private_artifact(rel):
                      errors.append(
                          f"Paid/private artifact detected in public site: {rel}. "
                          "Public AEP packages are allowed only at standards/AEP-###/complete-package.zip."
                      )

              # HTML validation by page class.
              for html in [p for p in iter_public_files(root) if p.suffix.lower() == ".html"]:
                  rel = html.relative_to(root).as_posix()
                  text = read_text(html)
                  page_type = classify_html_page(rel, text)
                  shell_count = text.count(CANONICAL_SHELL_MARKER)
                  footer_count = text.count(CANONICAL_FOOTER_MARKER)

                  for old in OLD_SHELL_MARKERS:
                      if old in text:
                          errors.append(f"{rel} still contains old shell marker {old}.")

                  if requires_canonical_shell(rel, text):
                      if shell_count != 1:
                          errors.append(
                              f"{rel} is classified as canonical_page but has {shell_count} canonical shells. "
                              "Inject exactly one canonical shell, or mark it as GOALOS-STANDALONE-PROOF if intentionally standalone."
                          )
                      if footer_count != 1:
                          errors.append(
                              f"{rel} is classified as canonical_page but has {footer_count} canonical footers. "
                              "Inject exactly one canonical footer, or mark it as GOALOS-STANDALONE-PROOF if intentionally standalone."
                          )
                  else:
                      if shell_count > 1:
                          errors.append(f"{rel} is classified as {page_type} but has {shell_count} canonical shells. Keep 0 or 1.")
                      if footer_count > 1:
                          errors.append(f"{rel} is classified as {page_type} but has {footer_count} canonical footers. Keep 0 or 1.")

                  if page_type == "standalone_proof_page":
                      if not has_title(text):
                          errors.append(f"{rel} is a standalone proof page but is missing a useful <title>.")
                      if not has_description(text):
                          errors.append(f"{rel} is a standalone proof page but is missing a meta description.")
                      if not has_goalos_backlink_or_text(text):
                          errors.append(f"{rel} is a standalone proof page but does not mention/link back to GoalOS / Proof Gradient.")
                      if not has_quebec_identity(text):
                          errors.append(f"{rel} is a standalone proof page but does not include QUEBEC.AI ⚜️✨ identity or seal.")

                  if page_type == "app_page":
                      if not has_title(text):
                          errors.append(f"{rel} is an app page but is missing a useful <title>.")

                  # Internal /proof-gradient links.
                  for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                      href = m.group(1)
                      fs = resolve_internal_link(root, href)
                      if not fs.exists():
                          errors.append(f"Broken internal link in {rel}: {href} -> expected {fs.relative_to(root).as_posix()}")

              if errors:
                  print("\n".join(errors))
                  return 1

              print("GoalOS public site validation passed.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(validate())
          PY

          cat > scripts/check_no_paid_artifacts.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import sys

          from goalos_public_site_rules import is_blocked_paid_or_private_artifact, is_public_aep_package


          def find_roots() -> list[Path]:
              roots = []
              if Path("site").exists():
                  roots.append(Path("site"))
              if Path("public").exists():
                  roots.append(Path("public"))
              if not roots:
                  raise SystemExit("No site/ or public/ root found.")
              return roots


          def main() -> int:
              errors: list[str] = []
              allowed: list[str] = []

              for root in find_roots():
                  for p in sorted(root.rglob("*")):
                      if not p.is_file():
                          continue
                      if "_archive" in p.parts or ".git" in p.parts or "node_modules" in p.parts:
                          continue
                      rel = p.relative_to(root).as_posix()
                      if is_public_aep_package(rel):
                          allowed.append(f"{root}/{rel}")
                          continue
                      if is_blocked_paid_or_private_artifact(rel):
                          errors.append(f"{root}/{rel}")

              if allowed:
                  print("Allowed public AEP packages:")
                  for item in allowed:
                      print(f"  {item}")

              if errors:
                  print("Blocked paid/private artifacts detected:")
                  for item in errors:
                      print(f"  {item}")
                  return 1

              print("No paid/private public artifacts detected.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > tests/test_goalos_public_site_rules.py <<'PY'
          from scripts.goalos_public_site_rules import (
              is_blocked_paid_or_private_artifact,
              is_standalone_proof_page,
              requires_canonical_shell,
              is_app_page,
          )


          def test_public_aep_package_allowed():
              assert not is_blocked_paid_or_private_artifact("standards/AEP-001/complete-package.zip")
              assert not is_blocked_paid_or_private_artifact("site/standards/AEP-008/complete-package.zip")


          def test_wrong_zip_blocked():
              assert is_blocked_paid_or_private_artifact("GoalOS_RSI_Sprint_Workshop_v6_0_COMPLETE_BUNDLE.zip")
              assert is_blocked_paid_or_private_artifact("site/GoalOS_Enterprise_RSI_Pilot_v2_0_BUYER_DELIVERY_KIT.zip")
              assert is_blocked_paid_or_private_artifact("public/private-anything.zip")


          def test_rsi_proof_page_can_be_standalone_by_marker():
              text = "<!-- GOALOS-STANDALONE-PROOF --><html><head><title>x</title></head></html>"
              assert is_standalone_proof_page("rsi-ai-first-blockchain-capital-machine-proof.html", text)
              assert not requires_canonical_shell("rsi-ai-first-blockchain-capital-machine-proof.html", text)


          def test_rsi_proof_page_can_be_standalone_by_filename():
              assert is_standalone_proof_page("rsi-ai-first-governance-capital-engine-proof.html", "")
              assert not requires_canonical_shell("rsi-ai-first-governance-capital-engine-proof.html", "")


          def test_normal_public_page_requires_shell():
              assert requires_canonical_shell("pricing/index.html", "<html></html>")


          def test_app_page_does_not_require_marketing_shell():
              assert is_app_page("app/goalos-cloud-mvp/index.html")
              assert not requires_canonical_shell("app/goalos-cloud-mvp/index.html", "<html></html>")


          def test_safe_public_image_not_blocked():
              assert not is_blocked_paid_or_private_artifact("assets/brand/quebecaisealv5.png")
          PY

          cat > docs/GOALOS_PUBLIC_SITE_VALIDATION.md <<'MD'
          # GoalOS Public Site Validation

          This document defines the public-site validation rules used by GoalOS / Proof Gradient.

          ## Page classes

          ### Canonical public pages

          Normal marketing, product, pricing, services, standards index, examples, and command-center pages.

          Requirement:

          - exactly one `GOALOS-CANONICAL-SHELL`
          - exactly one `GOALOS-CANONICAL-FOOTER`

          ### Standalone proof pages

          Some public proof pages are intentionally immersive and may not use the normal marketing shell.

          Examples:

          - `rsi-ai-first-blockchain-capital-machine-proof.html`
          - `rsi-ai-first-governance-capital-engine-proof.html`
          - `proofs/*.html`

          They must include one of:

          ```html
          <!-- GOALOS-STANDALONE-PROOF -->
          <meta name="goalos-page-type" content="standalone-proof">
          ```

          They must also include:

          - useful `<title>`
          - meta description
          - QUEBEC.AI ⚜️✨ or the seal
          - link back to `/proof-gradient/`
          - no paid/private downloads
          - no unsupported claims

          ### App pages

          Public app pages such as:

          `app/goalos-cloud-mvp/`

          may have their own app shell and do not need the marketing nav/footer.

          ### Public AEP packages

          Allowed public ZIP pattern:

          `standards/AEP-###/complete-package.zip`

          Example:

          `standards/AEP-001/complete-package.zip`

          ### Paid/private artifacts

          All other ZIPs in public deploy roots are blocked unless explicitly reviewed and added to a narrow public allowlist.

          Blocked examples:

          - paid workshop bundles
          - buyer ZIPs
          - delivery kits
          - implementation bundles
          - enterprise pilot bundles
          - commercialization master packs
          - quick launch packs

          ## Local validation

          ```bash
          python scripts/validate_goalos_public_site.py
          python scripts/check_no_paid_artifacts.py
          pytest tests/test_goalos_public_site_rules.py
          ```
          MD

      - name: Mark known RSI proof pages as standalone public proof pages
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [p for p in [Path("site"), Path("public"), Path(".")] if p.exists()]
          targets = [
              "rsi-ai-first-blockchain-capital-machine-proof.html",
              "rsi-ai-first-governance-capital-engine-proof.html",
          ]

          def patch_html(path: Path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              original = text

              if "GOALOS-STANDALONE-PROOF" not in text:
                  text = "<!-- GOALOS-STANDALONE-PROOF -->\n" + text

              if '<meta name="goalos-page-type" content="standalone-proof">' not in text:
                  if "</head>" in text.lower():
                      text = re.sub(
                          r"</head>",
                          '  <meta name="goalos-page-type" content="standalone-proof">\n</head>',
                          text,
                          count=1,
                          flags=re.I,
                      )

              if not re.search(r"<title>[^<]+</title>", text, re.I):
                  if "<head" in text.lower():
                      text = re.sub(
                          r"(<head[^>]*>)",
                          r"\1\n  <title>GoalOS Proof Page · QUEBEC.AI ⚜️✨</title>",
                          text,
                          count=1,
                          flags=re.I,
                      )

              if not re.search(r'<meta\s+name=["\']description["\']', text, re.I):
                  if "</head>" in text.lower():
                      text = re.sub(
                          r"</head>",
                          '  <meta name="description" content="Public standalone GoalOS / Proof Gradient proof page with QUEBEC.AI ⚜️✨ identity.">\n</head>',
                          text,
                          count=1,
                          flags=re.I,
                      )

              if "QUEBEC.AI" not in text and "⚜️✨" not in text:
                  badge = '<div data-goalos-standalone="true" style="position:fixed;top:12px;left:12px;z-index:9999;background:#05070d;color:#ffd76a;border:1px solid rgba(255,215,106,.45);border-radius:999px;padding:8px 12px;font:700 13px system-ui"><a href="/proof-gradient/" style="color:inherit;text-decoration:none">QUEBEC.AI ⚜️✨ · GoalOS · Proof Gradient</a></div>'
                  if "<body" in text.lower():
                      text = re.sub(r"(<body[^>]*>)", r"\1\n" + badge, text, count=1, flags=re.I)
                  else:
                      text = badge + "\n" + text

              if "/proof-gradient/" not in text:
                  link = '<p data-goalos-standalone="true"><a href="/proof-gradient/">Back to GoalOS · Proof Gradient</a></p>'
                  if "</body>" in text.lower():
                      text = re.sub(r"</body>", link + "\n</body>", text, count=1, flags=re.I)
                  else:
                      text += "\n" + link

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched standalone proof page: {path}")

          seen = set()
          for root in roots:
              for target in targets:
                  for path in root.rglob(target):
                      if path in seen:
                          continue
                      seen.add(path)
                      patch_html(path)

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_goalos_public_site_rules.py -q

      - name: Run public-site validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_no_paid_artifacts.py
          python scripts/validate_goalos_public_site.py

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit validation hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests docs site public *.html || true
          if git diff --cached --quiet; then
            echo "No validation hotfix changes to commit."
          else
            git commit -m "Fix GoalOS public-site validation rules [skip ci]"
            git push
          fi
