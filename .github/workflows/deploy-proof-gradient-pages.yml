name: Deploy Proof Gradient Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "site/**"
      - "docs/**"
      - "data/**"
      - "badges/**"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Proof Gradient site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p dist

          if [ -f site/index.html ]; then
            cp -R site/. dist/
          else
            cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Proof Gradient</title>
              <style>
                body {
                  margin: 0;
                  min-height: 100vh;
                  background: #05070d;
                  color: #f7f8ff;
                  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }
                main {
                  width: min(1100px, calc(100% - 40px));
                  margin: 0 auto;
                  padding: 80px 0;
                }
                h1 {
                  font-size: clamp(42px, 8vw, 96px);
                  line-height: .92;
                  letter-spacing: -0.06em;
                }
                p {
                  color: #aab3cf;
                  font-size: 20px;
                  line-height: 1.6;
                  max-width: 820px;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>One agent tries.<br>Proof decides.<br>The network evolves.</h1>
                <p>
                  GoalOS gives the network Direction. PlanOS gives it Strategy.
                  SkillOS gives it Capability. The Proof Gradient gives it Evolution.
                </p>
              </main>
            </body>
          </html>
          HTML
          fi

          touch dist/.nojekyll

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
            echo "Old SkillOS deployment URL found in generated site. Stopping."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy Proof Gradient Command Center
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: |
          echo "Proof Gradient deployed to: ${{ steps.deployment.outputs.page_url }}"
