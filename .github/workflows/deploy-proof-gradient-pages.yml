name: Proof Gradient Production Platform

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "proof_gradient_prod/**"
      - "tests/**"
      - "docs/**"
      - "site/**"
      - "scripts/**"
      - "alembic/**"
      - "migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: proof-gradient-production-platform
  cancel-in-progress: true

jobs:
  build-production-platform:
    name: Build, test, review, and deploy production platform
    runs-on: ubuntu-latest

    if: github.repository == 'MontrealAI/proof-gradient'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: proofgradient
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/proofgradient
      PROOF_GRADIENT_ENV: ci
      PROOF_GRADIENT_PROVIDER: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate production platform implementation
        run: |
          set -euo pipefail

          cat > /tmp/bootstrap_proof_gradient.py <<'PY'
          from pathlib import Path
          import textwrap

          ROOT = Path(".")

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")
              print(f"wrote {target}")

          write("pyproject.toml", """
          [build-system]
          requires = ["setuptools>=69", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "proof-gradient"
          version = "0.1.0"
          description = "Proof Gradient production platform: Artifact Vault, Run Fabric, Proof Ledger, Selection Gate."
          requires-python = ">=3.11"
          dependencies = [
            "fastapi>=0.115",
            "uvicorn[standard]>=0.30",
            "pydantic>=2.8",
            "pydantic-settings>=2.4",
            "sqlalchemy>=2.0",
            "alembic>=1.13",
            "psycopg[binary]>=3.2",
            "typer>=0.12",
            "rich>=13.7",
            "python-json-logger>=2.0"
          ]

          [project.optional-dependencies]
          dev = [
            "pytest>=8.3",
            "httpx>=0.27",
            "ruff>=0.6",
            "bandit>=1.7"
          ]

          [project.scripts]
          proof-gradient = "proof_gradient_prod.cli:main"

          [tool.setuptools.packages.find]
          include = ["proof_gradient_prod*"]

          [tool.pytest.ini_options]
          testpaths = ["tests"]
          addopts = "-q"

          [tool.ruff]
          line-length = 100
          target-version = "py311"
          """)

          write("proof_gradient_prod/__init__.py", """
          __version__ = "0.1.0"
          """)

          write("proof_gradient_prod/config.py", """
          from pydantic_settings import BaseSettings, SettingsConfigDict


          class Settings(BaseSettings):
              model_config = SettingsConfigDict(env_prefix="PROOF_GRADIENT_", extra="ignore")

              env: str = "local"
              database_url: str = "sqlite:///./proof_gradient.db"
              provider: str = "mock"
              log_level: str = "INFO"
              default_tenant: str = "demo"
              max_cost_usd: float = 1.0
              max_latency_seconds: int = 120


          settings = Settings()
          """)

          write("proof_gradient_prod/db.py", """
          from collections.abc import Generator

          from sqlalchemy import create_engine
          from sqlalchemy.orm import DeclarativeBase, Session, sessionmaker

          from proof_gradient_prod.config import settings


          class Base(DeclarativeBase):
              pass


          connect_args = {"check_same_thread": False} if settings.database_url.startswith("sqlite") else {}
          engine = create_engine(settings.database_url, pool_pre_ping=True, connect_args=connect_args)
          SessionLocal = sessionmaker(bind=engine, autoflush=False, autocommit=False, expire_on_commit=False)


          def session_scope() -> Generator[Session, None, None]:
              session = SessionLocal()
              try:
                  yield session
                  session.commit()
              except Exception:
                  session.rollback()
                  raise
              finally:
                  session.close()


          def init_db() -> None:
              from proof_gradient_prod import models  # noqa: F401

              Base.metadata.create_all(bind=engine)


          def reset_db() -> None:
              from proof_gradient_prod import models  # noqa: F401

              Base.metadata.drop_all(bind=engine)
              Base.metadata.create_all(bind=engine)
          """)

          write("proof_gradient_prod/models.py", """
