            "tests/test_security.py"
            "tests/test_api.py"
            ".github/workflows/proof-gradient-production-ci.yml"
            "site/index.html"
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done

          grep -R "Artifact Vault" proof_gradient_prod docs site
          grep -R "Run Fabric" proof_gradient_prod docs site
          grep -R "Proof Ledger" proof_gradient_prod docs site
          grep -R "Selection Gate" proof_gradient_prod docs site

          echo "Production platform foundation verified."

      - name: Commit production platform
        run: |
          set -euo pipefail

          git config user.name "proof-gradient-production-platform"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Implement Proof Gradient production platform foundation [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build clean Pages artifact
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp -R site/. dist/
          touch dist/.nojekyll

          echo "Published files:"
          find dist -maxdepth 4 -type f | sort

          echo "Checking final Pages artifact for stale SkillOS deployment URLs..."

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
