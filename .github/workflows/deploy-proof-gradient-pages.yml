          write("examples/the_proof_loop/job.json", """
          {
            "job_id": "job_the_proof_loop_011",
            "prompt": "Demonstrate Aim, Act, Prove, and Evolve as the simplest sovereign protocol for compounding agent intelligence.",
            "risk_class": "high",
            "expected_behavior": [
              "define Aim artifacts",
              "run active artifacts through Run Fabric",
              "emit Proof Ledger evidence",
              "route candidates through Selection Gate",
              "list GoalOS, PlanOS, SkillOS, Policy, Eval, Tool, and Context artifacts",
