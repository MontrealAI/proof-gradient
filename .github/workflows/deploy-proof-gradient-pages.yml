                  "proofs": proof_dicts,
                  "proof_archive_verdict": "each_proof_has_separate_webpage_and_all_pages_are_connected_to_main",
              }


          def esc(value: Any) -> str:
              return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;")


          def css() -> str:
              return """
