          if __name__ == "__main__":
              unittest.main()
          ''')

          write("docs/the_proof_loop.md", """
          # Proof #11 — The Proof Loop

          ```text
          Aim → Act → Prove → Evolve
          ```

          This is the simplest sovereign form of Proof Gradient.

