name: Deploy Proof Gradient Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "site/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build clean public site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean Pages artifact
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          if [ -f site/index.html ]; then
            cp -R site/. dist/
          else
            cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Proof Gradient</title>
            </head>
            <body>
              <h1>Aim. Act. Prove. Evolve.</h1>
              <p>The Artifact Vault stores reusable intelligence.</p>
              <p>The Run Fabric executes agents at scale.</p>
              <p>The Proof Ledger records what happened.</p>
              <p>The Selection Gate promotes only what proved itself.</p>
            </body>
          </html>
          HTML
          fi

          touch dist/.nojekyll

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
            echo "Old SkillOS deployment URL found in final Pages artifact. Stopping."
            exit 1
          fi

          echo "Clean Proof Gradient Pages artifact is ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy public site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: |
          echo "Proof Gradient deployed to: ${{ steps.deployment.outputs.page_url }}"
