name: Proof Gradient Sovereign Loop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to do."
        required: true
        default: "bootstrap-and-deploy"
        type: choice
        options:
          - "bootstrap-and-deploy"
          - "deploy-only"

  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "proof_gradient/**"
      - "tests/**"
      - "site/index.html"
      - "site/proof-gradient-command-center.html"
      - "site/assets/proof-gradient-status.json"
      - "docs/**"
      - "schemas/**"
      - "examples/**"
      - "data/proof_gradient_foundation.json"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-sovereign-loop
  cancel-in-progress: true

jobs:
  sovereign-loop:
    name: Build, prove, commit, and deploy Proof Gradient
    runs-on: ubuntu-latest

    if: github.repository == 'MontrealAI/proof-gradient'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap Proof Gradient foundation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-and-deploy' }}
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import textwrap

          ROOT = Path(".")

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")
              print(f"wrote {target}")

          legacy_readme = ROOT / "README.md"
          legacy_snapshot = ROOT / "docs" / "legacy_skillos_readme_snapshot.md"

          if legacy_readme.exists() and not legacy_snapshot.exists():
              legacy_snapshot.parent.mkdir(parents=True, exist_ok=True)
              legacy_snapshot.write_text(
                  "# Legacy SkillOS README Snapshot\n\n"
                  "This preserves the inherited SkillOS README before the Proof Gradient foundation rewrite.\n\n"
                  + legacy_readme.read_text(encoding="utf-8", errors="ignore"),
                  encoding="utf-8",
              )

          write("README.md", """
          # Proof Gradient

          **One agent tries. Proof decides. The network evolves.**

          Proof Gradient is the agent evolution protocol where every run leaves proof, every proof selects intelligence, and every selected artifact evolves the network.

          ## The product truth

          GoalOS gives the network **Direction**.  
          PlanOS gives it **Strategy**.  
          SkillOS gives it **Capability**.  
          The Proof Gradient gives it **Evolution**.

          ## The four systems

          | System | Promise |
          |---|---|
          | **Artifact Vault** | Stores reusable intelligence. |
          | **Run Fabric** | Executes agents at scale. |
          | **Proof Ledger** | Records what happened. |
          | **Selection Gate** | Promotes only what proved itself. |

          ## The operating law

          ```text
          No proof, no evolution.
          No eval, no propagation.
          No rollback, no release.
          ```

          ## Run the deterministic demo

          ```bash
          python -m proof_gradient demo --out data/proof_gradient_foundation.json
          ```

          ## Run tests

          ```bash
          python -m unittest tests/test_proof_gradient_foundation.py
          ```

          ## Public command center

          ```text
          https://montrealai.github.io/proof-gradient/
          ```
          """)

          write("proof_gradient/__init__.py", '''
          """Proof Gradient.

          GoalOS gives Direction.
          PlanOS gives Strategy.
          SkillOS gives Capability.
          The Proof Gradient gives Evolution.
          """

          __version__ = "0.1.0"
          ''')

          write("proof_gradient/foundation.py", r'''
          from __future__ import annotations

          from dataclasses import asdict, dataclass, field
          from datetime import datetime, timezone
          import hashlib
          import json
          from typing import Any


          def now() -> str:
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def checksum(value: Any) -> str:
              payload = json.dumps(value, sort_keys=True, ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()


          @dataclass(frozen=True)
          class ArtifactVersion:
              artifact_id: str
              artifact_type: str
              name: str
              version: str
              state: str
              scope: str
              risk_class: str
              description: str
              content: dict[str, Any]
              dependencies: list[str] = field(default_factory=list)
              permissions: dict[str, str] = field(default_factory=dict)
              eval_references: list[str] = field(default_factory=list)
              rollback_target: str | None = None
              created_at: str = field(default_factory=now)

              def to_dict(self) -> dict[str, Any]:
                  data = asdict(self)
                  data["checksum"] = checksum({
                      "artifact_id": self.artifact_id,
                      "artifact_type": self.artifact_type,
                      "version": self.version,
                      "content": self.content,
                      "dependencies": self.dependencies,
                      "permissions": self.permissions,
                      "eval_references": self.eval_references,
                  })
                  return data


          def artifact_vault() -> list[ArtifactVersion]:
              """The Artifact Vault stores reusable intelligence."""
              return [
                  ArtifactVersion(
                      artifact_id="customer_response_goal",
                      artifact_type="goal",
                      name="Customer Response Direction",
                      version="1.2.0",
                      state="active",
                      scope="tenant",
                      risk_class="medium",
                      description="Defines a safe, accurate, empathetic customer-response objective.",
                      content={
                          "desired_outcome": "Draft a safe, accurate, empathetic customer response.",
                          "success_criteria": [
                              "acknowledges customer concern",
                              "uses verified facts",
                              "proposes next step",
                              "avoids unsupported promises",
                          ],
                          "failure_criteria": [
                              "invents policy",
                              "blames customer",
                              "sends externally without approval",
                          ],
                      },
                      eval_references=["unsupported_claim_eval@1.0.0", "tone_safety_eval@1.0.0"],
                  ),
                  ArtifactVersion(
                      artifact_id="customer_response_plan",
                      artifact_type="plan",
                      name="Customer Response Strategy",
                      version="1.4.0",
                      state="active",
                      scope="tenant",
                      risk_class="medium",
                      description="Reads context, drafts, verifies claims, and requires approval before external send.",
                      content={
                          "steps": [
                              "read_customer_context",
                              "draft_response",
                              "verify_claims",
                              "require_human_approval_before_send",
                          ]
                      },
                      dependencies=["tone_control_skill@1.3.0", "claim_verification_skill@1.8.0"],
                      rollback_target="customer_response_plan@1.3.0",
                  ),
                  ArtifactVersion(
                      artifact_id="tone_control_skill",
                      artifact_type="skill",
                      name="Tone Control Capability",
                      version="1.3.0",
                      state="active",
                      scope="tenant",
                      risk_class="low",
                      description="Keeps customer-facing language calm, empathetic, and non-defensive.",
                      content={"instruction": "Use calm, concise, customer-safe language."},
                  ),
                  ArtifactVersion(
                      artifact_id="claim_verification_skill",
                      artifact_type="skill",
                      name="Claim Verification Capability",
                      version="1.8.0",
                      state="active",
                      scope="tenant",
                      risk_class="medium",
                      description="Detects unsupported claims before final output.",
                      content={"instruction": "Flag claims not grounded in approved policy or provided context."},
                  ),
                  ArtifactVersion(
                      artifact_id="refund_policy_tool",
                      artifact_type="tool",
                      name="Refund Policy Tool",
                      version="1.0.0",
                      state="active",
                      scope="tenant",
                      risk_class="medium",
                      description="Mock read-only refund policy lookup.",
                      content={"mode": "deterministic_mock", "permission": "read"},
                      permissions={"read": "allowed", "write": "denied", "send": "denied"},
                  ),
                  ArtifactVersion(
                      artifact_id="no_external_send_policy",
                      artifact_type="policy",
                      name="No External Send Without Approval",
                      version="1.0.0",
                      state="active",
                      scope="tenant",
                      risk_class="high",
                      description="External contact requires human approval.",
                      content={"email_send": "approval_required"},
                  ),
                  ArtifactVersion(
                      artifact_id="unsupported_claim_eval",
                      artifact_type="eval",
                      name="Unsupported Claim Eval",
                      version="1.0.0",
                      state="active",
                      scope="tenant",
                      risk_class="medium",
                      description="Fails when a draft promises a refund without policy evidence.",
                      content={"forbidden_without_policy": ["refund approved", "we will refund you"]},
                  ),
              ]


          def run_fabric(artifacts: list[ArtifactVersion]) -> dict[str, Any]:
              """The Run Fabric executes agents at scale."""
              resolved = {f"{a.artifact_id}@{a.version}": a.to_dict() for a in artifacts}

              run_contract = {
                  "job_id": "job_customer_refund_001",
                  "direction": "customer_response_goal@1.2.0",
                  "strategy": "customer_response_plan@1.4.0",
                  "capabilities": [
                      "tone_control_skill@1.3.0",
                      "claim_verification_skill@1.8.0",
                  ],
                  "tools": {
                      "refund_policy_tool": "read",
                      "email_send": "approval_required",
                  },
                  "policies": ["no_external_send_policy@1.0.0"],
                  "evals": ["unsupported_claim_eval@1.0.0", "tone_safety_eval@1.0.0"],
                  "budget": {
                      "max_cost_usd": 0.25,
                      "max_latency_seconds": 60,
                  },
                  "trace_required": True,
                  "created_at": now(),
              }

              trace_events = [
                  {
                      "event_type": "job_received",
                      "message": "Customer refund response job received.",
                      "data": {"job_id": run_contract["job_id"]},
                      "created_at": now(),
                  },
                  {
                      "event_type": "artifacts_resolved",
                      "message": "Direction, Strategy, Capability, Tool, Policy, and Eval artifacts resolved.",
                      "data": {
                          "direction": run_contract["direction"],
                          "strategy": run_contract["strategy"],
                          "capabilities": run_contract["capabilities"],
                      },
                      "created_at": now(),
                  },
                  {
                      "event_type": "tool_allowed",
                      "message": "Read-only refund policy lookup allowed.",
                      "data": {"tool": "refund_policy_tool", "permission": "read"},
                      "created_at": now(),
                  },
                  {
                      "event_type": "tool_denied",
                      "message": "External email send requires human approval.",
                      "data": {"tool": "email_send", "permission": "approval_required"},
                      "created_at": now(),
                  },
                  {
                      "event_type": "baseline_draft_created",
                      "message": "Baseline draft created with unsupported refund promise.",
                      "data": {
                          "draft": "I’m sorry for the frustration. We will refund you and follow up soon."
                      },
                      "created_at": now(),
                  },
                  {
                      "event_type": "eval_failed",
                      "message": "Unsupported refund promise detected.",
                      "data": {"eval": "unsupported_claim_eval@1.0.0"},
                      "created_at": now(),
                  },
              ]

              return {
                  "run_id": "run_customer_refund_001",
                  "resolved_artifacts": resolved,
                  "run_contract": run_contract,
                  "trace_events": trace_events,
              }


          def proof_ledger(run: dict[str, Any]) -> dict[str, Any]:
              """The Proof Ledger records what happened."""
              extra_events = [
                  {
                      "event_type": "credit_assigned",
                      "message": "Primary failure assigned to plan; secondary failure assigned to claim verification skill.",
                      "data": {
                          "primary_failure": "plan",
                          "secondary_failure": "skill",
                      },
                      "created_at": now(),
                  },
                  {
                      "event_type": "patch_proposed",
                      "message": "Plan patch proposed: add refund policy grounding before drafting.",
                      "data": {
                          "patch": "patch_customer_response_policy_grounding_001"
                      },
                      "created_at": now(),
                  },
              ]

              return {
                  "proof_id": "proof_customer_refund_001",
                  "run_id": run["run_id"],
                  "job_id": run["run_contract"]["job_id"],
                  "run_contract": run["run_contract"],
                  "resolved_artifacts": sorted(run["resolved_artifacts"].keys()),
                  "trace_events": run["trace_events"] + extra_events,
                  "output": {
                      "baseline_failed": True,
                      "candidate_output": "I’m sorry for the frustration. I can’t confirm refund eligibility yet, but I can help check the policy and next steps.",
                      "external_send_status": "blocked_until_human_approval",
                  },
                  "cost_usd": 0.00,
                  "latency_ms": 317,
                  "created_at": now(),
              }


          def selection_gate(proof: dict[str, Any]) -> dict[str, Any]:
              """The Selection Gate promotes only what proved itself."""
              score = {
                  "proof_id": proof["proof_id"],
                  "passed": True,
                  "quality_score": 0.91,
                  "safety_score": 1.0,
                  "policy_status": "pass",
                  "credit_assignment": {
                      "primary_failure": "plan",
                      "secondary_failure": "skill",
                      "evidence": [
                          "drafting occurred before policy grounding",
                          "unsupported refund promise detected by eval",
                          "external send correctly blocked by policy",
                      ],
                      "recommended_patches": [
                          "plan_patch:add_policy_grounding_before_draft",
                          "skill_patch:strengthen_refund_claim_verification",
                      ],
                      "do_not_patch": ["goal_artifact"],
                  },
                  "eval_results": {
                      "unsupported_claim_eval@1.0.0": "candidate_pass",
                      "tone_safety_eval@1.0.0": "candidate_pass",
                      "baseline_vs_candidate": {
                          "quality_delta": 0.18,
                          "safety_delta": 1.0,
                          "cost_delta_usd": 0.00,
                      },
                  },
                  "created_at": now(),
              }

              patch = {
                  "patch_id": "patch_customer_response_policy_grounding_001",
                  "patch_type": "plan_patch",
                  "target_artifact": "customer_response_plan@1.4.0",
                  "source_proof": proof["proof_id"],
                  "rationale": "Add a policy-grounding checkpoint before drafting to prevent unsupported refund promises.",
                  "diff": {
                      "add_step": {
                          "id": "check_refund_policy",
                          "before": "draft_response",
                          "capability": "refund_policy_tool@1.0.0",
                      }
                  },
                  "required_evals": [
                      "unsupported_claim_eval@1.0.0",
                      "tone_safety_eval@1.0.0",
                  ],
                  "rollback_target": "customer_response_plan@1.4.0",
                  "risk_class": "medium",
                  "created_at": now(),
              }

              selection = {
                  "decision_id": "selection_customer_response_canary_001",
                  "candidate_artifact": "customer_response_plan@1.5.0-candidate",
                  "baseline_artifact": "customer_response_plan@1.4.0",
                  "decision": "approve_canary",
                  "rollout_percentage": 10,
                  "rollback_target": "customer_response_plan@1.4.0",
                  "evidence": {
                      "proof_id": proof["proof_id"],
                      "score_passed": score["passed"],
                      "required_evals": "passed",
                  },
                  "created_at": now(),
              }

              return {
                  "score": score,
                  "patch": patch,
                  "selection": selection,
              }


          def build_foundation() -> dict[str, Any]:
              artifacts = artifact_vault()
              run = run_fabric(artifacts)
              proof = proof_ledger(run)
              selected = selection_gate(proof)

              return {
                  "generated_at": now(),
                  "repository": "MontrealAI/proof-gradient",
                  "site": "https://montrealai.github.io/proof-gradient/",
                  "product": "Proof Gradient",
                  "canonical_line": "One agent tries. Proof decides. The network evolves.",
                  "doctrine": "No proof, no evolution. No eval, no propagation. No rollback, no release.",
                  "systems": [
                      {
                          "name": "Artifact Vault",
                          "promise": "stores reusable intelligence",
                          "status": "implemented as deterministic foundation",
                      },
                      {
                          "name": "Run Fabric",
                          "promise": "executes agents at scale",
                          "status": "implemented as deterministic mock runtime",
                      },
                      {
                          "name": "Proof Ledger",
                          "promise": "records what happened",
                          "status": "implemented as append-only proof record",
                      },
                      {
                          "name": "Selection Gate",
                          "promise": "promotes only what proved itself",
                          "status": "implemented as score, patch, canary, rollback record",
                      },
                  ],
                  "demo": {
                      "artifacts": [artifact.to_dict() for artifact in artifacts],
                      "run_contract": run["run_contract"],
                      "proof": proof,
                      "score": selected["score"],
                      "patch": selected["patch"],
                      "selection": selected["selection"],
                  },
              }
          ''')

          write("proof_gradient/cli.py", r'''
          import argparse
          import json
          from pathlib import Path

          from proof_gradient.foundation import build_foundation


          def main() -> None:
              parser = argparse.ArgumentParser(prog="proof-gradient")
              sub = parser.add_subparsers(dest="command", required=True)

              demo = sub.add_parser("demo", help="Run the deterministic Proof Gradient demo.")
              demo.add_argument("--out", default="", help="Optional JSON output path.")

              args = parser.parse_args()

              if args.command == "demo":
                  data = build_foundation()
                  text = json.dumps(data, indent=2, ensure_ascii=False)
                  if args.out:
                      output = Path(args.out)
                      output.parent.mkdir(parents=True, exist_ok=True)
                      output.write_text(text + "\n", encoding="utf-8")
                  else:
                      print(text)


          if __name__ == "__main__":
              main()
          ''')

          write("proof_gradient/__main__.py", """
          from proof_gradient.cli import main

          if __name__ == "__main__":
              main()
          """)

          write("proof_gradient/demo.py", """
          import json

          from proof_gradient.foundation import build_foundation


          def main() -> None:
              print(json.dumps(build_foundation(), indent=2, ensure_ascii=False))


          if __name__ == "__main__":
              main()
          """)

          write("tests/test_proof_gradient_foundation.py", r'''
          import unittest

          from proof_gradient.foundation import build_foundation


          class ProofGradientFoundationTest(unittest.TestCase):
              def setUp(self):
                  self.foundation = build_foundation()
                  self.demo = self.foundation["demo"]

              def test_four_promises_are_explicit(self):
                  promises = {system["name"]: system["promise"] for system in self.foundation["systems"]}
                  self.assertEqual(promises["Artifact Vault"], "stores reusable intelligence")
                  self.assertEqual(promises["Run Fabric"], "executes agents at scale")
                  self.assertEqual(promises["Proof Ledger"], "records what happened")
                  self.assertEqual(promises["Selection Gate"], "promotes only what proved itself")

              def test_artifact_vault_contains_reusable_intelligence(self):
                  artifact_types = {artifact["artifact_type"] for artifact in self.demo["artifacts"]}
                  self.assertIn("goal", artifact_types)
                  self.assertIn("plan", artifact_types)
                  self.assertIn("skill", artifact_types)
                  self.assertIn("tool", artifact_types)
                  self.assertIn("policy", artifact_types)
                  self.assertIn("eval", artifact_types)

              def test_run_fabric_resolves_artifacts(self):
                  contract = self.demo["run_contract"]
                  self.assertEqual(contract["direction"], "customer_response_goal@1.2.0")
                  self.assertEqual(contract["strategy"], "customer_response_plan@1.4.0")
                  self.assertIn("claim_verification_skill@1.8.0", contract["capabilities"])

              def test_proof_ledger_records_what_happened(self):
                  event_types = [event["event_type"] for event in self.demo["proof"]["trace_events"]]
                  self.assertIn("job_received", event_types)
                  self.assertIn("artifacts_resolved", event_types)
                  self.assertIn("eval_failed", event_types)
                  self.assertIn("credit_assigned", event_types)
                  self.assertIn("patch_proposed", event_types)

              def test_selection_gate_promotes_only_what_proved_itself(self):
                  score = self.demo["score"]
                  selection = self.demo["selection"]
                  self.assertTrue(score["passed"])
                  self.assertEqual(selection["decision"], "approve_canary")
                  self.assertEqual(selection["rollout_percentage"], 10)
                  self.assertEqual(selection["rollback_target"], "customer_response_plan@1.4.0")

              def test_patch_is_proof_backed_and_rollbackable(self):
                  patch = self.demo["patch"]
                  self.assertEqual(patch["patch_type"], "plan_patch")
                  self.assertEqual(patch["source_proof"], "proof_customer_refund_001")
                  self.assertEqual(patch["rollback_target"], "customer_response_plan@1.4.0")


          if __name__ == "__main__":
              unittest.main()
          ''')

          write("docs/proof_gradient_platform.md", """
          # Proof Gradient Platform

          **One agent tries. Proof decides. The network evolves.**

          ## The four systems

          - **The Artifact Vault stores reusable intelligence.**
          - **The Run Fabric executes agents at scale.**
          - **The Proof Ledger records what happened.**
          - **The Selection Gate promotes only what proved itself.**

          ## The simplified platform chain

          ```text
          Artifact → Run → Proof → Selection
          ```

          Everything that can improve is an Artifact. Every job creates a Run. Every Run creates Proof. Every Proof can create a candidate improvement. Every candidate improvement must pass Selection.

          ## Current implementation

          This autonomous foundation creates:

          - deterministic Artifact Vault
          - deterministic Run Fabric
          - append-only Proof Ledger record
          - Selection Gate record with score, credit assignment, patch, canary, and rollback
          - local demo
          - tests
          - schemas
          - public command center
          """)

          write("docs/artifact_vault.md", """
          # Artifact Vault

          **The Artifact Vault stores reusable intelligence.**

          Artifact types include:

          - goal
          - plan
          - skill
          - tool
          - policy
          - eval
          - rubric
          - context_recipe
          - routing_rule
          - approval_rule
          - release_rule

          Released artifacts must be immutable. Any improvement creates a new version.
          """)

          write("docs/run_fabric.md", """
          # Run Fabric

          **The Run Fabric executes agents at scale.**

          A run resolves active artifacts, creates a run contract, executes the deterministic or provider-backed runtime, and emits proof events.

          ```text
          Agents do not carry the whole network.
          They resolve active artifacts, run, and emit proof.
          ```
          """)

          write("docs/proof_ledger.md", """
          # Proof Ledger

          **The Proof Ledger records what happened.**

          Proof includes:

          - run contract
          - resolved artifact versions
          - trace events
          - model/tool/policy decisions
          - eval results
          - score
          - human feedback
          - credit assignment
          - candidate patches
          """)

          write("docs/selection_gate.md", """
          # Selection Gate

          **The Selection Gate promotes only what proved itself.**

          A candidate improvement must have:

          - source proof
          - typed patch
          - baseline comparison
          - eval evidence
          - approval
          - rollout scope
          - rollback target

          No eval, no propagation. No rollback, no release.
          """)

          write("docs/quickstart.md", """
          # Quickstart

          ## Run the demo

          ```bash
          python -m proof_gradient demo --out data/proof_gradient_foundation.json
          ```

          ## Run the tests

          ```bash
          python -m unittest tests/test_proof_gradient_foundation.py
          ```

          ## Open the public command center

          ```text
          https://montrealai.github.io/proof-gradient/
          ```
          """)

          write("docs/migration_from_skillos_v2.md", """
          # Migration from SkillOS v2.0.0

          Proof Gradient preserves the useful SkillOS DNA and generalizes it.

          | SkillOS concept | Proof Gradient concept |
          |---|---|
          | Skill | Artifact type: skill |
          | Skill version | Artifact version |
          | Skill release | Artifact release |
          | Skill trace | Proof Ledger trace |
          | Learning lesson | Proof-backed patch rationale |
          | Candidate skill | Candidate artifact version |
          | Eval result | Eval artifact + eval run + selection evidence |
          | Canary release | Selection Gate rollout |
          | Rollback planner | Mandatory rollback target |
          | Proof receipt | Proof Ledger record |
          | Public command center | Proof Gradient Command Center |
          """)

          write("docs/final_acceptance_report.md", """
          # Final Acceptance Report

          | Requirement | Implementation location | Tests | Remaining risk | Notes |
          |---|---|---|---|---|
          | Artifact Vault stores reusable intelligence | `proof_gradient/foundation.py` | `test_artifact_vault_contains_reusable_intelligence` | Needs durable database | Deterministic foundation |
          | Run Fabric executes agents at scale | `run_fabric()` | `test_run_fabric_resolves_artifacts` | Needs real worker pool | Mock runtime |
          | Proof Ledger records what happened | `proof_ledger()` | `test_proof_ledger_records_what_happened` | Needs append-only storage | Proof record modeled |
          | Selection Gate promotes only what proved itself | `selection_gate()` | `test_selection_gate_promotes_only_what_proved_itself` | Needs production rollout router | Canary + rollback modeled |
          """)

          write("schemas/artifact.schema.json", '''
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "title": "Proof Gradient Artifact",
            "type": "object",
            "required": ["artifact_id", "artifact_type", "name", "version", "state", "content", "checksum"],
            "properties": {
              "artifact_id": {"type": "string"},
              "artifact_type": {
                "enum": ["goal", "plan", "skill", "tool", "policy", "eval", "rubric", "context_recipe", "routing_rule", "approval_rule", "release_rule"]
              },
              "name": {"type": "string"},
              "version": {"type": "string"},
              "state": {
                "enum": ["draft", "candidate", "evaluated", "approved", "canary", "active", "paused", "deprecated", "rolled_back"]
              },
              "content": {"type": "object"},
              "checksum": {"type": "string"}
            }
          }
          ''')

          write("schemas/proof.schema.json", '''
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "title": "Proof Gradient Proof",
            "type": "object",
            "required": ["proof_id", "run_id", "run_contract", "trace_events", "output"],
            "properties": {
              "proof_id": {"type": "string"},
              "run_id": {"type": "string"},
              "run_contract": {"type": "object"},
              "trace_events": {"type": "array", "items": {"type": "object"}},
              "output": {"type": "object"}
            }
          }
          ''')

          write("schemas/patch.schema.json", '''
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "title": "Proof Gradient Patch",
            "type": "object",
            "required": ["patch_id", "patch_type", "target_artifact", "source_proof", "diff", "rollback_target"],
            "properties": {
              "patch_id": {"type": "string"},
              "patch_type": {
                "enum": ["goal_patch", "plan_patch", "skill_patch", "tool_patch", "policy_patch", "eval_patch", "context_patch", "routing_patch", "approval_patch", "release_rule_patch"]
              },
              "target_artifact": {"type": "string"},
              "source_proof": {"type": "string"},
              "diff": {"type": "object"},
              "rollback_target": {"type": "string"}
            }
          }
          ''')

          write("examples/customer_response_safety/job.json", '''
          {
            "job_id": "job_customer_refund_001",
            "prompt": "Draft a response to this angry customer asking for a refund.",
            "risk_class": "medium",
            "expected_behavior": [
              "draft only",
              "do not send externally",
              "do not promise refund without policy evidence",
              "check or ask for policy context"
            ]
          }
          ''')

          write("site/index.html", r'''
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Proof Gradient</title>
              <style>
                :root {
                  color-scheme: dark;
                  --text: #f7f8ff;
                  --muted: #aab3cf;
                  --line: rgba(255,255,255,.14);
                  --gold: #f4c76b;
                  --blue: #8ab4ff;
                  --green: #91f2bf;
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  background:
                    radial-gradient(circle at 15% 8%, rgba(138,180,255,.18), transparent 30%),
                    radial-gradient(circle at 85% 12%, rgba(244,199,107,.14), transparent 30%),
                    linear-gradient(180deg, #05070d 0%, #090d18 100%);
                  color: var(--text);
                  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }

                main {
                  width: min(1180px, calc(100% - 40px));
                  margin: 0 auto;
                  padding: 64px 0 80px;
                }

                .eyebrow {
                  color: var(--gold);
                  letter-spacing: .18em;
                  text-transform: uppercase;
                  font-size: 13px;
                  font-weight: 800;
                }

                h1 {
                  font-size: clamp(44px, 8vw, 104px);
                  line-height: .92;
                  margin: 18px 0 22px;
                  letter-spacing: -0.07em;
                }

                .tagline {
                  font-size: clamp(22px, 3vw, 38px);
                  line-height: 1.15;
                  margin: 0 0 28px;
                  max-width: 1030px;
                }

                .muted {
                  color: var(--muted);
                  font-size: 18px;
                  line-height: 1.65;
                  max-width: 860px;
                }

                .tabs {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 10px;
                  margin: 36px 0 24px;
                }

                button.tab {
                  border: 1px solid var(--line);
                  border-radius: 999px;
                  padding: 10px 14px;
                  background: rgba(255,255,255,.04);
                  color: var(--muted);
                  cursor: pointer;
                  font-weight: 700;
                }

                button.tab.active {
                  color: #05070d;
                  background: var(--gold);
                  border-color: var(--gold);
                }

                section.panel {
                  display: none;
                  border: 1px solid var(--line);
                  border-radius: 28px;
                  padding: 28px;
                  background: rgba(11,16,32,.76);
                  box-shadow: 0 24px 80px rgba(0,0,0,.24);
                }

                section.panel.active {
                  display: block;
                }

                h2 {
                  margin: 0 0 14px;
                  font-size: clamp(30px, 4vw, 56px);
                  letter-spacing: -0.05em;
                }

                .grid {
                  display: grid;
                  grid-template-columns: repeat(4, 1fr);
                  gap: 16px;
                  margin-top: 22px;
                }

                .card {
                  border: 1px solid var(--line);
                  border-radius: 20px;
                  padding: 20px;
                  background: rgba(255,255,255,.035);
                  min-height: 160px;
                }

                .card b {
                  display: block;
                  font-size: 20px;
                  margin-bottom: 10px;
                }

                .card p, li {
                  color: var(--muted);
                  line-height: 1.55;
                }

                pre {
                  overflow: auto;
                  padding: 18px;
                  border: 1px solid var(--line);
                  border-radius: 18px;
                  background: #070b14;
                  color: #dbe6ff;
                }

                .status {
                  display: inline-block;
                  border: 1px solid rgba(145,242,191,.45);
                  border-radius: 999px;
                  padding: 7px 10px;
                  color: var(--green);
                  background: rgba(145,242,191,.08);
                  font-weight: 800;
                  margin: 8px 0 18px;
                }

                .footer {
                  margin-top: 42px;
                  color: var(--muted);
                  font-size: 14px;
                }

                a {
                  color: var(--blue);
                }

                @media (max-width: 980px) {
                  .grid {
                    grid-template-columns: 1fr;
                  }

                  main {
                    padding: 42px 0;
                  }
                }
              </style>
            </head>

            <body>
              <main>
                <div class="eyebrow">Proof Gradient · The Agent Evolution Protocol</div>
                <h1>One agent tries.<br>Proof decides.<br>The network evolves.</h1>

                <p class="tagline">
                  GoalOS gives the network Direction. PlanOS gives it Strategy.
                  SkillOS gives it Capability. The Proof Gradient gives it Evolution.
                </p>

                <p class="muted">
                  Proof Gradient is the agent evolution protocol where every run leaves proof,
                  every proof selects intelligence, and every selected artifact evolves the network.
                </p>

                <nav class="tabs" aria-label="Proof Gradient tabs">
                  <button class="tab active" data-tab="command">Command Center</button>
                  <button class="tab" data-tab="vault">Artifact Vault</button>
                  <button class="tab" data-tab="fabric">Run Fabric</button>
                  <button class="tab" data-tab="ledger">Proof Ledger</button>
                  <button class="tab" data-tab="gate">Selection Gate</button>
                  <button class="tab" data-tab="evidence">Evidence</button>
                </nav>

                <section id="command" class="panel active">
                  <h2>Direction. Strategy. Capability. Evolution.</h2>
                  <span class="status">Autonomous foundation active</span>
                  <p class="muted">
                    The Artifact Vault stores reusable intelligence. The Run Fabric executes agents at scale.
                    The Proof Ledger records what happened. The Selection Gate promotes only what proved itself.
                  </p>
                  <div class="grid" id="systems"></div>
                </section>

                <section id="vault" class="panel">
                  <h2>Artifact Vault</h2>
                  <p class="muted">Everything that can improve is a versioned artifact.</p>
                  <div id="artifact-list" class="grid"></div>
                </section>

                <section id="fabric" class="panel">
                  <h2>Run Fabric</h2>
                  <p class="muted">The run resolves explicit artifact versions and executes the customer-response safety demo.</p>
                  <pre id="run-contract">Loading…</pre>
                </section>

                <section id="ledger" class="panel">
                  <h2>Proof Ledger</h2>
                  <p class="muted">Every run emits proof events.</p>
                  <pre id="trace-events">Loading…</pre>
                </section>

                <section id="gate" class="panel">
                  <h2>Selection Gate</h2>
                  <p class="muted">Only proof-backed artifacts earn selection, rollout, and rollback readiness.</p>
                  <pre id="selection">Loading…</pre>
                </section>

                <section id="evidence" class="panel">
                  <h2>Evidence</h2>
                  <p class="muted">No proof, no evolution. No eval, no propagation. No rollback, no release.</p>
                  <pre id="evidence-json">Loading…</pre>
                </section>

                <p class="footer">
                  Repository:
                  <a href="https://github.com/MontrealAI/proof-gradient">github.com/MontrealAI/proof-gradient</a>
                  · Live site:
                  <a href="https://montrealai.github.io/proof-gradient/">montrealai.github.io/proof-gradient</a>
                </p>
              </main>

              <script>
                const tabs = document.querySelectorAll(".tab");
                const panels = document.querySelectorAll(".panel");

                tabs.forEach(tab => {
                  tab.addEventListener("click", () => {
                    tabs.forEach(t => t.classList.remove("active"));
                    panels.forEach(p => p.classList.remove("active"));
                    tab.classList.add("active");
                    document.getElementById(tab.dataset.tab).classList.add("active");
                  });
                });

                fetch("./assets/proof-gradient-status.json")
                  .then(response => response.json())
                  .then(data => {
                    document.getElementById("systems").innerHTML = data.systems.map(system => `
                      <div class="card">
                        <b>${system.name}</b>
                        <p>${system.promise}.</p>
                        <p>${system.status}.</p>
                      </div>
                    `).join("");

                    const artifacts = data.demo.artifacts || [];
                    document.getElementById("artifact-list").innerHTML = artifacts.map(a => `
                      <div class="card">
                        <b>${a.artifact_type}: ${a.name}</b>
                        <p><strong>${a.artifact_id}@${a.version}</strong></p>
                        <p>${a.description}</p>
                      </div>
                    `).join("");

                    document.getElementById("run-contract").textContent =
                      JSON.stringify(data.demo.run_contract, null, 2);

                    document.getElementById("trace-events").textContent =
                      JSON.stringify(data.demo.proof.trace_events, null, 2);

                    document.getElementById("selection").textContent =
                      JSON.stringify({
                        score: data.demo.score,
                        patch: data.demo.patch,
                        selection: data.demo.selection
                      }, null, 2);

                    document.getElementById("evidence-json").textContent =
                      JSON.stringify({
                        generated_at: data.generated_at,
                        doctrine: data.doctrine,
                        repository: data.repository,
                        site: data.site
                      }, null, 2);
                  })
                  .catch(error => {
                    document.getElementById("evidence-json").textContent =
                      "Could not load proof-gradient-status.json: " + error;
                  });
              </script>
            </body>
          </html>
          ''')

          write("site/proof-gradient-command-center.html", """
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./index.html">
              <title>Proof Gradient Command Center</title>
            </head>
            <body>
              <p>Redirecting to <a href="./index.html">Proof Gradient Command Center</a>.</p>
            </body>
          </html>
          """)
          PY

      - name: Run tests and generate proof data
        run: |
          set -euo pipefail

          if [ -f proof_gradient/foundation.py ]; then
            python -m unittest tests/test_proof_gradient_foundation.py

            mkdir -p data
            mkdir -p site/assets

            python -m proof_gradient demo --out data/proof_gradient_foundation.json
            cp data/proof_gradient_foundation.json site/assets/proof-gradient-status.json

            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/proof_gradient_foundation.json").read_text())

          required = {
              "Artifact Vault": "stores reusable intelligence",
              "Run Fabric": "executes agents at scale",
              "Proof Ledger": "records what happened",
              "Selection Gate": "promotes only what proved itself",
          }

          promises = {system["name"]: system["promise"] for system in data["systems"]}

          for name, promise in required.items():
              actual = promises.get(name)
              if actual != promise:
                  raise SystemExit(f"{name} promise mismatch: expected {promise!r}, got {actual!r}")

          if data["demo"]["selection"]["decision"] != "approve_canary":
              raise SystemExit("Selection Gate did not approve canary.")

          if not data["demo"]["selection"]["rollback_target"]:
              raise SystemExit("Selection Gate has no rollback target.")

          print("Proof Gradient four-system guarantee verified.")
          PY
          else
            echo "No proof_gradient/foundation.py found yet. Deploying current static site only."
          fi

      - name: Commit generated foundation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-and-deploy' }}
        run: |
          set -euo pipefail

          git config user.name "proof-gradient-sovereign-loop"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Implement Proof Gradient sovereign foundation [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build clean Pages artifact
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist
          mkdir -p dist/assets

          if [ -f site/index.html ]; then
            cp site/index.html dist/index.html
          else
            cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Proof Gradient</title>
            </head>
            <body>
              <h1>One agent tries. Proof decides. The network evolves.</h1>
              <p>The Artifact Vault stores reusable intelligence.</p>
              <p>The Run Fabric executes agents at scale.</p>
              <p>The Proof Ledger records what happened.</p>
              <p>The Selection Gate promotes only what proved itself.</p>
            </body>
          </html>
          HTML
          fi

          if [ -f site/proof-gradient-command-center.html ]; then
            cp site/proof-gradient-command-center.html dist/proof-gradient-command-center.html
          else
            cp dist/index.html dist/proof-gradient-command-center.html
          fi

          if [ -f site/assets/proof-gradient-status.json ]; then
            cp site/assets/proof-gradient-status.json dist/assets/proof-gradient-status.json
          else
            cat > dist/assets/proof-gradient-status.json <<'JSON'
          {
            "generated_at": "not-yet-generated",
            "repository": "MontrealAI/proof-gradient",
            "site": "https://montrealai.github.io/proof-gradient/",
            "product": "Proof Gradient",
            "canonical_line": "One agent tries. Proof decides. The network evolves.",
            "doctrine": "No proof, no evolution. No eval, no propagation. No rollback, no release.",
            "systems": [
              {
                "name": "Artifact Vault",
                "promise": "stores reusable intelligence",
                "status": "fallback static site"
              },
              {
                "name": "Run Fabric",
                "promise": "executes agents at scale",
                "status": "fallback static site"
              },
              {
                "name": "Proof Ledger",
                "promise": "records what happened",
                "status": "fallback static site"
              },
              {
                "name": "Selection Gate",
                "promise": "promotes only what proved itself",
                "status": "fallback static site"
              }
            ],
            "demo": {
              "artifacts": [],
              "run_contract": {},
              "proof": {
                "trace_events": []
              },
              "score": {},
              "patch": {},
              "selection": {}
            }
          }
          JSON
          fi

          touch dist/.nojekyll

          echo "Published files:"
          find dist -maxdepth 3 -type f | sort

          echo "Checking final Pages artifact for stale SkillOS deployment URLs..."

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
            echo "Old SkillOS deployment URL found in final Pages artifact. Stopping."
            exit 1
          fi

          echo "Clean Proof Gradient Pages artifact is ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: |
          echo "Proof Gradient deployed to: ${{ steps.deployment.outputs.page_url }}"
