                  <circle cx="790" cy="240" r="58" fill="#8ab4ff" opacity=".20" stroke="#8ab4ff" stroke-width="3"/><text x="790" y="246" text-anchor="middle" fill="#f7f8ff" font-size="22" font-weight="700">Compute</text>
