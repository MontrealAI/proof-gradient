          def markdown_to_html(path: Path) -> str:
              text = path.read_text(encoding="utf-8", errors="ignore")
              out: list[str] = []
              in_code = False
              code_lines: list[str] = []

              for line in text.splitlines():
                  stripped = line.strip()

                  if stripped.startswith("```"):
                      if not in_code:
                          in_code = True
                          code_lines = []
                      else:
                          in_code = False
                          out.append("<pre>" + esc("\n".join(code_lines)) + "</pre>")
                      continue

                  if in_code:
                      code_lines.append(line)
                      continue

                  if stripped.startswith("# "):
                      out.append(f"<h1>{esc(stripped[2:])}</h1>")
                  elif stripped.startswith("## "):
                      out.append(f"<h2>{esc(stripped[3:])}</h2>")
                  elif stripped.startswith("### "):
                      out.append(f"<h3>{esc(stripped[4:])}</h3>")
                  elif stripped.startswith("- "):
                      out.append(f"<p>• {esc(stripped[2:])}</p>")
                  elif stripped:
                      out.append(f"<p>{esc(stripped)}</p>")

              return shell(path.stem.replace("_", " ").title(), "Proof Gradient · Docs", main_nav("../") + "".join(out))


