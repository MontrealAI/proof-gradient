name: Proof Gradient The Proof Loop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "proof_gradient/**"
      - "tests/**"
      - "site/**"
      - "docs/**"
      - "data/proofs/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: proof-gradient-the-proof-loop
  cancel-in-progress: true

jobs:
  proof-loop:
    name: Build, prove, archive, and deploy The Proof Loop
    runs-on: ubuntu-latest

    if: github.repository == 'MontrealAI/proof-gradient'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap The Proof Loop
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          from dataclasses import dataclass, asdict
          from datetime import datetime, timezone
          import argparse
          import hashlib
          import json
          import textwrap
          from typing import Any

          ROOT = Path(".")
          SITE_BASE = "https://montrealai.github.io/proof-gradient"

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")
              print(f"wrote {target}")

          if not (ROOT / "proof_gradient" / "__init__.py").exists():
              write("proof_gradient/__init__.py", '''
              """Proof Gradient.

              GoalOS gives Direction.
              PlanOS gives Strategy.
              SkillOS gives Capability.
              The Proof Gradient gives Evolution.
              """

              __version__ = "1.1.0"
              ''')

          write("README.md", """
          # Proof Gradient

          **Aim. Act. Prove. Evolve.**

          Proof Gradient is the Agent Evolution Protocol.

          GoalOS gives the network **Direction**.  
          PlanOS gives it **Strategy**.  
          SkillOS gives it **Capability**.  
          The Proof Gradient gives it **Evolution**.

          ## The Proof Loop

          ```text
          Aim → Act → Prove → Evolve
          ```

          ## The doctrine

          ```text
          Every agent acts.
          Every action leaves proof.
          Every proof earns improvement.
          Every improvement strengthens the network.
          ```

          ## The four systems

          | System | Promise |
          |---|---|
          | **Artifact Vault** | Stores reusable intelligence. |
          | **Run Fabric** | Executes agents at scale. |
          | **Proof Ledger** | Records what happened. |
          | **Selection Gate** | Promotes only what proved itself. |

          ## Current apex proof

          - Proof #11 — The Proof Loop

          Public command center:

          ```text
          https://montrealai.github.io/proof-gradient/
          ```
          """)

          write("proof_gradient/the_proof_loop.py", r'''
          from __future__ import annotations

          from dataclasses import dataclass, asdict
          from datetime import datetime, timezone
          import argparse
          import hashlib
          import json
          from pathlib import Path
          from typing import Any


          SITE_BASE = "https://montrealai.github.io/proof-gradient"


          def now() -> str:
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def digest(value: Any) -> str:
              payload = json.dumps(value, sort_keys=True, ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()


          @dataclass(frozen=True)
          class ProofPage:
              proof_id: str
              number: int
              slug: str
              title: str
              subtitle: str
              url: str
              json_url: str
              status: str
              summary: dict[str, Any]
              evidence: dict[str, Any]

              def to_dict(self) -> dict[str, Any]:
                  data = asdict(self)
                  data["checksum"] = digest({
                      "proof_id": self.proof_id,
                      "summary": self.summary,
                      "evidence": self.evidence,
