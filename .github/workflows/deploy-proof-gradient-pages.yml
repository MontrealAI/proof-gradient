                  <circle cx="500" cy="240" r="72" fill="#ffffff" opacity=".12" stroke="#ffffff" stroke-width="3"/><text x="500" y="246" text-anchor="middle" fill="#f7f8ff" font-size="22" font-weight="700">Proof</text>
