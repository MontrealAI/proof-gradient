    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: "Deploy GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "Show live URLs"
        run: |
          echo "Main: ${{ steps.deployment.outputs.page_url }}"
          echo "Production: ${{ steps.deployment.outputs.page_url }}production.html"
          echo "Proof Archive: ${{ steps.deployment.outputs.page_url }}proofs/"
          echo "Proof #11: ${{ steps.deployment.outputs.page_url }}proofs/011-the-proof-loop.html"
          echo "Evidence Index: ${{ steps.deployment.outputs.page_url }}assets/proof-index.json"
