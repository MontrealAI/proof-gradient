name: Proof Gradient Enterprise RSI Superorganism

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to do."
        required: true
        default: "bootstrap-and-deploy"
        type: choice
        options:
          - "bootstrap-and-deploy"
          - "deploy-only"

  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "proof_gradient/**"
      - "tests/**"
      - "site/**"
      - "docs/**"
      - "data/proofs/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: proof-gradient-enterprise-rsi-superorganism
  cancel-in-progress: true

jobs:
  enterprise-rsi-superorganism:
    name: Build, prove, archive, and deploy Enterprise RSI Superorganism
    runs-on: ubuntu-latest

    if: github.repository == 'MontrealAI/proof-gradient'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap Enterprise RSI Superorganism
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-and-deploy' }}
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import textwrap

          ROOT = Path(".")

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")
              print(f"wrote {target}")

          if not (ROOT / "proof_gradient" / "__init__.py").exists():
              write("proof_gradient/__init__.py", '''
              """Proof Gradient.

              GoalOS gives Direction.
              PlanOS gives Strategy.
              SkillOS gives Capability.
              The Proof Gradient gives Evolution.
              """

              __version__ = "0.6.0"
              ''')

          write("README.md", """
          # Proof Gradient

          **One agent tries. Proof decides. The network evolves.**

          Proof Gradient is the agent evolution protocol where every run leaves proof, every proof selects intelligence, and every selected artifact evolves the network.

          ## Canonical product truth

          GoalOS gives the network **Direction**.  
          PlanOS gives it **Strategy**.  
          SkillOS gives it **Capability**.  
          The Proof Gradient gives it **Evolution**.

          ## The four systems

          | System | Promise |
          |---|---|
          | **Artifact Vault** | Stores reusable intelligence. |
          | **Run Fabric** | Executes agents at scale. |
          | **Proof Ledger** | Records what happened. |
          | **Selection Gate** | Promotes only what proved itself. |

          ## Current proof archive

          - Proof #1 — Sovereign Swarm
          - Proof #2 — Evolution Tournament
          - Proof #3 — Recursive Evolution Ladder
          - Proof #4 — Corporate RSI Dominion
          - Proof #5 — Enterprise RSI Superorganism

          ## Proof #5 — Enterprise RSI Superorganism

          Enterprise RSI Superorganism elevates the proof from corporate-domain improvement to an enterprise-wide recursive operating system.

          It proves a deterministic AI-first corporate superorganism across:

          - revenue
          - margin
          - product
          - engineering
          - security
          - legal
          - finance
          - procurement
          - growth
          - talent
          - capital allocation
          - executive operations
          - data infrastructure
          - customer trust
          - platform operations
          - strategic partnerships

          It does **not** claim real revenue, guaranteed ROI, investment advice, actual deployed superintelligence, or Kardashev achievement.

          It proves the substrate:

          ```text
          artifact → run → proof → eval → credit assignment → patch → selection → canary → rollback → next recursive cycle
          ```

          ## Operating law

          ```text
          No proof, no evolution.
          No eval, no propagation.
          No rollback, no release.
          ```

          ## Public command center

          ```text
          https://montrealai.github.io/proof-gradient/
          ```
          """)

          write("proof_gradient/enterprise_rsi_superorganism.py", r'''
          from __future__ import annotations

          from dataclasses import dataclass, asdict
          from datetime import datetime, timezone
          import argparse
          import hashlib
          import json
          from pathlib import Path
          from typing import Any


          SITE_BASE = "https://montrealai.github.io/proof-gradient"


          def now() -> str:
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def sha256(value: Any) -> str:
              payload = json.dumps(value, sort_keys=True, ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()


          @dataclass(frozen=True)
          class ProofPage:
              proof_id: str
              number: int
              slug: str
              title: str
              subtitle: str
              url: str
              json_url: str
              status: str
              summary: dict[str, Any]
              evidence: dict[str, Any]

              def to_dict(self) -> dict[str, Any]:
                  data = asdict(self)
                  data["checksum"] = sha256({
                      "proof_id": self.proof_id,
                      "summary": self.summary,
                      "evidence": self.evidence,
                  })
                  return data


          def four_systems() -> list[dict[str, str]]:
              return [
                  {
                      "name": "Artifact Vault",
                      "promise": "stores reusable intelligence",
                      "meaning": "Versioned goals, plans, skills, tools, policies, evals, rubrics, context recipes, routing rules, approval rules, and release rules.",
                  },
                  {
                      "name": "Run Fabric",
                      "promise": "executes agents at scale",
                      "meaning": "Runs resolve active artifacts, create run contracts, execute deterministic or provider-backed agents, and emit trace events.",
                  },
                  {
                      "name": "Proof Ledger",
                      "promise": "records what happened",
                      "meaning": "Append-only evidence: traces, scores, evals, tool decisions, credit assignment, patches, canaries, and rollback drills.",
                  },
                  {
                      "name": "Selection Gate",
                      "promise": "promotes only what proved itself",
                      "meaning": "Candidates must beat baselines, pass safety gates, receive canary routing, and preserve rollback.",
                  },
              ]


          CORPORATE_DOMAINS = [
              {"slug": "enterprise_sales", "name": "Enterprise Sales", "lever": "pipeline velocity and win-rate discipline", "base": 100.0},
              {"slug": "revenue_operations", "name": "Revenue Operations", "lever": "forecast accuracy and routing efficiency", "base": 96.0},
              {"slug": "customer_success", "name": "Customer Success", "lever": "retention, expansion, and health-score response", "base": 92.0},
              {"slug": "support_operations", "name": "Support Operations", "lever": "case deflection and resolution quality", "base": 88.0},
              {"slug": "marketing_growth", "name": "Marketing Growth", "lever": "campaign conversion and message-market fit", "base": 86.0},
              {"slug": "brand_positioning", "name": "Brand Positioning", "lever": "category authority and narrative clarity", "base": 83.0},
              {"slug": "product_management", "name": "Product Management", "lever": "roadmap prioritization and customer value density", "base": 94.0},
              {"slug": "product_design", "name": "Product Design", "lever": "activation, usability, and trust formation", "base": 90.0},
              {"slug": "software_engineering", "name": "Software Engineering", "lever": "cycle time, reliability, and validated delivery", "base": 102.0},
              {"slug": "platform_infrastructure", "name": "Platform Infrastructure", "lever": "scalability, reliability, and cost efficiency", "base": 99.0},
              {"slug": "security_operations", "name": "Security Operations", "lever": "risk detection and incident response speed", "base": 98.0},
              {"slug": "trust_safety", "name": "Trust and Safety", "lever": "policy integrity and abuse resistance", "base": 91.0},
              {"slug": "finance_fpna", "name": "Finance and FP&A", "lever": "capital allocation and margin visibility", "base": 104.0},
              {"slug": "accounting_controls", "name": "Accounting Controls", "lever": "close accuracy and audit readiness", "base": 87.0},
              {"slug": "procurement", "name": "Procurement", "lever": "vendor leverage and spend optimization", "base": 82.0},
              {"slug": "legal_compliance", "name": "Legal and Compliance Ops", "lever": "contract velocity and policy safety", "base": 84.0},
              {"slug": "people_talent", "name": "People and Talent", "lever": "hiring throughput and performance systems", "base": 80.0},
              {"slug": "learning_enablement", "name": "Learning and Enablement", "lever": "organizational skill transfer", "base": 78.0},
