                      proof4 = (site / "proofs" / "004-corporate-rsi-dominion.html").read_text(encoding="utf-8")
                      self.assertIn("../", proof4)
                      self.assertIn("Proof Archive", proof4)


          if __name__ == "__main__":
              unittest.main()
          ''')

