          - Python
          - FastAPI
          - SQLAlchemy
          - Alembic
          - SQLite local mode
          - Postgres production mode
          - Typer CLI
          - Docker Compose
          - GitHub Actions CI

          ## Core invariant

          No proof, no evolution. No eval, no propagation. No rollback, no release.
