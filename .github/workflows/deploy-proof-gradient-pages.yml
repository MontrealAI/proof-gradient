            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/proof_gradient_foundation.json").read_text())

          required = {
              "Artifact Vault": "stores reusable intelligence",
              "Run Fabric": "executes agents at scale",
              "Proof Ledger": "records what happened",
              "Selection Gate": "promotes only what proved itself",
          }

          promises = {system["name"]: system["promise"] for system in data["systems"]}

          for name, promise in required.items():
              actual = promises.get(name)
              if actual != promise:
                  raise SystemExit(f"{name} promise mismatch: expected {promise!r}, got {actual!r}")

          swarm = data["demo"]["swarm"]

          if swarm["agent_count"] < 64:
              raise SystemExit("Large multi-agent system proof failed: fewer than 64 agents.")

          if swarm["division_count"] < 8:
              raise SystemExit("Multi-agent coordination proof failed: fewer than 8 divisions.")

          if swarm["coordination_verdict"] != "large_multi_agent_coordination_proven_deterministically":
              raise SystemExit("Coordination verdict missing.")

          if data["demo"]["proof"]["output"]["claim_status"] != "strategic_scenario_not_empirical_claim":
              raise SystemExit("Kardashev/superintelligence claim boundary failed.")

          if data["demo"]["selection"]["decision"] != "approve_canary":
              raise SystemExit("Selection Gate did not approve canary.")

          if not data["demo"]["selection"]["rollback_target"]:
              raise SystemExit("Selection Gate has no rollback target.")

          print("Proof Gradient four-system guarantee verified.")
          print("Large multi-agent Sovereign Swarm coordination verified.")
          print("Civilization-scale thesis correctly labeled as scenario, not empirical claim.")
