          write("scripts/security_review.py", """
          from pathlib import Path
          import sys

          FORBIDDEN = [
              "guaranteed ROI",
              "guaranteed profit",
              "achieved Kardashev Type II",
              "real superintelligence achieved",
              "private data shared automatically",
          ]

          scanned = []
          failures = []

          for path in list(Path("docs").rglob("*.md")) + list(Path("site").rglob("*.html")) + [Path("README.md")]:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              scanned.append(str(path))
              for phrase in FORBIDDEN:
                  if phrase.lower() in text.lower():
                      failures.append((str(path), phrase))

          if failures:
              for path, phrase in failures:
                  print(f"FORBIDDEN CLAIM: {phrase!r} in {path}")
              sys.exit(1)

          print(f"security review passed; scanned {len(scanned)} public files")
          """)

