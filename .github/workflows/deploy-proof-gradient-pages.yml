name: Deploy Proof Gradient Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "site/index.html"
      - "site/proof-gradient-command-center.html"
      - "site/assets/proof-gradient-status.json"
      - "README.md"
      - "docs/**"
      - "data/proof_gradient_foundation.json"
      - "badges/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build clean Proof Gradient site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean static site
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist
          mkdir -p dist/assets

          echo "Building a clean Proof Gradient Pages artifact."
          echo "Important: legacy site/data files are intentionally NOT copied."

          if [ -f site/index.html ]; then
            cp site/index.html dist/index.html
          else
            cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Proof Gradient</title>
              <style>
                :root {
                  color-scheme: dark;
                  --bg: #05070d;
                  --text: #f7f8ff;
                  --muted: #aab3cf;
                  --gold: #f4c76b;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  background:
                    radial-gradient(circle at 20% 10%, rgba(138,180,255,.18), transparent 30%),
                    radial-gradient(circle at 80% 20%, rgba(244,199,107,.14), transparent 28%),
                    linear-gradient(180deg, #05070d 0%, #090d18 100%);
                  color: var(--text);
                  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }

                main {
                  width: min(1100px, calc(100% - 40px));
                  margin: 0 auto;
                  padding: 80px 0;
                }

                .eyebrow {
                  color: var(--gold);
                  letter-spacing: .18em;
                  text-transform: uppercase;
                  font-size: 13px;
                  font-weight: 800;
                }

                h1 {
                  font-size: clamp(42px, 8vw, 96px);
                  line-height: .92;
                  letter-spacing: -0.06em;
                  margin: 18px 0 22px;
                }

                p {
                  color: var(--muted);
                  font-size: 20px;
                  line-height: 1.6;
                  max-width: 820px;
                }
              </style>
            </head>
            <body>
              <main>
                <div class="eyebrow">Proof Gradient · The Agent Evolution Protocol</div>
                <h1>One agent tries.<br>Proof decides.<br>The network evolves.</h1>
                <p>
                  GoalOS gives the network Direction. PlanOS gives it Strategy.
                  SkillOS gives it Capability. The Proof Gradient gives it Evolution.
                </p>
                <p>
                  The Artifact Vault stores reusable intelligence.
                  The Run Fabric executes agents at scale.
                  The Proof Ledger records what happened.
                  The Selection Gate promotes only what proved itself.
                </p>
              </main>
            </body>
          </html>
          HTML
          fi

          if [ -f site/proof-gradient-command-center.html ]; then
            cp site/proof-gradient-command-center.html dist/proof-gradient-command-center.html
          else
            cp dist/index.html dist/proof-gradient-command-center.html
          fi

          if [ -f site/assets/proof-gradient-status.json ]; then
            cp site/assets/proof-gradient-status.json dist/assets/proof-gradient-status.json
          else
            cat > dist/assets/proof-gradient-status.json <<'JSON'
          {
            "generated_at": "not-yet-generated",
            "repository": "MontrealAI/proof-gradient",
            "site": "https://montrealai.github.io/proof-gradient/",
            "product": "Proof Gradient",
            "canonical_line": "One agent tries. Proof decides. The network evolves.",
            "doctrine": "No proof, no evolution. No eval, no propagation. No rollback, no release.",
            "vertical_slice": {
              "domain": "Customer response safety",
              "job": "Draft a response to this angry customer asking for a refund.",
              "flow": [
                "Job arrives",
                "Direction artifact resolved",
                "Strategy artifact resolved",
                "Capability artifacts resolved",
                "Run Fabric executes",
                "Proof Ledger records trace events",
                "Eval catches unsupported refund promise",
                "Score assigns credit",
                "Patch is generated",
                "Candidate is evaluated against baseline",
                "Selection Gate approves canary",
                "Rollback target is recorded"
              ]
            },
            "implementation_note": "Fallback status file. Run Proof Gradient Autonomous Foundation to generate full demo data.",
            "demo": {
              "artifacts": [],
              "run_contract": {},
              "proof": {
                "trace_events": []
              },
              "score": {},
              "patch": {},
              "selection": {}
            }
          }
          JSON
          fi

          touch dist/.nojekyll

          echo "Published files:"
          find dist -maxdepth 3 -type f | sort

          echo "Checking the final published artifact for stale SkillOS deployment URLs..."

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
            echo "Old SkillOS deployment URL found in final Pages artifact. Stopping."
            exit 1
          fi

          echo "Clean Proof Gradient Pages artifact is ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy Proof Gradient Command Center
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: |
          echo "Proof Gradient deployed to: ${{ steps.deployment.outputs.page_url }}"
