      - name: Commit Proof Archive
        run: |
          set -euo pipefail

          git config user.name "proof-gradient-proof-archive"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Add Proof Gradient Proof Archive [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build clean Pages artifact
        run: |
          set -euo pipefail

          rm -rf dist
