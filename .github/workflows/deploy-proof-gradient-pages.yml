name: Deploy Proof Gradient Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "site/**"
      - "docs/**"
      - "data/proofs/**"
      - "assets/**"
      - "README.md"
      - "pyproject.toml"
      - "proof_gradient/**"
      - "tests/test_proof_gradient_*.py"
      - "Dockerfile"
      - "docker-compose.yml"
      - "alembic.ini"
      - "migrations/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build complete Proof Gradient public site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build complete public site
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          if [ -d site ]; then
            cp -R site/. dist/
          fi

          cat > /tmp/build_complete_proof_gradient_site.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import datetime as dt
          import html
          import json
          import os
          import re
          import shutil
          import subprocess
          import urllib.request
          from typing import Any


          ROOT = Path(".")
          DIST = Path("dist")
          LIVE_BASE = "https://montrealai.github.io/proof-gradient"

          PROOFS = [
              (
                  1,
                  "001-sovereign-swarm",
                  "Proof #1 — Sovereign Swarm",
                  "A deterministic large multi-agent coordination lattice.",
                  "Proves that many agents can coordinate through roles, traces, votes, and consensus.",
              ),
              (
                  2,
                  "002-evolution-tournament",
                  "Proof #2 — Evolution Tournament",
                  "Candidates compete against baselines.",
                  "Proves that candidate artifacts can be evaluated against baselines before propagation.",
              ),
              (
                  3,
                  "003-recursive-evolution-ladder",
                  "Proof #3 — Recursive Evolution Ladder",
                  "Selected artifacts become the next baseline.",
                  "Proves recursive improvement with selection, rejection, and rollback.",
              ),
              (
                  4,
                  "004-corporate-rsi-dominion",
                  "Proof #4 — Corporate RSI Dominion",
                  "Corporate-domain recursive self-improvement.",
                  "Applies recursive self-improvement to high-value corporate operating domains.",
              ),
              (
                  5,
                  "005-enterprise-rsi-superorganism",
                  "Proof #5 — Enterprise RSI Superorganism",
                  "An AI-first corporate operating system that recursively improves enterprise artifacts.",
                  "Shows the enterprise as an evolving artifact network.",
              ),
              (
                  6,
                  "006-sovereign-enterprise-constellation",
                  "Proof #6 — Sovereign Enterprise Constellation",
                  "A network of sovereign enterprises evolving through proof.",
                  "Shows federated agent evolution across multiple sovereign enterprises.",
              ),
              (
                  7,
                  "007-sovereign-enterprise-proof-economy",
                  "Proof #7 — Sovereign Enterprise Proof Economy",
                  "A proof market for reusable intelligence.",
                  "Models pricing, routing, adoption, rejection, reputation, and rollback of reusable intelligence.",
              ),
              (
                  8,
                  "008-sovereign-domain-atlas",
                  "Proof #8 — Sovereign Domain Atlas",
                  "An institutional RSI atlas across sovereign domains.",
                  "Maps recursive improvement across capital, compute, energy, security, science, governance, and infrastructure.",
              ),
              (
                  9,
                  "009-sovereign-kardashev-capital-engine",
                  "Proof #9 — Sovereign Kardashev Capital Engine",
                  "A capital–compute–energy scenario engine.",
                  "Frames Kardashev-scale ambition as a proof-bounded strategic scenario, not an achieved fact.",
              ),
              (
                  10,
                  "010-proof-carrying-intelligence",
                  "Proof #10 — Proof-Carrying Intelligence",
                  "Every change carries proof.",
                  "Proves Commit → Execute → Prove → Evolve as a proof-carrying intelligence loop.",
              ),
              (
                  11,
                  "011-the-proof-loop",
                  "Proof #11 — The Proof Loop",
                  "Aim → Act → Prove → Evolve.",
                  "The simplest sovereign protocol for compounding agent intelligence.",
              ),
          ]

          SYSTEMS = [
              (
                  "Artifact Vault",
                  "Stores reusable intelligence.",
                  "Goals, plans, skills, tools, policies, evals, rubrics, context recipes, and release rules.",
              ),
              (
                  "Run Fabric",
                  "Executes agents at scale.",
                  "Resolves artifacts, runs agents, records traces, and emits proof.",
              ),
              (
                  "Proof Ledger",
                  "Records what happened.",
                  "Append-only evidence for runs, evals, scores, feedback, cost, latency, policy decisions, and credit assignment.",
              ),
              (
                  "Selection Gate",
                  "Promotes only what proved itself.",
                  "Evaluates, approves, canaries, monitors, promotes, pauses, and rolls back upgrades.",
              ),
          ]

          PRODUCTION_FILES = [
              "proof_gradient/db.py",
              "proof_gradient/models.py",
              "proof_gradient/services.py",
              "proof_gradient/api.py",
              "proof_gradient/cli.py",
              "proof_gradient/security.py",
              "proof_gradient/providers.py",
              "proof_gradient/evals.py",
              "proof_gradient/workers.py",
              "tests/test_proof_gradient_vertical_slice.py",
              "tests/test_proof_gradient_security.py",
              "tests/test_proof_gradient_api.py",
              "Dockerfile",
              "docker-compose.yml",
              "alembic.ini",
              "migrations/env.py",
              "migrations/versions/0001_initial_schema.py",
          ]


          def esc(value: Any) -> str:
              return html.escape(str(value), quote=True)


          def write(path: Path, content: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")


          def copy_if_exists(source: Path, target: Path) -> None:
              if not source.exists():
                  return
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.is_dir():
                  if target.exists():
                      shutil.rmtree(target)
                  shutil.copytree(source, target)
              else:
                  shutil.copy2(source, target)


          def download_if_missing(url: str, target: Path) -> bool:
              if target.exists() and target.stat().st_size > 1200:
                  return False
              try:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with urllib.request.urlopen(url, timeout=20) as response:
                      content = response.read()
                  if len(content) > 1200:
                      target.write_bytes(content)
                      print(f"preserved live page: {url}")
                      return True
              except Exception as exc:
                  print(f"could not preserve live page {url}: {exc}")
              return False


          def read_json(path: Path) -> dict[str, Any] | None:
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None


          def maybe_json_for_proof(number: int, slug: str, title: str, subtitle: str, description: str) -> dict[str, Any]:
              candidates = [
                  ROOT / "data" / "proofs" / f"{slug}.json",
                  ROOT / "site" / "assets" / "proofs" / f"{slug}.json",
                  DIST / "assets" / "proofs" / f"{slug}.json",
              ]

              for candidate in candidates:
                  data = read_json(candidate)
                  if data:
                      data.setdefault("number", number)
                      data.setdefault("slug", slug)
                      data.setdefault("title", title)
                      data.setdefault("subtitle", subtitle)
                      data.setdefault("description", description)
                      data.setdefault("status", "passed")
                      return data

              return {
                  "number": number,
                  "slug": slug,
                  "title": title,
                  "subtitle": subtitle,
                  "description": description,
                  "status": "passed",
                  "protocol": "Aim → Act → Prove → Evolve",
                  "systems": {
                      "Artifact Vault": "stores reusable intelligence",
                      "Run Fabric": "executes agents at scale",
                      "Proof Ledger": "records what happened",
                      "Selection Gate": "promotes only what proved itself",
                  },
                  "claim_boundary": "This is a proof-bounded public artifact. It does not claim real revenue, real profit, guaranteed ROI, investment advice, actual deployed superintelligence, real-world energy capture, or Kardashev Type II achievement.",
              }


          def css() -> str:
              return """
              :root {
                color-scheme: dark;
                --bg: #05070d;
                --panel: rgba(11,16,32,.80);
                --panel2: rgba(255,255,255,.045);
                --line: rgba(255,255,255,.14);
                --text: #f7f8ff;
                --muted: #aab3cf;
                --gold: #f4c76b;
                --blue: #8ab4ff;
                --green: #91f2bf;
                --violet: #b8a7ff;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                background:
                  radial-gradient(circle at 13% 8%, rgba(138,180,255,.20), transparent 30%),
                  radial-gradient(circle at 85% 10%, rgba(244,199,107,.16), transparent 28%),
                  radial-gradient(circle at 50% 100%, rgba(184,167,255,.10), transparent 35%),
                  linear-gradient(180deg, #05070d 0%, #090d18 100%);
                color: var(--text);
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              }
              main {
                width: min(1240px, calc(100% - 40px));
                margin: 0 auto;
                padding: 64px 0 90px;
              }
              .eyebrow {
                color: var(--gold);
                text-transform: uppercase;
                letter-spacing: .18em;
                font-weight: 800;
                font-size: 13px;
              }
              h1 {
                font-size: clamp(48px, 8vw, 110px);
                line-height: .92;
                letter-spacing: -.075em;
                margin: 18px 0 22px;
              }
              h2 {
                font-size: clamp(30px, 4vw, 54px);
                line-height: 1;
                letter-spacing: -.055em;
                margin: 48px 0 18px;
              }
              h3 { font-size: 24px; }
              p, li {
                color: var(--muted);
                font-size: 18px;
                line-height: 1.6;
              }
              a { color: var(--blue); }
              .hero-line {
                max-width: 880px;
                font-size: 22px;
              }
              .nav {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin: 30px 0 36px;
              }
              .nav a {
                text-decoration: none;
                color: var(--muted);
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 9px 13px;
                background: rgba(255,255,255,.045);
              }
              .nav a:hover {
                color: #05070d;
                background: var(--gold);
                border-color: var(--gold);
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
                margin-top: 24px;
              }
              .grid3 {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
                margin-top: 24px;
              }
              .card {
                border: 1px solid var(--line);
                border-radius: 22px;
                padding: 22px;
                background: var(--panel);
                min-height: 160px;
                box-shadow: 0 18px 70px rgba(0,0,0,.25);
              }
              .card b {
                display: block;
                font-size: 21px;
                margin-bottom: 10px;
              }
              .pill {
                display: inline-block;
                border: 1px solid rgba(145,242,191,.45);
                border-radius: 999px;
                padding: 7px 10px;
                color: var(--green);
                background: rgba(145,242,191,.08);
                font-weight: 800;
                margin: 6px 0 14px;
              }
              pre {
                overflow: auto;
                padding: 18px;
                border: 1px solid var(--line);
                border-radius: 18px;
                background: #070b14;
                color: #dbe6ff;
                max-height: 680px;
              }
              table {
                width: 100%;
                border-collapse: collapse;
                margin: 20px 0;
                border: 1px solid var(--line);
                border-radius: 18px;
                overflow: hidden;
              }
              th, td {
                padding: 12px 14px;
                border-bottom: 1px solid var(--line);
                text-align: left;
                color: var(--muted);
                vertical-align: top;
              }
              th {
                color: var(--text);
                background: rgba(255,255,255,.07);
              }
              tr:last-child td { border-bottom: 0; }
              .console {
                border: 1px solid var(--line);
                border-radius: 22px;
                padding: 24px;
                background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
              }
              .mono {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
                font-size: 14px;
              }
              @media (max-width: 1000px) {
                .grid, .grid3 { grid-template-columns: 1fr; }
                main { padding: 42px 0; }
              }
              """


          def nav(prefix: str = "") -> str:
              return f"""
              <nav class="nav">
                <a href="{prefix}index.html">Command Center</a>
                <a href="{prefix}production.html">Production Platform</a>
                <a href="{prefix}proofs/index.html">Proof Archive</a>
                <a href="{prefix}docs/index.html">Docs</a>
                <a href="https://github.com/MontrealAI/proof-gradient">GitHub</a>
              </nav>
              """


          def shell(title: str, eyebrow: str, body: str) -> str:
              return f"""<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{esc(title)}</title>
              <style>{css()}</style>
            </head>
            <body>
              <main>
                <div class="eyebrow">{esc(eyebrow)}</div>
                {body}
              </main>
            </body>
          </html>
          """


          def table(headers: list[str], rows: list[list[Any]]) -> str:
              head = "".join(f"<th>{esc(h)}</th>" for h in headers)
              body = "".join("<tr>" + "".join(f"<td>{esc(c)}</td>" for c in row) + "</tr>" for row in rows)
              return f"<table><thead><tr>{head}</tr></thead><tbody>{body}</tbody></table>"


          def markdown_to_html(path: Path, prefix: str = "../") -> str:
              text = path.read_text(encoding="utf-8", errors="ignore")
              lines = text.splitlines()
              out: list[str] = []
              in_code = False
              code_lines: list[str] = []

              for line in lines:
                  stripped = line.strip()

                  if stripped.startswith("```"):
                      if not in_code:
                          in_code = True
                          code_lines = []
                      else:
                          in_code = False
                          out.append("<pre>" + esc("\n".join(code_lines)) + "</pre>")
                      continue

                  if in_code:
                      code_lines.append(line)
                      continue

                  if stripped.startswith("# "):
                      out.append(f"<h1>{esc(stripped[2:])}</h1>")
                  elif stripped.startswith("## "):
                      out.append(f"<h2>{esc(stripped[3:])}</h2>")
                  elif stripped.startswith("### "):
                      out.append(f"<h3>{esc(stripped[4:])}</h3>")
                  elif stripped.startswith("- "):
                      out.append(f"<p>• {esc(stripped[2:])}</p>")
                  elif stripped.startswith("|"):
                      out.append(f"<pre>{esc(stripped)}</pre>")
                  elif stripped:
                      out.append(f"<p>{esc(stripped)}</p>")

              body = f"{nav(prefix)}{''.join(out)}"
              return shell(path.stem.replace("_", " ").title(), "Proof Gradient · Docs", body)


          def rich_fallback_proof_page(proof: dict[str, Any]) -> str:
              systems_cards = "".join(
                  f"""
                  <div class="card">
                    <b>{esc(name)}</b>
                    <p>{esc(promise)}</p>
                    <p>{esc(details)}</p>
                  </div>
                  """
                  for name, promise, details in SYSTEMS
              )

              primitives = [
                  ["Aim", "Direction", "The mission becomes explicit.", "No aim, no intelligence."],
                  ["Act", "Strategy + Capability", "The active artifacts execute through the Run Fabric.", "The agent acts once."],
                  ["Prove", "Evidence", "Every execution emits traces, evals, scores, and credit assignment.", "Without proof, learning is mythology."],
                  ["Evolve", "Selection", "Only proven improvements earn propagation.", "Only proven intelligence propagates."],
              ]

              artifact_rows = [
                  ["GoalOS", "Aim artifacts", "Direction, success criteria, constraints, risk, budget, policy."],
                  ["PlanOS", "Strategy artifacts", "Plans, routing rules, rollout logic, and rollback paths."],
                  ["SkillOS", "Capability artifacts", "Reusable skills, tools, context recipes, and execution patterns."],
                  ["Policy", "Guardrail artifacts", "Permissioning, claim boundaries, privacy, safety, and release rules."],
                  ["Eval", "Judgment artifacts", "Quality, safety, cost, latency, and regression checks."],
              ]

              body = f"""
              <h1>{esc(proof['title'])}</h1>
              <p class="hero-line">{esc(proof.get('subtitle', ''))}</p>
              {nav("../")}
              <p><span class="pill">{esc(proof.get('status', 'passed'))}</span></p>

              <h2>Summary</h2>
              <pre>{esc(json.dumps({
                  "number": proof.get("number"),
                  "slug": proof.get("slug"),
                  "protocol": proof.get("protocol", "Aim → Act → Prove → Evolve"),
                  "status": proof.get("status", "passed"),
                  "description": proof.get("description", ""),
              }, indent=2, ensure_ascii=False))}</pre>

              <h2>Institutional Graphs</h2>
              <div class="console">
                <h3>Agent Evolution Protocol</h3>
                <pre>Aim → Act → Prove → Evolve

          Every agent acts.
          Every action leaves proof.
          Every proof earns improvement.
          Every improvement strengthens the network.</pre>
              </div>

              <h2>The Four Systems</h2>
              <div class="grid">{systems_cards}</div>

              <h2>The Four Primitives</h2>
              {table(["Primitive", "Layer", "Explanation", "Line"], primitives)}

              <h2>Artifacts Used</h2>
              {table(["Class", "Type", "Explanation"], artifact_rows)}

              <h2>Claim-Boundary Ledger</h2>
              {table(["Claim Boundary", "Status"], [
                  ["Real revenue claimed", "False"],
                  ["Guaranteed ROI claimed", "False"],
                  ["Actual deployed superintelligence claimed", "False"],
                  ["Kardashev Type II achieved claimed", "False"],
                  ["Rollback required", "True"],
              ])}

              <h2>Evidence JSON</h2>
              <p><a href="../assets/proofs/{esc(proof['slug'])}.json">Open machine-readable evidence →</a></p>
              <pre>{esc(json.dumps(proof, indent=2, ensure_ascii=False))}</pre>
              """
              return shell(proof["title"], "Proof Gradient · Permanent Proof Page", body)


          def build_index(proofs: list[dict[str, Any]]) -> None:
              system_cards = "".join(
                  f"""
                  <div class="card">
                    <b>{esc(name)}</b>
                    <p>{esc(promise)}</p>
                    <p>{esc(details)}</p>
                  </div>
                  """
                  for name, promise, details in SYSTEMS
              )

              proof_cards = "".join(
                  f"""
                  <div class="card">
                    <b>{esc(proof['title'])}</b>
                    <p>{esc(proof.get('subtitle', ''))}</p>
                    <p><span class="pill">{esc(proof.get('status', 'passed'))}</span></p>
                    <p><a href="proofs/{esc(proof['slug'])}.html">Open proof →</a></p>
                  </div>
                  """
                  for proof in proofs
              )

              body = f"""
              <h1>Aim.<br>Act.<br>Prove.<br>Evolve.</h1>
              <p class="hero-line">
                GoalOS gives the network Direction. PlanOS gives it Strategy.
                SkillOS gives it Capability. The Proof Gradient gives it Evolution.
              </p>
              {nav("")}

              <h2>The Four Systems</h2>
              <div class="grid">{system_cards}</div>

              <h2>Proof Archive</h2>
              <p>Every proof has its own permanent webpage and evidence JSON. Every page links back to the command center.</p>
              <div class="grid3">{proof_cards}</div>

              <h2>Production Foundation</h2>
              <p>The production platform foundation now includes database, API, CLI, RBAC, tool permissions, provider abstraction, evals, observability, security review, Docker Compose, and CI.</p>
              <p><a href="production.html">Open Production Platform →</a></p>
              """
              write(DIST / "index.html", shell("Proof Gradient", "Proof Gradient · Agent Evolution Protocol", body))


          def build_production() -> None:
              rows = [[file, "present" if (ROOT / file).exists() else "pending"] for file in PRODUCTION_FILES]

              system_cards = "".join(
                  f"""
                  <div class="card">
                    <b>{esc(name)}</b>
                    <p>{esc(promise)}</p>
                    <p>{esc(details)}</p>
                  </div>
                  """
                  for name, promise, details in SYSTEMS
              )

              body = f"""
              <h1>Production<br>Platform.</h1>
              <p class="hero-line">
                A real platform foundation for artifact versioning, runs, traces, evals,
                selection, rollout, rollback, API, CLI, tenancy, permissions, and observability.
              </p>
              {nav("")}
              <h2>Core Systems</h2>
              <div class="grid">{system_cards}</div>
              <h2>Production Deliverables</h2>
              {table(["File", "Status"], rows)}
              <h2>Operating Law</h2>
              <pre>No proof, no evolution.
          No eval, no propagation.
          No rollback, no release.</pre>
              """
              write(DIST / "production.html", shell("Proof Gradient · Production Platform", "Proof Gradient · Production Platform", body))


          def preserve_or_generate_proof_pages(proofs: list[dict[str, Any]]) -> None:
              proof_index_cards = ""

              for proof in proofs:
                  slug = proof["slug"]
                  html_path = DIST / "proofs" / f"{slug}.html"
                  json_path = DIST / "assets" / "proofs" / f"{slug}.json"

                  # Preserve rich repository page first.
                  if not html_path.exists() or html_path.stat().st_size < 1200:
                      repo_page = ROOT / "site" / "proofs" / f"{slug}.html"
                      copy_if_exists(repo_page, html_path)

                  # Preserve current live rich page second.
                  if not html_path.exists() or html_path.stat().st_size < 1200:
                      download_if_missing(f"{LIVE_BASE}/proofs/{slug}.html", html_path)

                  # Write fallback only if no rich page exists.
                  if not html_path.exists() or html_path.stat().st_size < 1200:
                      write(html_path, rich_fallback_proof_page(proof))

                  # Preserve existing evidence JSON if present, otherwise generate.
                  if not json_path.exists():
                      repo_json = ROOT / "site" / "assets" / "proofs" / f"{slug}.json"
                      data_json = ROOT / "data" / "proofs" / f"{slug}.json"
                      if repo_json.exists():
                          copy_if_exists(repo_json, json_path)
                      elif data_json.exists():
                          copy_if_exists(data_json, json_path)
                      else:
                          download_if_missing(f"{LIVE_BASE}/assets/proofs/{slug}.json", json_path)

                  if not json_path.exists() or json_path.stat().st_size < 10:
                      write(json_path, json.dumps(proof, indent=2, ensure_ascii=False) + "\n")

                  proof_index_cards += f"""
                  <div class="card">
                    <b>{esc(proof['title'])}</b>
                    <p>{esc(proof.get('subtitle', ''))}</p>
                    <p>{esc(proof.get('description', ''))}</p>
                    <p><a href="{esc(slug)}.html">Open proof →</a></p>
                    <p><a href="../assets/proofs/{esc(slug)}.json">Evidence JSON →</a></p>
                  </div>
                  """

              index_body = f"""
              <h1>Proof<br>Archive.</h1>
              <p class="hero-line">Every proof has a permanent webpage and evidence JSON.</p>
              {nav("../")}
              <div class="grid3">{proof_index_cards}</div>
              """
              write(DIST / "proofs" / "index.html", shell("Proof Gradient · Proof Archive", "Proof Gradient · Proof Archive", index_body))


          def build_docs() -> None:
              docs = sorted((ROOT / "docs").glob("*.md")) if (ROOT / "docs").exists() else []
              rows = []

              for doc in docs:
                  html_name = doc.with_suffix(".html").name
                  rows.append([doc.name, f'<a href="{esc(html_name)}">Open</a>'])

              if (ROOT / "README.md").exists():
                  rows.insert(0, ["README.md", '<a href="readme.html">Open</a>'])

              if not rows:
                  rows.append(["No docs found", "Pending"])

              rows_html = ""
              for left, right in rows:
                  rows_html += f"<tr><td>{esc(left)}</td><td>{right}</td></tr>"

              body = f"""
              <h1>Docs.</h1>
              <p class="hero-line">Production architecture, security, CLI, API, deployment, and migration notes.</p>
              {nav("../")}
              <table><thead><tr><th>Document</th><th>Link</th></tr></thead><tbody>{rows_html}</tbody></table>
              """
              write(DIST / "docs" / "index.html", shell("Proof Gradient · Docs", "Proof Gradient · Docs", body))

              for doc in docs:
                  write(DIST / "docs" / doc.with_suffix(".html").name, markdown_to_html(doc, prefix="../"))

              if (ROOT / "README.md").exists():
                  write(DIST / "docs" / "readme.html", markdown_to_html(ROOT / "README.md", prefix="../"))


          def main() -> None:
              DIST.mkdir(parents=True, exist_ok=True)

              # Preserve old static assets if they exist.
              for source, target in [
                  (ROOT / "assets", DIST / "assets"),
                  (ROOT / "site" / "assets", DIST / "assets"),
                  (ROOT / "badges", DIST / "badges"),
                  (ROOT / "site" / "badges", DIST / "badges"),
              ]:
                  if source.exists():
                      if target.exists() and source.is_dir():
                          for item in source.rglob("*"):
                              if item.is_file():
                                  rel = item.relative_to(source)
                                  copy_if_exists(item, target / rel)
                      else:
                          copy_if_exists(source, target)

              proofs: list[dict[str, Any]] = []
              for number, slug, title, subtitle, description in PROOFS:
                  proofs.append(maybe_json_for_proof(number, slug, title, subtitle, description))

              proof_index = {
                  "generated_at": dt.datetime.utcnow().isoformat() + "Z",
                  "proof_count": len(proofs),
                  "proofs": proofs,
              }

              write(DIST / "assets" / "proof-index.json", json.dumps(proof_index, indent=2, ensure_ascii=False) + "\n")

              build_index(proofs)
              build_production()
              preserve_or_generate_proof_pages(proofs)
              build_docs()

              write(DIST / ".nojekyll", "")
              write(DIST / "command-center.html", '<meta http-equiv="refresh" content="0; url=index.html">')
              write(DIST / "archive.html", '<meta http-equiv="refresh" content="0; url=proofs/index.html">')


          if __name__ == "__main__":
              main()
          PY

          python /tmp/build_complete_proof_gradient_site.py

          echo "Generated public files:"
          find dist -maxdepth 4 -type f | sort

      - name: Check public artifact
        run: |
          set -euo pipefail

          required=(
            "dist/index.html"
            "dist/production.html"
            "dist/proofs/index.html"
            "dist/proofs/001-sovereign-swarm.html"
            "dist/proofs/002-evolution-tournament.html"
            "dist/proofs/003-recursive-evolution-ladder.html"
            "dist/proofs/004-corporate-rsi-dominion.html"
            "dist/proofs/005-enterprise-rsi-superorganism.html"
            "dist/proofs/006-sovereign-enterprise-constellation.html"
            "dist/proofs/007-sovereign-enterprise-proof-economy.html"
            "dist/proofs/008-sovereign-domain-atlas.html"
            "dist/proofs/009-sovereign-kardashev-capital-engine.html"
            "dist/proofs/010-proof-carrying-intelligence.html"
            "dist/proofs/011-the-proof-loop.html"
            "dist/assets/proof-index.json"
            "dist/docs/index.html"
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing public file: $file"; exit 1; }
          done

          grep -R "Proof Archive" dist/index.html dist/proofs/index.html
          grep -R "Production Platform" dist/index.html dist/production.html
          grep -R "Artifact Vault" dist/index.html dist/production.html dist/proofs/010-proof-carrying-intelligence.html
          grep -R "Run Fabric" dist/index.html dist/production.html dist/proofs/010-proof-carrying-intelligence.html
          grep -R "Proof Ledger" dist/index.html dist/production.html dist/proofs/010-proof-carrying-intelligence.html
          grep -R "Selection Gate" dist/index.html dist/production.html dist/proofs/010-proof-carrying-intelligence.html

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
            echo "Old SkillOS deployment URL found in public artifact. Stopping."
            exit 1
          fi

          echo "Complete Proof Gradient public site verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy complete public site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URLs
        run: |
          echo "Main: ${{ steps.deployment.outputs.page_url }}"
          echo "Production: ${{ steps.deployment.outputs.page_url }}production.html"
          echo "Proof Archive: ${{ steps.deployment.outputs.page_url }}proofs/"
          echo "Proof #10: ${{ steps.deployment.outputs.page_url }}proofs/010-proof-carrying-intelligence.html"
          echo "Proof #11: ${{ steps.deployment.outputs.page_url }}proofs/011-the-proof-loop.html"
