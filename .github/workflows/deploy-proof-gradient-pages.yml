          cat /tmp/proof-gradient-demo.json

      - name: Run tests
        run: |
          set -euo pipefail
          pytest

      - name: Run security and claim-boundary review
        run: |
          set -euo pipefail
          python scripts/security_review.py
          bandit -q -r proof_gradient_prod

      - name: Verify production deliverables
        run: |
          set -euo pipefail

          required=(
            "proof_gradient_prod/db.py"
            "proof_gradient_prod/models.py"
            "proof_gradient_prod/services.py"
            "proof_gradient_prod/api.py"
            "proof_gradient_prod/cli.py"
