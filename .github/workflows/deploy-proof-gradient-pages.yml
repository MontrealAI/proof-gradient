          def shell(title: str, eyebrow: str, body: str) -> str:
              return f"""<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{esc(title)}</title>
              <style>{css()}</style>
            </head>
            <body>
              <main>
                <div class="eyebrow">{esc(eyebrow)}</div>
                {body}
              </main>
            </body>
          </html>
          """


          def table(headers: list[str], rows: list[list[Any]]) -> str:
              head = ''.join(f"<th>{esc(h)}</th>" for h in headers)
              body = ''.join("<tr>" + ''.join(f"<td>{esc(c)}</td>" for c in row) + "</tr>" for row in rows)
              return f"<table><thead><tr>{head}</tr></thead><tbody>{body}</tbody></table>"


          def protocol_svg() -> str:
              items = [("Aim", "#f4c76b"), ("Act", "#8ab4ff"), ("Prove", "#91f2bf"), ("Evolve", "#b8a7ff")]
              nodes = []
              for i, (name, color) in enumerate(items):
                  x = 90 + i * 245
                  nodes.append(f'''
                    <rect x="{x}" y="115" width="170" height="88" rx="22" fill="{color}" opacity=".18" stroke="{color}" stroke-width="3"/>
                    <text x="{x+28}" y="165" fill="#f7f8ff" font-size="30" font-weight="800">{name}</text>
                  ''')
                  if i < len(items) - 1:
                      nodes.append(f'''
                        <line x1="{x+180}" y1="159" x2="{x+235}" y2="159" stroke="#f4c76b" stroke-width="5"/>
                        <polygon points="{x+235},159 {x+220},149 {x+220},169" fill="#f4c76b"/>
                      ''')
              return f'''
              <div class="visual">
                <h3>The Proof Loop</h3>
                <svg viewBox="0 0 1100 300" role="img" aria-label="Aim Act Prove Evolve">
                  <rect x="0" y="0" width="1100" height="300" rx="26" fill="#070b14"/>
                  <text x="60" y="58" fill="#f4c76b" font-size="28" font-weight="800">Aim → Act → Prove → Evolve</text>
                  <text x="60" y="88" fill="#aab3cf" font-size="18">Every agent acts. Every action leaves proof. Every proof earns improvement.</text>
                  {''.join(nodes)}
                </svg>
              </div>
              '''


          def curve_svg(title: str, data: list[dict[str, Any]], key: str, color: str) -> str:
              sampled = [d for d in data if d["cycle"] % 32 == 0 or d["cycle"] == 1]
              width, height, pad = 1000, 360, 54
              vals = [d[key] for d in sampled]
              mn, mx = min(vals), max(vals)
              pts = []
              circles = []
              for i, d in enumerate(sampled):
                  x = pad + i / max(1, len(sampled)-1) * (width - 2*pad)
                  y = height - pad - ((d[key] - mn) / max(0.000001, mx - mn)) * (height - 2*pad)
                  pts.append(f"{x:.1f},{y:.1f}")
                  circles.append(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="5" fill="{color}"><title>Cycle {d["cycle"]}: {d[key]}</title></circle>')
              return f'''
              <div class="visual">
                <h3>{esc(title)}</h3>
                <svg viewBox="0 0 {width} {height}" role="img" aria-label="{esc(title)}">
                  <rect x="0" y="0" width="{width}" height="{height}" rx="22" fill="#070b14"/>
                  <line x1="{pad}" y1="{height-pad}" x2="{width-pad}" y2="{height-pad}" stroke="rgba(255,255,255,.24)"/>
                  <line x1="{pad}" y1="{pad}" x2="{pad}" y2="{height-pad}" stroke="rgba(255,255,255,.24)"/>
                  <polyline fill="none" stroke="{color}" stroke-width="5" points="{' '.join(pts)}"/>
                  {''.join(circles)}
                  <text x="{pad}" y="34" fill="#aab3cf" font-size="18">{mn} → {mx}</text>
                </svg>
              </div>
              '''


          def gate_svg() -> str:
              rows = [("Aims", 2048, "#f4c76b"), ("Actions", 2048, "#8ab4ff"), ("Proofs", 2048, "#91f2bf"), ("Selected", 2035, "#b8a7ff"), ("Rolled back", 13, "#ffb86b")]
              bars = []
              for i, (name, val, color) in enumerate(rows):
                  y = 70 + i * 50
                  w = 720 * val / 2048
                  bars.append(f'<text x="40" y="{y+23}" fill="#dbe6ff" font-size="18">{name}</text><rect x="190" y="{y}" width="{w:.1f}" height="30" rx="10" fill="{color}" opacity=".76"/><text x="{w+205:.1f}" y="{y+22}" fill="#aab3cf" font-size="16">{val}</text>')
              return f'''
              <div class="visual">
                <h3>Selection Gate Funnel</h3>
                <svg viewBox="0 0 1000 360" role="img" aria-label="Selection Gate funnel">
                  <rect x="0" y="0" width="1000" height="360" rx="22" fill="#070b14"/>
                  <text x="40" y="38" fill="#f4c76b" font-size="22" font-weight="800">Only proven intelligence propagates</text>
