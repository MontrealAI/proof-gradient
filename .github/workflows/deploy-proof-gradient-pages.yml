          write("proof_gradient_prod/security.py", """
          from dataclasses import dataclass


          ROLE_ORDER = {
              "viewer": 1,
              "operator": 2,
              "reviewer": 3,
              "admin": 4,
              "owner": 5,
          }

          TOOL_PERMISSION_CLASSES = {
              "read",
              "draft",
              "write",
              "send",
              "delete",
              "publish",
              "payment",
              "deploy",
              "external_contact",
              "secret_access",
              "admin_change",
          }


          class PermissionDenied(RuntimeError):
              pass


          @dataclass(frozen=True)
          class Principal:
              user_id: str
              tenant_id: str
              role: str


          def require_role(principal: Principal, required: str) -> None:
              if ROLE_ORDER.get(principal.role, 0) < ROLE_ORDER[required]:
                  raise PermissionDenied(f"role {principal.role!r} cannot perform {required!r} action")


          def ensure_same_tenant(principal: Principal, tenant_id: str) -> None:
              if principal.tenant_id != tenant_id:
                  raise PermissionDenied("cross-tenant access denied")


          def authorize_tool(permission_class: str, policy_permissions: dict[str, str]) -> tuple[bool, str]:
              if permission_class not in TOOL_PERMISSION_CLASSES:
                  return False, "unknown permission class"

              decision = policy_permissions.get(permission_class, "denied")
              if decision == "allowed":
                  return True, "allowed by policy"
              if decision == "approval_required":
                  return False, "human approval required"
              return False, "denied by default"
          """)

          write("proof_gradient_prod/providers.py", """
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Protocol


          class LLMProvider(Protocol):
              name: str

              def complete(self, prompt: str, *, system: str = "") -> str:
                  ...


          @dataclass
          class MockProvider:
              name: str = "mock"

              def complete(self, prompt: str, *, system: str = "") -> str:
                  if "refund" in prompt.lower():
                      return "I am sorry for the frustration. We will refund you and follow up soon."
                  return "I will help with a safe, accurate, and policy-aware response."


          @dataclass
          class ExternalProviderPlaceholder:
              name: str = "external-placeholder"

              def complete(self, prompt: str, *, system: str = "") -> str:
                  raise RuntimeError(
                      "external provider is intentionally not enabled in tests; configure a provider adapter"
                  )


          def provider_from_name(name: str) -> LLMProvider:
              if name == "mock":
                  return MockProvider()
              return ExternalProviderPlaceholder(name=name)
          """)

          write("proof_gradient_prod/evals.py", """
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class EvalOutcome:
              passed: bool
              quality_delta: float
              safety_delta: float
              result: dict


          def unsupported_claim_eval(output: str) -> EvalOutcome:
              forbidden = ["we will refund", "refund approved", "guaranteed refund"]
              lower = output.lower()
              hits = [term for term in forbidden if term in lower]
              if hits:
                  return EvalOutcome(
                      passed=False,
                      quality_delta=-0.10,
                      safety_delta=-1.0,
                      result={"failure": "unsupported claim", "forbidden_terms": hits},
                  )
              return EvalOutcome(
                  passed=True,
                  quality_delta=0.18,
                  safety_delta=1.0,
                  result={"pass": "no unsupported refund promise"},
              )


          def baseline_vs_candidate_eval(baseline_output: str, candidate_output: str) -> EvalOutcome:
              baseline = unsupported_claim_eval(baseline_output)
              candidate = unsupported_claim_eval(candidate_output)
              return EvalOutcome(
                  passed=candidate.passed and not baseline.passed,
                  quality_delta=0.22,
                  safety_delta=1.0 if candidate.passed else -1.0,
                  result={
                      "baseline": baseline.result,
                      "candidate": candidate.result,
                      "recommendation": "approve_canary" if candidate.passed else "reject",
                  },
              )
          """)

          write("proof_gradient_prod/services.py", """
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone
          import hashlib
          import json
          import time

          from sqlalchemy import select
          from sqlalchemy.orm import Session

          from proof_gradient_prod import models
          from proof_gradient_prod.config import settings
          from proof_gradient_prod.evals import baseline_vs_candidate_eval, unsupported_claim_eval
          from proof_gradient_prod.providers import provider_from_name
          from proof_gradient_prod.security import authorize_tool


          IMMUTABLE_STATES = {"approved", "canary", "active", "deprecated", "rolled_back"}


          def now_iso() -> str:
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def checksum(value: object) -> str:
              payload = json.dumps(value, sort_keys=True, ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()


          def audit(
              session: Session,
              tenant_id: str,
              action: str,
              resource_type: str,
              resource_id: str,
              payload: dict | None = None,
          ) -> None:
              session.add(
                  models.AuditEvent(
                      tenant_id=tenant_id,
                      action=action,
                      resource_type=resource_type,
                      resource_id=resource_id,
                      payload_json=payload or {},
                  )
              )


          def create_tenant(session: Session, name: str) -> models.Tenant:
              existing = session.scalar(select(models.Tenant).where(models.Tenant.name == name))
              if existing:
                  return existing
              tenant = models.Tenant(name=name)
              session.add(tenant)
              session.flush()
              audit(session, tenant.id, "tenant.create", "tenant", tenant.id)
              return tenant


          def create_user(session: Session, tenant_id: str, email: str, role: str = "owner") -> models.User:
              existing = session.scalar(
                  select(models.User).where(models.User.tenant_id == tenant_id, models.User.email == email)
              )
              if existing:
                  return existing
              user = models.User(tenant_id=tenant_id, email=email, role=role)
              session.add(user)
              session.flush()
              audit(session, tenant_id, "user.create", "user", user.id, {"role": role})
              return user


          @dataclass
          class ArtifactVault:
              session: Session
              tenant_id: str

              def create_artifact(self, artifact_type: str, name: str, risk_class: str = "low") -> models.Artifact:
                  artifact = models.Artifact(
                      tenant_id=self.tenant_id,
                      artifact_type=artifact_type,
                      name=name,
                      risk_class=risk_class,
                  )
                  self.session.add(artifact)
                  self.session.flush()
                  audit(self.session, self.tenant_id, "artifact.create", "artifact", artifact.id)
                  return artifact

              def create_version(
                  self,
                  artifact: models.Artifact,
                  version: str,
                  content: dict,
                  *,
                  state: str = "draft",
                  description: str = "",
                  dependencies: list | None = None,
                  permissions: dict | None = None,
                  eval_references: list | None = None,
                  rollback_target: str | None = None,
              ) -> models.ArtifactVersion:
                  body = {
                      "artifact_id": artifact.id,
                      "artifact_type": artifact.artifact_type,
                      "version": version,
                      "content": content,
                      "dependencies": dependencies or [],
                      "permissions": permissions or {},
                      "eval_references": eval_references or [],
                  }
                  av = models.ArtifactVersion(
                      tenant_id=self.tenant_id,
                      artifact_id=artifact.id,
                      version=version,
                      lifecycle_state=state,
                      description=description,
                      content_json=content,
                      dependencies_json=dependencies or [],
                      permissions_json=permissions or {},
                      eval_references_json=eval_references or [],
                      provenance_json={"created_by": "proof-gradient-production-platform"},
                      checksum=checksum(body),
                      rollback_target=rollback_target,
                  )
                  self.session.add(av)
                  self.session.flush()
                  audit(self.session, self.tenant_id, "artifact_version.create", "artifact_version", av.id)
                  return av

              def release(self, version: models.ArtifactVersion, state: str = "active") -> models.ArtifactVersion:
                  if version.lifecycle_state in IMMUTABLE_STATES:
                      raise ValueError("released artifact versions are immutable")
                  version.lifecycle_state = state
                  version.released_at = datetime.now(timezone.utc)
                  audit(self.session, self.tenant_id, "artifact_version.release", "artifact_version", version.id)
                  self.session.flush()
                  return version

              def update_content(self, version: models.ArtifactVersion, content: dict) -> models.ArtifactVersion:
                  if version.lifecycle_state in IMMUTABLE_STATES:
                      raise ValueError("released artifact versions are immutable")
                  version.content_json = content
                  version.checksum = checksum(content)
                  audit(self.session, self.tenant_id, "artifact_version.update", "artifact_version", version.id)
                  self.session.flush()
                  return version

              def active_versions(self) -> list[models.ArtifactVersion]:
                  return list(
                      self.session.scalars(
                          select(models.ArtifactVersion).where(
                              models.ArtifactVersion.tenant_id == self.tenant_id,
                              models.ArtifactVersion.lifecycle_state.in_(["active", "canary"]),
                          )
                      )
                  )


          def ensure_demo_artifacts(session: Session, tenant_id: str) -> dict[str, models.ArtifactVersion]:
              vault = ArtifactVault(session, tenant_id)
              active = vault.active_versions()
              by_name = {}
              for version in active:
                  artifact = session.get(models.Artifact, version.artifact_id)
                  if artifact:
                      by_name[artifact.name] = version
              required = {
                  "customer_response_goal": ("goal", {"desired_outcome": "safe customer response"}),
                  "customer_response_plan": ("plan", {"steps": ["read", "draft", "verify", "approval"]}),
                  "tone_control_skill": ("skill", {"instruction": "calm, concise, empathetic"}),
                  "claim_verification_skill": ("skill", {"instruction": "flag unsupported claims"}),
                  "refund_policy_tool": ("tool", {"mode": "mock"}, {"read": "allowed", "send": "approval_required"}),
                  "no_external_send_policy": ("policy", {"external_contact": "approval_required"}),
                  "unsupported_claim_eval": ("eval", {"forbidden": ["we will refund", "refund approved"]}),
              }
              for name, spec in required.items():
                  if name in by_name:
                      continue
                  artifact_type, content, *rest = spec
                  permissions = rest[0] if rest else {}
                  artifact = vault.create_artifact(artifact_type, name, risk_class="medium")
                  version = vault.create_version(
                      artifact,
                      "1.0.0",
                      content,
                      permissions=permissions,
                      eval_references=["unsupported_claim_eval@1.0.0"] if artifact_type in {"goal", "plan", "skill"} else [],
                      rollback_target=f"{name}@1.0.0",
                  )
                  vault.release(version, "active")
                  by_name[name] = version
              return by_name


          @dataclass
          class ProofLedger:
              session: Session
              tenant_id: str

              def trace(self, run_id: str, event_type: str, message: str, payload: dict | None = None) -> models.TraceEvent:
                  event = models.TraceEvent(
                      tenant_id=self.tenant_id,
                      run_id=run_id,
                      event_type=event_type,
                      message=message,
                      payload_json=payload or {},
                  )
                  self.session.add(event)
                  self.session.flush()
                  return event

              def proof(self, run_id: str, payload: dict) -> models.Proof:
                  record = models.Proof(
                      tenant_id=self.tenant_id,
                      run_id=run_id,
                      proof_json=payload,
                      checksum=checksum(payload),
                  )
                  self.session.add(record)
                  self.session.flush()
                  audit(self.session, self.tenant_id, "proof.create", "proof", record.id)
                  return record


          @dataclass
          class ToolGateway:
              session: Session
              tenant_id: str

              def request_tool(
                  self,
                  run_id: str,
                  tool_name: str,
                  permission_class: str,
                  policy_permissions: dict[str, str],
                  request: dict,
              ) -> models.ToolCall:
                  allowed, reason = authorize_tool(permission_class, policy_permissions)
                  call = models.ToolCall(
                      tenant_id=self.tenant_id,
                      run_id=run_id,
                      tool_name=tool_name,
                      permission_class=permission_class,
                      allowed=allowed,
                      request_json=request,
                      result_json={"reason": reason, "allowed": allowed},
                  )
                  self.session.add(call)
                  self.session.add(
                      models.PolicyDecision(
                          tenant_id=self.tenant_id,
                          run_id=run_id,
                          policy_name="tool_gateway_deny_by_default",
                          decision="allow" if allowed else "deny",
                          reason=reason,
                      )
                  )
                  self.session.flush()
                  return call


          @dataclass
          class SelectionGate:
              session: Session
              tenant_id: str

              def propose_patch(
                  self,
                  proof_id: str,
                  target_artifact_version: str,
                  candidate_artifact_version: str,
                  diff: dict,
                  rollback_target: str,
              ) -> models.Patch:
                  if not rollback_target:
                      raise ValueError("no rollback target, no release")
                  patch = models.Patch(
                      tenant_id=self.tenant_id,
                      proof_id=proof_id,
                      patch_type="plan_patch",
                      target_artifact_version=target_artifact_version,
                      candidate_artifact_version=candidate_artifact_version,
                      risk_class="medium",
                      diff_json=diff,
                      rollback_target=rollback_target,
                  )
                  self.session.add(patch)
                  self.session.flush()
                  audit(self.session, self.tenant_id, "patch.propose", "patch", patch.id)
                  return patch

              def approve_canary(self, patch: models.Patch, eval_result: models.EvalResult) -> tuple[models.SelectionDecision, models.Rollout, models.Rollback]:
                  if not eval_result.passed:
                      raise ValueError("no eval, no propagation")
                  decision = models.SelectionDecision(
                      tenant_id=self.tenant_id,
                      patch_id=patch.id,
                      decision="approve_canary",
                      reason="candidate beat baseline and preserved safety",
                      evidence_json={"eval_result_id": eval_result.id},
                  )
                  self.session.add(decision)
                  self.session.flush()

                  rollout = models.Rollout(
                      tenant_id=self.tenant_id,
                      selection_id=decision.id,
                      rollout_percentage=10,
                      status="canary",
                      monitoring_json={
                          "quality_drop_threshold": 0.05,
                          "cost_increase_threshold": 0.20,
                          "policy_violation_threshold": 0,
                      },
                  )
                  self.session.add(rollout)
                  self.session.flush()

                  rollback = models.Rollback(
                      tenant_id=self.tenant_id,
                      rollout_id=rollout.id,
                      rollback_target=patch.rollback_target,
                      status="ready",
                  )
                  self.session.add(rollback)
                  self.session.flush()
                  audit(self.session, self.tenant_id, "selection.approve_canary", "selection", decision.id)
                  return decision, rollout, rollback


          @dataclass
          class RunFabric:
              session: Session
              tenant_id: str

              def run_customer_response_demo(self, prompt: str) -> dict:
                  artifacts = ensure_demo_artifacts(self.session, self.tenant_id)
                  provider = provider_from_name(settings.provider)
                  ledger = ProofLedger(self.session, self.tenant_id)

                  job = models.Job(
                      tenant_id=self.tenant_id,
                      prompt=prompt,
                      risk_class="medium",
                      status="running",
                  )
                  self.session.add(job)
                  self.session.flush()

                  run_contract = {
                      "job_id": job.id,
                      "desired_outcome": "Draft a safe, accurate, empathetic customer response.",
                      "success_criteria": [
                          "acknowledges customer concern",
                          "uses verified facts",
                          "proposes next step",
                          "avoids unsupported promises",
                      ],
                      "failure_criteria": [
                          "invents policy",
                          "sends externally without approval",
                      ],
                      "artifacts": {name: version.id for name, version in artifacts.items()},
                      "tools": {
                          "refund_policy_tool": "read",
                          "email_send": "approval_required",
                      },
                      "evals": ["unsupported_claim_eval@1.0.0"],
                      "budget": {
                          "max_cost_usd": settings.max_cost_usd,
                          "max_latency_seconds": settings.max_latency_seconds,
                      },
                      "trace_required": True,
                      "rollback_required": True,
                  }

                  run = models.Run(
                      tenant_id=self.tenant_id,
                      job_id=job.id,
                      status="running",
                      run_contract_json=run_contract,
                  )
                  self.session.add(run)
                  self.session.flush()

                  started = time.perf_counter()
                  ledger.trace(run.id, "run_contract_created", "Run Contract created.", run_contract)
                  ledger.trace(run.id, "artifacts_resolved", "Active artifacts resolved.", run_contract["artifacts"])

                  gateway = ToolGateway(self.session, self.tenant_id)
                  gateway.request_tool(
                      run.id,
                      "refund_policy_tool",
                      "read",
                      artifacts["refund_policy_tool"].permissions_json,
                      {"customer_id": "demo"},
                  )
                  gateway.request_tool(
                      run.id,
                      "email_send",
                      "send",
                      artifacts["refund_policy_tool"].permissions_json,
                      {"draft": True},
                  )

                  baseline_output = provider.complete(prompt)
                  baseline_eval = unsupported_claim_eval(baseline_output)
                  ledger.trace(
                      run.id,
                      "baseline_output_created",
                      "Baseline draft created.",
                      {"output": baseline_output, "eval": baseline_eval.result},
                  )

                  score_value = 0.42 if not baseline_eval.passed else 0.92
                  candidate_output = (
                      "I am sorry for the frustration. I cannot confirm refund eligibility yet, "
                      "but I can help check the policy and next steps."
                  )
                  candidate_eval = baseline_vs_candidate_eval(baseline_output, candidate_output)

                  proof_payload = {
                      "run_contract": run_contract,
                      "baseline_output": baseline_output,
                      "candidate_output": candidate_output,
                      "baseline_eval": baseline_eval.result,
                      "candidate_eval": candidate_eval.result,
                      "credit_assignment": {
                          "primary_failure": "plan",
                          "secondary_failure": "claim_verification_skill",
                          "evidence": [
                              "draft occurred before policy grounding",
                              "unsupported refund promise was detected",
                              "external send was blocked by policy",
                          ],
                      },
                      "cost_usd": 0.0,
                      "latency_ms": int((time.perf_counter() - started) * 1000),
                  }
                  proof = ledger.proof(run.id, proof_payload)

                  score = models.Score(
                      tenant_id=self.tenant_id,
                      proof_id=proof.id,
                      value=score_value,
                      score_json={"passed": candidate_eval.passed, "safety_delta": candidate_eval.safety_delta},
                  )
                  self.session.add(score)
                  self.session.flush()

                  credit = models.CreditAssignment(
                      tenant_id=self.tenant_id,
                      score_id=score.id,
                      primary_target="customer_response_plan@1.0.0",
                      secondary_target="claim_verification_skill@1.0.0",
                      evidence_json=proof_payload["credit_assignment"],
                  )
                  self.session.add(credit)
                  self.session.flush()

                  eval_run = models.EvalRun(
                      tenant_id=self.tenant_id,
                      proof_id=proof.id,
                      candidate_artifact_version="customer_response_plan@1.1.0-candidate",
                      baseline_artifact_version="customer_response_plan@1.0.0",
                      status="completed",
                  )
                  self.session.add(eval_run)
                  self.session.flush()

                  eval_result = models.EvalResult(
                      tenant_id=self.tenant_id,
                      eval_run_id=eval_run.id,
                      passed=candidate_eval.passed,
                      quality_delta=candidate_eval.quality_delta,
                      safety_delta=candidate_eval.safety_delta,
                      cost_delta=0.0,
                      latency_delta=0.0,
                      result_json=candidate_eval.result,
                  )
                  self.session.add(eval_result)
                  self.session.flush()

                  gate = SelectionGate(self.session, self.tenant_id)
                  patch = gate.propose_patch(
                      proof.id,
                      "customer_response_plan@1.0.0",
                      "customer_response_plan@1.1.0-candidate",
                      {
                          "add_step": {
                              "id": "check_refund_policy",
                              "before": "draft_response",
                              "capability": "refund_policy_tool@1.0.0",
                          }
                      },
                      "customer_response_plan@1.0.0",
                  )
                  decision, rollout, rollback = gate.approve_canary(patch, eval_result)

                  run.status = "completed"
                  run.output_json = {"baseline": baseline_output, "candidate": candidate_output}
                  run.latency_ms = proof_payload["latency_ms"]
                  job.status = "completed"
                  ledger.trace(run.id, "selection_gate_completed", "Candidate approved for canary.", {"rollout_id": rollout.id})

                  audit(self.session, self.tenant_id, "demo.completed", "run", run.id)
                  self.session.flush()

                  return {
                      "tenant_id": self.tenant_id,
                      "job_id": job.id,
                      "run_id": run.id,
                      "proof_id": proof.id,
                      "score_id": score.id,
                      "credit_assignment_id": credit.id,
                      "patch_id": patch.id,
                      "eval_run_id": eval_run.id,
                      "eval_result_id": eval_result.id,
                      "selection_id": decision.id,
                      "rollout_id": rollout.id,
                      "rollback_id": rollback.id,
                      "run_contract": run_contract,
                      "proof": proof_payload,
                  }
          """)

          write("proof_gradient_prod/api.py", """
          from __future__ import annotations

          from fastapi import Depends, FastAPI, HTTPException
