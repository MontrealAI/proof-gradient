          def render_proof_page(proof: dict[str, Any], archive: dict[str, Any]) -> str:
              other_links = ''.join(f'<a href="{esc(other["slug"])}.html">Proof #{other["number"]}</a>' for other in archive["proofs"])

              body = f"""
