          from pathlib import Path
          import json

          required_pages = [
              Path("site/index.html"),
              Path("site/proofs/index.html"),
              Path("site/proofs/001-sovereign-swarm.html"),
              Path("site/proofs/002-evolution-tournament.html"),
              Path("site/proofs/003-recursive-evolution-ladder.html"),
              Path("site/assets/proof-index.json"),
              Path("site/assets/proofs/001-sovereign-swarm.json"),
              Path("site/assets/proofs/002-evolution-tournament.json"),
              Path("site/assets/proofs/003-recursive-evolution-ladder.json"),
          ]

          for page in required_pages:
              if not page.exists():
                  raise SystemExit(f"Missing required proof archive file: {page}")

          archive = json.loads(Path("site/assets/proof-index.json").read_text())

          if archive["proof_count"] < 3:
              raise SystemExit("Proof archive has fewer than 3 proofs.")

          proof3 = json.loads(Path("site/assets/proofs/003-recursive-evolution-ladder.json").read_text())
          if proof3["evidence"]["verdict"] != "recursive_evolution_proven_with_selection_rejection_and_rollback":
              raise SystemExit("Proof #3 verdict failed.")

          main = Path("site/index.html").read_text()
          for slug in ["001-sovereign-swarm", "002-evolution-tournament", "003-recursive-evolution-ladder"]:
              if f"proofs/{slug}.html" not in main:
                  raise SystemExit(f"Main page does not link to proof page: {slug}")

