name: "Deploy Proof Gradient Pages"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-proof-gradient-pages.yml"
      - "site/**"
      - "docs/**"
      - "data/proofs/**"
      - "assets/**"
      - "README.md"
      - "pyproject.toml"
      - "proof_gradient/**"
      - "tests/test_proof_gradient_*.py"
      - "Dockerfile"
      - "docker-compose.yml"
      - "alembic.ini"
      - "migrations/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-public-site-guardian
  cancel-in-progress: true

jobs:
  build:
    name: "Build complete Proof Gradient public site"
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Build public site without removing existing pages"
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

