              Path("site/assets/proof-index.json"),
              Path("site/assets/proofs/004-corporate-rsi-dominion.json"),
          ]

          for page in required_pages:
              if not page.exists():
                  raise SystemExit(f"Missing required proof archive file: {page}")

          proof4 = json.loads(Path("site/assets/proofs/004-corporate-rsi-dominion.json").read_text())
          summary = proof4["summary"]
          evidence = proof4["evidence"]

          if summary["agents"] < 512:
              raise SystemExit("Corporate RSI proof failed: fewer than 512 agents.")

          if summary["corporate_domains"] < 16:
              raise SystemExit("Corporate RSI proof failed: fewer than 16 corporate domains.")

          if summary["rsi_cycles"] < 8:
              raise SystemExit("Corporate RSI proof failed: fewer than 8 recursive cycles.")

          if summary["eval_cases"] < 6144:
              raise SystemExit("Corporate RSI proof failed: fewer than 6,144 eval cases.")

          if evidence["recursive_self_improvement"]["meta_rsi_upgrade_count"] < 4:
              raise SystemExit("Corporate RSI proof failed: meta-RSI upgrades missing.")

          if evidence["selection_gate"]["decision"] != "approve_corporate_rsi_canary":
