          PY

      - name: Run The Proof Loop tests and generate site
        run: |
          set -euo pipefail

          python -m unittest tests/test_the_proof_loop.py

          rm -rf site
          mkdir -p site
          mkdir -p data/proofs

          python -m proof_gradient.the_proof_loop --site site --data data/proofs

          python - <<'PY'
          from pathlib import Path
          import json

          required_pages = [
              Path("site/index.html"),
              Path("site/proofs/index.html"),
              Path("site/proofs/011-the-proof-loop.html"),
              Path("site/assets/proof-index.json"),
              Path("site/assets/proofs/011-the-proof-loop.json"),
          ]

          for page in required_pages:
              if not page.exists():
                  raise SystemExit(f"Missing required proof file: {page}")

          archive = json.loads(Path("site/assets/proof-index.json").read_text())
          proof = json.loads(Path("site/assets/proofs/011-the-proof-loop.json").read_text())

          if archive["proof_count"] < 11:
              raise SystemExit("Proof archive must contain at least 11 proofs.")

          evidence = proof["evidence"]
          summary = proof["summary"]

          if [p["name"] for p in evidence["proof_loop"]] != ["Aim", "Act", "Prove", "Evolve"]:
              raise SystemExit("Proof Loop protocol mismatch.")

          if summary["agents"] < 8388608:
              raise SystemExit("Large multi-agent proof failed.")

          if summary["sovereign_domains"] < 1280:
              raise SystemExit("Sovereign domain proof failed.")

          if summary["eval_cases"] < 2684354560:
              raise SystemExit("Eval case proof failed.")

          if summary["goals_used"] < 4 or summary["plans_used"] < 4 or summary["skills_used"] < 8:
              raise SystemExit("Artifact catalog incomplete.")

          if evidence["selection_gate"]["decision"] != "approve_the_proof_loop_canary":
              raise SystemExit("Selection Gate did not approve canary.")

          if evidence["vision_treatment"] != "strategic scenario, not empirical claim":
              raise SystemExit("Claim boundary failed.")

          if evidence["sovereignty_guarantees"]["real_world_kardashev_claim_made"]:
              raise SystemExit("Invalid real-world Kardashev claim.")

          main = Path("site/index.html").read_text()
          for proof_item in archive["proofs"]:
              slug = proof_item["slug"]
              if f"proofs/{slug}.html" not in main:
                  raise SystemExit(f"Main page does not link to proof: {slug}")

          proof_page = Path("site/proofs/011-the-proof-loop.html").read_text()
          for phrase in [
              "Aim → Act → Prove → Evolve",
              "Artifact Vault",
              "Run Fabric",
              "Proof Ledger",
              "Selection Gate",
              "GoalOS / Aim Artifacts Used",
              "PlanOS / Strategy Artifacts Used",
              "SkillOS / Capability Artifacts Used",
              "Claim-Boundary Ledger",
          ]:
              if phrase not in proof_page:
                  raise SystemExit(f"Missing page section: {phrase}")

          print("The Proof Loop verified.")
          print("Aim → Act → Prove → Evolve verified.")
          print("Artifact Vault, Run Fabric, Proof Ledger, and Selection Gate verified.")
          print("Large multi-agent coordination proof verified.")
          print("GoalOS, PlanOS, SkillOS, Policy, Eval, Tool, and Context catalogs verified.")
          print("Selection Gate and rollback verified.")
          print("Claim boundary verified.")
          print("Every proof has its own webpage and is connected to the main page.")
          PY

      - name: Commit The Proof Loop
        run: |
          set -euo pipefail

          git config user.name "proof-gradient-the-proof-loop"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Add Proof Gradient The Proof Loop [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build clean Pages artifact
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp -R site/. dist/
          touch dist/.nojekyll

          echo "Published files:"
          find dist -maxdepth 4 -type f | sort

          echo "Checking final Pages artifact for stale SkillOS deployment URLs..."

          if grep -R "montrealai.github.io/skillos\|github.com/MontrealAI/skillos\|MontrealAI/skillos" dist; then
            echo "Old SkillOS deployment URL found in final Pages artifact. Stopping."
            exit 1
          fi

          echo "Clean Proof Gradient The Proof Loop artifact is ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: |
          echo "Proof Gradient deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "Main: ${{ steps.deployment.outputs.page_url }}"
          echo "Proof Archive: ${{ steps.deployment.outputs.page_url }}proofs/"
          echo "Proof #11: ${{ steps.deployment.outputs.page_url }}proofs/011-the-proof-loop.html"
