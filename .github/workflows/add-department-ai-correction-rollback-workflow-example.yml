name: Add Department AI Correction Rollback Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: department-ai-correction-rollback-workflow-example
  cancel-in-progress: false

jobs:
  add-department-ai-correction-rollback-example:
    name: Add department-ai-correction-rollback workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create department-ai-correction-rollback workflow example safely
        id: build
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "department-ai-correction-rollback"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "department-ai-correction-rollback"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · PROOF ROOM LITE</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn AI mistakes</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into corrections.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Issue → Severity → Correction → Rule update → Rollback receipt → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 22:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Department AI Correction / Rollback Workflow</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">The serious question is not “will AI make mistakes?” It is “how do we correct them?”</text>
          </svg>"""
          (assets_dir / "department-ai-correction-rollback-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough Department AI Correction / Rollback notes:
          Product: GoalOS Department Pack / Proof Room Lite
          Buyer: department lead, operations manager, AI champion, or small-business manager
          Department: Customer Success / Operations
          Room: Customer Success AI Workflow Room

          Incident:
          A draft support reply generated by the Support FAQ workflow gave unclear policy guidance about a refund / access issue.
          The reply was not sent externally because human review caught it.
          The issue suggests the workflow needs better rules for policy uncertainty.

          Goal:
          Create a correction / rollback workflow that records what happened, severity, immediate action, correction message if needed, workflow update, manager note, rollback receipt, and proof note.

          Need output:
          - issue summary
          - severity level
          - immediate action
          - correction / rollback decision
          - workflow rule update
          - checker update
          - manager note
          - rollback receipt
          - proof note

          Rules:
          - no legal/compliance certification
          - no guarantee of safety
          - do not blame a person
          - do not claim the system is now perfect
          - do not publish private customer details
          - do not send external correction unless actually needed and approved
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """AI Correction / Rollback Record:
          Room:
          Customer Success AI Workflow Room

          Workflow:
          Support FAQ replies

          Issue:
          A draft support reply gave unclear policy guidance about a refund / access issue.

          Status:
          Caught during human review.
          Not sent externally.

          Severity:
          Level 2 — internal correction required.

          Why Level 2:
          - The issue affected a draft workflow output.
          - It was caught before external sending.
          - No customer received the unclear answer.
          - The workflow rule needs revision.

          Immediate action:
          1. Do not use the draft reply.
          2. Mark the run as “needs correction.”
          3. Update the support workflow rules.
          4. Add a stronger policy-uncertainty check.
          5. Re-test the workflow on three internal examples.

          Correction / rollback decision:
          Rollback required:
          Yes — rollback the draft output.

          External correction required:
          No — the message was not sent externally.

          Workflow status:
          Active / restricted until rule update is tested.

          Workflow rule update:
          Add this rule:

          If a support question involves refund terms, billing, legal, privacy, safety, or policy uncertainty:
          - do not provide a final answer
          - mark the issue as “needs human review”
          - use the approved support policy wording
          - escalate to the room owner if unclear

          Checker update:
          Before any support reply is sent externally, confirm:
          - the issue category is correct
          - refund/access terms match the published policy
          - uncertain policy items are marked
          - no legal or compliance advice is given
          - no private customer data appears in public examples

          Manager note:
          Subject: Support FAQ workflow correction

          We caught an unclear AI-drafted support reply during human review.

          The reply was not sent externally.

          Decision:
          We rolled back the draft and restricted the workflow until the rule update is tested.

          Change:
          Support questions involving refunds, billing, legal, privacy, safety, or policy uncertainty will now be escalated for human review instead of answered directly by the workflow.

          Claim boundary:
          This correction does not claim the workflow is risk-free or compliant. It records the issue found, the rollback decision, and the rule update.

          Rollback Receipt:
          Rollback ID:
          RB-SUPPORT-FAQ-001

          Rolled back:
          Unclear draft support reply.

          Reason:
          Policy uncertainty.

          External impact:
          None identified; draft was not sent.

          Action taken:
          Draft discarded, workflow rule updated, checker updated, re-test required.

          Status:
          Rollback complete / verification pending.

          Next verification:
          Run three internal support examples and confirm uncertainty is correctly escalated."""

          proof_note = """Proof note:
          Source: rough Department AI Correction / Rollback notes.
          Outputs created: issue summary, severity level, immediate action, rollback decision, workflow rule update, checker update, manager note, rollback receipt.
          Claims made: the Department Pack can help record and manage correction/rollback for department AI workflows.
          Claims avoided: no legal/compliance certification, no guarantee of safety, no claim that the workflow is now perfect, no blame assignment, no private customer details.
          Review needed: department should confirm incident facts, policy wording, owner approval, and whether any external correction is required before sharing.
          Public-safe: yes, if private customer, employee, policy, and operational details are removed."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Department AI Correction / Rollback — GoalOS Workflow Example</title>
            <meta name="description" content="Turn an AI workflow issue into a correction and rollback record with severity, immediate action, rule update, manager note, rollback receipt, and proof note." />
            <meta property="og:title" content="Turn AI mistakes into corrections." />
            <meta property="og:description" content="Issue → severity → correction → rule update → rollback receipt → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/department-ai-correction-rollback-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Proof Room Lite · Example 22</div>
              <h1>Turn AI mistakes into corrections.</h1>
              <p class="lead">This reusable AI workflow turns an AI workflow issue into a clear correction / rollback record: what happened, how serious it was, what changed, who reviews it, and what proof was recorded.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                <a class="btn" href="/proof-gradient/workflow/department-ai-permission-map/">Example 21: AI permission map</a>
                <a class="btn" href="/proof-gradient/workflow/department-weekly-proof-review/">Example 19: weekly proof review</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/AEP-006/">Rollback Standard</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">The serious question is not “will AI make mistakes?” It is “how do we correct them?”</div>
                <p class="lead">Proof Room Lite becomes much more credible when a department has a simple way to catch, correct, restrict, revise, and record AI workflow issues.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: mistakes become confusion</h3>
                    <p>An AI draft is wrong or unclear. Someone fixes it quietly. The workflow keeps the same weak rule. The same issue can happen again.</p>
                    <p class="mini">Result: hidden risk, no learning, no proof.</p>
                  </div>
                  <div class="card">
                    <h3>After: correction loop</h3>
                    <p>The issue is classified, the draft is rolled back, the rule is updated, the checker is improved, and a rollback receipt is recorded.</p>
                    <p class="mini">Result: mistakes become workflow improvements.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI what happened, which workflow was involved, whether anything was sent, and who owns the workflow.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to blame people, certify compliance, guarantee safety, or publish private details.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save severity levels, rollback wording, and the standard “needs human review” policy language.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates issue summary, severity, immediate action, rollback decision, rule update, checker update, manager note, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether external correction is needed, whether the workflow should be restricted, and whether the rule was updated.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was rolled back, what changed, what was claimed, and what still needs review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough Department AI Correction / Rollback notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Issue summary</span>
                  <span class="pill">Severity level</span>
                  <span class="pill">Immediate action</span>
                  <span class="pill">Rollback decision</span>
                  <span class="pill">Rule update</span>
                  <span class="pill">Checker update</span>
                  <span class="pill">Manager note</span>
                  <span class="pill">Rollback receipt</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for real adoption</h3><p>AI adoption becomes more credible when mistakes have a correction path.</p></div>
                  <div class="card"><h3>Lightweight rollback</h3><p>Use simple rollback receipts instead of hiding errors or overbuilding governance.</p></div>
                  <div class="card"><h3>Proof Room ready</h3><p>Every issue becomes evidence for improving rules, checks, and workflow boundaries.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste an AI workflow issue. Get a correction plan, rollback receipt, and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-006/">See Rollback Standard</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, procurement, security, privacy, or regulatory advice. No income, savings, compliance, safety, accuracy, productivity, ROI, or business-results guarantee. Review incident facts, internal policies, customer impact, data boundaries, and approval responsibilities before acting.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof."),
              "internal-approval-memo": ("Example 16: Interest → approval memo", "Turn an interested internal champion into a manager memo, procurement email, rollout plan, and proof."),
              "team-sprint-facilitator": ("Example 17: Team Pack → self-run sprint", "Turn a team meeting into a reusable AI workflow session, role assignments, checks, and proof."),
              "department-proof-room-lite": ("Example 18: Department Pack → Proof Room Lite", "Turn scattered department AI use into workflow priorities, roles, checks, dashboard fields, and proof."),
              "department-weekly-proof-review": ("Example 19: Weekly proof review", "Turn dashboard notes into keep/revise/stop decisions, manager update, and proof."),
              "department-monthly-proof-report": ("Example 20: Monthly proof report", "Turn 30 days of Proof Room Lite notes into an executive report, leadership email, and proof."),
              "department-ai-permission-map": ("Example 21: Department AI Permission Map", "Turn AI tool confusion into Green / Yellow / Red rules, task permissions, escalation, and proof."),
              "department-ai-correction-rollback": ("Example 22: AI correction / rollback", "Turn an AI workflow issue into severity, correction, rule update, rollback receipt, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-department-ai-correction-rollback-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- DEPARTMENT-AI-CORRECTION-ROLLBACK-EXAMPLE:START -->"
              end = "<!-- DEPARTMENT-AI-CORRECTION-ROLLBACK-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="department-ai-correction-rollback-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Proof Room Lite · Example 22</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn AI mistakes into corrections.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste an AI workflow issue. Get severity, immediate action, rule update, checker update, rollback receipt, manager note, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/department-ai-correction-rollback/">See the correction / rollback workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit department-ai-correction-rollback example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add department-ai-correction-rollback workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
