name: GoalOS Public Site Release (v4-bilingual, obsolete compatibility validation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    name: Obsolete release path; validate with shared v14 scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate public site with shared rules
        run: python scripts/validate_goalos_public_site.py
      - name: Check paid/private artifact boundary with shared rules
        run: python scripts/check_no_paid_artifacts.py
      - name: Explain obsolete workflow
        run: echo "This legacy release workflow is retained only as an obsolete compatibility validator. Use the current GoalOS Public Site Release v8 Intelligent Assets path after v14 validation; do not deploy through this legacy workflow."
