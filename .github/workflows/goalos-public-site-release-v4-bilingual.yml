name: GoalOS Public Site Release v4 Bilingual

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goalos-public-site-release-v4-bilingual
  cancel-in-progress: false

jobs:
