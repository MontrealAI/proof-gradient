          # Shell repair across all HTML.
          MARKERS = [
              r"<!-- GOALOS-CANONICAL-SHELL:START -->.*?<!-- GOALOS-CANONICAL-SHELL:END -->",
              r"<!-- GOALOS-CANONICAL-FOOTER:START -->.*?<!-- GOALOS-CANONICAL-FOOTER:END -->",
              r"<!-- GOALOS-UNIFIED-SHELL:START -->.*?<!-- GOALOS-UNIFIED-SHELL:END -->",
              r"<!-- GOALOS-UNIFIED-FOOTER:START -->.*?<!-- GOALOS-UNIFIED-FOOTER:END -->",
              r"<!-- GOALOS-COMPLETE-NAV:START -->.*?<!-- GOALOS-COMPLETE-NAV:END -->",
              r"<!-- GOALOS-COMPLETE-FOOTER:START -->.*?<!-- GOALOS-COMPLETE-FOOTER:END -->",
              r"<!-- GOALOS-PRODUCT-LADDER-NAV:START -->.*?<!-- GOALOS-PRODUCT-LADDER-NAV:END -->",
              r"<!-- GOALOS-PRODUCT-LADDER-FOOTER:START -->.*?<!-- GOALOS-PRODUCT-LADDER-FOOTER:END -->",
              r"<!-- GOALOS-CLOUD-MVP:START -->.*?<!-- GOALOS-CLOUD-MVP:END -->",
              r"<!-- GOALOS-CLOUD-MVP-V02:START -->.*?<!-- GOALOS-CLOUD-MVP-V02:END -->",
          ]
          ASSET_PATTERNS = [
              r'<link[^>]+data-goalos-[^>]+>\s*',
              r'<script[^>]+data-goalos-[^>]+></script>\s*',
              r'<link[^>]+goalos-(?:complete|product|unified|site-v2|site-v3|opulent-v4|ladder)[^>]+\.css[^>]*>\s*',
              r'<script[^>]+goalos-(?:complete|product|unified|site-v2|site-v3|opulent-v4|ladder)[^>]+\.js[^>]*></script>\s*',
          ]
          SHELL_TEXT = re.compile(r"(GoalOS|Proof Gradient|Products|Pricing|Services|Standards|Shop|Department RSI|Cloud MVP|RSI Workshop|Atelier)", re.I)

          def remove_headers(text):
              body = re.search(r"<body\b[^>]*>", text, flags=re.I)
              if not body:
                  return text, 0
              start = body.end()
              next_content = re.search(r"<main\b|<section\b|<article\b", text[start:], flags=re.I)
              prefix_end = start + (next_content.start() if next_content else min(9000, len(text)-start))
              prefix = text[start:prefix_end]
              removed = 0
              def repl(m):
                  nonlocal removed
                  block = m.group(0)
                  flat = re.sub(r"<[^>]+>", " ", block)
                  if SHELL_TEXT.search(flat):
                      removed += 1
                      return "\n"
                  return block
              pattern = re.compile(r"<(?:header|nav)\b[\s\S]*?</(?:header|nav)>|<div\b(?=[^>]*class=[\"'][^\"']*(?:topbar|shell|navbar|site-header|nav)[^\"']*[\"'])[\s\S]*?</div>", re.I)
              return text[:start] + pattern.sub(repl, prefix) + text[prefix_end:], removed

          def remove_footers(text):
              removed = 0
              def repl(m):
                  nonlocal removed
                  block = m.group(0)
                  if SHELL_TEXT.search(re.sub(r"<[^>]+>", " ", block)):
                      removed += 1
                      return "\n"
                  return block
              return re.sub(r"<footer\b[\s\S]*?</footer>", repl, text, flags=re.I), removed

          CANON_CSS = f'<link rel="stylesheet" href="{BASE}/assets/goalos-opulent-v4.css" data-goalos-canonical-css>'
          CANON_JS = f'<script defer src="{BASE}/assets/goalos-opulent-v4.js" data-goalos-canonical-js></script>'

          def repair_html(path):
              if "_archive" in path.parts or ".git" in path.parts:
                  return
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "<html" not in text.lower():
                  return
              original = text
              backup(path)
              for pat in MARKERS:
                  text, n = re.subn(pat, "", text, flags=re.S|re.I)
                  REPORT["old_markers_removed"] += n
              for pat in ASSET_PATTERNS:
                  text, n = re.subn(pat, "", text, flags=re.I)
                  REPORT["old_assets_removed"] += n
              text, n = remove_headers(text)
              REPORT["topbars_removed"] += n
              text, n = remove_footers(text)
              REPORT["footers_removed"] += n
              if "</head>" in text:
                  text = text.replace("</head>", f"  {CANON_CSS}\n  {CANON_JS}\n</head>", 1)
              if "<body" in text.lower():
                  text = re.sub(r"(<body\b[^>]*>)", r"\1\n" + NAV + "\n", text, count=1, flags=re.I)
              else:
                  text = NAV + "\n" + text
              if "</body>" in text:
                  text = text.replace("</body>", FOOTER + "\n</body>", 1)
              else:
                  text += "\n" + FOOTER
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  REPORT["html_repaired"].append(path.relative_to(WEB_ROOT).as_posix())

          for html in sorted(WEB_ROOT.rglob("*.html")):
              repair_html(html)

          # Sitemap and robots.
          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          for u in sorted(set(URLS)):
              sitemap += f'  <url><loc>https://montrealai.github.io{BASE}{u}</loc><lastmod>{TODAY}</lastmod></url>\n'
          sitemap += "</urlset>\n"
          (WEB_ROOT / "sitemap.xml").write_text(sitemap, encoding="utf-8")
          (WEB_ROOT / "robots.txt").write_text(f"User-agent: *\nAllow: /\nSitemap: https://montrealai.github.io{BASE}/sitemap.xml\n", encoding="utf-8")

          # Paid/private artifact guard.
          def is_public_standard_package(rel):
              rel = rel.replace("\\", "/").lower()
              return re.fullmatch(r"standards/aep-[0-9]{3}/complete-package\.zip", rel) is not None

          blocked_terms = [
              "buyer", "buyer_official", "complete_bundle", "delivery_kit", "seller_assets",
              "master_pack", "commercialization_ready", "quick_launch", "opulent_institutional",
              "institutional_boardroom", "implementation_sprint", "enterprise_rsi_pilot",
              "workshop_v", "buyer_facilitator"
          ]
          restricted = []
          allowed = []
          for p in WEB_ROOT.rglob("*"):
              if not p.is_file() or "_archive" in p.parts:
                  continue
              rel = p.relative_to(WEB_ROOT).as_posix()
              name = p.name.lower()
              if name.endswith(".zip"):
                  if is_public_standard_package(rel):
                      allowed.append(rel)
                  else:
                      restricted.append(rel)
                      continue
              if any(term in name for term in blocked_terms):
                  if not name.endswith((".md",".html",".json",".txt",".yml",".yaml",".css",".js",".svg")):
                      restricted.append(rel)
          REPORT["allowed_public_packages"] = allowed
          if restricted:
              raise SystemExit("Paid/private artifacts detected in public site:\n" + "\n".join(sorted(set(restricted))[:120]))

          # Validation.
          errors = []
          for html in sorted(WEB_ROOT.rglob("*.html")):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              if text.count("GOALOS-CANONICAL-SHELL:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-SHELL:START')} canonical shells")
              if text.count("GOALOS-CANONICAL-FOOTER:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-FOOTER:START')} canonical footers")
              for old in ["GOALOS-COMPLETE-NAV","GOALOS-PRODUCT-LADDER-NAV","GOALOS-UNIFIED-SHELL","GOALOS-CLOUD-MVP:START","GOALOS-CLOUD-MVP-V02:START"]:
                  if old in text:
                      errors.append(f"{html.relative_to(WEB_ROOT)} still has old marker {old}")

          missing = []
          for html in WEB_ROOT.rglob("*.html"):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                  target = m.group(1)[len(BASE):] or "/"
                  fs = WEB_ROOT / target.lstrip("/")
                  if target.endswith("/"):
                      fs = fs / "index.html"
                  if not fs.exists():
                      missing.append((html.relative_to(WEB_ROOT).as_posix(), m.group(1)))
          if missing:
              errors.append("Missing internal links:\n" + "\n".join(f"{s} -> {u}" for s,u in missing[:80]))

          REPORT["validation"] = {"errors": errors, "html_files_checked": len([p for p in WEB_ROOT.rglob('*.html') if '_archive' not in p.parts])}
          if errors:
              (WEB_ROOT / "goalos-public-site-release-v4-errors.json").write_text(json.dumps(errors, indent=2), encoding="utf-8")
              raise SystemExit("GoalOS public site release v4 validation failed:\n" + "\n".join(errors[:60]))

          # Manifest/report.
          manifest = []
          for p in sorted(WEB_ROOT.rglob("*")):
              if p.is_file() and ".git" not in p.parts:
                  manifest.append({"path":p.relative_to(WEB_ROOT).as_posix(),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          (WEB_ROOT / "goalos-public-site-release-v4-manifest.json").write_text(json.dumps({"generated_at":NOW,"files":manifest}, indent=2)+"\n", encoding="utf-8")
          (WEB_ROOT / "goalos-public-site-release-v4-report.json").write_text(json.dumps(REPORT, indent=2)+"\n", encoding="utf-8")

          print("GoalOS public site release v4 complete.")
          print("Web root:", WEB_ROOT)
          print("Pages written:", len(REPORT["pages_written"]))
          print("HTML repaired:", len(REPORT["html_repaired"]))
          print("Allowed public packages:", len(allowed))
          print("Validation: passed")
          PY

          python3 "$RUNNER_TEMP/goalos_public_site_release_v4.py"

      - name: Run public site validation
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi

          cat > "$RUNNER_TEMP/validate_goalos_public_site_v4.py" <<'PY'
          from pathlib import Path
          import re, sys

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")
          BASE = "/proof-gradient"
          errors = []

          def is_public_standard_package(rel):
              rel = rel.replace("\\", "/").lower()
              return re.fullmatch(r"standards/aep-[0-9]{3}/complete-package\.zip", rel) is not None

          blocked_terms = [
              "buyer", "buyer_official", "complete_bundle", "delivery_kit", "seller_assets",
              "master_pack", "commercialization_ready", "quick_launch", "opulent_institutional",
              "institutional_boardroom", "implementation_sprint", "enterprise_rsi_pilot",
              "workshop_v", "buyer_facilitator"
          ]

          for html in sorted(WEB_ROOT.rglob("*.html")):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              if text.count("GOALOS-CANONICAL-SHELL:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-SHELL:START')} canonical shells")
              if text.count("GOALOS-CANONICAL-FOOTER:START") != 1:
                  errors.append(f"{html.relative_to(WEB_ROOT)} has {text.count('GOALOS-CANONICAL-FOOTER:START')} canonical footers")
              for old in ["GOALOS-COMPLETE-NAV","GOALOS-PRODUCT-LADDER-NAV","GOALOS-UNIFIED-SHELL","GOALOS-CLOUD-MVP:START","GOALOS-CLOUD-MVP-V02:START"]:
                  if old in text:
                      errors.append(f"{html.relative_to(WEB_ROOT)} still has old marker {old}")

          for html in WEB_ROOT.rglob("*.html"):
              if "_archive" in html.parts:
                  continue
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                  target = m.group(1)[len(BASE):] or "/"
                  fs = WEB_ROOT / target.lstrip("/")
                  if target.endswith("/"):
                      fs = fs / "index.html"
                  if not fs.exists():
                      errors.append(f"Broken link in {html.relative_to(WEB_ROOT)} -> {m.group(1)}")

          for p in WEB_ROOT.rglob("*"):
              if not p.is_file() or "_archive" in p.parts:
                  continue
              rel = p.relative_to(WEB_ROOT).as_posix()
              name = p.name.lower()
              if name.endswith(".zip") and not is_public_standard_package(rel):
                  errors.append(f"Paid/private ZIP detected in public site: {rel}")
              if any(term in name for term in blocked_terms):
                  if not name.endswith((".md",".html",".json",".txt",".yml",".yaml",".css",".js",".svg")):
                      errors.append(f"Suspicious paid/private artifact detected: {rel}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("GoalOS public site validation v4 passed.")
          PY

          python3 "$RUNNER_TEMP/validate_goalos_public_site_v4.py"

          if [ -f "$WEB_ROOT/app/goalos-cloud-mvp/tests/enterprise-core.test.mjs" ]; then
            node "$WEB_ROOT/app/goalos-cloud-mvp/tests/enterprise-core.test.mjs"
          else
            echo "Cloud MVP Node test not found; skipping because app may be installed by separate workflow."
          fi

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit public site release
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT" docs || true
          if git diff --cached --quiet; then
            echo "No public site changes to commit."
          else
            git commit -m "Release bilingual GoalOS public site v4 [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
