color:var(--text)}.loop{display:inline-flex;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);background:rgba(255,215,106,.08);padding:10px 14px;font-weight:950;margin:12px 0}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:24px}.steps div{border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(255,255,255,.045)}.steps strong{display:block;color:var(--gold);font-size:13px;margin-bottom:8px}.steps span{color:var(--muted);font-size:14px;line-height:1.35}.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table td,.table th{padding:14px;background:rgba(255,255,255,.055);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;color:var(--muted);vertical-align:top}.table th{color:var(--text)}.table td:first-child,.table th:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}.table td:last-child,.table th:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}.search input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:#080b13;color:var(--text);font-size:17px;outline:none}.footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:13px;background:rgba(5,7,13,.78)}.footer-inner{width:min(1280px,calc(100% - 36px));margin:0 auto;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}.footer a{color:var(--muted);text-decoration:none;margin-right:14px}@media(max-width:1020px){.grid,.grid.two,.steps{grid-template-columns:1fr}.goalos-links{display:none}.wrap{padding-top:42px}.loop{display:flex;white-space:normal;border-radius:22px}}
