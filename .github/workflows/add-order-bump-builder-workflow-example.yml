name: Add Order Bump Builder Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: order-bump-builder-workflow-example
  cancel-in-progress: false

jobs:
  add-order-bump-example:
    name: Add order-bump-builder workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create order-bump-builder workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "order-bump-builder"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "order-bump-builder"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · CHECKOUT LOOP</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn one sale</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a larger cart.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Main kit → Order bump → Microcopy → Terms → Proof note</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 14:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Main offer → ethical order bump</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Increase value per buyer with a clear add-on, not pressure or dark patterns.</text>
          </svg>"""
          (assets_dir / "order-bump-builder-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough order bump notes:
          Main product: GoalOS AI Efficiency Sprint Kit
          Main price: $49
          Possible add-on: Proof Page Template Pack
          Add-on price: $29
          Goal: make a simple checkout add-on that is useful, clear, and not pushy
          Buyer situation: they are already buying the kit and may want more proof-page examples
          What add-on includes:
          - 10 proof-page templates
          - 10 claim-boundary examples
          - 10 public-safe proof-card examples
          - 5 before/after examples
          - copy-paste proof-note prompts
          Rules:
          - no fake urgency
          - no fake scarcity
          - no income guarantee
          - no ROI guarantee
          - no forced continuity
          - no pre-checked checkbox
          - make it easy to say no
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Order Bump Name:
          Proof Page Template Pack

          Short Checkout Copy:
          Add the Proof Page Template Pack for $29.

          Get extra examples that make your first proof page easier to finish:

          - 10 proof-page templates
          - 10 claim-boundary examples
          - 10 public-safe proof-card examples
          - 5 before/after examples
          - copy-paste proof-note prompts

          Best if:
          You want more examples before building your first proof page.

          Skip if:
          You only want the basic kit today.

          Microcopy Under Checkbox:
          Optional add-on. You can continue with only the $49 kit.

          Confirmation Text:
          You added the Proof Page Template Pack.

          You will receive:
          - GoalOS AI Efficiency Sprint Kit
          - Proof Page Template Pack

          Both are digital educational products delivered instantly.

          FAQ:
          Q: Do I need this add-on?
          A: No. The main kit includes a proof page template. The add-on simply gives you more examples.

          Q: Is this a subscription?
          A: No. This is a one-time digital add-on.

          Q: Can I buy the main kit without it?
          A: Yes. The add-on is optional.

          Q: Can I get a refund if I change my mind?
          A: Digital products are delivered instantly. Sales are final once delivered, except where required by law or for duplicate charges / technical access failures.

          Claims To Avoid:
          - “This will increase your income.”
          - “Guaranteed ROI.”
          - “Only available today” unless actually true and properly explained.
          - “You need this to use the kit.”
          - “No refunds ever under any circumstances.”
          - Pre-checking the add-on box without clear consent."""

          proof_note = """Proof note:
          Source: rough order bump notes.
          Outputs created: order bump name, checkout copy, microcopy, confirmation text, FAQ, claims-to-avoid list.
          Claims made: the add-on gives extra proof-page templates and examples.
          Claims avoided: no income guarantee, no ROI guarantee, no fake urgency, no fake scarcity, no forced continuity, no claim that the add-on is required.
          Checkout boundary: add-on should be optional, clearly priced, not pre-checked, and easy to decline.
          Review needed: human should confirm checkout platform settings, add-on files, price, tax settings, and final digital product terms before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Order Bump Builder — GoalOS Workflow Example</title>
            <meta name="description" content="Turn a main product into a clear optional order bump with checkout copy, FAQ, terms, and proof note." />
            <meta property="og:title" content="Turn one sale into a larger cart." />
            <meta property="og:description" content="Main kit → order bump → microcopy → terms → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/order-bump-builder-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Checkout Loop · Example 14</div>
              <h1>Turn one sale into a larger cart.</h1>
              <p class="lead">This reusable AI workflow turns a main product and add-on idea into a clear optional order bump: name, checkout copy, microcopy, confirmation text, FAQ, claims-to-avoid list, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/checkout-recovery/">Example 13: checkout recovery</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Add more value at checkout without pressure.</div>
                <p class="lead">An order bump should be optional, clearly priced, easy to decline, and directly useful to the person already buying.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: one product only</h3>
                    <p>Someone buys the $49 kit. If they want more examples, they must figure that out later or contact you.</p>
                    <p class="mini">Result: lower cart value and more “do you have more examples?” questions.</p>
                  </div>
                  <div class="card">
                    <h3>After: clear optional add-on</h3>
                    <p>The checkout offers a $29 Proof Page Template Pack that is optional, useful, and clearly explained.</p>
                    <p class="mini">Result: higher potential order value without fake urgency or confusion.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the main product, price, add-on, price, and what the add-on includes.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to avoid fake urgency, fake scarcity, forced continuity, and claims that the add-on is required.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your digital product terms and standard “optional add-on” language.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates order bump name, checkout copy, microcopy, confirmation text, FAQ, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the add-on is optional, clearly priced, useful, and easy to decline.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was claimed, what was avoided, and what needs review before checkout.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough order bump notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Order bump name</span>
                  <span class="pill">Checkout copy</span>
                  <span class="pill">Microcopy</span>
                  <span class="pill">Confirmation text</span>
                  <span class="pill">FAQ</span>
                  <span class="pill">Claims to avoid</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for higher cart value</h3><p>Offer a useful add-on to people already buying.</p></div>
                  <div class="card"><h3>No dark patterns</h3><p>The workflow avoids fake urgency, pre-checked boxes, and unclear continuity.</p></div>
                  <div class="card"><h3>Lower support risk</h3><p>The FAQ explains what is included, whether it is required, and what the terms are.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste add-on notes. Get clear checkout copy and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, advertising, endorsement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Review checkout rules, platform terms, pricing, taxes, and consumer requirements before publishing.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-order-bump-builder-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- ORDER-BUMP-BUILDER-EXAMPLE:START -->"
              end = "<!-- ORDER-BUMP-BUILDER-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="order-bump-builder-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Checkout Loop · Example 14</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn one sale into a larger cart.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste add-on notes. Get optional order bump copy, microcopy, FAQ, terms language, claims-to-avoid list, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/order-bump-builder/">See the order bump workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit order-bump-builder example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add order-bump-builder workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
