name: Add Team Pack Upsell Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: team-pack-upsell-workflow-example
  cancel-in-progress: false

jobs:
  add-team-pack-example:
    name: Add team-pack-upsell workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create team-pack-upsell workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "team-pack-upsell"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "team-pack-upsell"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · UPGRADE LOOP</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn one buyer</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a team rollout.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Individual kit → Team Pack → Workshop agenda → Rollout email → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 15:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Individual purchase → Team Pack upgrade</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Increase lifetime value by helping one buyer bring the workflow to their team.</text>
          </svg>"""
          (assets_dir / "team-pack-upsell-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough Team Pack upsell notes:
          Main product: GoalOS AI Efficiency Sprint Kit
          Main price: $49
          Upsell product: GoalOS AI Efficiency Sprint Team Pack
          Upsell price: $199
          Buyer situation: they bought or are buying the individual kit and may want to use the method with coworkers, clients, students, or a small team
          Goal: create a clear Team Pack upgrade page / post-purchase upsell that is useful and not pushy
          Team Pack includes:
          - everything in the individual kit
          - team workshop agenda
          - manager facilitation guide
          - team workflow inventory sheet
          - role assignment sheet
          - proof-room-lite template
          - rollout checklist
          - internal adoption email templates
          - team scoring rubric
          Rules:
          - no fake urgency
          - no fake scarcity
          - no income guarantee
          - no ROI guarantee
          - no claim that the Team Pack is required
          - no forced continuity
          - make it easy to decline
          - clear digital product terms
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Team Pack Upsell Headline:
          Want to run the sprint with a team?

          Subheadline:
          The individual kit helps one person build one reusable AI workflow.

          The Team Pack helps a group run the same sprint together.

          Upgrade Copy:
          If you want to use GoalOS with coworkers, clients, students, or a small team, the Team Pack gives you the extra materials to make the sprint easier to run with other people.

          You get:
          - everything in the individual kit
          - team workshop agenda
          - manager facilitation guide
          - team workflow inventory sheet
          - role assignment sheet
          - proof-room-lite template
          - rollout checklist
          - internal adoption email templates
          - team scoring rubric

          Best if:
          - you want to run a team AI workflow session
          - you manage a small team
          - you teach or advise others
          - you want shared templates instead of everyone working alone

          Skip if:
          - you only want to build one personal workflow today
          - you do not need team materials
          - you are not ready to involve other people

          Button Copy:
          Yes, upgrade to the Team Pack

          Decline Copy:
          No thanks, continue with the individual kit.

          Post-Purchase Email:
          Subject: Want to run this with a team?

          You now have the GoalOS AI Efficiency Sprint Kit.

          If you want to bring the method to a team, the Team Pack adds:

          - team workshop agenda
          - manager guide
          - team workflow inventory
          - role assignment sheet
          - proof-room-lite template
          - rollout checklist
          - internal adoption email templates

          Use the individual kit first if you are starting alone.

          Upgrade only if you want to run the sprint with other people.

          FAQ:
          Q: Do I need the Team Pack to use the individual kit?
          A: No. The individual kit is enough to build one reusable workflow.

          Q: Is the Team Pack a subscription?
          A: No. It is a one-time digital team kit.

          Q: Does the Team Pack include live consulting?
          A: No. It is a self-serve digital product.

          Q: Can I get a refund if I change my mind?
          A: Digital products are delivered instantly. Sales are final once delivered, except where required by law or for duplicate charges / technical access failures.

          Claims To Avoid:
          - “This will make your team more profitable.”
          - “Guaranteed productivity.”
          - “Guaranteed ROI.”
          - “You need this to use GoalOS.”
          - “Only available today” unless actually true and clearly explained.
          - “No refunds ever under any circumstances.”"""

          proof_note = """Proof note:
          Source: rough Team Pack upsell notes.
          Outputs created: upsell headline, upgrade copy, best-if / skip-if sections, button copy, decline copy, post-purchase email, FAQ, claims-to-avoid list.
          Claims made: the Team Pack provides additional materials for running the sprint with a team.
          Claims avoided: no income guarantee, no ROI guarantee, no fake urgency, no fake scarcity, no forced continuity, no claim that the Team Pack is required.
          Checkout boundary: upgrade should be optional, clearly priced, not pre-selected, and easy to decline.
          Review needed: human should confirm product contents, price, checkout flow, tax settings, and digital product terms before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Team Pack Upsell — GoalOS Workflow Example</title>
            <meta name="description" content="Turn an individual kit purchase into a clear Team Pack upgrade with upsell copy, FAQ, decline option, terms, and proof note." />
            <meta property="og:title" content="Turn one buyer into a team rollout." />
            <meta property="og:description" content="Individual kit → Team Pack → workshop agenda → rollout email → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/team-pack-upsell-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Upgrade Loop · Example 15</div>
              <h1>Turn one buyer into a team rollout.</h1>
              <p class="lead">This reusable AI workflow turns an individual kit purchase into a clear Team Pack upgrade: upsell copy, best-fit guidance, decline copy, post-purchase email, FAQ, claims-to-avoid list, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/order-bump-builder/">Example 14: order bump</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">One buyer can become a team rollout.</div>
                <p class="lead">The individual kit helps one person. The Team Pack helps that person bring the workflow method to coworkers, clients, students, or a small team.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: solo buyer only</h3>
                    <p>Someone buys the $49 kit and likes the method, but there is no clear next step for using it with other people.</p>
                    <p class="mini">Result: lower lifetime value and missed team adoption.</p>
                  </div>
                  <div class="card">
                    <h3>After: optional Team Pack upgrade</h3>
                    <p>The buyer sees a clear, optional Team Pack with workshop agenda, manager guide, role sheet, rollout checklist, and team templates.</p>
                    <p class="mini">Result: higher value without pressure.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the individual product, Team Pack product, prices, buyer situation, and contents.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to avoid fake urgency, forced upgrades, income claims, ROI claims, and “required” language.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your standard upgrade language: optional, self-serve, team materials, clear decline option.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates upsell copy, best-if / skip-if sections, buttons, email, FAQ, claims-to-avoid, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the offer is optional, clearly priced, easy to decline, and not overpromising.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was claimed, what was avoided, and what must be reviewed before checkout.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough Team Pack upsell notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Upsell headline</span>
                  <span class="pill">Upgrade copy</span>
                  <span class="pill">Best-if / skip-if</span>
                  <span class="pill">Button copy</span>
                  <span class="pill">Decline copy</span>
                  <span class="pill">Post-purchase email</span>
                  <span class="pill">FAQ</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for LTV</h3><p>Give individual buyers a clear team-level next step.</p></div>
                  <div class="card"><h3>No pressure</h3><p>The workflow makes the upgrade optional, clearly priced, and easy to decline.</p></div>
                  <div class="card"><h3>Team adoption</h3><p>The Team Pack moves from one person using AI better to a group running the same method.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste Team Pack notes. Get optional upgrade copy and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, advertising, endorsement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Review checkout rules, platform terms, pricing, taxes, and consumer requirements before publishing.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-team-pack-upsell-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- TEAM-PACK-UPSELL-EXAMPLE:START -->"
              end = "<!-- TEAM-PACK-UPSELL-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="team-pack-upsell-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Upgrade Loop · Example 15</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn one buyer into a team rollout.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste Team Pack notes. Get optional upgrade copy, best-if / skip-if sections, post-purchase email, FAQ, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/team-pack-upsell/">See the Team Pack workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit team-pack-upsell example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add team-pack-upsell workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
