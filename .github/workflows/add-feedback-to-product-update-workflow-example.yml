name: Add Feedback To Product Update Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feedback-to-product-update-workflow-example
  cancel-in-progress: false

jobs:
  add-feedback-example:
    name: Add feedback-to-product-update workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create feedback-to-product-update workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "feedback-to-product-update"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "feedback-to-product-update"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn feedback</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into product updates.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Feedback → Pattern → Update → Changelog → Email → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 8:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Buyer feedback → product improvement loop</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Every repeated question can become a better product, better FAQ, or better template.</text>
          </svg>"""
          (assets_dir / "feedback-to-product-update-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough feedback notes:
          Product: GoalOS AI Efficiency Sprint Kit
          Recent buyer/support feedback:
          - People ask which task to choose first.
          - Some buyers are confused by “proof note.”
          - Some people want examples for consultants.
          - Some people ask whether this is just prompts.
          - Some people want a simpler one-page checklist.
          Goal: turn feedback into product improvements and a public update.
          Important: do not invent testimonials, do not claim buyers achieved results unless verified, do not reveal private buyer messages.
          Needed output: feedback themes, product update plan, new template idea, changelog, buyer update email, social post, proof note."""

          output_example = """Feedback Themes:
          1. Buyers need help choosing their first task.
          2. “Proof note” needs a simpler explanation.
          3. Consultants want a dedicated example.
          4. Some buyers still confuse the kit with a prompt pack.
          5. A one-page checklist would reduce friction.

          Product Update Plan:
          Update 1:
          Add a “Pick Your First Workflow” one-page checklist.

          Update 2:
          Add a plain-language “What is a proof note?” page.

          Update 3:
          Add a consultant example:
          Client call notes → proposal outline → follow-up email → proof note.

          Update 4:
          Add a comparison table:
          Prompt pack vs. reusable workflow.

          Changelog:
          GoalOS AI Efficiency Sprint Kit — Update

          New:
          - Pick Your First Workflow checklist
          - What Is A Proof Note? explainer
          - Consultant workflow example
          - Prompt pack vs. reusable workflow comparison

          Improved:
          - Clearer onboarding language
          - Simpler first-task selection
          - Better explanation of proof notes

          Buyer Update Email:
          Subject: New GoalOS kit update: easier first workflow

          Hi,

          We improved the GoalOS AI Efficiency Sprint Kit based on repeated buyer questions.

          The new update makes it easier to start.

          Added:
          - Pick Your First Workflow checklist
          - What Is A Proof Note? explainer
          - Consultant workflow example
          - Prompt pack vs. reusable workflow comparison

          The goal is simple:
          help you build your first reusable AI workflow with less confusion.

          Social Post:
          Every repeated buyer question is product intelligence.

          If people keep asking:
          “What should I do first?”
          “Is this just prompts?”
          “What is a proof note?”

          That is not a support problem only.

          It is a product improvement signal.

          The GoalOS method:
          feedback
          → pattern
          → product update
          → changelog
          → buyer email
          → proof note

          That is how digital products get better without becoming high-support services."""

          proof_note = """Proof note:
          Source: summarized buyer/support feedback.
          Outputs created: feedback themes, product update plan, changelog, buyer update email, social post.
          Claims made: the product was updated based on repeated question themes.
          Claims avoided: no fake testimonial, no invented buyer result, no private buyer message, no income guarantee, no ROI guarantee.
          Privacy boundary: do not publish names, emails, screenshots, private support messages, or exact buyer quotes unless explicitly permitted.
          Review needed: human should confirm the updates actually exist before sending the changelog.
          Public-safe: yes, if feedback is summarized and anonymized."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Feedback to Product Update — GoalOS Workflow Example</title>
            <meta name="description" content="Turn buyer feedback and support patterns into product updates, changelogs, buyer emails, social posts, and proof notes." />
            <meta property="og:title" content="Turn feedback into product updates." />
            <meta property="og:description" content="Feedback → pattern → product update → changelog → buyer email → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/feedback-to-product-update-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 8</div>
              <h1>Turn feedback into product updates.</h1>
              <p class="lead">This reusable AI workflow turns repeated buyer questions and support patterns into product improvements, changelogs, buyer update emails, social posts, and proof notes — without inventing testimonials or exposing private messages.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/support-faq-triage/">Example 7: support FAQ</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Every repeated question is product intelligence.</div>
                <p class="lead">If buyers keep asking the same thing, that is not just support. It is a signal for the next checklist, explainer, example, FAQ, or product update.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: feedback gets lost</h3>
                    <p>Support questions pile up. Useful patterns stay in your inbox. Product updates happen randomly.</p>
                    <p class="mini">Result: more confusion, more repeated support, slower improvement.</p>
                  </div>
                  <div class="card">
                    <h3>After: feedback becomes updates</h3>
                    <p>The workflow summarizes patterns, proposes product updates, drafts a changelog, writes a buyer email, and creates a proof note.</p>
                    <p class="mini">Result: the product improves without turning into custom service.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the product, recent support questions, buyer confusion, and update goal.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to invent testimonials, results, buyer names, or private quotes.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your product promise, support boundaries, and standard changelog format.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI extracts themes, proposes updates, writes a changelog, drafts a buyer email, creates a social post, and records proof.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks that updates are real, feedback is anonymized, and no buyer claim is invented.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was updated, what was claimed, what was avoided, and what needs review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough feedback notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Feedback themes</span>
                  <span class="pill">Product update plan</span>
                  <span class="pill">New template idea</span>
                  <span class="pill">Changelog</span>
                  <span class="pill">Buyer update email</span>
                  <span class="pill">Social post</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Compounding product</h3><p>Repeated questions become reusable assets instead of one-off replies.</p></div>
                  <div class="card"><h3>Lower support over time</h3><p>Every pattern can become a better checklist, FAQ, example, or onboarding step.</p></div>
                  <div class="card"><h3>Public-safe updates</h3><p>The workflow summarizes feedback without leaking buyer names, emails, or private messages.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste buyer feedback. Get product updates, changelog, buyer email, and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Do not publish private buyer messages, names, emails, or testimonials without appropriate permission.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
              <a class="card" href="feedback-to-product-update/"><h3>Example 8: Feedback → product update</h3><p>Turn buyer feedback into product improvements, changelog, buyer email, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-feedback-to-product-update-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- FEEDBACK-TO-PRODUCT-UPDATE-EXAMPLE:START -->"
              end = "<!-- FEEDBACK-TO-PRODUCT-UPDATE-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="feedback-to-product-update-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 8</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn feedback into product updates.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste buyer feedback. Get themes, product updates, changelog, buyer email, social post, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/feedback-to-product-update/">See the feedback workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit feedback-to-product-update example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add feedback-to-product-update workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
