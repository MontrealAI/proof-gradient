name: Add Internal Approval Memo Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: internal-approval-memo-workflow-example
  cancel-in-progress: false

jobs:
  add-internal-approval-example:
    name: Add internal-approval-memo workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create internal-approval-memo workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "internal-approval-memo"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "internal-approval-memo"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · B2B LOOP</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn interest</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into approval.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Buyer note → Manager memo → Procurement email → Rollout plan → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 16:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Interested employee → internal approval memo</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Help one internal champion explain the kit clearly to a manager or budget owner.</text>
          </svg>"""
          (assets_dir / "internal-approval-memo-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough internal approval notes:
          Product: GoalOS AI Efficiency Sprint Team Pack
          Price: $199
          Buyer: employee, consultant, team lead, teacher, or manager who wants approval to buy the Team Pack
          Audience: manager, budget owner, procurement person, or team lead
          Goal: make it easy to request approval without hype
          Use case: run a 60-minute team session to turn one repeated AI task into a reusable workflow
          Team Pack includes:
          - individual kit
          - team workshop agenda
          - manager facilitation guide
          - team workflow inventory
          - role assignment sheet
          - proof-room-lite template
          - rollout checklist
          - internal adoption email templates
          - team scoring rubric
          Rules:
          - no guaranteed ROI
          - no guaranteed productivity
          - no legal/compliance claims
          - no fake urgency
          - no fake testimonials
          - no claim that approval is automatic
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Internal Approval Memo:
          Subject: Request to purchase GoalOS AI Efficiency Sprint Team Pack

          I would like approval to purchase the GoalOS AI Efficiency Sprint Team Pack.

          Purpose:
          Use the kit to run a 60-minute internal session where we turn one repeated AI task into a reusable workflow.

          Why this may help:
          Our team often repeats the same AI-assisted tasks from scratch. The Team Pack gives us a simple structure for turning one repeated task into a reusable workflow with:

          - context
          - rules
          - memory
          - workflow steps
          - checks
          - proof note

          Proposed first use case:
          Turn our recurring meeting notes or customer replies into a reusable workflow.

          What is included:
          - individual sprint kit
          - team workshop agenda
          - manager facilitation guide
          - team workflow inventory
          - role assignment sheet
          - proof-room-lite template
          - rollout checklist
          - internal adoption email templates
          - team scoring rubric

          Cost:
          $199 one-time digital product.

          Important boundaries:
          This is a self-serve digital product.
          It does not guarantee productivity, ROI, income, legal compliance, or perfect accuracy.
          Outputs still require human review.

          Suggested next step:
          Approve purchase and run one 60-minute pilot session with one repeated task.

          Procurement / Purchase Email:
          Hi,

          We would like to purchase the GoalOS AI Efficiency Sprint Team Pack.

          Product:
          GoalOS AI Efficiency Sprint Team Pack

          Price:
          $199

          Purpose:
          Internal team AI workflow training / reusable workflow development.

          Please confirm the preferred purchase method.

          Thanks.

          Mini Rollout Plan:
          1. Choose one repeated team task.
          2. Invite 3–6 people involved in that task.
          3. Run the 60-minute sprint.
          4. Build one reusable workflow.
          5. Add checks.
          6. Create a proof note.
          7. Decide whether to repeat with another task.

          Manager FAQ:
          Q: Is this software?
          A: It is a digital workflow kit, not enterprise software.

          Q: Does it guarantee productivity?
          A: No. It provides a structured method and templates. Results depend on use and review.

          Q: Does it replace policy or compliance review?
          A: No. It is not legal, financial, medical, employment, security, or compliance advice.

          Q: Why not just use ChatGPT?
          A: ChatGPT is the tool. The kit helps the team build a reusable workflow around repeated work instead of starting from scratch every time.

          Q: Is this a subscription?
          A: No. The Team Pack is a one-time digital kit."""

          proof_note = """Proof note:
          Source: rough internal approval notes.
          Outputs created: internal approval memo, procurement email, rollout plan, manager FAQ.
          Claims made: the Team Pack provides materials to run a team sprint and build one reusable workflow.
          Claims avoided: no guaranteed ROI, no guaranteed productivity, no compliance claim, no legal advice, no automatic approval claim.
          Review needed: human should confirm internal purchasing rules, exact product contents, budget authority, and digital product terms before sending.
          Public-safe: yes, if internal company details are removed."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Internal Approval Memo — GoalOS Workflow Example</title>
            <meta name="description" content="Turn interest in the Team Pack into an internal approval memo, procurement email, rollout plan, manager FAQ, and proof note." />
            <meta property="og:title" content="Turn interest into approval." />
            <meta property="og:description" content="Buyer note → manager memo → procurement email → rollout plan → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/internal-approval-memo-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · B2B Loop · Example 16</div>
              <h1>Turn interest into approval.</h1>
              <p class="lead">This reusable AI workflow turns one interested employee, consultant, teacher, or team lead into an internal champion with a manager memo, procurement email, rollout plan, FAQ, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/team-pack-upsell/">Example 15: Team Pack upsell</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">A team buyer often needs approval before buying.</div>
                <p class="lead">Instead of making an interested person explain everything from scratch, give them a reusable workflow that creates the approval memo for them.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: internal friction</h3>
                    <p>Someone wants the Team Pack but must explain it to a manager, budget owner, or procurement person. They hesitate or never ask.</p>
                    <p class="mini">Result: interest disappears before purchase.</p>
                  </div>
                  <div class="card">
                    <h3>After: approval workflow</h3>
                    <p>The workflow creates a clear internal memo, procurement email, rollout plan, manager FAQ, and proof note.</p>
                    <p class="mini">Result: easier team purchase without manual sales calls.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the product, price, buyer role, approval audience, team use case, and contents.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to promise ROI, productivity, compliance, or automatic approval.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the standard explanation: ChatGPT is the tool; GoalOS helps the team build reusable workflows around repeated work.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates the manager memo, procurement email, rollout plan, manager FAQ, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the memo is clear, calm, specific, and not overpromising.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was claimed, what was avoided, and what needs internal review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough internal approval notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Manager memo</span>
                  <span class="pill">Procurement email</span>
                  <span class="pill">Rollout plan</span>
                  <span class="pill">Manager FAQ</span>
                  <span class="pill">Claim boundary</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for B2B demand</h3><p>Help internal champions explain the Team Pack to decision-makers.</p></div>
                  <div class="card"><h3>No inflated claims</h3><p>The workflow avoids ROI, productivity, and compliance promises.</p></div>
                  <div class="card"><h3>Low-touch selling</h3><p>Buyers can self-serve the approval request instead of booking a call.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste approval notes. Get a manager memo and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS Team Pack</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-008/">See the Proof Room Standard</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, procurement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, productivity, or business-results guarantee. Review internal purchase rules and product terms before sending.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof."),
              "internal-approval-memo": ("Example 16: Interest → approval memo", "Turn an interested internal champion into a manager memo, procurement email, rollout plan, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-internal-approval-memo-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- INTERNAL-APPROVAL-MEMO-EXAMPLE:START -->"
              end = "<!-- INTERNAL-APPROVAL-MEMO-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="internal-approval-memo-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · B2B Loop · Example 16</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn interest into approval.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste internal approval notes. Get a manager memo, procurement email, rollout plan, FAQ, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/internal-approval-memo/">See the approval memo workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit internal-approval-memo example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add internal-approval-memo workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
