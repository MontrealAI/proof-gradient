name: AEP-006 Rollback Receipt Conformance CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-aep006:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate sample Rollback Receipts
        run: |
          set -euo pipefail
          if [ -d docs/standards/AEP-006/examples ]; then
            python docs/standards/AEP-006/tools/validate_rollback_receipt.py docs/standards/AEP-006/examples/sample_rollback_receipt_success.json
            python docs/standards/AEP-006/tools/rollback_audit.py docs/standards/AEP-006/examples/sample_rollback_plan.json docs/standards/AEP-006/examples/sample_rollback_receipt_success.json docs/standards/AEP-006/examples/sample_rollback_verification.json
          fi
