name: Add Department Proof Room Lite Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: department-proof-room-lite-workflow-example
  cancel-in-progress: false

jobs:
  add-department-proof-room-lite-example:
    name: Add department-proof-room-lite workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create department-proof-room-lite workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "department-proof-room-lite"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "department-proof-room-lite"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · PROOF ROOM LITE</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn department AI chaos</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a proof room.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Task inventory → Charter → Roles → Workflows → Checks → Proof dashboard</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 18:</text>
          <text x="390" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Department Pack → Proof Room Lite</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Move from one team workflow to a department-level AI operating room.</text>
          </svg>"""
          (assets_dir / "department-proof-room-lite-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough Department Pack / Proof Room Lite notes:
          Product: GoalOS Department Pack / Proof Room Lite
          Price idea: $499 to $999 self-serve digital department kit
          Buyer: department lead, operations lead, innovation lead, AI champion, or small-business manager
          Goal: organize a department's repeated AI work without hiring consultants
          Department: customer success / operations
          Team size: 8 to 25 people
          Problem:
          - people use AI differently
          - repeated tasks are not documented
          - no shared rules
          - no proof that outputs were checked
          - no clear owner for each workflow
          - no rollback / correction process
          Need output:
          - department AI task inventory
          - top 3 workflow priorities
          - Proof Room Lite charter
          - role assignments
          - 30-day rollout plan
          - proof dashboard fields
          - manager update email
          - proof note
          Rules:
          - no guaranteed ROI
          - no guaranteed productivity
          - no legal/compliance certification
          - no claim that AI outputs are safe without human review
          - no private customer data in public examples
          Digital product terms:
          instant access; all sales final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Department AI Task Inventory:
          Department: Customer Success / Operations

          Repeated tasks found:
          1. Weekly customer status update
          2. Meeting notes to action plan
          3. Support FAQ replies
          4. Renewal-risk summary
          5. Internal handoff notes
          6. Product feedback summary
          7. Monthly operations report

          Top 3 workflow priorities:
          1. Support FAQ replies
          Why: repeated weekly, high volume, clear support boundary needed.

          2. Meeting notes to action plan
          Why: repeated across the department, easy to standardize.

          3. Product feedback summary
          Why: helps turn repeated customer questions into product updates.

          Proof Room Lite Charter:
          Room name:
          Customer Success AI Workflow Room

          Mission:
          Turn three repeated department AI tasks into reusable workflows with context, rules, checks, owners, and proof notes.

          In scope:
          - support FAQ replies
          - meeting notes to action plans
          - product feedback summaries

          Out of scope:
          - legal advice
          - financial advice
          - employment decisions
          - regulated customer decisions
          - autonomous sending without human review

          Room rules:
          - one workflow owner per workflow
          - no private customer data in public examples
          - every workflow must have checks
          - every output must be reviewed before use
          - every workflow must leave a proof note

          Role assignments:
          Room Owner:
          Department lead

          Workflow Owners:
          Support lead, operations lead, product feedback lead

          Checker:
          Person responsible for reviewing outputs before use

          Proof Keeper:
          Person responsible for proof notes and weekly room summary

          30-Day Rollout Plan:
          Week 1:
          Inventory repeated AI tasks and choose top 3.

          Week 2:
          Build support FAQ workflow and test internally.

          Week 3:
          Build meeting notes workflow and product feedback workflow.

          Week 4:
          Review proof notes, improve templates, decide what to keep, revise, or stop.

          Proof Dashboard Fields:
          - workflow name
          - owner
          - last run date
          - input type
          - output created
          - checks completed
          - issues found
          - correction needed
          - proof note link
          - status: draft / active / needs revision / stopped

          Manager Update Email:
          Subject: Proof Room Lite rollout plan

          We are setting up a lightweight GoalOS Proof Room for three repeated AI-assisted department workflows.

          The goal is not to automate everything.

          The goal is to make repeated AI work more consistent, reviewable, and easier to improve.

          First workflows:
          - support FAQ replies
          - meeting notes to action plans
          - product feedback summaries

          Each workflow will have:
          - owner
          - context
          - rules
          - checks
          - proof note
          - review status

          We will run this for 30 days and review what should continue, change, or stop."""

          proof_note = """Proof note:
          Source: rough Department Pack / Proof Room Lite notes.
          Outputs created: task inventory, top 3 priorities, Proof Room Lite charter, role assignments, 30-day rollout plan, proof dashboard fields, manager update email.
          Claims made: the Department Pack can help organize repeated department AI work into reusable workflows with owners, checks, and proof notes.
          Claims avoided: no guaranteed ROI, no guaranteed productivity, no compliance certification, no claim that AI output is safe without review.
          Review needed: department should confirm internal policy, data boundaries, workflow owners, and review responsibilities before use.
          Public-safe: yes, if department/private/customer details are removed."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Department Proof Room Lite — GoalOS Workflow Example</title>
            <meta name="description" content="Turn department AI chaos into a Proof Room Lite with task inventory, charter, roles, rollout plan, dashboard fields, and proof note." />
            <meta property="og:title" content="Turn department AI chaos into a Proof Room." />
            <meta property="og:description" content="Task inventory → charter → roles → workflows → checks → proof dashboard." />
            <meta property="og:image" content="/proof-gradient/assets/department-proof-room-lite-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Proof Room Lite · Example 18</div>
              <h1>Turn department AI chaos into a Proof Room.</h1>
              <p class="lead">This reusable AI workflow turns scattered department AI use into a lightweight Proof Room: task inventory, workflow priorities, charter, role assignments, 30-day rollout, dashboard fields, manager update, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
                <a class="btn" href="/proof-gradient/workflow/team-sprint-facilitator/">Example 17: team sprint</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/AEP-008/">Proof Room Standard</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">A department does not need random AI use. It needs a room for proof.</div>
                <p class="lead">Proof Room Lite helps a department pick a few repeated AI workflows, assign owners, add checks, and track what is working without becoming a heavy enterprise project.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: scattered AI use</h3>
                    <p>Everyone uses AI differently. Workflows are not documented. Outputs are not consistently checked. Nobody knows what should continue, change, or stop.</p>
                    <p class="mini">Result: useful experiments, but no department system.</p>
                  </div>
                  <div class="card">
                    <h3>After: Proof Room Lite</h3>
                    <p>The department chooses three repeated workflows, assigns owners, sets rules, adds checks, records proof notes, and reviews progress after 30 days.</p>
                    <p class="mini">Result: a lightweight operating room for department AI adoption.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the department, team size, repeated tasks, problems, and desired rollout.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to avoid ROI, productivity, compliance, or safety guarantees.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the Proof Room Lite structure: inventory, charter, roles, workflows, checks, proof dashboard.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates task inventory, priorities, charter, role assignments, rollout plan, dashboard fields, and manager update.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether owners, boundaries, review responsibilities, and proof fields are clear.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was created, what was claimed, what was avoided, and what must be reviewed.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough Department Pack / Proof Room Lite notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">AI task inventory</span>
                  <span class="pill">Top 3 priorities</span>
                  <span class="pill">Proof Room Lite charter</span>
                  <span class="pill">Role assignments</span>
                  <span class="pill">30-day rollout</span>
                  <span class="pill">Proof dashboard fields</span>
                  <span class="pill">Manager update email</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for departments</h3><p>Move from one team workflow to a lightweight department adoption system.</p></div>
                  <div class="card"><h3>Self-serve governance</h3><p>Use owners, checks, proof notes, and dashboard fields instead of heavy consulting.</p></div>
                  <div class="card"><h3>Proof Room Lite</h3><p>Small enough to start, structured enough to be taken seriously.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste department notes. Get a Proof Room Lite rollout and proof.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS Department Pack</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-008/">See the Proof Room Standard</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, procurement, security, or regulatory advice. No income, savings, compliance, safety, accuracy, productivity, or business-results guarantee. Review internal policies, data boundaries, workflow owners, and human-review responsibilities before use.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          EXAMPLE_META = {
              "build-one-reusable-ai-workflow": ("Example 1: Customer question → clear reply", "Turn messy customer questions into clear replies and proof notes."),
              "meeting-to-action-plan": ("Example 2: Meeting notes → action plan", "Turn messy notes into decisions, owners, deadlines, follow-up email, and proof."),
              "idea-to-demand-engine": ("Example 3: One idea → demand engine", "Turn a rough product idea into content, email, sales copy, and proof."),
              "offer-to-sales-page": ("Example 4: Offer notes → sales page", "Turn rough offer notes into a clear product page, FAQ, terms, and proof note."),
              "lead-magnet-email-sequence": ("Example 5: Lead magnet → email sequence", "Turn a free worksheet into opt-in emails, offer clarity, and proof."),
              "post-purchase-onboarding": ("Example 6: Purchase → onboarding", "Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof."),
              "support-faq-triage": ("Example 7: Support questions → self-serve answers", "Turn repeated support questions into FAQ, canned replies, escalation rules, and proof."),
              "feedback-to-product-update": ("Example 8: Feedback → product update", "Turn buyer feedback into product improvements, changelog, buyer email, and proof."),
              "proof-card-referral-loop": ("Example 9: Usage → proof card", "Turn real usage into public-safe proof, social post, referral ask, and permission request."),
              "monthly-workflow-vault-drop": ("Example 10: Requests → Vault drop", "Turn buyer requests into a recurring template library, announcement email, changelog, and proof."),
              "partner-referral-kit": ("Example 11: Partner interest → referral kit", "Turn partner interest into clear promo copy, disclosure language, FAQ, and proof."),
              "weekly-growth-review": ("Example 12: Weekly numbers → growth move", "Turn weekly numbers into a growth experiment, content plan, and proof note."),
              "checkout-recovery": ("Example 13: Checkout signal → recovery sequence", "Turn almost-buyers into clear decisions with calm email, FAQ, terms, and proof."),
              "order-bump-builder": ("Example 14: Main offer → order bump", "Turn an add-on idea into optional checkout copy, FAQ, terms, and proof."),
              "team-pack-upsell": ("Example 15: Individual kit → Team Pack", "Turn one buyer into a team rollout with optional upgrade copy, email, FAQ, and proof."),
              "internal-approval-memo": ("Example 16: Interest → approval memo", "Turn an interested internal champion into a manager memo, procurement email, rollout plan, and proof."),
              "team-sprint-facilitator": ("Example 17: Team Pack → self-run sprint", "Turn a team meeting into a reusable AI workflow session, role assignments, checks, and proof."),
              "department-proof-room-lite": ("Example 18: Department Pack → Proof Room Lite", "Turn scattered department AI use into workflow priorities, roles, checks, dashboard fields, and proof.")
          }

          cards = []
          for slug, (title, desc) in EXAMPLE_META.items():
              folder = examples_dir / slug
              if folder.exists():
                  cards.append(f'<a class="card" href="{slug}/"><h3>{title}</h3><p>{desc}</p></a>')

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              {''.join(cards)}
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-department-proof-room-lite-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- DEPARTMENT-PROOF-ROOM-LITE-EXAMPLE:START -->"
              end = "<!-- DEPARTMENT-PROOF-ROOM-LITE-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="department-proof-room-lite-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Proof Room Lite · Example 18</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn department AI chaos into a Proof Room.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste department AI notes. Get a task inventory, Proof Room Lite charter, role assignments, 30-day rollout, dashboard fields, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/department-proof-room-lite/">See the Proof Room Lite workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the Department Pack</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit department-proof-room-lite example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add department-proof-room-lite workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
