name: GoalOS Public Site Release v8 Intelligent Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    name: Current release package; validate with shared v14 scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate public site with shared rules
        run: python scripts/validate_goalos_public_site.py
      - name: Check paid/private artifact boundary with shared rules
        run: python scripts/check_no_paid_artifacts.py
      - name: Explain obsolete workflow
        run: echo "This legacy release workflow is retained only as a compatibility validator. Use the documented v8 intelligent-assets release path with v14 validation."
