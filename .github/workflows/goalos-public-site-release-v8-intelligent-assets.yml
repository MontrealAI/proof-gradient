name: Validate GoalOS Public Site Release v8 Intelligent Assets (No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    name: Validate v8 intelligent-assets package only; no Pages deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate public site with shared rules
        run: python scripts/validate_goalos_public_site.py
      - name: Check paid/private artifact boundary with shared rules
        run: python scripts/check_no_paid_artifacts.py
      - name: Explain validate-only scope
        run: echo "This workflow validates the v8 intelligent-assets public-site package only. It does not configure, upload, or deploy GitHub Pages. Use the actual autonomous deployment workflow for release."
