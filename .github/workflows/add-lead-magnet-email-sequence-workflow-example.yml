name: Add Lead Magnet Email Sequence Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lead-magnet-email-sequence-workflow-example
  cancel-in-progress: false

jobs:
  add-lead-magnet-example:
    name: Add lead-magnet-email-sequence workflow example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create lead-magnet-email-sequence workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "lead-magnet-email-sequence"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "lead-magnet-email-sequence"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn a free worksheet</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into a sales sequence.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Lead magnet → emails → offer → terms → proof note</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 5:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Free audit → email sequence → checkout-ready demand</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">Build the lowest-friction digital-product funnel without fake claims or spam.</text>
          </svg>"""
          (assets_dir / "lead-magnet-email-sequence-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough funnel notes:
          Free lead magnet: AI Efficiency Audit Worksheet
          Paid product: GoalOS AI Efficiency Sprint Kit
          Price: $49
          Promise: build one reusable AI workflow in under one hour
          Audience: founders, consultants, creators, operators, small teams
          Goal: people download the free worksheet, understand the problem, then buy the kit
          Rules: send only to people who opted in, include unsubscribe, avoid income claims, avoid fake urgency, avoid fake testimonials, clearly say digital product sales are final once delivered except where required by law or for duplicate charges / technical access failures"""

          output_example = """Email 1 — Deliver the free worksheet
          Subject: Your AI Efficiency Audit

          Thanks for requesting the AI Efficiency Audit.

          Use it to find one repeated AI task worth turning into a reusable workflow.

          Look for a task you do every week:
          - answering customer questions
          - summarizing meetings
          - writing updates
          - creating sales copy
          - preparing reports

          The goal is simple:
          stop asking AI from scratch.

          Email 2 — Explain the problem
          Subject: The real AI bottleneck

          Most people do not have an AI access problem.

          They have a workflow problem.

          They open AI.
          Ask for help.
          Edit the answer.
          Close the tab.
          Then repeat the same kind of task again next week.

          That is not leverage.

          A reusable workflow gives the AI:
          context
          rules
          memory
          steps
          checks
          proof

          Email 3 — Show the example
          Subject: One example

          Take customer questions.

          Instead of asking AI from scratch every time, you build one workflow that knows:
          your product
          your tone
          your rules
          your claims
          your limits
          your proof note format

          Now every answer is clearer and easier to review.

          Email 4 — Answer the objection
          Subject: Is this just templates?

          Fair question.

          A template is useful once.
          A workflow is something you can run again.

          The GoalOS kit helps you build the workflow:
          context
          rules
          memory
          steps
          checks
          proof

          That is the difference.

          Email 5 — Present the offer
          Subject: Build your first reusable AI workflow

          The GoalOS AI Efficiency Sprint Kit is a $49 digital kit.

          It helps you pick one repeated AI task and turn it into a reusable workflow in under one hour.

          You get:
          - Start Here guide
          - 60-minute checklist
          - context template
          - rules template
          - memory template
          - workflow template
          - checks template
          - proof page template
          - copy-paste prompts
          - examples

          Email 6 — Final clarity before checkout
          Subject: Before you buy

          This is for you if you want to stop repeating the same AI task manually.

          It is not for you if you expect guaranteed income, guaranteed ROI, legal advice, financial advice, medical advice, or a fully autonomous agent acting without your review.

          This is a digital educational workflow product.
          Access is delivered instantly.
          All sales are final once delivered, except where required by law or for duplicate charges / technical access failures."""

          proof_note = """Proof note:
          Source: rough funnel notes.
          Output created: six-email opt-in sequence.
          Claims made: the kit helps buyers build one reusable AI workflow.
          Claims avoided: no income guarantee, no ROI guarantee, no fake urgency, no fake testimonial, no legal/compliance promise.
          Compliance reminders: send only to people who opted in; include unsubscribe; confirm final wording and checkout terms before publishing.
          Review needed: human should verify email platform settings, consent source, unsubscribe link, product links, and final terms.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Lead Magnet to Email Sequence — GoalOS Workflow Example</title>
            <meta name="description" content="Turn a free worksheet into an opt-in email sequence that explains the problem, builds trust, presents the kit, and includes a proof note." />
            <meta property="og:title" content="Turn a free worksheet into a sales sequence." />
            <meta property="og:description" content="Lead magnet → emails → offer → terms → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/lead-magnet-email-sequence-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 5</div>
              <h1>Turn a free worksheet into a sales sequence.</h1>
              <p class="lead">This reusable AI workflow turns one free lead magnet into a simple opt-in email sequence that teaches the buyer, explains the offer, sets expectations, and creates a proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/offer-to-sales-page/">Example 4: sales page</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">A free download is not the funnel. The follow-up is the funnel.</div>
                <p class="lead">If someone asks for a free worksheet, use a reusable workflow to create a clear, honest email sequence that helps them understand the problem and decide whether the paid kit is right for them.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: freebie with no follow-up</h3>
                    <p>People download the worksheet, but they do not understand the product, the use case, or why the kit exists.</p>
                    <p class="mini">Result: missed demand, weak trust, random follow-up.</p>
                  </div>
                  <div class="card">
                    <h3>After: reusable email workflow</h3>
                    <p>You paste the lead magnet notes into the workflow. It creates a clean opt-in sequence with education, examples, offer, terms, and proof.</p>
                    <p class="mini">Result: automated demand without fake claims or spam.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the free worksheet, paid product, price, audience, and desired next step.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI to use opt-in language, avoid spammy pressure, avoid fake urgency, and avoid income claims.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save the core message: “Stop asking AI from scratch. Build one reusable AI workflow.”</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates delivery email, education email, example email, objection email, offer email, and terms email.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks for clear consent language, unsubscribe reminder, honest claims, and buyer-fit clarity.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what the sequence claims, what it avoids, and what must be reviewed before sending.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough funnel notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Lead magnet delivery</span>
                  <span class="pill">Education email</span>
                  <span class="pill">Example email</span>
                  <span class="pill">Objection email</span>
                  <span class="pill">Offer email</span>
                  <span class="pill">Terms email</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for automated selling</h3><p>The workflow turns one free worksheet into structured follow-up.</p></div>
                  <div class="card"><h3>Lower support burden</h3><p>The sequence explains who the product is for, who it is not for, and what is not promised.</p></div>
                  <div class="card"><h3>Safer demand</h3><p>The proof note keeps track of claims avoided: no fake urgency, fake reviews, income guarantee, or ROI promise.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste lead magnet notes. Get a clean opt-in sales sequence and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Send commercial emails only where you have proper permission and include required unsubscribe / identification information.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-lead-magnet-email-sequence-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- LEAD-MAGNET-EMAIL-SEQUENCE-EXAMPLE:START -->"
              end = "<!-- LEAD-MAGNET-EMAIL-SEQUENCE-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="lead-magnet-email-sequence-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 5</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn a free worksheet into a sales sequence.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste lead magnet notes. Get a clean opt-in email sequence that teaches, explains, sells, sets terms, and leaves proof.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/lead-magnet-email-sequence/">See the email sequence workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit lead-magnet-email-sequence example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add lead-magnet-email-sequence workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
