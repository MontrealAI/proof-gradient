name: OBSOLETE — do not run — v12 public-site release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goalos-public-site-release-v12-obsolete-validate-only
  cancel-in-progress: false

jobs:
  validate-only:
    name: Obsolete v12 path; validate only and do not deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Explain obsolete workflow
        run: |
          echo "This obsolete v12 workflow is validate-only and cannot deploy GitHub Pages."
          echo "Use GoalOS Validation Hotfix v14 Microsite Compatibility, then the GoalOS Public Site Release v8 Intelligent Assets path."
      - name: Validate public site classification and shell rules
        run: python scripts/validate_goalos_public_site.py
      - name: Check paid/private artifact boundary
        run: python scripts/check_no_paid_artifacts.py
      - name: Validate docs tables and figures
        run: python scripts/validate_docs_tables_figures.py
      - name: Validate GoalOS catalog
        run: python scripts/validate_goalos_catalog.py
