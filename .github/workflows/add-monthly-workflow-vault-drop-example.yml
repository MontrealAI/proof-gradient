name: Add Monthly Workflow Vault Drop Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monthly-workflow-vault-drop-example
  cancel-in-progress: false

jobs:
  add-vault-drop-example:
    name: Add monthly-workflow-vault-drop example
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create monthly-workflow-vault-drop example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "monthly-workflow-vault-drop"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "monthly-workflow-vault-drop"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · WORKFLOW VAULT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn demand</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into monthly drops.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Requests → Vault drop → Email → Upgrade → Changelog → Proof</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 10:</text>
          <text x="370" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Buyer requests → recurring template library</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">The one-time kit becomes a recurring Workflow Vault without custom service.</text>
          </svg>"""
          (assets_dir / "monthly-workflow-vault-drop-card.svg").write_text(svg, encoding="utf-8")

          rough_notes = """Rough subscription notes:
          Product: GoalOS Workflow Vault
          Price idea: $29/month individual or $99/month team
          Purpose: recurring template library for people who already understand the $49 kit
          Buyer requests:
          - more workflows for consultants
          - more workflows for creators
          - more workflows for small teams
          - more proof-page examples
          - monthly updates instead of custom support
          Goal: create one monthly Vault drop with new templates, announcement email, upgrade section, social post, changelog, and proof note.
          Important:
          - no income guarantee
          - no ROI guarantee
          - no fake scarcity
          - no fake testimonials
          - no promise of custom work
          - subscription can be cancelled before future billing
          - delivered digital content is final except where required by law or for duplicate charges / technical access failures"""

          output_example = """Monthly Vault Drop:
          GoalOS Workflow Vault — Monthly Drop 001

          Theme:
          Turn repeated business communication into reusable AI workflows.

          New workflows included:
          1. Consultant discovery call → proposal outline → follow-up email → proof note
          2. Creator content idea → content calendar → post pack → proof note
          3. Small-team weekly update → summary → blockers → next actions → proof note

          New proof templates:
          - Proof page for client-facing work
          - Proof note for meeting follow-up
          - Claim boundary for public posts

          Announcement Email:
          Subject: New Workflow Vault drop: 3 reusable workflows

          This month’s GoalOS Workflow Vault drop is focused on repeated business communication.

          New workflows:
          - consultant discovery call workflow
          - creator content calendar workflow
          - weekly team update workflow

          Each workflow includes:
          context
          rules
          memory
          steps
          checks
          proof note

          The goal is not more random prompts.

          The goal is to build reusable AI work systems.

          Upgrade Section:
          Already using the $49 GoalOS AI Efficiency Sprint Kit?

          The Workflow Vault gives you new reusable workflow examples every month.

          Use it if you want more examples, more templates, and more proof-page patterns without waiting for custom support.

          Social Post:
          The one-time AI kit teaches the method.

          The Workflow Vault keeps adding examples.

          That is the ladder:

          $49 kit
          → learn the system
          → build one workflow
          → join the Vault
          → get new workflow drops monthly

          Not custom consulting.
          Not prompt spam.

          Reusable work systems.

          Changelog:
          GoalOS Workflow Vault — Drop 001

          Added:
          - Consultant discovery call workflow
          - Creator content calendar workflow
          - Weekly team update workflow
          - 3 proof-note examples
          - 3 claim-boundary examples

          Not included:
          - custom implementation
          - personal workflow review
          - guaranteed business results"""

          proof_note = """Proof note:
          Source: rough subscription / vault notes.
          Outputs created: monthly drop outline, announcement email, upgrade section, social post, changelog.
          Claims made: the Workflow Vault provides recurring workflow examples and templates.
          Claims avoided: no income guarantee, no ROI guarantee, no fake scarcity, no fake testimonial, no custom-service promise.
          Subscription boundary: buyers should be told how billing works, how to cancel future billing, and what happens to already-delivered digital content.
          Review needed: human should confirm price, billing platform, cancellation settings, delivered assets, and final terms before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Monthly Workflow Vault Drop — GoalOS Workflow Example</title>
            <meta name="description" content="Turn buyer requests into a recurring Workflow Vault drop with templates, announcement email, upgrade section, changelog, social post, and proof note." />
            <meta property="og:title" content="Turn demand into monthly workflow drops." />
            <meta property="og:description" content="Requests → Vault drop → email → upgrade → changelog → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/monthly-workflow-vault-drop-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · Workflow Vault · Example 10</div>
              <h1>Turn demand into monthly workflow drops.</h1>
              <p class="lead">This reusable AI workflow turns buyer requests into a monthly Workflow Vault drop: new templates, announcement email, upgrade section, changelog, social post, and proof note.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/proof-card-referral-loop/">Example 9: proof card loop</a>
                <a class="btn" href="/proof-gradient/examples/">All examples</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">The kit teaches the method. The Vault compounds the examples.</div>
                <p class="lead">A recurring library lets buyers keep getting useful workflow examples without turning you into a custom consultant.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: one-time sale only</h3>
                    <p>A buyer gets the $49 kit. If they want more examples, they email you, ask for support, or disappear.</p>
                    <p class="mini">Result: one-time revenue or manual service pressure.</p>
                  </div>
                  <div class="card">
                    <h3>After: recurring Vault drop</h3>
                    <p>Repeated buyer requests become monthly template drops with clear boundaries: examples, not custom implementation.</p>
                    <p class="mini">Result: recurring value without unlimited support.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI the subscription idea, audience, pricing, buyer requests, and monthly theme.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI not to promise custom work, guaranteed income, guaranteed ROI, or fake scarcity.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your standard Vault format: theme, new workflows, proof templates, email, changelog, proof note.</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates the monthly drop, announcement email, upgrade section, social post, changelog, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the drop is concrete, reusable, correctly scoped, and not overpromising.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what was created, what was claimed, what was avoided, and what must be reviewed.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough subscription notes:</p>
                <pre>{rough_notes}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Monthly drop outline</span>
                  <span class="pill">New workflow templates</span>
                  <span class="pill">Proof templates</span>
                  <span class="pill">Announcement email</span>
                  <span class="pill">Upgrade section</span>
                  <span class="pill">Social post</span>
                  <span class="pill">Changelog</span>
                  <span class="pill">Proof note</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Built for recurring revenue</h3><p>Turn repeated requests into a monthly template library.</p></div>
                  <div class="card"><h3>Low support boundary</h3><p>The Vault provides examples and templates, not custom implementation.</p></div>
                  <div class="card"><h3>Compounding value</h3><p>Every month adds more reusable workflows, proof notes, and claim-boundary examples.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product and subscription terms</h2>
                <p class="lead">Suggested low-friction wording: digital product, instant access, delivered content is final once accessed except where required by law or for duplicate charges / technical access failures. For subscriptions, buyers can cancel future billing according to the terms shown at checkout.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste buyer requests. Get a monthly Vault drop and proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Buyers should review subscription terms, cancellation rules, and delivered digital content policies before purchase.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
              <a class="card" href="offer-to-sales-page/"><h3>Example 4: Offer notes → sales page</h3><p>Turn rough offer notes into a clear product page, FAQ, terms, and proof note.</p></a>
              <a class="card" href="lead-magnet-email-sequence/"><h3>Example 5: Lead magnet → email sequence</h3><p>Turn a free worksheet into opt-in emails, offer clarity, and proof.</p></a>
              <a class="card" href="post-purchase-onboarding/"><h3>Example 6: Purchase → onboarding</h3><p>Turn a digital-product purchase into delivery, activation, upsell, support boundary, and proof.</p></a>
              <a class="card" href="support-faq-triage/"><h3>Example 7: Support questions → self-serve answers</h3><p>Turn repeated support questions into FAQ, canned replies, escalation rules, and proof.</p></a>
              <a class="card" href="feedback-to-product-update/"><h3>Example 8: Feedback → product update</h3><p>Turn buyer feedback into product improvements, changelog, buyer email, and proof.</p></a>
              <a class="card" href="proof-card-referral-loop/"><h3>Example 9: Usage → proof card</h3><p>Turn real usage into public-safe proof, social post, referral ask, and permission request.</p></a>
              <a class="card" href="monthly-workflow-vault-drop/"><h3>Example 10: Requests → Vault drop</h3><p>Turn buyer requests into a recurring template library, announcement email, changelog, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-monthly-workflow-vault-drop-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- MONTHLY-WORKFLOW-VAULT-DROP-EXAMPLE:START -->"
              end = "<!-- MONTHLY-WORKFLOW-VAULT-DROP-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="monthly-workflow-vault-drop-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · Workflow Vault · Example 10</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn demand into monthly workflow drops.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste buyer requests. Get a monthly Vault drop, announcement email, upgrade section, social post, changelog, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/monthly-workflow-vault-drop/">See the Vault drop workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit monthly-workflow-vault-drop example
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add monthly workflow vault drop example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
