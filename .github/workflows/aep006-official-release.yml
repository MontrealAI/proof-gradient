name: AEP-006 Official Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "aep-006-v1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/aep006_assets
          find docs/standards/AEP-006 site/standards/AEP-006 -maxdepth 5 -type f \( -name '*.zip' -o -name '*.pdf' -o -name '*.json' -o -name '*.md' -o -name 'SHA256SUMS.txt' -o -name 'QA_REPORT.md' \) -exec cp {} /tmp/aep006_assets/ \; 2>/dev/null || true
          ls -la /tmp/aep006_assets
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cat > /tmp/aep006_notes.md <<'EOF'
          # AEP-006 — Rollback Receipt Standard v1.1

          AEP-006 defines the recovery proof. GoalOS releases only what can recover, and proves when recovery happens.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --title "AEP-006 — Rollback Receipt Standard v1.1" --notes-file /tmp/aep006_notes.md; else gh release create "$TAG" --title "AEP-006 — Rollback Receipt Standard v1.1" --notes-file /tmp/aep006_notes.md; fi
          if compgen -G "/tmp/aep006_assets/*" > /dev/null; then gh release upload "$TAG" /tmp/aep006_assets/* --clobber; fi
