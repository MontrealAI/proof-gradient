name: Refresh Full Proof Gradient Site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-full-site-refresh
  cancel-in-progress: false

jobs:
  refresh-full-site:
    name: Refresh full Proof Gradient public site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate refreshed public site
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          mkdir -p "$WEB_ROOT/standards"
          touch "$WEB_ROOT/.nojekyll"

          cat > /tmp/refresh_proof_gradient_site.py <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import html
          import json
          import re
          import shutil
          import datetime

          WEB_ROOT = Path("site")
          WEB_STANDARDS = WEB_ROOT / "standards"
          DOC_STANDARDS = Path("docs/standards")

          PUBLIC_EXTENSIONS = {
              ".html", ".htm", ".md", ".json", ".txt", ".csv", ".pdf", ".docx", ".tex",
              ".png", ".jpg", ".jpeg", ".webp", ".svg", ".py", ".yml", ".yaml"
          }
          SKIP_DIR_NAMES = {".git", "__pycache__", ".pytest_cache", ".DS_Store"}

          AEP_META = {
              "AEP-001": {
                  "title": "GoalOS Proof-of-Evolution Constitution",
                  "short": "Constitution",
                  "desc": "The constitutional protocol for Proof-Carrying Intelligence: Commit → Execute → Prove → Evolve.",
                  "law": ["No proof, no evolution.", "No eval, no propagation.", "No rollback, no release."],
                  "cards": [
                      ("Commit → Execute → Prove → Evolve", "The core evolution loop."),
                      ("Artifact Vault", "Reusable intelligence: goals, plans, skills, tools, policies, evals, and contexts."),
                      ("Selection Gate", "Promotes only what proved itself.")
                  ],
              },
              "AEP-002": {
                  "title": "Evidence Docket Standard",
                  "short": "Evidence Docket",
                  "desc": "The portable proof package for machine work: claims, evidence, evals, risk, cost, rollback, and public-safe boundaries.",
                  "law": ["No docket, no institutional proof.", "No boundary, no publication.", "No evidence, no claim."],
                  "cards": [
                      ("Evidence Docket", "A portable proof package for one governed run or workflow."),
                      ("Claim Boundary", "Separates what is supported from what is not claimed."),
                      ("Audit Trail", "Keeps evidence reviewable across contexts.")
                  ],
              },
              "AEP-003": {
                  "title": "ProofPacket Schema",
                  "short": "ProofPacket",
                  "desc": "The atomic proof unit for machine work: commitments, trace events, tool calls, policy decisions, approvals, eval results, risks, costs, selections, rollouts, rollbacks, and public reports.",
                  "law": ["No proof, no evolution.", "No eval, no propagation.", "No rollback, no release."],
                  "cards": [
                      ("Atomic proof", "One coherent evidence record for one machine-work fact, event, check, or decision."),
                      ("Hashable packets", "Deterministic canonical JSON and SHA-256 packet hashes for tamper-evident proof chains."),
                      ("Docket composition", "Many ProofPackets compose into an AEP-002 Evidence Docket.")
                  ],
              },
              "AEP-004": {
                  "title": "Selection Gate Standard",
                  "short": "Selection Gate",
                  "desc": "The propagation boundary for machine intelligence: promote, canary, revise, reject, archive, rollback, or request more evidence.",
                  "law": ["No proof, no evolution.", "No eval, no propagation.", "No rollback, no release.", "Under uncertainty, fail closed."],
                  "cards": [
                      ("Selection Candidate", "The proposed artifact, workflow, policy, tool, eval, route, context, or capability."),
                      ("Gate Policy", "Required evidence, evals, approvals, canary rules, and rollback readiness."),
                      ("Selection Certificate", "The recorded decision proving what may evolve and under what scope.")
                  ],
              },
              "AEP-005": {
                  "title": "Tool Permission Standard",
                  "short": "Tool Permission",
                  "desc": "The Tool Gateway standard for scoped, approved, leased, revocable, and provable tool use.",
                  "law": ["No tool without permission.", "No action without scope.", "No high-risk tool without approval.", "No permanent authority without expiration.", "No side effect without receipt."],
                  "cards": [
                      ("Tool Gateway", "Evaluates requests, checks policies, issues leases, requires approval, emits decisions, and fails closed."),
                      ("Permission Lease", "Time-bounded, scope-bounded, revocable authority for tool use."),
                      ("Receipts", "Tool calls, revocations, and compensation actions leave proof records.")
                  ],
              },
              "AEP-006": {
                  "title": "Rollback Receipt Standard",
                  "short": "Rollback Receipt",
                  "desc": "The recovery proof standard for rollback, restoration, compensation, verification, and post-rollback review.",
                  "law": ["No rollback, no release.", "No receipt, no recovery claim.", "No restore point, no promotion.", "No proof, no evolution."],
                  "cards": [
                      ("Rollback Trigger", "The signal that initiates recovery."),
                      ("Rollback Receipt", "The execution proof that recovery happened."),
                      ("Rollback Verification", "The confirmation that restoration actually worked.")
                  ],
              },
              "AEP-007": {
                  "title": "Public-Safe Proof Report Standard",
                  "short": "Public Proof",
                  "desc": "The public proof layer: report evidence safely, bound claims precisely, publish without leaking private or protected material, and preserve corrections.",
                  "law": ["No public claim without claim boundary.", "No public proof without redaction review.", "No private trace in public report.", "No protected data in public proof.", "No correction without history."],
                  "cards": [
                      ("Public Claim Matrix", "Verified, supported, observed, contextual, and not-claimed public statements."),
                      ("Redaction Ledger", "Disclosure review that shows what was withheld, summarized, embargoed, or forbidden."),
                      ("Correction History", "Challenge, correction, and retraction records that preserve public trust.")
                  ],
              },
              "AEP-008": {
                  "title": "Proof Room Standard",
                  "short": "Proof Room",
                  "desc": "The governed workspace where machine work becomes institutional proof: charters, scope, roles, evidence boundaries, registers, decisions, audit exports, closure reports, and public-safe publication.",
                  "law": ["No room without charter.", "No run without scope.", "No evidence without boundary.", "No promotion without gate.", "No closure without archive."],
                  "cards": [
                      ("Proof Room Charter", "Mission, scope, success criteria, allowed agents/tools/data, required evals, and closure conditions."),
                      ("Room Registers", "Dockets, packets, tool permissions, gates, rollbacks, reports, and decisions."),
                      ("Audit and Closure", "Reviewable proof export with archive, unresolved items, and claim boundaries.")
                  ],
              },
          }

          def is_public_file(path: Path) -> bool:
              if path.name.startswith(".DS_Store"):
                  return False
              if path.suffix.lower() not in PUBLIC_EXTENSIONS:
                  return False
              if any(part in SKIP_DIR_NAMES for part in path.parts):
                  return False
              if "__pycache__" in path.parts:
                  return False
              if path.suffix.lower() in {".pyc", ".zip", ".rtf"}:
                  return False
              return True

          def discover_standards():
              if not DOC_STANDARDS.exists():
                  return []
              return sorted([p for p in DOC_STANDARDS.iterdir() if p.is_dir() and p.name.startswith("AEP-")])

          def discover_aep_ids():
              ids = set()
              if DOC_STANDARDS.exists():
                  ids |= {p.name for p in DOC_STANDARDS.iterdir() if p.is_dir() and p.name.startswith("AEP-")}
              if WEB_STANDARDS.exists():
                  ids |= {p.name for p in WEB_STANDARDS.iterdir() if p.is_dir() and p.name.startswith("AEP-")}
              return sorted(ids)

          def copy_public_assets(src_standard: Path, dst_standard: Path):
              dst_standard.mkdir(parents=True, exist_ok=True)
              for src_file in sorted(src_standard.rglob("*")):
                  if not src_file.is_file() or not is_public_file(src_file):
                      continue
                  rel = src_file.relative_to(src_standard)
                  dst_file = dst_standard / rel
                  dst_file.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src_file, dst_file)

          def first_file(folder: Path, patterns):
              if not folder.exists():
                  return None
              matches = []
              for pattern in patterns:
                  matches.extend(folder.glob(pattern))
              matches = [p for p in matches if p.is_file()]
              return sorted(matches, key=lambda p: (len(p.parts), p.name))[0] if matches else None

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16);--blue:#91b7ff}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%, rgba(145,183,255,.18), transparent 34rem),radial-gradient(circle at 92% 5%, rgba(255,215,106,.12), transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,106px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:11px 15px;border:1px solid rgba(255,215,106,.48);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.13)}
              .panel,.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .stack{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}
              .card{text-decoration:none;color:var(--text)}
              .card h3{margin-top:0}.card p{color:var(--muted);line-height:1.38}
              .four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}
              .proofs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}
              .muted{color:var(--muted)}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              code{color:var(--gold)}
              @media(max-width:920px){.grid,.stack,.four,.proofs{grid-template-columns:1fr}}
              """

          def nav_buttons(current=None):
              out = []
              for sid in discover_aep_ids():
                  label = sid if current == sid else f"{sid} {AEP_META.get(sid, {}).get('short', '')}".strip()
                  out.append(f'<a class="btn" href="/proof-gradient/standards/{html.escape(sid)}/">{html.escape(label)}</a>')
              return "\n".join(out)

          def action_buttons(dst: Path):
              buttons = []
              pdf = first_file(dst, ["*.pdf"])
              if pdf:
                  buttons.append(f'<a class="btn primary" href="{quote(pdf.name)}">Download PDF</a>')
              md = first_file(dst, ["*.md"])
              if md:
                  buttons.append(f'<a class="btn" href="{quote(md.name)}">Markdown</a>')
              for name in ["schemas","examples","templates","tools"]:
                  if (dst / name).exists():
                      buttons.append(f'<a class="btn" href="{name}/">{name.title()}</a>')
              return "\n".join(buttons)

          def write_aep_page(sid: str, dst: Path):
              meta = AEP_META.get(sid, {"title": sid, "short": sid, "desc": "Proof Gradient standard.", "law": ["No proof, no evolution."], "cards": []})
              law = "<br>".join(html.escape(x) for x in meta["law"])
              cards = "\n".join(f'<div class="card"><h3>{html.escape(a)}</h3><p>{html.escape(b)}</p></div>' for a,b in meta["cards"])
              page = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>{html.escape(sid)} — {html.escape(meta['title'])}</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Protocol Standard</div>
            <h1>{html.escape(sid)} — {html.escape(meta['title'])}</h1>
            <p class="lead">{html.escape(meta['desc'])}</p>
            <div class="bar"><a class="btn" href="/proof-gradient/">Command Center</a><a class="btn" href="/proof-gradient/standards/">All Standards</a>{nav_buttons(current=sid)}</div>
            <div class="bar">{action_buttons(dst)}</div>
            <section class="panel"><h2>Canonical Law</h2><div class="law">{law}</div></section>
            <section><h2>What {html.escape(sid)} Standardizes</h2><div class="grid">{cards}</div></section>
            <section class="panel"><h2>Foundational AEP Stack</h2><p class="lead">AEP-001 defines the protocol. AEP-002 defines the docket. AEP-003 defines the packet. AEP-004 defines the gate. AEP-005 defines the permission. AEP-006 defines recovery proof. AEP-007 defines public proof. AEP-008 defines the room.</p></section>
            <footer>Generated from <code>docs/standards/{html.escape(sid)}</code>. Public standard assets only.</footer>
          </main></body></html>"""
              (dst / "index.html").write_text(page, encoding="utf-8")

          def write_subdir_index(folder: Path, title: str):
              dirs = sorted([p for p in folder.iterdir() if p.is_dir() and p.name not in SKIP_DIR_NAMES])
              files = sorted([p for p in folder.iterdir() if p.is_file() and p.name != "index.html"])
              rows = [(d.name + "/", quote(d.name) + "/", "Directory") for d in dirs]
              rows += [(f.name, quote(f.name), f.suffix.lstrip(".").upper() or "FILE") for f in files]
              links = "\n".join(f'<a class="card" href="{href}"><h3>{html.escape(name)}</h3><p>{html.escape(kind)}</p></a>' for name, href, kind in rows) or '<p class="muted">No public files found.</p>'
              page = f"""<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>{html.escape(title)}</title><style>{styles()}</style></head><body><main><div class="eyebrow">Proof Gradient · Public Assets</div><h1>{html.escape(title)}</h1><p class="lead">Browsable public files for this standard directory.</p><div class="bar"><a class="btn" href="../">Parent</a><a class="btn" href="/proof-gradient/">Command Center</a><a class="btn" href="/proof-gradient/standards/">All Standards</a>{nav_buttons()}</div><div class="grid">{links}</div></main></body></html>"""
              (folder / "index.html").write_text(page, encoding="utf-8")

          def write_standards_index():
              cards = []
              for sid in discover_aep_ids():
                  meta = AEP_META.get(sid, {"title": sid, "desc": ""})
                  cards.append(f'<a class="card" href="{sid}/"><h3>{html.escape(sid)} — {html.escape(meta["title"])}</h3><p>{html.escape(meta.get("desc",""))}</p></a>')
              page = f"""<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Standards</title><style>{styles()}</style></head><body><main><div class="eyebrow">Proof Gradient · Foundational AEP Stack</div><h1>Proof Gradient Standards</h1><p class="lead">The GoalOS / Proof Gradient governance stack for machine work: protocol, docket, packet, gate, permission, recovery, public proof, and proof room.</p><div class="bar"><a class="btn" href="/proof-gradient/">Command Center</a>{nav_buttons()}</div><div class="stack">{''.join(cards)}</div></main></body></html>"""
              WEB_STANDARDS.mkdir(parents=True, exist_ok=True)
              (WEB_STANDARDS / "index.html").write_text(page, encoding="utf-8")

          def backup_home():
              home = WEB_ROOT / "index.html"
              backup = WEB_ROOT / "legacy-command-center.html"
              if home.exists() and not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")

          def discover_existing_links_from_home():
              home = WEB_ROOT / "legacy-command-center.html"
              if not home.exists():
                  home = WEB_ROOT / "index.html"
              if not home.exists():
                  return []
              text = home.read_text(encoding="utf-8", errors="ignore")
              hrefs = re.findall(r'href=["\']([^"\']+)["\']', text)
              kept, seen = [], set()
              for href in hrefs:
                  if href.startswith("http") or href.startswith("#") or href.startswith("mailto:") or href in seen:
                      continue
                  seen.add(href)
                  if "proof" in href.lower() or "evidence" in href.lower() or "data/" in href.lower():
                      kept.append(href)
              return kept[:24]

          def write_home_page():
              backup_home()
              aep_cards = []
              for sid in discover_aep_ids():
                  meta = AEP_META.get(sid, {"title": sid, "desc": ""})
                  aep_cards.append(f'<a class="card" href="standards/{sid}/"><h3>{html.escape(sid)} — {html.escape(meta["short"])}</h3><p>{html.escape(meta.get("desc",""))}</p></a>')
              proof_cards = "".join(f'<a class="card" href="{html.escape(href)}"><h3>{html.escape(href.split("/")[-2] if href.endswith("/") and len(href.split("/"))>1 else href.split("/")[-1] or href)}</h3><p>Existing proof / evidence page preserved from the current site.</p></a>' for href in discover_existing_links_from_home())
              if not proof_cards:
                  proof_cards = '<div class="card"><h3>Proof Archive</h3><p>Existing proof pages are preserved. Add proof pages or evidence JSON to make them appear here automatically.</p></div>'
              four = [
                  ("Artifact Vault","Stores reusable intelligence: goals, plans, skills, tools, policies, evals, contexts, and proof-ready artifacts."),
                  ("Run Fabric","Executes bounded machine work and emits traces, events, and proof."),
                  ("Proof Ledger","Records what happened: dockets, packets, evals, risk, cost, receipts, gates, and reports."),
                  ("Selection Gate","Promotes only what proved itself, canaries what needs monitoring, and rolls back what fails.")
              ]
              four_html = "".join(f'<div class="card"><h3>{html.escape(a)}</h3><p>{html.escape(b)}</p></div>' for a,b in four)
              legacy = '<a class="btn" href="legacy-command-center.html">Legacy Command Center</a>' if (WEB_ROOT / "legacy-command-center.html").exists() else ""
              page = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Agent Evolution Protocol</div>
            <h1>Aim.<br>Act.<br>Prove.<br>Evolve.</h1>
            <p class="lead">GoalOS gives the network direction. PlanOS gives it strategy. SkillOS gives it capability. Proof Gradient gives it evolution: every meaningful machine-work run should leave evidence, proof, permission, recovery, and public-safe reporting.</p>
            <div class="bar">
              <a class="btn primary" href="standards/">AEP Standards</a>
              <a class="btn" href="standards/AEP-008/">Proof Room</a>
              <a class="btn" href="standards/AEP-007/">Public Proof</a>
              <a class="btn" href="standards/AEP-005/">Tool Permission</a>
              {legacy}
              <a class="btn" href="https://github.com/MontrealAI/proof-gradient">GitHub</a>
            </div>
            <section class="panel"><h2>Operating Law</h2><div class="law">No proof, no evolution.<br>No eval, no propagation.<br>No rollback, no release.</div></section>
            <section><h2>The Four Systems</h2><div class="four">{four_html}</div></section>
            <section><h2>Foundational AEP Stack</h2><p class="lead">A complete governance stack for machine work: protocol, docket, packet, gate, permission, recovery, public proof, and proof room.</p><div class="stack">{''.join(aep_cards)}</div></section>
            <section><h2>Proof Archive</h2><p class="lead">Existing proof pages and evidence links remain preserved. The refreshed home page brings the standards stack forward while keeping the archive accessible.</p><div class="proofs">{proof_cards}</div></section>
            <section class="panel"><h2>Canonical Line</h2><p class="lead">AEP-001 defines the protocol. AEP-002 defines the docket. AEP-003 defines the packet. AEP-004 defines the gate. AEP-005 defines the permission. AEP-006 defines recovery proof. AEP-007 defines public proof. AEP-008 defines the room.</p></section>
            <footer>Generated by the full Proof Gradient site refresh workflow. Public standard assets only.</footer>
          </main></body></html>"""
              (WEB_ROOT / "index.html").write_text(page, encoding="utf-8")

          def write_404():
              page = f"""<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient — Not Found</title><style>{styles()}</style></head><body><main><div class="eyebrow">Proof Gradient</div><h1>Proof not found.</h1><p class="lead">This public proof page does not exist yet, or the address changed. Start from the Command Center or the AEP Standards index.</p><div class="bar"><a class="btn primary" href="/proof-gradient/">Command Center</a><a class="btn" href="/proof-gradient/standards/">AEP Standards</a>{nav_buttons()}</div></main></body></html>"""
              (WEB_ROOT / "404.html").write_text(page, encoding="utf-8")

          def write_sitemap_and_health():
              urls = []
              base = "https://montrealai.github.io/proof-gradient/"
              for p in sorted(WEB_ROOT.rglob("*.html")):
                  rel = p.relative_to(WEB_ROOT).as_posix()
                  if rel.startswith("legacy-"):
                      continue
                  loc = base + ("" if rel == "index.html" else rel.replace("index.html", ""))
                  urls.append(loc)
              today = datetime.date.today().isoformat()
              sitemap = ['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
              for url in urls:
                  sitemap.append(f"  <url><loc>{html.escape(url)}</loc><lastmod>{today}</lastmod></url>")
              sitemap.append("</urlset>")
              (WEB_ROOT / "sitemap.xml").write_text("\n".join(sitemap) + "\n", encoding="utf-8")
              (WEB_ROOT / "robots.txt").write_text("User-agent: *\nAllow: /\nSitemap: https://montrealai.github.io/proof-gradient/sitemap.xml\n", encoding="utf-8")
              health = {
                  "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
                  "standards": discover_aep_ids(),
                  "pages": len(urls),
                  "claim_boundary": "Public standard assets only; private evidence, secrets, credentials, paid products, protected traces, and restricted data should not be published here."
              }
              (WEB_ROOT / "site-health.json").write_text(json.dumps(health, indent=2), encoding="utf-8")

          for src in discover_standards():
              copy_public_assets(src, WEB_STANDARDS / src.name)

          for sid in discover_aep_ids():
              dst = WEB_STANDARDS / sid
              if dst.exists():
                  write_aep_page(sid, dst)

          for sid in discover_aep_ids():
              dst = WEB_STANDARDS / sid
              if not dst.exists():
                  continue
              for folder in sorted([p for p in dst.rglob("*") if p.is_dir()], key=lambda p: len(p.parts), reverse=True):
                  if folder.name in SKIP_DIR_NAMES or "__pycache__" in folder.parts or folder == dst:
                      continue
                  rel = folder.relative_to(WEB_STANDARDS)
                  suffix = " / ".join(rel.parts[1:])
                  write_subdir_index(folder, f"{sid} / {suffix}")

          write_standards_index()
          write_home_page()
          write_404()
          write_sitemap_and_health()

          print("Full Proof Gradient site refreshed.")
          PY

          python3 /tmp/refresh_proof_gradient_site.py

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit full site refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh full Proof Gradient public site"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
