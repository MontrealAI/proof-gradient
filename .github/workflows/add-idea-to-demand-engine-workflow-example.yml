name: Add Idea To Demand Engine Workflow Example

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: idea-to-demand-engine-workflow-example
  cancel-in-progress: false

jobs:
  add-demand-example:
    name: Add idea-to-demand-engine workflow example page
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create idea-to-demand-engine workflow example safely
        shell: bash
        run: |
          set -euo pipefail

          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          mkdir -p "$WEB_ROOT"
          touch "$WEB_ROOT/.nojekyll"

          python3 <<'PY'
          from pathlib import Path

          WEB_ROOT = Path("site")
          if not WEB_ROOT.exists() and Path("public").exists():
              WEB_ROOT = Path("public")

          workflow_dir = WEB_ROOT / "workflow" / "idea-to-demand-engine"
          examples_dir = WEB_ROOT / "examples"
          example_dir = examples_dir / "idea-to-demand-engine"
          assets_dir = WEB_ROOT / "assets"

          for folder in [workflow_dir, examples_dir, example_dir, assets_dir]:
              folder.mkdir(parents=True, exist_ok=True)

          def styles():
              return """
              :root{--bg:#05070d;--text:#f6f7ff;--muted:#b8c0da;--gold:#ffd76a;--line:rgba(255,255,255,.16)}
              *{box-sizing:border-box}
              body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(145,183,255,.20),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(255,215,106,.14),transparent 28rem),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:64px 0 92px}
              .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:12px}
              h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.08em;margin:18px 0}
              h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin-top:52px}
              h3{margin-top:0}
              .lead{max-width:920px;color:var(--muted);font-size:21px;line-height:1.55}
              .bar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
              .btn{display:inline-flex;margin:0;padding:12px 16px;border:1px solid rgba(255,215,106,.52);border-radius:999px;text-decoration:none;font-weight:850;background:rgba(255,255,255,.06);color:var(--text)}
              .btn.primary{background:rgba(255,215,106,.16)}
              .panel,.card,.step{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:24px;padding:22px}
              .law{font-size:clamp(24px,4vw,42px);line-height:1.13;letter-spacing:-.045em}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
              .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
              .steps{display:grid;gap:14px;margin:28px 0}
              .step strong{color:var(--gold)}
              .card p,.step p{color:var(--muted);line-height:1.45}
              pre{white-space:pre-wrap;background:#080b13;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;color:#eaf0ff;line-height:1.45;overflow-wrap:anywhere}
              .mini{font-size:14px;color:var(--muted)}
              .pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,215,106,.45);border-radius:999px;color:var(--gold);font-weight:850;font-size:13px;margin:4px}
              footer{margin-top:44px;color:var(--muted);font-size:13px}
              @media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
              """

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><radialGradient id="g" cx="75%" cy="20%" r="70%"><stop offset="0%" stop-color="#263b74"/><stop offset="55%" stop-color="#070b15"/><stop offset="100%" stop-color="#05070d"/></radialGradient></defs>
          <rect width="1600" height="900" fill="url(#g)"/>
          <text x="90" y="100" fill="#ffd76a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">GOALOS · AI EFFICIENCY SPRINT</text>
          <text x="90" y="230" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">Turn one idea</text>
          <text x="90" y="332" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="86" font-weight="900">into demand.</text>
          <text x="90" y="440" fill="#b8c0da" font-family="Arial, sans-serif" font-size="38">Idea → Hook → Post → Email → Page section → Proof note</text>
          <rect x="90" y="610" width="1420" height="135" rx="34" fill="rgba(255,255,255,.08)" stroke="#ffd76a" stroke-width="3"/>
          <text x="130" y="675" fill="#ffd76a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Example 3:</text>
          <text x="340" y="675" fill="#f6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Rough product idea → demand content system</text>
          <text x="130" y="720" fill="#b8c0da" font-family="Arial, sans-serif" font-size="26">One message becomes a reusable content engine without fake claims or refund drama.</text>
          </svg>"""
          (assets_dir / "idea-to-demand-engine-card.svg").write_text(svg, encoding="utf-8")

          rough_idea = """Rough idea:
          People keep using AI like a chat box.
          We want to sell a $49 kit that helps them build one reusable AI workflow.
          Need a LinkedIn post, an X post, an email, and a sales-page section.
          Avoid hype, income guarantees, fake urgency, and fake testimonials.
          Make it practical."""

          output_example = """Core Hook:
          Stop asking AI from scratch.

          LinkedIn Post:
          Most people do not have an AI problem.
          They have a workflow problem.

          They open ChatGPT.
          They ask for help.
          They edit.
          They close the tab.
          Then next week, they ask the same kind of question again.

          That is not leverage.

          The better move:
          turn one repeated task into a reusable AI workflow.

          Context.
          Rules.
          Memory.
          Workflow.
          Checks.
          Proof.

          One task becomes a system you can run again.

          That is what GoalOS AI Efficiency Sprint is built to help you do.

          X Post:
          Most people use AI like a chat box.

          The upgrade:
          build one reusable workflow.

          Context.
          Rules.
          Memory.
          Workflow.
          Checks.
          Proof.

          Stop asking AI from scratch.

          Email:
          Subject: Stop asking AI from scratch

          Most people use AI one chat at a time.

          The problem is not access.
          The problem is repetition.

          If you answer the same customer questions, summarize the same meetings, write the same updates, or create the same kind of content every week, you do not need more random prompts.

          You need one reusable workflow.

          The GoalOS AI Efficiency Sprint Kit helps you build one in under one hour.

          Sales Page Section:
          Build one reusable AI workflow.

          Pick one task you repeat.
          Add context.
          Add rules.
          Add memory.
          Add workflow steps.
          Add checks.
          Leave proof.

          You are not buying “a bunch of files.”
          You are building your first reusable AI work system."""

          proof_note = """Proof note:
          Source: rough internal product idea.
          Outputs created: hook, LinkedIn post, X post, email, sales-page section.
          Claims made: the kit helps buyers build one reusable AI workflow.
          Claims avoided: no income guarantee, no ROI guarantee, no fake testimonial, no legal/compliance claim, no guarantee of results.
          Review needed: human should confirm final wording, links, pricing, and platform rules before publishing.
          Public-safe: yes."""

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Idea to Demand Engine — GoalOS Workflow Example</title>
            <meta name="description" content="Turn one rough product idea into demand content: hook, LinkedIn post, X post, email, sales-page section, and proof note." />
            <meta property="og:title" content="Turn one idea into demand." />
            <meta property="og:description" content="Idea → hook → post → email → sales-page section → proof note." />
            <meta property="og:image" content="/proof-gradient/assets/idea-to-demand-engine-card.svg" />
            <style>{styles()}</style>
          </head>
          <body>
            <main>
              <div class="eyebrow">GoalOS · AI Efficiency Sprint · Example 3</div>
              <h1>Turn one idea into demand.</h1>
              <p class="lead">This reusable AI workflow turns a rough product idea into a clean hook, LinkedIn post, X post, email, sales-page section, and proof note — without fake claims, fake testimonials, or risky guarantees.</p>

              <div class="bar">
                <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
                <a class="btn" href="/proof-gradient/workflow/">Example 1: customer replies</a>
                <a class="btn" href="/proof-gradient/workflow/meeting-to-action-plan/">Example 2: meeting notes</a>
                <a class="btn" href="/proof-gradient/standards/">AEP standards</a>
              </div>

              <section class="panel">
                <h2>The simple idea</h2>
                <div class="law">Stop starting from a blank page every time you need demand.</div>
                <p class="lead">A reusable demand workflow helps you turn one product message into useful content you can review, publish, reuse, and improve.</p>
              </section>

              <section>
                <h2>Before vs. after</h2>
                <div class="two">
                  <div class="card">
                    <h3>Before: random content</h3>
                    <p>You have a product idea. You ask AI for a post. It sounds generic. You edit. Then tomorrow, you start over again.</p>
                    <p class="mini">Result: inconsistent message, weak offer, risky hype, no repeatable system.</p>
                  </div>
                  <div class="card">
                    <h3>After: reusable demand engine</h3>
                    <p>You paste one rough idea into the same workflow. It produces a hook, post, email, page section, and proof note every time.</p>
                    <p class="mini">Result: one idea becomes a reusable content system.</p>
                  </div>
                </div>
              </section>

              <section>
                <h2>The workflow in plain English</h2>
                <div class="steps">
                  <div class="step"><strong>1. Context</strong><p>Tell the AI what the product is, who it is for, price, promise, and what buyers actually get.</p></div>
                  <div class="step"><strong>2. Rules</strong><p>Tell the AI what to avoid: fake urgency, fake testimonials, guaranteed income, guaranteed ROI, or exaggerated claims.</p></div>
                  <div class="step"><strong>3. Memory</strong><p>Save your core message: “Stop asking AI from scratch. Build one reusable AI workflow.”</p></div>
                  <div class="step"><strong>4. Workflow</strong><p>The AI creates a hook, long post, short post, email, sales-page section, and proof note.</p></div>
                  <div class="step"><strong>5. Checks</strong><p>The AI checks whether the content is clear, specific, useful, honest, and safe to publish.</p></div>
                  <div class="step"><strong>6. Proof</strong><p>The AI records what it created, what it claimed, what it avoided, and what needs human review.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Copy-paste example</h2>
                <p class="lead">Rough product idea:</p>
                <pre>{rough_idea}</pre>
                <p class="lead">Reusable workflow output:</p>
                <pre>{output_example}</pre>
                <p class="lead">Proof note:</p>
                <pre>{proof_note}</pre>
              </section>

              <section>
                <h2>What the buyer gets</h2>
                <div>
                  <span class="pill">Hook</span>
                  <span class="pill">LinkedIn post</span>
                  <span class="pill">X post</span>
                  <span class="pill">Email</span>
                  <span class="pill">Sales-page section</span>
                  <span class="pill">Proof note</span>
                  <span class="pill">Claim boundary</span>
                </div>
                <div class="grid">
                  <div class="card"><h3>Useful for selling digital kits</h3><p>Turn one product message into multiple assets for your sales funnel.</p></div>
                  <div class="card"><h3>Lower-risk copy</h3><p>The workflow avoids fake guarantees, fake reviews, and unsupported claims.</p></div>
                  <div class="card"><h3>Reusable engine</h3><p>Run it again for every product, feature, example, launch, or update.</p></div>
                </div>
              </section>

              <section class="panel">
                <h2>Digital product sales rule</h2>
                <p class="lead">For a low-friction digital product business, use clear terms before checkout: instant digital access, all sales final once delivered, except where required by law or for duplicate charges / technical access failures.</p>
              </section>

              <section class="panel">
                <h2>The one-sentence promise</h2>
                <div class="law">Paste one rough product idea. Get demand content and a proof note.</div>
                <div class="bar">
                  <a class="btn primary" href="https://www.quebecartificialintelligence.com/shop">Get the GoalOS AI Efficiency Sprint Kit</a>
                  <a class="btn" href="/proof-gradient/standards/AEP-007/">See Public-Safe Proof</a>
                </div>
              </section>

              <footer>
                Educational workflow example only. Not legal, financial, medical, tax, employment, security, or regulatory advice. No income, savings, compliance, safety, accuracy, or business-results guarantee. Users are responsible for review and judgment before using outputs.
              </footer>
            </main>
          </body>
          </html>"""

          for path in [workflow_dir / "index.html", example_dir / "index.html"]:
              path.write_text(page, encoding="utf-8")

          examples_index = f"""<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Proof Gradient Examples</title><style>{styles()}</style></head>
          <body><main>
            <div class="eyebrow">Proof Gradient · Examples</div>
            <h1>Examples that turn AI into leverage.</h1>
            <p class="lead">Practical, public-safe examples for turning repeated AI tasks into reusable work systems.</p>
            <div class="grid">
              <a class="card" href="build-one-reusable-ai-workflow/"><h3>Example 1: Customer question → clear reply</h3><p>Turn messy customer questions into clear replies and proof notes.</p></a>
              <a class="card" href="meeting-to-action-plan/"><h3>Example 2: Meeting notes → action plan</h3><p>Turn messy notes into decisions, owners, deadlines, follow-up email, and proof.</p></a>
              <a class="card" href="idea-to-demand-engine/"><h3>Example 3: One idea → demand engine</h3><p>Turn a rough product idea into content, email, sales copy, and proof.</p></a>
            </div>
          </main></body></html>"""
          examples_dir.joinpath("index.html").write_text(examples_index, encoding="utf-8")

          home = WEB_ROOT / "index.html"
          if home.exists():
              backup = WEB_ROOT / "home-before-demand-engine-example.html"
              if not backup.exists():
                  backup.write_text(home.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              text = home.read_text(encoding="utf-8", errors="ignore")
              start = "<!-- IDEA-TO-DEMAND-ENGINE-EXAMPLE:START -->"
              end = "<!-- IDEA-TO-DEMAND-ENGINE-EXAMPLE:END -->"
              block = f"""
          {start}
          <section id="idea-to-demand-engine-example" style="margin:48px auto;max-width:1120px;padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));">
            <p style="color:#ffd76a;text-transform:uppercase;letter-spacing:.18em;font-weight:900;font-size:12px;">GoalOS · AI Efficiency Sprint · Example 3</p>
            <h2 style="font-size:clamp(30px,5vw,58px);line-height:.95;letter-spacing:-.055em;margin:10px 0 16px;">Turn one idea into demand.</h2>
            <p style="color:#b8c0da;font-size:19px;line-height:1.5;max-width:820px;">Paste one rough product idea. Get a hook, LinkedIn post, X post, email, sales-page section, and proof note.</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <a class="btn" href="/proof-gradient/workflow/idea-to-demand-engine/">See the demand workflow</a>
              <a class="btn" href="https://www.quebecartificialintelligence.com/shop">Get the kit</a>
            </div>
          </section>
          {end}
          """
              if start in text and end in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + block + after
              elif "</main>" in text:
                  text = text.replace("</main>", block + "\n</main>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", block + "\n</body>", 1)
              else:
                  text += block
              home.write_text(text, encoding="utf-8")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit idea-to-demand-engine example page
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="site"
          if [ ! -d "$WEB_ROOT" ] && [ -d "public" ]; then WEB_ROOT="public"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add idea-to-demand-engine workflow example [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
