          - public claim-boundary review
          EOF

          cat > docs/api.md <<'EOF'
          # API

          Implemented endpoints:

          - `GET /healthz`
          - `GET /readyz`
          - `GET /metrics`
          - `POST /tenants`
          - `POST /demo/run`
