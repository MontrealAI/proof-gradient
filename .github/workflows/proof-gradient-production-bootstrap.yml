      - name: Install and test generated platform
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -e ".[dev]"

          proof-gradient db reset
          proof-gradient demo --tenant demo --json > /tmp/proof-gradient-demo.json

          pytest tests/test_proof_gradient_*.py

          python scripts/security_review.py
          bandit -q -r proof_gradient

      - name: Verify production deliverables
        run: |
          set -euo pipefail

          required=(
            "README.md"
            ".gitignore"
            "proof_gradient/db.py"
            "proof_gradient/models.py"
            "proof_gradient/services.py"
            "proof_gradient/api.py"
            "proof_gradient/cli.py"
            "proof_gradient/security.py"
            "proof_gradient/providers.py"
            "proof_gradient/evals.py"
            "proof_gradient/workers.py"
            "alembic.ini"
            "migrations/env.py"
            "migrations/versions/0001_initial_schema.py"
            "docker-compose.yml"
            "Dockerfile"
            "docs/architecture.md"
            "docs/migration_from_skillos_v2.md"
            "docs/security.md"
            "docs/api.md"
            "docs/cli.md"
            "docs/deployment.md"
            "docs/final_acceptance_report.md"
            "tests/test_proof_gradient_vertical_slice.py"
            "tests/test_proof_gradient_security.py"
            "tests/test_proof_gradient_api.py"
            "site/index.html"
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done

          grep -R "Artifact Vault" proof_gradient docs site README.md
          grep -R "Run Fabric" proof_gradient docs site README.md
          grep -R "Proof Ledger" proof_gradient docs site README.md
          grep -R "Selection Gate" proof_gradient docs site README.md

          echo "Production platform foundation verified."

      - name: Commit production platform
        run: |
          set -euo pipefail

          git config user.name "proof-gradient-production-bootstrap"
          git config user.email "actions@github.com"

          rm -f proof_gradient.db
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Implement Proof Gradient production platform foundation [skip ci]"
            git push origin HEAD:main
          fi
