          FORBIDDEN_CLAIMS = [
              "guaranteed ROI",
              "guaranteed profit",
              "achieved Kardashev Type II",
              "real superintelligence achieved",
              "private data shared automatically",
          ]

          SAFE_BOUNDARY_CONTEXTS = [
              "not claiming",
              "does not claim",
              "do not claim",
              "doesnt claim",
              "doesn't claim",
              "not claim",
              "not a claim",
              "not revenue",
              "not profit",
              "not investment advice",
              "not achieved",
              "not an achieved",
              "not real",
              "not empirical",
              "claim boundary",
              "claim-boundary",
              "forbidden claim",
              "not a guarantee",
              "strategic scenario",
              "synthetic",
              "archived",
              "deprecated",
              "unsupported claims",
              "does not represent",
              "not presented as",
          ]

          SCAN_PATHS = [
              Path("README.md"),
              Path("docs/architecture.md"),
              Path("docs/final_acceptance_report.md"),
              Path("docs/security.md"),
              Path("docs/api.md"),
              Path("docs/cli.md"),
              Path("docs/deployment.md"),
              Path("docs/migration_from_skillos_v2.md"),
              Path("site/index.html"),
          ]


          def normalize(text: str) -> str:
              text = text.lower()
              text = text.replace("**", " ")
              text = text.replace("__", " ")
              text = text.replace("`", " ")
              text = text.replace("*", " ")
              text = text.replace("_", " ")
              text = text.replace("-", " ")
              text = re.sub(r"[^a-z0-9]+", " ", text)
              text = re.sub(r"\s+", " ", text)
              return text.strip()


          def line_is_safe(line: str) -> bool:
              normalized = normalize(line)
              return any(normalize(context) in normalized for context in SAFE_BOUNDARY_CONTEXTS)


          failures = []
          scanned = 0

          for path in SCAN_PATHS:
              if not path.exists() or not path.is_file():
                  continue

              scanned += 1
              lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()

              for number, line in enumerate(lines, start=1):
                  normalized_line = normalize(line)

                  for claim in FORBIDDEN_CLAIMS:
                      normalized_claim = normalize(claim)

                      if normalized_claim in normalized_line and not line_is_safe(line):
                          failures.append((str(path), number, claim, line.strip()))

          if failures:
              for path, number, claim, line in failures:
                  print(f"FORBIDDEN CLAIM: {claim!r} in {path}:{number}")
                  print(f"  {line}")
              sys.exit(1)

          print(f"security review passed; scanned {scanned} generated public files")
          EOF

          cat > Dockerfile <<'EOF'
          FROM python:3.11-slim

          ENV PYTHONDONTWRITEBYTECODE=1
          ENV PYTHONUNBUFFERED=1

          WORKDIR /app

          COPY pyproject.toml README.md /app/
          COPY proof_gradient /app/proof_gradient

          RUN pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -e .

          EXPOSE 8000

          CMD ["uvicorn", "proof_gradient.api:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

          cat > docker-compose.yml <<'EOF'
          services:
            postgres:
              image: postgres:16
              environment:
                POSTGRES_DB: proofgradient
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
              ports:
                - "5432:5432"
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 10s
                timeout: 5s
                retries: 5

            api:
              build: .
              environment:
                PROOF_GRADIENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/proofgradient
                PROOF_GRADIENT_PROVIDER: mock
              ports:
                - "8000:8000"
              depends_on:
                postgres:
                  condition: service_healthy
          EOF

          cat > docs/architecture.md <<'EOF'
          # Proof Gradient Production Architecture

          Aim → Act → Prove → Evolve.

          ## Four systems

          | System | Responsibility |
          |---|---|
          | Artifact Vault | Stores immutable, versioned reusable intelligence. |
          | Run Fabric | Resolves artifacts, runs agents, emits proof. |
          | Proof Ledger | Stores append-only traces, proof, evals, scores, and credit assignment. |
          | Selection Gate | Evaluates, approves, canaries, monitors, promotes, pauses, and rolls back upgrades. |

          Core invariant: no proof, no evolution. No eval, no propagation. No rollback, no release.
          EOF

          cat > docs/final_acceptance_report.md <<'EOF'
          # Final Acceptance Report

          | Requirement | Implementation location | Tests | Remaining risk | Notes |
          |---|---|---|---|---|
          | Production database | `db.py`, `models.py`, Docker Compose | API and vertical slice tests | Needs managed Postgres deployment | SQLite local, Postgres CI-ready |
          | Artifact Vault | `ArtifactVault` | immutability test | Needs full diff UI | lifecycle foundation implemented |
          | Run Fabric | `RunFabric` | vertical slice test | Needs distributed worker pool | stateless mock runtime implemented |
          | Proof Ledger | `ProofLedger` | trace/proof test | Needs advanced search | append-only records implemented |
          | Selection Gate | `SelectionGate` | rollout/rollback test | Needs production routing integration | canary and rollback implemented |
          | API | `api.py` | API test | Needs auth middleware | core endpoints implemented |
          | CLI | `cli.py` | demo command | Needs full admin suite | core commands implemented |
          | Tenancy and RBAC | `security.py`, tenant models | security tests | Needs real auth provider | isolation helpers implemented |
          | Tool permissions | `ToolGateway` | security tests | Needs real tool adapters | deny-by-default implemented |
          | LLM/provider abstraction | `providers.py` | vertical slice test | Needs provider adapters | mock implemented |
          | Eval execution | `evals.py` | vertical slice test | Needs batch eval workers | deterministic evals implemented |
          EOF

          cat > docs/security.md <<'EOF'
          # Security and Governance

          Implemented controls:

          - tenant isolation model
          - RBAC helpers
          - audit log
          - deny-by-default tool permission checks
