name: Proof Gradient Production Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-gradient-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Build production platform foundation
    runs-on: ubuntu-latest

    if: github.repository == 'MontrealAI/proof-gradient'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Quarantine legacy SkillOS tests
        run: |
          set -euo pipefail

          mkdir -p tests_legacy_skillos

          for file in \
            tests/test_end_to_end.py \
            tests/test_pages_build.py \
            tests/test_storage.py \
            tests/test_wealth_proof.py
          do
            if [ -f "$file" ]; then
              dest="tests_legacy_skillos/$(basename "$file")"
              if [ ! -f "$dest" ]; then
                git mv "$file" "$dest"
              else
                rm "$file"
                git add -A
              fi
              echo "Quarantined legacy test: $file"
            fi
          done

          mkdir -p proof_gradient tests docs scripts site migrations/versions

      - name: Generate production platform
        run: |
          set -euo pipefail

          cat > .gitignore <<'EOF'
          __pycache__/
          *.pyc
          .pytest_cache/
          .ruff_cache/
          .mypy_cache/
          .venv/
          venv/
          env/
          dist/
          build/
          *.egg-info/
          proof_gradient.db
          .coverage
          htmlcov/
          .env
          EOF

          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=69", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "proof-gradient"
          version = "0.3.1"
          description = "Proof Gradient: Artifact Vault, Run Fabric, Proof Ledger, Selection Gate."
          requires-python = ">=3.11"
          dependencies = [
            "fastapi>=0.115",
            "uvicorn[standard]>=0.30",
            "pydantic>=2.8",
            "pydantic-settings>=2.4",
            "sqlalchemy>=2.0",
            "alembic>=1.13",
            "psycopg[binary]>=3.2",
            "typer>=0.12",
            "rich>=13.7"
          ]

          [project.optional-dependencies]
          dev = [
            "pytest>=8.3",
            "httpx>=0.27",
            "ruff>=0.6",
            "bandit>=1.7"
          ]

          [project.scripts]
          proof-gradient = "proof_gradient.cli:main"

          [tool.setuptools.packages.find]
          include = ["proof_gradient*"]

          [tool.pytest.ini_options]
          testpaths = ["tests"]
          addopts = "-q"
          python_files = ["test_proof_gradient_*.py"]

          [tool.ruff]
          line-length = 160
          target-version = "py311"
          EOF

          cat > README.md <<'EOF'
          # Proof Gradient

          **Aim. Act. Prove. Evolve.**

          Proof Gradient is the Agent Evolution Protocol.

          GoalOS gives the network **Direction**.  
          PlanOS gives it **Strategy**.  
          SkillOS gives it **Capability**.  
          The Proof Gradient gives it **Evolution**.

          ## Four systems

          | System | Promise |
          |---|---|
          | Artifact Vault | Stores reusable intelligence. |
          | Run Fabric | Executes agents at scale. |
          | Proof Ledger | Records what happened. |
          | Selection Gate | Promotes only what proved itself. |

          ## Production foundation

          This repository now contains the first production platform foundation:

          - production database layer
          - Artifact Vault service
          - Run Fabric service
          - Proof Ledger storage
          - Selection Gate rollout router
          - API
          - CLI
          - static UI
          - tenancy and RBAC helpers
          - tool permissions
          - provider abstraction
          - eval execution
          - observability endpoint
          - security review
          - Docker Compose
          - production tests

          ## Claim boundary

          It does **not** claim real revenue, real profit, guaranteed ROI, investment advice, actual deployed superintelligence, real-world energy capture, or Kardashev Type II achievement.

          It is a proof-bounded production foundation.
          EOF

          cat > proof_gradient/__init__.py <<'EOF'
          __version__ = "0.3.1"
          EOF

          cat > proof_gradient/config.py <<'EOF'
          from pydantic_settings import BaseSettings, SettingsConfigDict


          class Settings(BaseSettings):
              model_config = SettingsConfigDict(env_prefix="PROOF_GRADIENT_", extra="ignore")

              env: str = "local"
              database_url: str = "sqlite:///./proof_gradient.db"
              provider: str = "mock"
              max_cost_usd: float = 1.0
              max_latency_seconds: int = 120


          settings = Settings()
          EOF

          cat > proof_gradient/db.py <<'EOF'
          from sqlalchemy import create_engine
          from sqlalchemy.orm import DeclarativeBase, sessionmaker

          from proof_gradient.config import settings


          class Base(DeclarativeBase):
              pass


          connect_args = {"check_same_thread": False} if settings.database_url.startswith("sqlite") else {}
          engine = create_engine(settings.database_url, pool_pre_ping=True, connect_args=connect_args)
          SessionLocal = sessionmaker(bind=engine, autoflush=False, autocommit=False, expire_on_commit=False)


          def init_db() -> None:
              from proof_gradient import models  # noqa: F401

              Base.metadata.create_all(bind=engine)


          def reset_db() -> None:
              from proof_gradient import models  # noqa: F401

              Base.metadata.drop_all(bind=engine)
              Base.metadata.create_all(bind=engine)
          EOF

          cat > proof_gradient/models.py <<'EOF'
