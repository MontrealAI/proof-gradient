          cat > docs/migration_from_skillos_v2.md <<'EOF'
          # Migration from SkillOS v2.0.0

          | SkillOS v2 concept | Proof Gradient concept |
          |---|---|
          | Skill | artifact type: skill |
          | Skill version | ArtifactVersion |
