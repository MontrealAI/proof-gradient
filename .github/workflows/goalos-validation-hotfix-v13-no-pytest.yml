name: OBSOLETE — do not run — v13 no-pytest validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goalos-validation-hotfix-v13-obsolete-validate-only
  cancel-in-progress: false

jobs:
  validate-only:
    name: Obsolete v13 hotfix; validate only and do not write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Explain obsolete workflow
        run: |
          echo "This obsolete v13 no-pytest hotfix is validate-only and cannot commit or push changes."
          echo "It must not rewrite validation scripts, tests, docs, site files, or public pages."
          echo "Use GoalOS Validation Hotfix v14 Microsite Compatibility as the current validation fix."
      - name: Validate public site classification and shell rules
        run: python scripts/validate_goalos_public_site.py
      - name: Check paid/private artifact boundary
        run: python scripts/check_no_paid_artifacts.py
      - name: Validate docs tables and figures
        run: python scripts/validate_docs_tables_figures.py
      - name: Validate GoalOS catalog
        run: python scripts/validate_goalos_catalog.py
