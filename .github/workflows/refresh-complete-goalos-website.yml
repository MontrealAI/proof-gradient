          pricing_body = f"""<section class="hero"><div class="eyebrow">Pricing / Tarifs</div><h1>Clear ladder. Clear outcomes.</h1><p class="lead">$49 builds one reusable workflow. $199 builds one self-improving workflow. $997 sets up a department Proof Room Lite. $2,500+ builds the first self-improving workflow live. $9,500+ deploys Department RSI in 30 days.</p><div class="actions"><a class="btn primary" href="{SHOP}">Shop / Acheter</a></div></section><section class="section"><table class="table"><tr><th>Price</th><th>Offer</th><th>Outcome</th><th>Type</th></tr>{pricing_rows}</table></section>"""
          ensure_page("pricing", "GoalOS Pricing · Proof Gradient", "Compare GoalOS products, workshops, and implementation offers.", pricing_body)

          for item in products:
              body = f"""<section class="hero"><div class="eyebrow">{escape(item['price'])} · {escape(item['type'])}</div><h1>{escape(item['title'])}</h1><p class="lead fr">{escape(item['fr_title'])}</p><p class="lead">{escape(item['promise'])}</p><p class="lead fr">{escape(item['fr_promise'])}</p><div class="actions"><a class="btn primary" href="{SHOP}">Buy on QUEBEC.AI</a><a class="btn" href="{href('/pricing/')}">Compare</a></div></section><section class="section panel"><div class="price">{escape(item['price'])}</div><h2>Outcome</h2><p class="lead">{escape(item['outcome'])}</p>{bullets(item['bullets'])}</section><section class="section panel"><h2>Boundary / Limite</h2><p class="lead">No guaranteed ROI, income, compliance certification, safety guarantee, legal advice, or autonomous deployment. Human review required.</p><p class="lead fr">Aucune garantie de ROI, revenu, conformité, sécurité, conseil juridique ou déploiement autonome. La revue humaine est requise.</p></section>"""
              ensure_page("products/" + item["slug"], item["title"] + " · Proof Gradient", item["promise"], body)

          for item in services:
              body = f"""<section class="hero"><div class="eyebrow">{escape(item['price'])} · {escape(item['type'])}</div><h1>{escape(item['title'])}</h1><p class="lead fr">{escape(item['fr_title'])}</p><p class="lead">{escape(item['promise'])}</p><p class="lead fr">{escape(item['fr_promise'])}</p><div class="actions"><a class="btn primary" href="{SHOP}">Apply / Buy on QUEBEC.AI</a><a class="btn" href="{href('/services/')}">Services</a></div></section><section class="section panel"><div class="price">{escape(item['price'])}</div><h2>Outcome</h2><p class="lead">{escape(item['outcome'])}</p>{bullets(item['bullets'])}</section><section class="section panel"><h2>Safe boundary / Limite claire</h2><p class="lead">GoalOS does not modify AI models. It improves workflows around AI through instructions, checks, scorecards, proof notes, versions, approvals, and human review.</p><p class="lead fr">GoalOS ne modifie pas les modèles IA. Il améliore les flux autour de l’IA grâce aux instructions, vérifications, grilles de score, notes de preuve, versions, approbations et revue humaine.</p></section>"""
              ensure_page("products/" + item["slug"], item["title"] + " · Proof Gradient", item["promise"], body)

          implementation_body = f"""<section class="hero"><div class="eyebrow">GoalOS Proof Room Implementation Sprint</div><h1>Department RSI in 30 days.</h1><p class="lead">Deploy Recursive Self-Improving Workflows in one department.</p><p class="lead fr">Déployer des flux IA récursivement auto-améliorants dans un département.</p><div class="actions"><a class="btn primary" href="{SHOP}">Apply / Buy on QUEBEC.AI</a><a class="btn" href="{href('/products/goalos-proof-room-implementation-sprint/')}">Offer page</a></div></section><section class="section panel"><p class="law">In 30 days, set up the first version of a lightweight Proof Room for three repeated department AI workflows.</p></section><section class="section"><div class="steps"><div><strong>1</strong><span>Executive kickoff</span></div><div><strong>2</strong><span>Task inventory</span></div><div><strong>3</strong><span>Three workflows</span></div><div><strong>4</strong><span>Proof reviews</span></div><div><strong>5</strong><span>Rollback path</span></div><div><strong>6</strong><span>Executive report</span></div></div></section>"""
          ensure_page("implementation/goalos-proof-room-implementation-sprint", "Department RSI in 30 Days · GoalOS", "GoalOS Proof Room Implementation Sprint.", implementation_body)
          ensure_page("workshop/goalos-proof-room-implementation-sprint", "GoalOS Proof Room Implementation Sprint · Workshop", "Department RSI in 30 Days.", implementation_body)
          ensure_page("workshop/goalos-rsi-sprint-workshop", "GoalOS RSI Sprint Workshop · Proof Gradient", "Build your first self-improving AI workflow live.", f"""<section class="hero"><div class="eyebrow">GoalOS RSI Sprint Workshop</div><h1>Build your first self-improving AI workflow live.</h1><p class="lead">In one live session, build workflow v1.0, run it, score it, diagnose what failed, improve it to v1.1, save a proof note, and leave with a 30-day next-run plan.</p><div class="actions"><a class="btn primary" href="{SHOP}">Apply / Buy</a></div></section>""")

          rsi_body = f"""<section class="hero"><div class="eyebrow">Recursive Self-Improving Workflows</div><h1>Run → Score → Diagnose → Improve → Version → Prove → Re-run.</h1><p class="lead">GoalOS RSI Lite is the practical, safe version of recursive self-improvement for business AI workflows.</p><div class="actions"><a class="btn primary" href="{SHOP}">Get RSI Lite</a><a class="btn" href="{href('/products/goalos-rsi-lite/')}">Product page</a></div></section><section class="section panel"><p class="law">The AI model does not improve itself. Your workflow improves around the AI.</p></section>"""
          ensure_page("workflow/rsi-lite-self-improving-workflows", "Recursive Self-Improving Workflows · GoalOS", "GoalOS RSI Lite workflow loop.", rsi_body)

          proof_body = f"""<section class="hero"><div class="eyebrow">Proof Room Lite</div><h1>Set up a lightweight department Proof Room.</h1><p class="lead">Owners. Permissions. Checks. Proof notes. Weekly reviews. Monthly reports. Corrections. Rollback receipts. Public-safe proof.</p><div class="actions"><a class="btn primary" href="{SHOP}">Get Proof Room Lite</a><a class="btn" href="{href('/products/goalos-proof-room-lite/')}">Product page</a></div></section><section class="section panel"><p class="law">A department does not need AI chaos. It needs a room for proof.</p></section>"""
          ensure_page("proof-room-lite", "Proof Room Lite · GoalOS", "Set up a lightweight department Proof Room.", proof_body)

          examples_body = f"""<section class="hero"><div class="eyebrow">Examples</div><h1>Examples that turn AI into leverage.</h1><p class="lead">Reusable workflow examples for individuals, teams, departments, RSI Lite, and Proof Room Lite.</p><div class="search"><input data-site-search placeholder="Search examples..."></div></section><section class="section"><div class="grid">{''.join(f'<a class="card" data-site-card href="{href("/workflow/"+slug+"/")}"><span class="badge">{escape(badge)}</span><h3>{escape(num)}: {escape(title)}</h3><p>{escape(desc)}</p></a>' for slug,num,title,desc,badge in examples)}</div></section>"""
          ensure_page("examples", "Examples · Proof Gradient", "GoalOS examples.", examples_body)

          # fallback workflow pages
          fallback = """<section class="hero"><div class="eyebrow">{badge}</div><h1>{title}</h1><p class="lead">{desc}</p><div class="actions"><a class="btn primary" href="{shop}">Shop / Acheter</a><a class="btn" href="{examples}">All examples</a></div></section><section class="section panel"><h2>GoalOS structure</h2><p class="lead">Context → Rules → Memory → Workflow → Checks → Proof.</p></section>"""
          for slug,num,title,desc,badge in examples:
              out = WEB_ROOT/"workflow"/slug/"index.html"
              if not out.exists():
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text(page(f"{num}: {title} · GoalOS", desc, fallback.format(badge=escape(badge), title=escape(title), desc=escape(desc), shop=SHOP, examples=href("/examples/"))), encoding="utf-8")

          standards_body = f"""<section class="hero"><div class="eyebrow">AEP Standards</div><h1>The public trust layer.</h1><p class="lead">AEP standards provide the vocabulary for proof, permissions, rollback, public-safe reporting, and Proof Rooms.</p></section><section class="section"><div class="grid">{''.join(f'<a class="card" data-site-card href="{href("/standards/"+code+"/")}"><span class="badge">AEP</span><h3>{escape(code)}</h3><p>{escape(title)}</p></a>' for code,title in standards)}</div></section>"""
          ensure_page("standards", "AEP Standards · Proof Gradient", "Proof Gradient standards.", standards_body)

          for code,title in standards:
              out = WEB_ROOT/"standards"/code/"index.html"
              if not out.exists():
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text(page(f"{code} · {title}", title, f"""<section class="hero"><div class="eyebrow">AEP Standard</div><h1>{escape(code)} — {escape(title)}</h1><p class="lead">Public trust layer for GoalOS and Proof Gradient.</p><div class="actions"><a class="btn" href="{href('/standards/')}">All standards</a></div></section>"""), encoding="utf-8")

          start_body = f"""<section class="hero"><div class="eyebrow">Start Here / Départ</div><h1>Choose your GoalOS path.</h1><p class="lead">Start with reusable workflows, RSI Lite, Proof Room Lite, a live workshop, or Department RSI in 30 days.</p></section><section class="section"><div class="grid">{''.join(offer_card(i, '/products/') for i in all_offers[:5])}</div></section>"""
          ensure_page("start-here", "Start Here · GoalOS", "Choose your GoalOS path.", start_body)

          command_cards = "".join(offer_card(i, "/products/") for i in all_offers)
          command_cards += f'<a class="card" data-site-card href="{href("/pricing/")}"><span class="badge">Compare</span><h3>Pricing</h3><p>Compare the full GoalOS ladder.</p></a>'
          command_cards += f'<a class="card" data-site-card href="{href("/implementation/goalos-proof-room-implementation-sprint/")}"><span class="badge">Department RSI</span><h3>GoalOS Proof Room Implementation Sprint</h3><p>Department RSI in 30 days.</p></a>'
          command_body = f"""<section class="hero"><div class="eyebrow">Command Center</div><h1>Find anything on the GoalOS site.</h1><p class="lead">Search products, services, standards, examples, workshops, and implementation pages.</p><div class="search"><input data-site-search placeholder="Search the full site..."></div></section><section class="section"><div class="grid">{command_cards}</div></section>"""
          ensure_page("command-center", "Command Center · GoalOS", "Search the complete GoalOS site.", command_body)

          urls = ["/", "/start-here/", "/products/", "/services/", "/pricing/", "/examples/", "/standards/", "/proof-room-lite/", "/command-center/", "/implementation/goalos-proof-room-implementation-sprint/", "/workshop/goalos-rsi-sprint-workshop/", "/workshop/goalos-proof-room-implementation-sprint/", "/workflow/rsi-lite-self-improving-workflows/"]
          urls += [f"/products/{i['slug']}/" for i in all_offers]
          urls += [f"/standards/{code}/" for code,_ in standards]
          urls += [f"/workflow/{slug}/" for slug,*_ in examples]

          site_map_rows = "\n".join(f"<tr><td>{escape(u)}</td><td><a href='{href(u)}'>{href(u)}</a></td></tr>" for u in sorted(set(urls)))
          ensure_page("site-map", "Site Map · GoalOS", "Complete GoalOS site map.", f"""<section class="hero"><div class="eyebrow">Site Map</div><h1>Complete site map.</h1></section><section class="section"><table class="table"><tr><th>Path</th><th>URL</th></tr>{site_map_rows}</table></section>""")

          notfound = f"""<section class="hero"><div class="eyebrow">404</div><h1>Page not found.</h1><p class="lead">Use the Command Center to find the right product, workshop, standard, or implementation page.</p><div class="actions"><a class="btn primary" href="{href('/command-center/')}">Open Command Center</a><a class="btn" href="{href('/')}">Home</a></div></section>"""
          (WEB_ROOT/"404.html").write_text(page("404 · GoalOS", "Page not found.", notfound), encoding="utf-8")

          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          for u in sorted(set(urls)):
              sitemap += f"  <url><loc>https://montrealai.github.io{BASE}{u}</loc><lastmod>{NOW[:10]}</lastmod></url>\n"
          sitemap += "</urlset>\n"
          (WEB_ROOT/"sitemap.xml").write_text(sitemap, encoding="utf-8")
          (WEB_ROOT/"robots.txt").write_text(f"User-agent: *\nAllow: /\nSitemap: https://montrealai.github.io{BASE}/sitemap.xml\n", encoding="utf-8")

          nav = f"""<!-- GOALOS-COMPLETE-NAV:START --><header class="shell"><nav class="nav" aria-label="GoalOS"><a class="brand" href="{href('/')}"><span class="mark">G</span><span>GoalOS · Proof Gradient</span></a><div class="links"><a href="{href('/start-here/')}">Start</a><a href="{href('/products/')}">Products</a><a href="{href('/pricing/')}">Pricing</a><a href="{href('/services/')}">Services</a><a href="{href('/implementation/goalos-proof-room-implementation-sprint/')}">Department RSI</a><a href="{href('/examples/')}">Examples</a><a href="{href('/standards/')}">Standards</a><a class="shop" href="{SHOP}">Shop</a></div></nav></header><!-- GOALOS-COMPLETE-NAV:END -->"""
          footer = f"""<!-- GOALOS-COMPLETE-FOOTER:START --><footer class="footer"><div class="footer-inner"><div>GoalOS · Reusable Workflows · RSI Lite · Proof Room Lite · Department RSI</div><div><a href="{href('/site-map/')}">Site Map</a><a href="{href('/pricing/')}">Pricing</a><a href="{SHOP}">Shop</a><a href="{GITHUB}">GitHub</a></div></div></footer><!-- GOALOS-COMPLETE-FOOTER:END -->"""
          css_link = f'<link rel="stylesheet" href="{BASE}/assets/goalos-complete-site.css" data-goalos-complete-css>'
          js_link = f'<script defer src="{BASE}/assets/goalos-complete-site.js" data-goalos-complete-js></script>'

          def inject(path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "<html" not in text.lower():
                  return
              text = re.sub(r"<!-- GOALOS-COMPLETE-NAV:START -->.*?<!-- GOALOS-COMPLETE-NAV:END -->", "", text, flags=re.S)
              text = re.sub(r"<!-- GOALOS-COMPLETE-FOOTER:START -->.*?<!-- GOALOS-COMPLETE-FOOTER:END -->", "", text, flags=re.S)
              text = re.sub(r'<link[^>]+data-goalos-complete-css[^>]*>\s*', "", text, flags=re.I)
              text = re.sub(r'<script[^>]+data-goalos-complete-js[^>]*></script>\s*', "", text, flags=re.I)
              if "</head>" in text:
                  text = text.replace("</head>", f"  {css_link}\n  {js_link}\n</head>", 1)
              if "<body" in text:
                  text = re.sub(r"(<body[^>]*>)", r"\1\n"+nav+"\n", text, count=1, flags=re.I)
              else:
                  text = nav + "\n" + text
              if "</body>" in text:
                  text = text.replace("</body>", footer + "\n</body>", 1)
              else:
                  text += "\n" + footer
              path.write_text(text, encoding="utf-8")

          for html in WEB_ROOT.rglob("*.html"):
              if ".git" not in html.parts:
                  inject(html)

          manifest = []
          for p in sorted(WEB_ROOT.rglob("*")):
              if p.is_file() and ".git" not in p.parts:
                  manifest.append({"path": p.relative_to(WEB_ROOT).as_posix(), "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          (WEB_ROOT/"goalos-complete-site-manifest.json").write_text(json.dumps({"generated_at": NOW, "files": manifest}, indent=2)+"\n", encoding="utf-8")

          missing = []
          for html in WEB_ROOT.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href=["\'](/proof-gradient/[^"#?\']*)["\']', text):
                  target = m.group(1)[len(BASE):] or "/"
                  fs = WEB_ROOT / target.lstrip("/")
                  if target.endswith("/"):
                      fs = fs / "index.html"
                  if not fs.exists():
                      missing.append((html.relative_to(WEB_ROOT).as_posix(), m.group(1)))
          if missing:
              raise SystemExit("Generated local link check failed:\n" + "\n".join(f"{s} -> {u}" for s,u in missing[:200]))

          print("Complete GoalOS website update done.")
          print("Web root:", WEB_ROOT)
          print("Public paid-material policy: no buyer ZIP files were created or copied.")
          PY

          python3 "$RUNNER_TEMP/refresh_goalos_complete_website.py"

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "Refusing to continue because deletions were detected:"
            echo "$deleted"
            exit 1
          fi

      - name: Commit website update
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="${{ steps.build.outputs.web_root }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEB_ROOT"
          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "Refresh complete GoalOS website [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
