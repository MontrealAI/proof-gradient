          :root{--bg:#05070d;--panel:rgba(255,255,255,.078);--panel2:rgba(255,255,255,.045);--line:rgba(255,255,255,.16);--text:#f7f8ff;--muted:#b8c0da;--gold:#ffd76a;--blue:#8fb3ff;--green:#7ce0a3;--radius:26px;--shadow:0 28px 78px rgba(0,0,0,.36)}
