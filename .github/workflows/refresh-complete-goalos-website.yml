              (WEB_ROOT/"index.html").write_text(page("GoalOS · Proof Gradient", "GoalOS complete product and implementation ladder.", body), encoding="utf-8")

          products_body = f"""<section class="hero"><div class="eyebrow">Products / Produits</div><h1>Self-serve GoalOS products.</h1><p class="lead">Start with one reusable workflow, upgrade to one self-improving workflow, then set up a lightweight department Proof Room.</p><div class="actions"><a class="btn primary" href="{SHOP}">Shop / Acheter</a><a class="btn" href="{href('/pricing/')}">Pricing</a></div></section><section class="section"><div class="grid">{''.join(offer_card(p, '/products/') for p in products)}</div></section>"""
