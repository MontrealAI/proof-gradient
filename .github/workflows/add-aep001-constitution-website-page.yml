name: Add AEP-001 Constitution Website Page

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy GitHub Pages after creating the AEP-001 page?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proof-gradient-pages
  cancel-in-progress: false

jobs:
  add-aep001-page:
    name: Add AEP-001 page without removing existing website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create AEP-001 website page safely
        id: build
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import html
          import os
          import shutil
          import zipfile

          ROOT = Path(".").resolve()

          # Your repository currently uses "site/" as the website source.
          # This workflow also supports "public/" if a repo uses that convention later.
          if Path("site").exists():
              WEB_ROOT = Path("site")
          elif Path("public").exists():
              WEB_ROOT = Path("public")
          else:
              WEB_ROOT = Path("site")
              WEB_ROOT.mkdir(parents=True, exist_ok=True)

          PAGE_DIR = WEB_ROOT / "standards" / "AEP-001"
          FIG_DIR = PAGE_DIR / "figures"
          PAGE_DIR.mkdir(parents=True, exist_ok=True)
          FIG_DIR.mkdir(parents=True, exist_ok=True)

          DOCS_SRC = Path("docs") / "standards" / "AEP-001"
          RELEASE_SRC = Path("releases") / "AEP-001"
          TMP_SRC = Path("_tmp_aep001_unpacked")
          if TMP_SRC.exists():
              shutil.rmtree(TMP_SRC)

          # If only the ZIP exists, unpack it temporarily so we can copy public files.
          zip_files = sorted(RELEASE_SRC.glob("*.zip")) if RELEASE_SRC.exists() else []
          if zip_files:
              TMP_SRC.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(zip_files[0], "r") as zf:
                  zf.extractall(TMP_SRC)

          SEARCH_ROOTS = [p for p in [DOCS_SRC, TMP_SRC] if p.exists()]

          def all_files():
              seen = set()
              for base in SEARCH_ROOTS:
                  for p in base.rglob("*"):
                      if p.is_file() and p.resolve() not in seen:
                          seen.add(p.resolve())
                          yield p

          def find_first(predicate):
              for p in all_files():
                  if predicate(p):
                      return p
              return None

          def copy_if_found(predicate, dest_name):
              found = find_first(predicate)
              if found:
                  shutil.copy2(found, PAGE_DIR / dest_name)
                  return True
              return False

          def name_lower(p):
              return p.name.lower()

          # Canonical public files.
          copy_if_found(lambda p: p.suffix.lower() == ".pdf" and ("final" in name_lower(p) or "constitution" in name_lower(p)), "paper.pdf")
          copy_if_found(lambda p: p.suffix.lower() == ".pdf" and ("one_page" in name_lower(p) or "one-page" in name_lower(p) or "one page" in name_lower(p)), "one-page.pdf")
          copy_if_found(lambda p: p.suffix.lower() == ".json" and ("schema" in name_lower(p) or "protocol" in name_lower(p)), "protocol_schema.json")
          copy_if_found(lambda p: p.suffix.lower() in {".md", ".markdown"} and ("evidence" in name_lower(p) and "docket" in name_lower(p)), "evidence_docket_template.md")
          copy_if_found(lambda p: p.suffix.lower() in {".md", ".markdown"} and ("one_page" in name_lower(p) or "one-page" in name_lower(p) or ("one" in name_lower(p) and "constitution" in name_lower(p))), "one_page_constitution.md")
          copy_if_found(lambda p: p.suffix.lower() == ".docx" and ("constitution" in name_lower(p) or "aep001" in name_lower(p)), "paper.docx")
          copy_if_found(lambda p: p.suffix.lower() == ".tex" and ("constitution" in name_lower(p) or "aep001" in name_lower(p)), "source.tex")
          copy_if_found(lambda p: p.suffix.lower() in {".md", ".markdown"} and ("constitution" in name_lower(p) or "aep001" in name_lower(p)), "source.md")

          # Copy the complete release package into the website page if available.
          if zip_files:
              shutil.copy2(zip_files[0], PAGE_DIR / "complete-package.zip")

          # Copy figures from docs or unpacked ZIP.
          figure_extensions = {".png", ".jpg", ".jpeg", ".webp", ".svg"}
          figure_count = 0
          for p in all_files():
              lower_parts = [part.lower() for part in p.parts]
              if "figures" in lower_parts and p.suffix.lower() in figure_extensions:
                  dest = FIG_DIR / p.name
                  shutil.copy2(p, dest)
                  figure_count += 1

          def link_card(title, href, description):
              exists = (PAGE_DIR / href).exists() if not href.startswith("figures/") else any(FIG_DIR.iterdir())
              if exists:
                  return f'''
                  <a class="download-card" href="{html.escape(href)}">
                    <span>{html.escape(title)}</span>
                    <small>{html.escape(description)}</small>
                  </a>'''
              return f'''
                  <div class="download-card unavailable">
                    <span>{html.escape(title)}</span>
                    <small>Not found yet. Add the file to docs/standards/AEP-001 or releases/AEP-001, then rerun this workflow.</small>
                  </div>'''

          downloads = "\n".join([
              link_card("Download PDF", "paper.pdf", "Canonical institutional edition."),
              link_card("Download One-Page Constitution", "one-page.pdf", "Printable executive version."),
              link_card("View Protocol Schema", "protocol_schema.json", "Machine-readable AEP-001 protocol object."),
              link_card("View Evidence Docket Template", "evidence_docket_template.md", "Reusable proof package template."),
              link_card("Download Complete Package", "complete-package.zip", "Frozen institutional archive package."),
              link_card("View Figures", "figures/", "Canonical diagrams and visual system maps."),
          ])

          page_html = f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>AEP-001 — GoalOS Proof-of-Evolution Constitution</title>
            <meta name="description" content="AEP-001 defines the GoalOS Proof-of-Evolution Constitution: Commit, Execute, Prove, Evolve." />
            <style>
              :root {{
                --bg: #05070d;
                --panel: rgba(255,255,255,.055);
                --panel2: rgba(255,255,255,.085);
                --text: #f6f7ff;
                --muted: #b8c0da;
                --line: rgba(255,255,255,.16);
                --gold: #ffd76a;
                --blue: #91b7ff;
                --green: #9af0c8;
                --purple: #b9a7ff;
              }}
              * {{ box-sizing: border-box; }}
              body {{
                margin: 0;
                min-height: 100vh;
                color: var(--text);
                font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background:
                  radial-gradient(circle at 18% 5%, rgba(145,183,255,.22), transparent 32rem),
                  radial-gradient(circle at 88% 10%, rgba(255,215,106,.16), transparent 28rem),
                  radial-gradient(circle at 50% 80%, rgba(185,167,255,.12), transparent 35rem),
                  var(--bg);
              }}
              main {{
                width: min(1180px, calc(100% - 40px));
                margin: 0 auto;
                padding: 72px 0 96px;
              }}
              .eyebrow {{
                color: var(--gold);
                text-transform: uppercase;
                letter-spacing: .22em;
                font-weight: 800;
                font-size: 13px;
              }}
              h1 {{
                max-width: 960px;
                margin: 18px 0 20px;
                font-size: clamp(48px, 8vw, 106px);
                line-height: .9;
                letter-spacing: -.075em;
              }}
              .lead {{
                max-width: 850px;
                color: var(--muted);
                font-size: clamp(18px, 2vw, 24px);
                line-height: 1.55;
              }}
              .button-row {{
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                margin: 30px 0 56px;
              }}
              .pill {{
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 10px 15px;
                border-radius: 999px;
                color: var(--text);
                text-decoration: none;
                border: 1px solid var(--line);
                background: rgba(255,255,255,.06);
                font-weight: 700;
              }}
              .pill.primary {{
                background: linear-gradient(135deg, rgba(255,215,106,.22), rgba(145,183,255,.16));
                border-color: rgba(255,215,106,.35);
              }}
              .grid {{
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 16px;
                margin: 30px 0 56px;
              }}
              .card, .download-card, .panel {{
                border: 1px solid var(--line);
                background: linear-gradient(180deg, var(--panel2), var(--panel));
                border-radius: 24px;
                box-shadow: 0 24px 80px rgba(0,0,0,.25);
              }}
              .card {{
                padding: 24px;
                min-height: 170px;
              }}
              .card b {{
                display: block;
                font-size: 20px;
                margin-bottom: 12px;
              }}
              .card p {{
                margin: 0;
                color: var(--muted);
                line-height: 1.5;
              }}
              h2 {{
                margin-top: 56px;
                font-size: clamp(32px, 5vw, 58px);
                letter-spacing: -.05em;
              }}
              .panel {{
                padding: 28px;
                margin: 18px 0;
              }}
              .doctrine {{
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
              }}
              .step {{
                padding: 18px;
                border-radius: 18px;
                background: rgba(0,0,0,.28);
                border: 1px solid rgba(255,255,255,.1);
              }}
              .step strong {{
                display: block;
                color: var(--gold);
                font-size: 22px;
                margin-bottom: 6px;
              }}
              .downloads {{
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
                margin-top: 22px;
              }}
              .download-card {{
                display: block;
                padding: 20px;
                color: var(--text);
                text-decoration: none;
                min-height: 112px;
                transition: transform .18s ease, border-color .18s ease;
              }}
              .download-card:hover {{
                transform: translateY(-2px);
                border-color: rgba(255,215,106,.55);
              }}
              .download-card span {{
                display: block;
                font-weight: 900;
                font-size: 18px;
                margin-bottom: 10px;
              }}
              .download-card small {{
                display: block;
                color: var(--muted);
                line-height: 1.45;
              }}
              .unavailable {{
                opacity: .58;
              }}
              .law {{
                font-size: clamp(24px, 4vw, 44px);
                line-height: 1.08;
                letter-spacing: -.045em;
              }}
              .footer {{
                margin-top: 60px;
                color: var(--muted);
                border-top: 1px solid var(--line);
                padding-top: 26px;
              }}
              @media (max-width: 900px) {{
                .grid, .downloads, .doctrine {{ grid-template-columns: 1fr; }}
                main {{ width: min(100% - 28px, 1180px); padding-top: 42px; }}
              }}
            </style>
          </head>
          <body>
            <main>
              <div class="eyebrow">Proof Gradient · Protocol Standard</div>
              <h1>AEP-001 — GoalOS Proof-of-Evolution Constitution</h1>
              <p class="lead">
                The canonical protocol standard for Proof-Carrying Intelligence:
                every job becomes a commitment, every execution produces proof,
                every reusable improvement becomes an artifact, and only what proves itself may evolve.
              </p>

              <div class="button-row">
                <a class="pill primary" href="../../">← Main Command Center</a>
                <a class="pill" href="paper.pdf">Download PDF</a>
                <a class="pill" href="protocol_schema.json">Protocol Schema</a>
                <a class="pill" href="complete-package.zip">Complete Package</a>
              </div>

              <section class="grid" aria-label="AEP-001 systems">
                <div class="card"><b>Artifact Vault</b><p>Stores reusable intelligence: goals, plans, skills, tools, policies, evals, context recipes, and proof-ready artifacts.</p></div>
                <div class="card"><b>Run Fabric</b><p>Executes agents at scale by resolving artifacts, running bounded workflows, and emitting proof.</p></div>
                <div class="card"><b>Proof Ledger</b><p>Records what happened: traces, evals, tool calls, policy decisions, cost, risk, and credit assignment.</p></div>
                <div class="card"><b>Selection Gate</b><p>Promotes only what proved itself through eval, approval, canary, monitoring, and rollback.</p></div>
              </section>

              <section class="panel">
                <h2 style="margin-top:0">Commit → Execute → Prove → Evolve</h2>
                <div class="doctrine">
                  <div class="step"><strong>Commit</strong><span>The mission becomes explicit.</span></div>
                  <div class="step"><strong>Execute</strong><span>The system runs active artifacts.</span></div>
                  <div class="step"><strong>Prove</strong><span>Every execution creates evidence.</span></div>
                  <div class="step"><strong>Evolve</strong><span>Only proven upgrades propagate.</span></div>
                </div>
              </section>

              <section class="panel">
                <h2 style="margin-top:0">Canonical Law</h2>
                <div class="law">
                  No proof, no evolution.<br />
                  No eval, no propagation.<br />
                  No rollback, no release.
                </div>
              </section>

              <section>
                <h2>Downloads & Public Materials</h2>
                <p class="lead">Use these files to read, cite, implement, audit, or extend AEP-001.</p>
                <div class="downloads">
                  {downloads}
                </div>
              </section>

              <section class="panel">
                <h2 style="margin-top:0">Claim Boundary</h2>
                <p class="lead">
                  AEP-001 is a protocol architecture and standard. It does not claim achieved AGI, achieved ASI,
                  guaranteed ROI, legal advice, safety certification, energy abundance, or Kardashev Type II achievement.
                  It defines the proof, governance, rollout, and rollback discipline required for governed agent evolution.
                </p>
              </section>

              <div class="footer">
                <strong>Public line:</strong> Every agent acts once. The network learns forever.
                <br />
                <strong>Generated safely:</strong> this page was added without deleting existing website files.
              </div>
            </main>
          </body>
          </html>
          '''

          (PAGE_DIR / "index.html").write_text(page_html, encoding="utf-8")

          # Standards archive page.
          standards_dir = WEB_ROOT / "standards"
          standards_dir.mkdir(parents=True, exist_ok=True)
          standards_index = standards_dir / "index.html"
          standards_block = '''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Proof Gradient Standards</title>
            <style>
              body { margin:0; background:#05070d; color:#f6f7ff; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
              main { width:min(1000px,calc(100% - 40px)); margin:0 auto; padding:64px 0; }
              h1 { font-size:clamp(44px,8vw,88px); line-height:.9; letter-spacing:-.07em; }
              a { color:#f6f7ff; text-decoration:none; }
              .card { display:block; border:1px solid rgba(255,255,255,.16); border-radius:24px; padding:24px; background:rgba(255,255,255,.06); margin:18px 0; }
              p { color:#b8c0da; font-size:18px; line-height:1.55; }
            </style>
          </head>
          <body><main>
            <p><a href="../">← Main Command Center</a></p>
            <h1>Proof Gradient Standards</h1>
            <a class="card" href="./AEP-001/">
              <h2>AEP-001 — GoalOS Proof-of-Evolution Constitution</h2>
              <p>Commit → Execute → Prove → Evolve. The canonical protocol standard for Proof-Carrying Intelligence.</p>
            </a>
          </main></body></html>'''
          if not standards_index.exists() or "AEP-001 — GoalOS Proof-of-Evolution Constitution" not in standards_index.read_text(encoding="utf-8", errors="ignore"):
              standards_index.write_text(standards_block, encoding="utf-8")

          # Homepage link/card insertion. This preserves the existing file and only inserts a block if absent.
          homepage = WEB_ROOT / "index.html"
          homepage_block = '''
          <!-- AEP001_HOMEPAGE_LINK_START -->
          <section id="aep-001-constitution" style="margin:56px 0; padding:28px; border:1px solid rgba(255,255,255,.16); border-radius:28px; background:linear-gradient(135deg, rgba(255,215,106,.10), rgba(145,183,255,.08)); box-shadow:0 24px 80px rgba(0,0,0,.22);">
            <div style="color:#ffd76a; text-transform:uppercase; letter-spacing:.18em; font-weight:900; font-size:12px;">Protocol Standard</div>
            <h2 style="font-size:clamp(30px,5vw,56px); line-height:.95; letter-spacing:-.055em; margin:12px 0 14px;">AEP-001 — GoalOS Proof-of-Evolution Constitution</h2>
            <p style="max-width:820px; color:#b8c0da; font-size:18px; line-height:1.55;">
              Commit → Execute → Prove → Evolve. The canonical standard for Proof-Carrying Intelligence:
              Artifact Vault, Run Fabric, Proof Ledger, and Selection Gate.
            </p>
            <a href="./standards/AEP-001/" style="display:inline-flex; margin-top:12px; padding:11px 16px; border-radius:999px; border:1px solid rgba(255,215,106,.45); color:#f6f7ff; text-decoration:none; font-weight:800; background:rgba(255,255,255,.06);">Read AEP-001 Constitution →</a>
          </section>
          <!-- AEP001_HOMEPAGE_LINK_END -->
          '''

          if homepage.exists():
              text = homepage.read_text(encoding="utf-8", errors="ignore")
              if "AEP001_HOMEPAGE_LINK_START" not in text:
                  lower = text.lower()
                  if "</main>" in lower:
                      idx = lower.rfind("</main>")
                      text = text[:idx] + homepage_block + "\n" + text[idx:]
                  elif "</body>" in lower:
                      idx = lower.rfind("</body>")
                      text = text[:idx] + homepage_block + "\n" + text[idx:]
                  else:
                      text = text + "\n" + homepage_block
                  homepage.write_text(text, encoding="utf-8")
          else:
              homepage.write_text(f'''<!doctype html>
              <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Proof Gradient</title></head><body style="background:#05070d;color:#f6f7ff;font-family:system-ui;padding:40px">
              <main><h1>Proof Gradient</h1>{homepage_block}</main></body></html>''', encoding="utf-8")

          if TMP_SRC.exists():
              shutil.rmtree(TMP_SRC)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"web_root={WEB_ROOT.as_posix()}\n")
              out.write(f"page_dir={PAGE_DIR.as_posix()}\n")
              out.write(f"figure_count={figure_count}\n")

          print(f"Website root: {WEB_ROOT}")
          print(f"AEP-001 page: {PAGE_DIR / 'index.html'}")
          print(f"Figures copied: {figure_count}")
          PY

      - name: Safety check — refuse deletions
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$deleted" ]; then
            echo "This workflow refuses to continue because it detected deleted files:"
            echo "$deleted"
            exit 1
          fi
          echo "No deleted files detected."

      - name: Show changed files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat

      - name: Commit website update
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.build.outputs.web_root }}/index.html" "${{ steps.build.outputs.web_root }}/standards"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add AEP-001 Constitution website page"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: ${{ inputs.deploy_pages == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.deploy_pages == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.web_root }}

      - name: Deploy GitHub Pages
        if: ${{ inputs.deploy_pages == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Final summary
        shell: bash
        run: |
          echo "AEP-001 page created at: ${{ steps.build.outputs.page_dir }}/index.html"
          echo "Website root used: ${{ steps.build.outputs.web_root }}"
          echo "Figures copied: ${{ steps.build.outputs.figure_count }}"
          echo "Deployment URL, if deployed: ${{ steps.deployment.outputs.page_url || 'Deployment was skipped or unavailable.' }}"
