name: OBSOLETE — do not run — v12 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/validate-goalos-public-site-v12.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Shared public-site validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Explain obsolete workflow
        run: |
          echo "This obsolete v12 validation workflow is validate-only and uses the current shared v14 guard scripts."
          echo "Do not treat this workflow as the current release path; use GoalOS Validation Hotfix v14 Microsite Compatibility."
      - name: Check paid/private artifact boundary
        run: python scripts/check_no_paid_artifacts.py
      - name: Validate public site classification and shell rules
        run: python scripts/validate_goalos_public_site.py
      - name: Validate docs tables and figures
        run: python scripts/validate_docs_tables_figures.py
      - name: Validate GoalOS catalog
        run: python scripts/validate_goalos_catalog.py
