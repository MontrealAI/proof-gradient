platform_direction: "GoalOS Recursive Workflow OS"
identity_line: "Aim. Act. Prove. Evolve."
public_thesis: "A model can answer. An agent can act. An institution must prove."
commercial_line: "ChatGPT gives you answers. GoalOS gives you workflows that get better every time they run."
enterprise_line: "Enterprise RSI without model self-modification."
core_law_en:
  - "No proof, no evolution."
  - "No eval, no propagation."
  - "No rollback, no release."
core_law_fr:
  - "Pas de preuve, pas d’évolution."
  - "Pas d’évaluation, pas de propagation."
  - "Pas de rollback, pas de publication."
core_loop:
  - Run
  - Score
  - Prove
  - Diagnose
  - Improve
  - Approve
  - Version
  - Monitor
  - Re-run
safe_boundary: "GoalOS improves workflows around AI through instructions, prompts, memory, scorecards, proof records, evaluations, approvals, versions, monitoring, and rollback; it does not modify base AI models."
safe_boundary_fr: "GoalOS ne modifie pas les modèles IA de base. GoalOS améliore les flux autour de l’IA grâce aux instructions, prompts, mémoire, grilles de score, dossiers de preuve, évaluations, approbations, versions, surveillance et rollback."
