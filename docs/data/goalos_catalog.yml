project:
  name: "Proof Gradient · GoalOS"
  identity_line: "Aim. Act. Prove. Evolve."
  public_thesis: "A model can answer. An agent can act. An institution must prove."
  commercial_thesis: "ChatGPT gives you answers. GoalOS gives you workflows that get better every time they run."
  enterprise_thesis: "Enterprise RSI without model self-modification."
  safe_boundary: "GoalOS does not modify base AI models. GoalOS improves workflows around AI through instructions, prompts, memory, scorecards, proof records, evaluations, approvals, versions, monitoring, and rollback."
  core_loop: ["Run", "Score", "Prove", "Diagnose", "Improve", "Approve", "Version", "Monitor", "Re-run"]
  operating_law_en: ["No proof, no evolution.", "No eval, no propagation.", "No rollback, no release."]
  operating_law_fr: ["Pas de preuve, pas d’évolution.", "Pas d’évaluation, pas de propagation.", "Pas de rollback, pas de publication."]
