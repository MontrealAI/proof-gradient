website:
  autonomous_github_actions_status: "current; public website is generated and refreshed through autonomous GitHub Actions"
  current_release_workflow_names: ["goalos-public-site-release-v8-intelligent-assets.yml"]
  validation_workflow_names: ["goalos-validation-hotfix-v14-microsite-compat.yml", "check-no-paid-artifacts.yml", "validate-goalos-catalog.yml", "validate-docs-tables-figures.yml", "validate-public-site-policy.yml"]
  obsolete_workflow_names: ["goalos-validation-hotfix-v12.yml", "goalos-validation-hotfix-v13-no-pytest.yml", "validate-goalos-public-site-v12.yml", "goalos-public-site-release-v12.yml", "obsolete v8 compatibility validation unless updated to shared current rules"]
  public_site_source_policy: "Update catalog, docs, tables, templates, scripts, or workflow inputs first; do not manually rewrite generated website pages as the main delivery method."
  generated_site_policy: "Do not manually bypass release workflows. Do not upload paid buyer products to public site."
paid_file_policy:
  allowed_public_files: ["public standards", "public docs", "public schemas", "public examples", "public proof pages", "public site assets", "standards/AEP-###/complete-package.zip"]
  blocked_private_paid_files: ["paid buyer ZIPs", "paid digital products", "paid workshop bundles", "buyer/facilitator delivery kits", "implementation bundles", "enterprise pilot bundles", "commercialization packs", "private legal/tax packs", "private keys", "treasury secrets", "seed phrases"]
  aep_zip_exception: "standards/AEP-###/complete-package.zip"
  shop_url: "https://www.quebecartificialintelligence.com/shop"
proof_system:
  proof_room: "A governed workspace for evidence, decisions, reviews, approvals, and rollback records."
  proof_card: "A public-safe credential-like record summarizing approved evidence and workflow outcomes without exposing private buyer materials."
  proof_card_001_plan: "Use the first paid workflow success or workshop outcome to create Proof Card 001 with evidence docket, scorecard, approval, and safe public summary."
  evidence_docket: "Private-to-public evidence package with redaction and claim-boundary review."
  proof_graph_future_direction: "Network of proof cards, proof rooms, credentials, and standards-aligned evidence."
goalos_cloud:
  mvp_status: "GoalOS Cloud MVP 0.2 exists as public software proof; not full enterprise SaaS yet."
  future_saas_direction: "Cloud workflow records, scorecards, approvals, versions, monitoring, rollback, proof cards, proof rooms, and enterprise integrations."
  enterprise_modules: ["workflow registry", "scorecards", "evidence dockets", "approval gates", "versioning", "rollback", "monitoring", "Proof Room administration", "Proof Card publishing"]
  not_full_saas_yet: true
jobs_on_base:
  canonical_definition: "$JOBS is the native coordination asset for proof-based AI workflow work on Base."
  latest_package_status: "GoalOS $JOBS Base Production Release Candidate v4.2 — Audit-Ready Label-Clean"
  genesis_utility_list: ["Sponsor posting", "Builder job claiming", "Proof submission bonds", "Reviewer bonds", "Credential minting", "Proof-card registry actions", "Premium job access", "Referral attribution", "Reputation-weighted opportunities"]
  additive_relationship: "$JOBS is additive and does not replace the GoalOS product ladder."
  current_technical_status: "Audit-ready production release candidate; Base Sepolia first; not audited; not mainnet authorized; not legally approved; not tax reviewed; not guaranteed non-security."
  base_sepolia_first: true
  mainnet_gate_requirements: ["npm install", "npm run compile", "npm test", "npm run static-check", "deploy to Base Sepolia", "run full proof-job loop", "external Solidity audit / expert review", "legal/token counsel review", "tax/accounting review", "treasury/founder address verification", "operator role review", "public claims review", "utility live from genesis", "mainnet gate approval"]
  prohibited_claims: ["investment", "profit", "yield", "revenue share", "passive income", "price target", "guaranteed resale value", "guaranteed non-security", "audited if not audited", "mainnet-ready if not mainnet authorized", "founder timelock/no-sale if not actually implemented", "legal/tax approval if not completed"]
  safe_public_copy: "Sponsors use $JOBS to post missions. Builders use $JOBS to claim work and submit proof. Reviewers use $JOBS to validate proof. Approved proof creates credentials, proof cards, reputation, and access to better opportunities. $JOBS is built for utility, coordination, and proof — not investment promises."
