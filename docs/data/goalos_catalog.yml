  launch_sequence: ["First sale", "first proof", "first department", "first enterprise pilot", "GoalOS Cloud", "Proof Graph", "standard"]
  practical_sequence: ["Hidden $1 Squarespace test purchase", "publish $49 product", "first buyer", "first workflow success", "RSI Sprint Workshop", "Proof Card 001", "department proof", "enterprise pilot"]
  commercialization_team_proof_of_value_standards: ["buyers", "sponsors", "builders", "reviewers", "proof jobs", "proof cards", "workshop applications", "department leads", "enterprise pipeline", "measurable revenue"]
  commercialization_pool: "34% commercialization pool is an earnable ceiling, not an upfront allocation; 0% is the default until verified value, evidence, and approval."
