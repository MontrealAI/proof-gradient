category: Recursive Self-Improving Workflows
core_loop_en: Run → Score → Prove → Diagnose → Improve → Approve → Version → Monitor
  → Re-run
core_loop_fr: Exécuter → Noter → Prouver → Diagnostiquer → Améliorer → Approuver →
  Versionner → Surveiller → Réexécuter
safe_boundary_en: GoalOS does not modify base AI models. GoalOS improves workflows
  around AI through instructions, prompts, memory, scorecards, proof records, evaluations,
  approvals, versions, monitoring, and rollback.
safe_boundary_fr: GoalOS ne modifie pas les modèles IA de base. GoalOS améliore les
  flux autour de l’IA grâce aux instructions, prompts, mémoire, grilles de score,
  dossiers de preuve, évaluations, approbations, versions, surveillance et rollback.
approved_claims:
- A model can answer. An agent can act. An institution must prove.
- Enterprise RSI without model self-modification.
- GoalOS improves workflows around AI, not base AI models.
prohibited_claims:
- guaranteed ROI
- guaranteed revenue
- guaranteed productivity
- compliance certification
- AI safety certification
- legal / financial / tax / HR / security / medical / regulatory advice
- uncontrolled autonomous deployment
- true AGI RSI
- base-model self-modification
